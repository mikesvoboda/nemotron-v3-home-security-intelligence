# AI Pipeline Quality Baseline
# Generated by scripts/ai-quality-analysis.py --capture-baseline
# Update this baseline after validating AI pipeline changes
#
# Note: This is a template baseline. Run the analysis script with
# --capture-baseline after seeding data with proper serialization
# to generate accurate baseline metrics.

baseline_captured_at: '2026-01-30T16:00:00+00:00'
timestamp: '2026-01-30T16:00:00+00:00'

# Field completeness metrics - required fields should be 100%
field_completeness:
  total_records: 0
  raw_response_rate: 1.0
  enrichment_snapshot_rate: 1.0
  context_sources_rate: 0.8
  household_matches_rate: 0.0 # Optional field, often null

# Risk score distribution - should show meaningful spread
risk_distribution:
  total_events: 0
  mean_score: 50.0
  std_dev: 25.0
  min_score: 0
  max_score: 100
  levels_covered: 3
  level_counts:
    low: 0
    medium: 0
    high: 0

# Reasoning quality metrics
reasoning_quality:
  avg_reasoning_length: 500.0
  avg_summary_length: 100.0
  min_reasoning_length: 100
  max_reasoning_length: 2000
  detection_reference_rate: 0.8
  risk_keyword_rate: 0.9

# Serialization health - no Python repr strings allowed
serialization:
  python_repr_count: 0
  invalid_array_count: 0
  weather_serialization_ok: true
  faces_serialization_ok: true
  plates_serialization_ok: true

# Event-to-LLMInteraction linkage
linkage:
  total_events: 0
  events_with_interaction: 0
  orphan_interactions: 0
  coverage_rate: 1.0

# Individual metric results
results:
  - name: raw_response_rate
    value: 1.0
    expected: 1.0
    level: pass
    details: All LLMInteraction records must have raw_response
  - name: enrichment_snapshot_rate
    value: 1.0
    expected: 1.0
    level: pass
    details: All LLMInteraction records must have enrichment_snapshot
  - name: risk_levels_covered
    value: 3
    expected: 3
    level: pass
    details: 'Levels present: [low, medium, high]'
  - name: risk_score_std_dev
    value: 25.0
    expected: 15.0
    level: pass
    details: Risk scores should have meaningful spread
  - name: avg_reasoning_length
    value: 500
    expected: 200
    level: pass
    details: Reasoning should be substantive
  - name: detection_reference_rate
    value: 0.8
    expected: 0.5
    level: pass
    details: Reasoning should reference specific detections
  - name: python_repr_count
    value: 0
    expected: 0
    level: pass
    details: No Python repr strings in JSON fields
  - name: weather_serialization
    value: true
    expected: true
    level: pass
    details: Weather must be proper JSON object, not string
  - name: event_coverage_rate
    value: 1.0
    expected: 1.0
    level: pass
    details: All events should have LLMInteraction record
  - name: orphan_interactions
    value: 0
    expected: 0
    level: pass
    details: LLMInteractions should have valid event references
