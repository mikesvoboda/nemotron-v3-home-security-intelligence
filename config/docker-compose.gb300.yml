# config/docker-compose.gb300.yml — additive host overlay (spec §3)
# Holds ONLY: (i) GPU-exclusion mechanics + (ii) host-proven deltas + (iii) additive
# mounts whose prod-file fix is queued in the convergence list (ledger C1).
# amd64 users never see this file; prod compose is untouched.
#
# Invocation (two-file form, used by Tasks 5-6 and validate.sh-adjacent commands):
#   podman compose -f docker-compose.prod.yml -f config/docker-compose.gb300.yml <cmd>
#
# Volume lists MERGE on this provider (compose v2.40.3, probe P0/P1: base entries
# survive an overlay that adds entries; identical entries dedupe). So only the three
# rule_files that monitoring/prometheus.yml references but prod compose never mounts
# are listed below — the prod rule mounts and prometheus_data are NOT re-listed (C1).

services:
  prometheus:
    volumes:
      # The three rule_files prometheus.yml loads but prod compose never mounts (D4/C1).
      # Additive: MERGE keeps the five prod rule mounts + prometheus_data intact, so
      # all seven rule_files resolve inside the container.
      - ./monitoring/profiling-recording-rules.yml:/etc/prometheus/profiling-recording-rules.yml:ro,z
      - ./monitoring/profiling-regression-alerts.yml:/etc/prometheus/profiling-regression-alerts.yml:ro,z
      - ./monitoring/ai-pipeline-alerts.yml:/etc/prometheus/ai-pipeline-alerts.yml:ro,z

  backend:
    # Single-GPU host (GB300, spec §3.2): the GPU-serving deps are trimmed so
    # `up backend` does not drag the model stack along. ai-llm and ai-gateway are
    # dropped from this list — both still exist in `config --services`, so the
    # amd64/full-stack path is provably intact; they are started explicitly.
    depends_on: !override
      foscam-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # go2rtc for live streaming - non-critical, backend can start without it
      go2rtc:
        condition: service_healthy
