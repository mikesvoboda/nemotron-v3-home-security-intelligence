# Production Docker Compose
#
# This uses optimized builds with multi-stage Dockerfiles.
# Compatible with Docker and Podman on Linux and macOS.
#
# Usage:
#   Docker:  docker compose -f docker-compose.prod.yml up -d
#   Podman:  podman-compose -f docker-compose.prod.yml up -d
#
# GPU Requirements:
#   - NVIDIA GPU with CUDA support required for AI services
#   - nvidia-container-toolkit must be installed
#
# Credential Management (Choose One Approach):
#
#   OPTION 1: Environment Variables (Default)
#   - POSTGRES_PASSWORD: Database password (REQUIRED - no default for security)
#     Generate with: openssl rand -base64 32
#
#   OPTION 2: Docker Secrets (Recommended for Production)
#   - Enhanced security: secrets stored separately from environment variables
#   - Credentials not visible in 'docker inspect' output
#   - Easier credential rotation without image rebuild
#   - See DOCKER_SECRETS_SETUP section below for setup instructions
#
# Environment Variables (Optional):
#   - AI_MODELS_PATH: Base path for AI models (default: /export/ai_models)
#   - FRONTEND_PORT: Host port for frontend HTTP (default: 5173)
#   - FRONTEND_HTTPS_PORT: Host port for frontend HTTPS (default: 8444)
#   - FRONTEND_INTERNAL_PORT: Container port for nginx (default: 8080, used for health checks)
#   - YOLO26_CONFIDENCE: YOLO26 detection confidence threshold (default: 0.5)
#   - GPU_LAYERS: Number of GPU layers for LLM (default: auto = fit to available VRAM)
#   - CTX_SIZE: LLM context window size (default: 262144, 8 slots × 32K each)
#   - HF_CACHE: HuggingFace cache directory (default: uses hf_cache volume)
#   - HF_HUB_OFFLINE: Enable offline mode for HuggingFace Hub (default: 0, set to 1 for production)
#   - REDIS_PASSWORD: Redis authentication password (optional, for production use)
#   - GF_ADMIN_PASSWORD: Grafana admin password (default: admin, anonymous access enabled)
#
# GPU Assignment (configured in .env - single source of truth):
#   - GPU_LLM: GPU for Nemotron LLM (default: 0)
#   - GPU_AI_SERVICES: GPU for AI Gateway / Triton (default: 1)

services:
  postgres:
    # Security hardening: Read-only root filesystem (NEM-4978)
    read_only: true
    security_opt:
      - no-new-privileges:true
    # NOTE: Postgres needs CHOWN/DAC_OVERRIDE for data directory initialization
    # Other capabilities are dropped for security
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
    image: docker.io/library/postgres:16-alpine
    tmpfs:
      - /tmp
      - /var/run/postgresql
    # NEM-4496: Bind to localhost only to prevent external network access
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-security}
      # SECURITY: No default password - must be explicitly set via environment or secrets
      # Option 1: Set POSTGRES_PASSWORD environment variable (e.g., in .env file)
      # Option 2: Use Docker secrets (uncomment secrets section below)
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - run ./setup.sh or set manually}
      - POSTGRES_DB=${POSTGRES_DB:-security}
    # Uncomment to use Docker secrets instead of environment variables:
    # secrets:
    #   - postgres_password
    # environment:
    #   - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    # PostgreSQL server-side query logging (NEM-3054)
    # Logs slow queries (>1s) to container stdout, collected by Alloy -> Loki
    # - log_min_duration_statement: Log queries exceeding 1000ms (1 second)
    # - log_duration: Include query duration in all logged statements
    # - log_line_prefix: Timestamp, PID, user@database for correlation
    # - log_statement: 'ddl' logs only schema changes (not all queries)
    # - log_checkpoints: Log checkpoint activity for performance analysis
    # - log_connections/disconnections: Track connection lifecycle
    # - log_lock_waits: Log queries waiting >1s for locks (deadlock detection)
    command:
      - postgres
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_duration=on
      - -c
      - log_line_prefix=%t [%p] %u@%d
      - -c
      - log_statement=ddl
      - -c
      - log_checkpoints=on
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-security} -d ${POSTGRES_DB:-security}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  ai-llm:
    # NOTE: read_only not set — nvidia-cdi-hook needs write access for GPU passthrough
    security_opt:
      - no-new-privileges:true
      - label=disable
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    labels:
      pyroscope.profile: 'true'
      pyroscope.service: 'ai-llm'
    build:
      context: ./ai/nemotron
      dockerfile: Dockerfile
    # Podman CDI device passthrough (rootless GPU access)
    devices:
      - nvidia.com/gpu=${GPU_LLM:-0}
    # NEM-4486: Bind to localhost only - AI services are internal
    ports:
      - '127.0.0.1:${LLM_PORT:-8091}:8091'
    volumes:
      - ${AI_MODELS_PATH:-/export/ai_models}/nemotron/nemotron-3-nano-30b-a3b-q4km:/models:ro
      # Persistent CUDA kernel cache (llama.cpp compilation cache)
      - llama-cache:/home/llama/.cache
      # Persistent NVIDIA compute cache (CUDA JIT kernels)
      - llama-nv-cache:/home/llama/.nv
    environment:
      # Pyroscope continuous profiling for LLM inference analysis
      - SERVICE_NAME=ai-llm
      # GPU assignment - LLM stays on GPU 0 (A5500)
      - CUDA_VISIBLE_DEVICES=${GPU_LLM:-0}
      - PYROSCOPE_ENABLED=${PYROSCOPE_ENABLED:-true}
      - PYROSCOPE_URL=http://pyroscope:4040
      - PYROSCOPE_SAMPLE_RATE=${PYROSCOPE_SAMPLE_RATE:-10}
      # NEM-5528: Model path configurable via .env to swap quantizations without rebuild
      - MODEL_PATH=${LLM_MODEL_PATH:-/models/Nemotron-3-Nano-30B-A3B-Q4_K_M.gguf}
      # All layers on GPU - other AI services moved to GPU 1 (A400) to free up A5500 for LLM
      # auto = llama.cpp --fit determines optimal layer count based on free VRAM
      - GPU_LAYERS=${GPU_LAYERS:-auto}
      # Context window: 8 parallel slots for high-throughput inference
      # 262144 tokens = 8 slots × 32768 tokens each (~24K words per request)
      # Enables complex multi-event analysis with extensive context
      - CTX_SIZE=${CTX_SIZE:-262144}
      # 8 parallel slots for concurrent batch processing
      - PARALLEL=${PARALLEL:-8}
      # Thread count for CPU-offloaded layers
      - THREADS=${LLM_THREADS:-4}
      # Batch sizes for prompt processing
      - BATCH_SIZE=${LLM_BATCH_SIZE:-2048}
      - UBATCH_SIZE=${LLM_UBATCH_SIZE:-512}
      # KV cache quantization (Q8_0 saves ~50% KV memory, negligible quality loss)
      - CACHE_TYPE_K=${LLM_CACHE_TYPE_K:-q8_0}
      - CACHE_TYPE_V=${LLM_CACHE_TYPE_V:-q8_0}
      # MoE expert offloading pattern (empty = disabled, set to regex matching expert FFN weights)
      - MOE_OFFLOAD_PATTERN=${LLM_MOE_OFFLOAD_PATTERN:-}
      # NEM-5369: Enable flash attention to reduce VRAM usage with minimal performance impact
      - FLASH_ATTENTION=${FLASH_ATTENTION:-true}
      # CUDA Graph optimization: fuses repeated kernel launches into a single graph replay
      # Up to 35% TPS improvement for autoregressive decoding (eliminates kernel launch overhead)
      - GGML_CUDA_GRAPH_OPT=${GGML_CUDA_GRAPH_OPT:-1}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8091/health']
      interval: 10s
      timeout: 5s
      retries: 3
      # NEM-5512: 31B parameter model requires ~5 minutes to load tensors to GPU
      start_period: 300s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 12G
        reservations:
          memory: 8G
          devices:
            # Specific GPU assignment for podman-compose compatibility
            - driver: nvidia
              device_ids: ['${GPU_LLM:-0}']
              capabilities: [gpu]

  # =============================================================================
  # vLLM Engine (Optional - for benchmarking against llama.cpp)
  # =============================================================================
  # Alternative LLM inference engine using vLLM with OpenAI-compatible API.
  # Used for performance comparison benchmarks (NEM-5441 Phase 4).
  #
  # To enable: docker compose -f docker-compose.prod.yml --profile vllm up -d
  # Note: Cannot run simultaneously with ai-llm on same GPU - stop ai-llm first.
  #
  # vLLM requires HuggingFace format models (not GGUF). Model options:
  #   - /models/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4 (default, 4-bit quantized)
  #   - nvidia/Nemotron-Mini-4B-Instruct (smaller model for testing)
  #   - Any HF model compatible with vLLM
  ai-llm-vllm:
    profiles:
      - vllm
    # Security hardening: Drop all capabilities, prevent privilege escalation
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/vllm/vllm-openai:cu130-nightly
    # NEM-4486: Bind to localhost only - AI services are internal
    # Port from .env (single source of truth for all network ports)
    ports:
      - '127.0.0.1:${VLLM_PORT:-8097}:8000'
    volumes:
      # HuggingFace cache for model downloads
      - hf_cache:/root/.cache/huggingface:U
      # Optional: Mount pre-downloaded HF models
      - ${AI_MODELS_PATH:-/export/ai_models}/huggingface:/models:ro
    environment:
      # HuggingFace configuration
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - HF_TOKEN=${HF_TOKEN:-}
      # vLLM server configuration
      - VLLM_NO_USAGE_STATS=1
    # vLLM command-line arguments
    # NOTE: Nemotron-3-Nano-30B quantizations have compatibility issues:
    # - NVFP4: Requires H100/A100 datacenter GPUs, not supported on RTX A5500
    # - AWQ (compressed-tensors): vLLM bug with Mamba architecture in nightly builds
    # - FP8: 30GB, exceeds 24GB VRAM on RTX A5500
    # Recommend using llama.cpp with GGUF quantizations until vLLM adds proper support
    command:
      - --model
      - ${VLLM_MODEL:-/models/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4}
      - --host
      - '0.0.0.0'
      - --port
      - '8000'
      - --gpu-memory-utilization
      - '${VLLM_GPU_MEMORY_UTILIZATION:-0.8}'
      - --max-model-len
      - '${VLLM_MAX_MODEL_LEN:-4096}'
      - --trust-remote-code
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 24G
        reservations:
          memory: 16G
          devices:
            # All GPUs passed - CUDA_VISIBLE_DEVICES from .env controls selection
            - driver: nvidia
              capabilities: [gpu]

  # =============================================================================
  # AI Gateway (Triton + FastAPI)
  # =============================================================================
  # Serves all AI models (YOLO26, Florence-2, CLIP, enrichment) via Triton
  # Inference Server with a FastAPI gateway for HTTP routing.
  ai-gateway:
    security_opt:
      - no-new-privileges:true
      - label=disable
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: ai/gateway/Dockerfile
    # Podman CDI device passthrough (rootless GPU access)
    # Pass ALL GPUs via CDI so /dev/nvidia0 and /dev/nvidia1 both exist.
    # CUDA_VISIBLE_DEVICES restricts Triton to only the AI services GPU.
    # Using nvidia.com/gpu=N only creates /dev/nvidiaN which CUDA can't
    # use if N>0 (it expects /dev/nvidia0 for the first visible device).
    devices:
      - nvidia.com/gpu=all
    ports:
      - '127.0.0.1:${AI_GATEWAY_PORT:-8090}:8090'
      - '127.0.0.1:${AI_GATEWAY_METRICS_PORT:-8002}:8002'
    volumes:
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo:/models/zoo:ro
      - ${AI_MODELS_PATH:-/export/ai_models}/triton:/models/cache
      - ${AI_MODELS_PATH:-/export/ai_models}/quantized:/models/quantized:ro
      # Persistent CUDA kernel cache (survives container redeploys)
      - triton-kernel-cache:/root/.nv
      # TensorRT temp artifacts cache (compilation intermediates)
      - triton-tmp-cache:/tmp
      # HuggingFace model cache (pre-downloaded models, avoids network downloads)
      - ${HF_CACHE_PATH:-/home/ubuntu/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - SERVICE_NAME=ai-gateway
      - GATEWAY_PORT=8090
      # All GPUs are passed via CDI (nvidia.com/gpu=all) so /dev/nvidia0 and
      # /dev/nvidia1 both exist. CUDA_VISIBLE_DEVICES restricts Triton to only
      # the AI services GPU (default: GPU 1 = A400).
      - CUDA_VISIBLE_DEVICES=${GPU_AI_SERVICES:-1}
      # INT8 quantization for vehicle/demographics models (NEM-5533)
      # Set to true after running ai/enrichment/scripts/quantize_models.py
      - VEHICLE_QUANTIZED=${VEHICLE_QUANTIZED:-false}
      - DEMOGRAPHICS_QUANTIZED=${DEMOGRAPHICS_QUANTIZED:-false}
      - QUANTIZED_MODEL_DIR=${QUANTIZED_MODEL_DIR:-/models/quantized}
      # Use pre-downloaded HF cache, disable network downloads
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8090/health']
      interval: 15s
      timeout: 10s
      retries: 5
      # Triton loads 13 models — allow 3 minutes for all to initialize
      start_period: 180s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 20G
        reservations:
          memory: 10G
          devices:
            - driver: nvidia
              device_ids: ['${GPU_AI_SERVICES:-1}']
              capabilities: [gpu]

  # Ensures FOSCAM_BASE_PATH is writable by host user (seed-events.py runs outside containers)
  foscam-init:
    image: docker.io/library/alpine:3.19
    volumes:
      - ${FOSCAM_BASE_PATH:-/export/foscam}:/cameras
    command: sh -c "chown -R $${HOST_UID:-1000}:$${HOST_GID:-1000} /cameras 2>/dev/null || true"
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    restart: "no"
    networks:
      - security-net

  backend:
    # Run as host user for Podman socket and data dir access; keep-id preserves UID across namespace
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    userns_mode: keep-id
    # NOTE: read_only not set — nvidia-cdi-hook needs write access for GPU device passthrough
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    # NEM-4486: Bind to localhost only - backend accessed via frontend nginx proxy
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    volumes:
      # :U tells Podman to recursively chown the volume to match container user (appuser)
      # Docker ignores the :U flag, making this backward compatible
      - ./backend/data:/app/data:z,U
      - ${FOSCAM_BASE_PATH:-/export/foscam}:/cameras
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo:/models/model-zoo:ro,z
      # Podman socket for container orchestrator auto-recovery (NEM-4xxx)
      # Mount to fixed path so container has access regardless of /run/user layout
      - ${PODMAN_SOCKET:?PODMAN_SOCKET must be set}:/var/run/podman/podman.sock
      # Docker compose file for dynamic service discovery by orchestrator
      - ./docker-compose.prod.yml:/app/docker-compose.prod.yml:ro
    environment:
      # Free-threaded Python 3.14t: GIL disabled so run_in_executor threads
      # (ML inference, model loading, file-watcher polling) cannot block the asyncio
      # event loop and cause health-check failures.
      - PYTHON_GIL=0
      # Environment setting: defaults to 'development' for local deploys
      # Override with ENVIRONMENT=production for actual production deployments
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # Logging verbosity: WARNING (default) suppresses all INFO/DEBUG pipeline messages.
      # Set LOG_LEVEL=INFO in .env to see file watcher queuing, detection, and event creation.
      # Set LOG_LEVEL=DEBUG for full trace including debounce and deduplication decisions.
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      # Redirect torch hub cache to /tmp (writable tmpfs) — /home/appuser/.cache tmpfs
      # mounts as root-owned in rootless Podman, preventing appuser from writing to it
      - TORCH_HOME=/tmp/torch_cache
      # Prevent ultralytics from attempting to install packages (e.g. CLIP from GitHub)
      # at runtime via check_requirements(). The container has no git and no PyPI access,
      # so these attempts block for tens of seconds before failing, which causes GIL
      # contention in the thread pool that starves the asyncio event loop.
      - ULTRALYTICS_OFFLINE=1
      - YOLO_VERBOSE=False
      # SECURITY: Uses same POSTGRES_PASSWORD as postgres service (must be set)
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-security}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-security}
      - REDIS_URL=redis://redis:6379
      # SECURITY: Redis password authentication (optional, for production use)
      # Must match REDIS_PASSWORD set in the redis service
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Rootless Podman bind mounts don't propagate inotify events reliably.
      # Use polling mode for file watcher to detect new camera images.
      - FILE_WATCHER_POLLING=${FILE_WATCHER_POLLING:-true}
      # Pyroscope continuous profiling (enabled by default, set PYROSCOPE_ENABLED=false to disable)
      - PYROSCOPE_ENABLED=${PYROSCOPE_ENABLED:-true}
      - PYROSCOPE_URL=http://pyroscope:4040
      - PYROSCOPE_SAMPLE_RATE=${PYROSCOPE_SAMPLE_RATE:-100}
      # Memory allocation profiling (alloc_objects, alloc_space) for leak detection
      - PYROSCOPE_MEMORY_ENABLED=${PYROSCOPE_MEMORY_ENABLED:-true}
      - NEMOTRON_URL=http://ai-llm:8091
      # AI Gateway routes — all enrichment models served via Triton through ai-gateway
      - USE_AI_GATEWAY=true
      - AI_GATEWAY_URL=http://ai-gateway:8090
      - YOLO26_URL=http://ai-gateway:8090/yolo26
      - FLORENCE_URL=http://ai-gateway:8090/florence
      - CLIP_URL=http://ai-gateway:8090/clip
      - ENRICHMENT_URL=http://ai-gateway:8090/enrichment
      - ENRICHMENT_LIGHT_URL=http://ai-gateway:8090/enrich-lt
      # go2rtc RTSP-to-WebRTC streaming service (NEM-4958)
      - GO2RTC_API_URL=http://go2rtc:1984
      # WebRTC URL is the external URL browsers use to connect (via localhost port mapping)
      - GO2RTC_WEBRTC_URL=${GO2RTC_WEBRTC_URL:-http://localhost:8555}
      # Enrichment model assignment (determines request routing)
      # Set to 'light' for GPU 1 (A400) or 'heavy' for GPU 0 (A5500)
      - ENRICHMENT_POSE_SERVICE=${ENRICHMENT_POSE_SERVICE:-light}
      - ENRICHMENT_THREAT_SERVICE=${ENRICHMENT_THREAT_SERVICE:-light}
      - ENRICHMENT_REID_SERVICE=${ENRICHMENT_REID_SERVICE:-light}
      - ENRICHMENT_PET_SERVICE=${ENRICHMENT_PET_SERVICE:-light}
      - ENRICHMENT_DEPTH_SERVICE=${ENRICHMENT_DEPTH_SERVICE:-light}
      - ENRICHMENT_VEHICLE_SERVICE=${ENRICHMENT_VEHICLE_SERVICE:-heavy}
      - ENRICHMENT_CLOTHING_SERVICE=${ENRICHMENT_CLOTHING_SERVICE:-heavy}
      - ENRICHMENT_ACTION_SERVICE=${ENRICHMENT_ACTION_SERVICE:-heavy}
      - ENRICHMENT_DEMOGRAPHICS_SERVICE=${ENRICHMENT_DEMOGRAPHICS_SERVICE:-heavy}
      # YOLO26_URL is set above in the AI Gateway routes block
      - DETECTOR_TYPE=${DETECTOR_TYPE:-yolo26}
      - FRONTEND_URL=http://frontend:${FRONTEND_INTERNAL_PORT:-8080}
      # Always use /cameras (container mount point) regardless of host env var
      - FOSCAM_BASE_PATH=/cameras
      - DEBUG=${DEBUG:-false}
      - ADMIN_ENABLED=${ADMIN_ENABLED:-false}
      - FAST_PATH_ENABLED=${FAST_PATH_ENABLED:-false}
      - FAST_PATH_CONFIDENCE_THRESHOLD=${FAST_PATH_CONFIDENCE_THRESHOLD:-0.90}
      # OpenTelemetry distributed tracing (NEM-1629)
      # Enabled by default since monitoring stack is included
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-nemotron-backend}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}
      - OTEL_TRACE_SAMPLE_RATE=${OTEL_TRACE_SAMPLE_RATE:-1.0}
      # Container orchestrator: connect to Podman socket for self-healing
      # Socket mounted at /var/run/podman/podman.sock (backend runs as host user for access)
      - ORCHESTRATOR_DOCKER_HOST=${ORCHESTRATOR_DOCKER_HOST:-unix:///var/run/podman/podman.sock}
      # Relax readiness: set false when pipeline workers fail to init (e.g. startup race)
      - READINESS_REQUIRE_PIPELINE_WORKERS=${READINESS_REQUIRE_PIPELINE_WORKERS:-false}
    depends_on:
      foscam-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # AI services — backend waits for LLM (critical for risk analysis)
      ai-llm:
        condition: service_healthy
      # AI gateway — YOLO26 and enrichment models; backend health checks yolo26 via gateway
      ai-gateway:
        condition: service_healthy
      # go2rtc for live streaming - non-critical, backend can start without it
      go2rtc:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import httpx; r = httpx.get(''http://localhost:8000/api/system/health/ready''); exit(0 if r.status_code == 200 else 1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '2'
          # NEM-3890: Increased from 4G to 6G to prevent OOM kills
          # Backend was at 94.45% memory usage (4.057GB / 4.295GB)
          memory: 6G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  redis:
    # Security hardening: Read-only root filesystem (NEM-4978)
    read_only: true
    tmpfs:
      - /tmp
    # Security hardening: Prevent privilege escalation
    # NOTE: Redis needs CHOWN/DAC_OVERRIDE for data persistence
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
    # Redis tuning for connection handling
    # NOTE: Sysctls require host-level configuration for rootless containers
    # These settings should be configured by setup.py for production deployments:
    #   sudo sysctl -w vm.overcommit_memory=1
    #   sudo sysctl -w net.core.somaxconn=511
    # See: https://redis.io/docs/management/admin/#background-saving-fails-with-a-fork-error
    # Rootless Podman cannot set sysctls - must be configured at host level
    # sysctls:
    #   - net.core.somaxconn=511
    image: docker.io/library/redis:7.4-alpine3.21
    # NEM-4496: Bind to localhost only to prevent external network access
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    # SECURITY: Password authentication via REDIS_PASSWORD environment variable
    # If REDIS_PASSWORD is set, Redis requires authentication for all connections.
    # If REDIS_PASSWORD is empty or not set, Redis runs without authentication (local dev only).
    command: >-
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        echo "Starting Redis with password authentication"
        redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy volatile-lru --slowlog-log-slower-than 10000 --slowlog-max-len 128 --stop-writes-on-bgsave-error no --requirepass "$$REDIS_PASSWORD"
      else
        echo "Starting Redis without authentication (development mode)"
        redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy volatile-lru --slowlog-log-slower-than 10000 --slowlog-max-len 128 --stop-writes-on-bgsave-error no
      fi
      '
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      # Use AUTH if password is set, otherwise just ping
      test: >-
        sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG
        else
          redis-cli ping | grep -q PONG
        fi
        '
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

