  # go2rtc for RTSP to WebRTC conversion (NEM-4958)
  # Enables low-latency live video streaming from RTSP cameras to browser
  # API: http://localhost:1984 (stream management)
  # WebRTC: http://localhost:8555 (client connections)
  go2rtc:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/alexxit/go2rtc:latest
    container_name: hsi-go2rtc
    restart: unless-stopped
    # NEM-4486: Bind to localhost only to prevent unauthorized external access
    ports:
      - '127.0.0.1:${GO2RTC_API_PORT:-1984}:1984' # API
      - '127.0.0.1:${GO2RTC_WEBRTC_PORT:-8555}:8555' # WebRTC
    environment:
      - GO2RTC_API_ORIGIN=*
    volumes:
      - ./config/go2rtc.yaml:/config/go2rtc.yaml:ro,z
    networks:
      - security-net
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '-O',
          '/dev/null',
          'http://localhost:1984/api/streams',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  frontend:
    # NOTE: read_only not used — nginx entrypoint uses sed -i on /etc/nginx/conf.d/default.conf
    # and generates SSL certificates at runtime. These require a writable root filesystem.
    tmpfs:
      - /tmp
      - /var/run # nginx pid file
      - /var/cache/nginx # nginx cache
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    ports:
      # HTTPS (direct access) and HTTP (for Cloudflare tunnel / Brev secure link)
      # FRONTEND_HTTP_PORT exposes nginx HTTP for tunnels that send plain HTTP
      # Bound to 0.0.0.0 for external access; use firewall to restrict if needed
      - '0.0.0.0:${FRONTEND_HTTPS_PORT:-8444}:8443'
      - '0.0.0.0:${FRONTEND_HTTP_PORT:-8080}:8080'
    volumes:
      # SSL certificates - writable for auto-generation, or mount pre-existing certs
      - frontend_certs:/etc/nginx/certs:U
    environment:
      # Extra SANs for the auto-generated certificate (e.g., your server's IP)
      # Format: IP:192.168.1.100,DNS:myhost.local
      - SSL_SAN_EXTRA=${SSL_SAN_EXTRA:-}
      # SSL/TLS Configuration
      # SSL enabled by default - auto-generates self-signed certs if none mounted
      # Set to false to serve HTTP only (no redirect to HTTPS); true enables HTTPS + redirect
      - SSL_ENABLED=${SSL_ENABLED:-false}
      # Custom certificate paths (relative to /etc/nginx/certs mount)
      - SSL_CERT_PATH=${SSL_CERT_PATH:-/etc/nginx/certs/cert.pem}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-/etc/nginx/certs/key.pem}
      # HTTPS port for redirect (must match external port mapping)
      - FRONTEND_HTTPS_PORT=${FRONTEND_HTTPS_PORT:-8444}
    # NOTE: VITE_* environment variables are NOT used at runtime.
    # Vite bakes these values at build time. The frontend uses relative URLs
    # (empty BASE_URL), and nginx proxies /api and /ws to the backend.
    # See frontend/nginx.conf for proxy configuration.
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      # Use /health endpoint which returns 200 directly (avoids 301 redirect issues)
      # FRONTEND_INTERNAL_PORT configures the internal nginx port (default: 8080)
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:${FRONTEND_INTERNAL_PORT:-8080}/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # =============================================================================
  # Monitoring Stack (Included by Default)
  # =============================================================================
  # Monitoring services are now part of the core deployment for full observability.
  # Access points:
  #   - Grafana: http://localhost:3002 (anonymous access enabled by default)
  #   - Prometheus: http://localhost:9090
  #   - Tempo: http://localhost:3200 (distributed tracing)
  #   - Alertmanager: http://localhost:9093

  # Grafana Tempo for distributed tracing (NEM-5545, replaces Jaeger+Elasticsearch)
  # Lightweight trace backend with native OTLP ingestion and 30-day retention
  tempo:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/grafana/tempo:2.7.1
    container_name: tempo
    volumes:
      - ./monitoring/tempo/tempo-config.yml:/etc/tempo/config.yml:ro,z
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/config.yml
    ports:
      - '127.0.0.1:${TEMPO_PORT:-3200}:3200'
      - '127.0.0.1:${TEMPO_OTLP_GRPC:-4317}:4317'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3200/ready']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  prometheus:
    # Security hardening: Read-only root filesystem (NEM-4978)
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prom/prometheus:v3.1.0
    # NEM-4486: Bind to localhost only to prevent unauthorized external access
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./monitoring/prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml:ro,z
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro,z
      - ./monitoring/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro,z
      - ./monitoring/gpu-alerts.yml:/etc/prometheus/gpu-alerts.yml:ro,z
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    # NEM-3898: Prometheus must wait for Alertmanager to be healthy before starting
    # This ensures Prometheus can connect to Alertmanager for alert delivery
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9090/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  grafana:
    # Security hardening: Read-only root filesystem (NEM-4978)
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: ./monitoring/grafana
      dockerfile: Dockerfile
    image: nemotron-v3-home-security-intelligence-grafana:latest
    # NEM-4486: Bind to localhost only to prevent unauthorized external access
    # Access Grafana via the frontend nginx proxy at /grafana/ for production use
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3002}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    environment:
      # Anonymous access enabled for local development (no login required)
      # Set GF_AUTH_ANONYMOUS_ENABLED=false in .env to require login
      # When disabling anonymous, also set GF_AUTH_DISABLE_LOGIN_FORM=false to enable login form
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=${GF_AUTH_DISABLE_LOGIN_FORM:-true}
      # Admin credentials (anonymous access is enabled by default, so password is optional)
      # For production with login enabled: generate with openssl rand -base64 32
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      # Allow embedding Grafana dashboards in iframes (required for AI Performance page)
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # Enable Grafana Explore for distributed tracing (required for Tracing page)
      - GF_EXPLORE_ENABLED=true
      - GF_USERS_ALLOW_SIGN_UP=false
      # Subpath configuration for nginx proxy at /grafana/
      # This enables Grafana to be accessed via https://<host>:8444/grafana/
      # Use relative root URL for reverse proxy compatibility (allows any hostname/port)
      - GF_SERVER_ROOT_URL=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Log HTTP requests (useful for debugging dashboard 404s)
      - GF_SERVER_ROUTER_LOGGING=true
      # Plugins installed to /opt/grafana/plugins in image (avoids volume overwrite)
      - GF_PATHS_PLUGINS=/opt/grafana/plugins
      # SMTP Configuration for Email Alerts (NEM-3511)
      # Configure via .env file for email alerting capability
      # See docs/operator/smtp-configuration.md for setup instructions
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${GF_SMTP_HOST:-smtp.example.com:587}
      - GF_SMTP_USER=${GF_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:-grafana@example.com}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME:-Grafana Alerts}
      - GF_SMTP_STARTTLS_POLICY=${GF_SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
      - GF_SMTP_SKIP_VERIFY=${GF_SMTP_SKIP_VERIFY:-false}
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  redis-exporter:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/oliver006/redis_exporter:v1.55.0
    # NEM-4486: Bind to localhost only to prevent unauthorized external access
    ports:
      - '127.0.0.1:${REDIS_EXPORTER_PORT:-9121}:9121'
    environment:
      - REDIS_ADDR=redis://redis:6379
      # SECURITY: Redis password for exporter authentication (must match redis service)
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
    # NOTE: redis_exporter is a minimal Go binary without shell tools (wget/curl).
    # Disable container health check; rely on process running and Prometheus scraping.
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  json-exporter:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prometheuscommunity/json-exporter:v0.6.0
    # NEM-4486: Bind to localhost only to prevent unauthorized external access
    ports:
      - '127.0.0.1:${JSON_EXPORTER_PORT:-7979}:7979'
    volumes:
      - ./monitoring/json-exporter-config.yml:/etc/json-exporter/config.yml:ro,z
    command:
      - '--config.file=/etc/json-exporter/config.yml'
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  # Alertmanager for alert routing, grouping, and delivery (NEM-1631)
  alertmanager:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prom/alertmanager:v0.27.0
    # NEM-4486: Bind to localhost only to prevent unauthorized external access
    ports:
      - '127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=:9093'
      - '--cluster.listen-address='
    # NEM-3898: Alertmanager starts independently without waiting for backend
    # Prometheus depends on Alertmanager being healthy, so we cannot wait for backend here.
    # Alertmanager has built-in retry logic for webhook delivery - it will retry failed
    # webhook deliveries with exponential backoff until backend becomes available.
    # This ensures the alerting pipeline (Prometheus -> Alertmanager) is ready early,
    # even if alert webhook delivery is delayed until backend starts.
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9093/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # Blackbox Exporter for synthetic monitoring (NEM-1637)
  # Probes endpoints for availability, latency, and health status
  blackbox-exporter:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prom/blackbox-exporter:v0.24.0
    # NEM-4486: Bind to localhost only to prevent unauthorized external access
    ports:
      - '127.0.0.1:${BLACKBOX_EXPORTER_PORT:-9115}:9115'
    volumes:
      - ./monitoring/blackbox-exporter.yml:/etc/blackbox_exporter/config.yml:ro,z
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
      - '--log.level=info'
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9115/metrics']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  # Loki for log aggregation (NEM-3093)
  # Receives logs from Alloy and stores them for querying via Grafana
  loki:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/grafana/loki:3.5.1
    container_name: loki
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro,z
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml
    # NEM-4486: Bind to localhost only to prevent unauthorized external access
    ports:
      - '127.0.0.1:${LOKI_PORT:-3100}:3100'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3100/ready']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1G

  # Pyroscope for continuous profiling (NEM-3097)
  # Custom image with busybox/wget for health checks (the official image is scratch-based)
  # Services push profiles via py-spy when PYROSCOPE_ENABLED=true
  # NEM-3514: Upgraded from 1.4.0 to 1.18.0 to fix "unknown profile type: seconds" error.
  # Fix: https://github.com/grafana/pyroscope/pull/4568 (released in v1.9.2+)
  pyroscope:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: ./monitoring/pyroscope
      dockerfile: Dockerfile
    container_name: pyroscope
    volumes:
      - ./monitoring/pyroscope/pyroscope-config.yml:/etc/pyroscope/config.yml:ro,z
      - pyroscope_data:/data
    command: -config.file=/etc/pyroscope/config.yml
    # NEM-4486: Bind to localhost only to prevent unauthorized external access
    ports:
      - '127.0.0.1:${PYROSCOPE_PORT:-4040}:4040'
    networks:
      - security-net
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4040/ready']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

  # cAdvisor for container CPU/memory metrics (NEM-3930)
  # Provides detailed container-level resource usage metrics
  # Access UI at http://localhost:8088
  # cadvisor: Moved to rootful systemd service (same pattern as dcgm-exporter).
  # cAdvisor requires privileged + host filesystem access (/sys/fs/cgroup, /proc, /dev/kmsg)
  # which is incompatible with rootless Podman on cgroups v2 (causes .containerenv OCI errors).
  # See: monitoring/cadvisor/cadvisor.service
  # Install: sudo cp monitoring/cadvisor/cadvisor.service /etc/systemd/system/
  #          sudo systemctl daemon-reload && sudo systemctl enable --now cadvisor

  # Node Exporter for host system metrics (NEM-3931)
  # Collects hardware and OS metrics from the host system
  # Access metrics at http://localhost:9100/metrics
  node-exporter:
    # Security hardening: Drop all capabilities, prevent privilege escalation
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prom/node-exporter:v1.8.2
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    # NEM-4486: Bind to localhost only to prevent unauthorized external access
    ports:
      - '127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100'
    pid: host
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9100/metrics']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    labels:
      - 'prometheus.scrape=true'
      - 'prometheus.port=9100'

  # NVIDIA DCGM Exporter for GPU hardware metrics (NEM-4132, NEM-4150)
  # Provides low-level GPU metrics: SM utilization, memory bandwidth, temperature, power, PCIe throughput
  # Essential for understanding compute-bound vs memory-bound workloads
  # Metrics exposed at :9400/metrics, scraped by Prometheus
  # Custom counters enable PCIe throughput metrics for the GPU dashboard
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: dcgm-exporter
    restart: unless-stopped
    # KNOWN LIMITATION: DCGM nv-hostengine requires host-level root access to watch GPU fields.
    # Rootless Podman cannot provide this even with privileged: true (user namespace isolation).
    # This service is disabled by default (gpu-rootful profile) to prevent crash-looping.
    # GPU metrics are available via alternative sources:
    #   - Triton (ai-gateway:8002/metrics): nv_gpu_utilization, nv_gpu_memory_used_bytes
    #   - Backend API (/api/system/gpu): hsi_gpu_utilization, hsi_gpu_memory_used_mb
    # To enable: run with rootful podman or use `--profile gpu-rootful`
    profiles:
      - gpu-rootful
    security_opt:
      - label=disable
    devices:
      - nvidia.com/gpu=all
    volumes:
      # Custom counters CSV to enable PCIe throughput metrics (NEM-4150)
      - ./monitoring/dcgm/custom-counters.csv:/etc/dcgm-exporter/default-counters.csv:ro,z
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
      - DCGM_EXPORTER_KUBERNETES=false
    # NEM-4486: Bind to localhost only to prevent unauthorized external access
    ports:
      - '127.0.0.1:${DCGM_EXPORTER_PORT:-9400}:9400'
    cap_add:
      - SYS_ADMIN
    networks:
      - security-net
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://localhost:9400/metrics']
      interval: 30s
      timeout: 10s
      retries: 3

  # Alloy for log collection and eBPF profiling (NEM-3093, NEM-3922, NEM-4499)
  # - Collects container logs from Podman and forwards to Loki
  # - Profiles native C/C++ services (ai-llm/llama.cpp) via eBPF and sends to Pyroscope
  alloy:
    image: docker.io/grafana/alloy:v1.9.2
    container_name: alloy
    # Minimal capabilities for eBPF profiling (replaces privileged: true)
    # Requires host memlock limit: /etc/security/limits.d/50-memlock.conf
    # Previously used privileged mode (NEM-4499) but alloy v1.9.2 works with caps + label=disable
    cap_add:
      - SYS_ADMIN # eBPF map creation, cgroup access
      - BPF # eBPF program loading
      - PERFMON # perf_event_open for profiling
      - SYS_PTRACE # Reading /proc/<pid>/maps for symbol resolution
      - SYS_RESOURCE # setrlimit for memlock
    cap_drop:
      - ALL
    security_opt:
      - label=disable
    pid: host
    user: root
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro,z
      # NOTE: rw required — Alloy reads container logs via Podman API
      - ${PODMAN_SOCKET:?PODMAN_SOCKET must be set}:${PODMAN_SOCKET}
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /proc:/host/proc:ro
      # eBPF profiler symbol cache for stack trace resolution (NEM-3922)
      - alloy_symb_cache:/tmp/symb-cache
    ulimits:
      # eBPF profiling requires increased memory lock limit
      # Rootless containers cannot set unlimited (-1), so use a high limit (8GB)
      # Host limit should be configured by setup.py in /etc/security/limits.d/
      memlock:
        soft: 8589934592
        hard: 8589934592
    environment:
      - HOST_PROC=/host/proc
      - PODMAN_SOCKET=${PODMAN_SOCKET}
    command:
      - run
      - --stability.level=public-preview
      - --storage.path=/tmp/alloy
      - /etc/alloy/config.alloy
    # NEM-4486: Bind to localhost only to prevent unauthorized external access
    ports:
      - '127.0.0.1:${ALLOY_UI_PORT:-12345}:12345' # Alloy UI
      - '4317' # OTLP gRPC (internal only)
      - '4318' # OTLP HTTP (internal only)
    depends_on:
      - loki
      - pyroscope
    healthcheck:
      # Alloy doesn't have wget/curl - use process check instead
      test: ['CMD', 'pgrep', '-f', 'alloy']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  tempo_data:
    driver: local
  # Persistent HuggingFace cache volume (NEM-3812)
  # Shared across all AI services to avoid re-downloading models
  hf_cache:
    driver: local
  # Redis Sentinel volumes (uncomment when enabling Sentinel)
  # sentinel1_data:
  #   driver: local
  # sentinel2_data:
  #   driver: local
  # sentinel3_data:
  #   driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local
  pyroscope_data:
    driver: local
  # Alloy eBPF profiler symbol cache for stack trace resolution (NEM-3922)
  alloy_symb_cache:
    driver: local
  # Frontend SSL certificates volume for auto-generation with read-only filesystem
  frontend_certs:
    driver: local
  # Triton/Gateway CUDA kernel cache (NEM-XXXX)
  # Persists CUDA JIT compilation across container redeploys
  triton-kernel-cache:
    driver: local
  # Triton TensorRT temporary compilation artifacts
  triton-tmp-cache:
    driver: local
  # llama.cpp CUDA kernel cache (ai-llm service)
  # Persists llama.cpp compilation cache across redeploys
  llama-cache:
    driver: local
  # NVIDIA CUDA JIT kernel cache for ai-llm
  llama-nv-cache:
    driver: local

networks:
  security-net:
    driver: bridge
# ============================================================================
# DOCKER SECRETS SETUP (Optional - Recommended for Production)
# ============================================================================
#
# Docker Secrets provide enhanced security for credential management:
#   - Credentials stored separately from environment variables
#   - Not visible in 'docker inspect' output
#   - Easier credential rotation without image rebuild
#   - Secrets mounted read-only in /run/secrets/ inside containers
#
# SETUP INSTRUCTIONS:
# ==================
#
# 1. Create secrets directory and files:
#    mkdir -p secrets
#    chmod 700 secrets
#
# 2. Generate strong passwords:
#    openssl rand -base64 32 > secrets/postgres_password.txt
#    openssl rand -base64 32 > secrets/redis_password.txt
#    openssl rand -base64 32 > secrets/grafana_admin_password.txt
#    chmod 600 secrets/*.txt
#
# 3. Add secret values to the files (or use commands above to generate):
#    echo "your_postgres_password" > secrets/postgres_password.txt
#    echo "your_redis_password" > secrets/redis_password.txt
#    echo "your_grafana_password" > secrets/grafana_admin_password.txt
#
# 4. Enable Docker secrets by uncommenting the sections below
#
# 5. Validate configuration:
#    docker compose -f docker-compose.prod.yml config
#
# 6. Start services with secrets:
#    docker compose -f docker-compose.prod.yml up -d
#
# 7. Verify secrets are mounted in containers:
#    docker compose -f docker-compose.prod.yml exec postgres ls -la /run/secrets/
#
# ROTATION PROCEDURE (Zero-Downtime):
# ===================================
#
# 1. Update secret file:
#    echo "new_password" > secrets/postgres_password.txt
#
# 2. Restart affected service:
#    docker compose -f docker-compose.prod.yml restart postgres
#
# 3. Update dependent services if needed:
#    docker compose -f docker-compose.prod.yml restart backend redis-exporter
#
# IMPORTANT NOTES:
# ================
#
# - Docker Secrets work with Docker Swarm and standalone Docker/Podman
# - Secrets are NOT encrypted at rest in standalone Docker (use full-disk encryption)
# - Never commit secrets/ directory to version control
# - Add secrets/ to .gitignore (already configured)
# - When using secrets, REMOVE corresponding environment variables from .env
# - Ensure file paths are relative to docker-compose.prod.yml location
#
# ============================================================================

# Uncomment the entire sections below to enable Docker Secrets
#
# secrets:
#   postgres_password:
#     file: ./secrets/postgres_password.txt
#   redis_password:
#     file: ./secrets/redis_password.txt
#   grafana_admin_password:
#     file: ./secrets/grafana_admin_password.txt
