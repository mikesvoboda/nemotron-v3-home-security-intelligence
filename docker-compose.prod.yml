# Production Compose base (Podman / Docker). Configure ports and paths in .env (.env.example).

# ORCHESTRATOR_ENABLED=false uses '-f docker-compose.prod.yml -f docker-compose.engine-false.yml'.
include:
  - docker-compose.marker-${ORCHESTRATOR_ENABLED:-true}.yml

services:
  # Read-only rootfs; keeps CHOWN/DAC_OVERRIDE for data dir initialization
  postgres:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
    image: docker.io/library/postgres:16-alpine
    tmpfs:
      - /tmp
      - /var/run/postgresql
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-security}
      # Required: set POSTGRES_PASSWORD in .env
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - run ./setup.sh or set manually}
      - POSTGRES_DB=${POSTGRES_DB:-security}
    # Log slow queries (>1s), DDL, checkpoints, and lock waits to stdout for Alloy/Loki
    command:
      - postgres
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_duration=on
      - -c
      - log_line_prefix=%t [%p] %u@%d
      - -c
      - log_statement=ddl
      - -c
      - log_checkpoints=on
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-security} -d ${POSTGRES_DB:-security}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  # VLM Server (llama.cpp llama-server + Qwen3-VL GGUF/mmproj on port 8098; UR-18 default set)
  ai-vlm:
    # Writable rootfs required by nvidia-cdi-hook for GPU passthrough
    security_opt:
      - no-new-privileges:true
      - label=disable
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    labels:
      pyroscope.profile: 'true'
      pyroscope.service: 'ai-vlm'
    build:
      context: ./ai/vlm
      dockerfile: Dockerfile
      args:
        # Build arg: 103 for GB300 (aarch64), 86 for RTX A5500 (x86_64)
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-}
    # Podman CDI GPU passthrough
    devices:
      - nvidia.com/gpu=${GPU_LLM:-0}
    ports:
      - '127.0.0.1:${AI_VLM_PORT:-8098}:8098'
    volumes:
      - ${AI_MODELS_PATH:-/export/ai_models}/vlm:/models:ro
      # Persistent CUDA/llama.cpp compilation caches
      - llama-cache:/home/llama/.cache
      - llama-nv-cache:/home/llama/.nv
    environment:
      - SERVICE_NAME=ai-vlm
      - CUDA_VISIBLE_DEVICES=${GPU_LLM:-0}
      # Host-mounted GGUF model + multimodal projector
      - PORT=8098
      - MODEL_PATH=${VLM_MODEL_PATH:-/models/Qwen3VL-8B-Instruct-Q4_K_M.gguf}
      - MMPROJ_PATH=${VLM_MMPROJ_PATH:-/models/mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf}
      - MODEL_ALIAS=${VLM_MODEL_ALIAS:-Qwen3VL-8B}
      - GPU_LAYERS=${VLM_GPU_LAYERS:-auto}
      # Cap vision tokens at 1280 per frame to fit the 16,384-token per-slot budget
      - LLAMA_ARG_IMAGE_MAX_TOKENS=1280
      # 32,768 context across 2 parallel slots (16,384 tokens/slot)
      - CTX_SIZE=${VLM_CTX_SIZE:-32768}
      - PARALLEL=${VLM_PARALLEL:-2}
      - THREADS=${VLM_THREADS:-4}
      - BATCH_SIZE=${VLM_BATCH_SIZE:-2048}
      - UBATCH_SIZE=${VLM_UBATCH_SIZE:-512}
      # q8_0 KV cache quantization halves the 32K pool footprint
      - CACHE_TYPE_K=${VLM_CACHE_TYPE_K:-q8_0}
      - CACHE_TYPE_V=${VLM_CACHE_TYPE_V:-q8_0}
      - FLASH_ATTENTION=${VLM_FLASH_ATTENTION:-true}
      # Offload weights to CPU RAM after 300s idle (set empty to disable sleep)
      - SLEEP_IDLE_SECONDS=${VLM_SLEEP_IDLE_SECONDS:-300}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8098/health']
      interval: 10s
      timeout: 5s
      retries: 3
      # Matches ai/vlm/Dockerfile HEALTHCHECK --start-period=120s
      start_period: 120s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 10G
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              device_ids: ['${GPU_LLM:-0}']
              capabilities: [gpu]

  # AI Gateway (Triton Inference Server + FastAPI router for /yolo26 and /enrich-lt)
  ai-gateway:
    security_opt:
      - no-new-privileges:true
      - label=disable
    cap_drop:
      - ALL
    build:
      context: .
      dockerfile: ai/gateway/Dockerfile
    # Pass all GPUs via CDI so /dev/nvidia0 exists when CUDA_VISIBLE_DEVICES selects GPU > 0
    devices:
      - nvidia.com/gpu=all
    ports:
      - '127.0.0.1:${AI_GATEWAY_PORT:-8090}:8090'
      - '127.0.0.1:${AI_GATEWAY_METRICS_PORT:-8002}:8002'
    volumes:
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo:/models/zoo:ro
      - ${AI_MODELS_PATH:-/export/ai_models}/triton:/models/cache
      - ${AI_MODELS_PATH:-/export/ai_models}/quantized:/models/quantized:ro
      - triton-kernel-cache:/root/.nv
      - triton-tmp-cache:/tmp
      - ${HF_CACHE_PATH:-/home/ubuntu/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - SERVICE_NAME=ai-gateway
      - GATEWAY_PORT=8090
      # Residency set pruned by ai.gateway.residency at startup (must match backend PIPELINE_MODE)
      - GATEWAY_MODEL_SET=${GATEWAY_MODEL_SET:-vlm}
      - GATEWAY_ENABLE_THREAT=${GATEWAY_ENABLE_THREAT:-false}
      - CUDA_VISIBLE_DEVICES=${GPU_AI_SERVICES:-1}
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8090/health']
      interval: 15s
      timeout: 10s
      retries: 5
      # Covers cold TensorRT engine build on first start
      start_period: 180s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 20G
        reservations:
          memory: 10G
          devices:
            - driver: nvidia
              device_ids: ['${GPU_AI_SERVICES:-1}']
              capabilities: [gpu]

  foscam-init:
    # Ensures FOSCAM_BASE_PATH is writable by host user
    image: docker.io/library/alpine:3.19
    volumes:
      - ${FOSCAM_BASE_PATH:-/export/foscam}:/cameras:z
    command: sh -c "chown -R $${HOST_UID:-1000}:$${HOST_GID:-1000} /cameras 2>/dev/null || true"
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    restart: 'no'
    networks:
      - security-net

  backend:
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    # Run as host UID/GID with keep-id for Podman socket and data dir access
    userns_mode: keep-id
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    volumes:
      # :U chowns volume to container user under Podman; :z relabels for SELinux inotify watch
      - ./backend/data:/app/data:z,U
      - ${FOSCAM_BASE_PATH:-/export/foscam}:/cameras:z
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo:/models/model-zoo:ro,z
      - ${HF_CACHE_PATH:-/home/ubuntu/.cache/huggingface}:/models/huggingface-cache:ro
      # Podman socket for orchestrator (dropped by docker-compose.engine-false.yml when off)
      - ${PODMAN_SOCKET:?PODMAN_SOCKET must be set}:/var/run/podman/podman.sock
      - ./docker-compose.prod.yml:/app/docker-compose.prod.yml:ro
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # Per-event pipeline mode (vlm is the only supported mode; matches GATEWAY_MODEL_SET)
      - PIPELINE_MODE=${PIPELINE_MODE:-vlm}
      # Preload resident backend lookup models at boot when true
      - BACKEND_MODEL_PRELOAD=${BACKEND_MODEL_PRELOAD:-false}
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      # Persistent model-zoo/tiktoken/HuggingFace caches (offline mode enforced at runtime)
      - TORCH_HOME=/models/model-zoo/.torch_cache
      - TIKTOKEN_CACHE_DIR=/models/model-zoo/.tiktoken_cache
      - HF_HOME=/models/huggingface-cache
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-1}
      - ULTRALYTICS_OFFLINE=1
      - YOLO_VERBOSE=False
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-security}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-security}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Set FILE_WATCHER_POLLING=true only on macOS/Docker Desktop where bind-mount inotify lags
      - FILE_WATCHER_POLLING=${FILE_WATCHER_POLLING:-false}
      - PYROSCOPE_ENABLED=${PYROSCOPE_ENABLED:-true}
      - PYROSCOPE_URL=http://pyroscope:4040
      - PYROSCOPE_SAMPLE_RATE=${PYROSCOPE_SAMPLE_RATE:-100}
      - PYROSCOPE_MEMORY_ENABLED=${PYROSCOPE_MEMORY_ENABLED:-true}
      # VLM client endpoint, timeouts, and slot budget (must match ai-vlm service)
      - AI_VLM_URL=${AI_VLM_URL:-http://ai-vlm:8098}
      - AI_VLM_READ_TIMEOUT=${AI_VLM_READ_TIMEOUT:-25.0}
      - AI_VLM_WAKE_TIMEOUT_SECONDS=${AI_VLM_WAKE_TIMEOUT_SECONDS:-90.0}
      - VLM_ENFORCEMENT_PROBE_ENABLED=${VLM_ENFORCEMENT_PROBE_ENABLED:-true}
      - VLM_REQUIRED_BUILD=${VLM_REQUIRED_BUILD:-}
      - VLM_MODEL_ID=${VLM_MODEL_ID:-Qwen3VL-8B-Instruct-Q4_K_M}
      - VLM_MAX_IMAGE_BYTES=${VLM_MAX_IMAGE_BYTES:-8388608}
      - VLM_CTX_SIZE=${VLM_CTX_SIZE:-32768}
      - VLM_PARALLEL=${VLM_PARALLEL:-2}
      - VLM_SLEEP_IDLE_SECONDS=${VLM_SLEEP_IDLE_SECONDS:-300}
      - CTX_SIZE=${CTX_SIZE:-262144}
      # AI Gateway endpoints
      - PARALLEL=${PARALLEL:-8}
      - USE_AI_GATEWAY=true
      - AI_GATEWAY_URL=http://ai-gateway:8090
      - YOLO26_URL=http://ai-gateway:8090/yolo26
      - ENRICHMENT_LIGHT_URL=http://ai-gateway:8090/enrich-lt
      - GO2RTC_API_URL=http://go2rtc:1984
      - GO2RTC_WEBRTC_URL=${GO2RTC_WEBRTC_URL:-http://localhost:8555}
      - DETECTOR_TYPE=${DETECTOR_TYPE:-yolo26}
      - FRONTEND_URL=http://frontend:${FRONTEND_INTERNAL_PORT:-8080}
      - FOSCAM_BASE_PATH=/cameras
      - CAMERA_TIMEZONE=${CAMERA_TIMEZONE:-}
      - DEBUG=${DEBUG:-false}
      - ADMIN_ENABLED=${ADMIN_ENABLED:-false}
      # OD-12 / O1.11: EXPOSE_LAN=true arms auth gate on /api and /ws; API_KEYS accepts machine callers
      - EXPOSE_LAN=${EXPOSE_LAN:-false}
      - API_KEYS=${API_KEYS:-[]}
      # Set SESSION_COOKIE_SECURE=false only for plain-HTTP local/tunnel logins
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
      - FAST_PATH_ENABLED=${FAST_PATH_ENABLED:-false}
      # OpenTelemetry distributed tracing -> Alloy -> Tempo
      - FAST_PATH_CONFIDENCE_THRESHOLD=${FAST_PATH_CONFIDENCE_THRESHOLD:-0.90}
      - TRASH_RETENTION_DAYS=${TRASH_RETENTION_DAYS:-30}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-nemotron-backend}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}
      - OTEL_TRACE_SAMPLE_RATE=${OTEL_TRACE_SAMPLE_RATE:-1.0}
      - ORCHESTRATOR_DOCKER_HOST=${ORCHESTRATOR_DOCKER_HOST:-unix:///var/run/podman/podman.sock}
      - READINESS_REQUIRE_PIPELINE_WORKERS=${READINESS_REQUIRE_PIPELINE_WORKERS:-false}
    depends_on:
      foscam-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-gateway:
        condition: service_healthy
      go2rtc:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import httpx; r = httpx.get(''http://localhost:8000/api/system/health/ready''); exit(0 if r.status_code == 200 else 1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 10G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  redis:
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
    # Host sysctls (vm.overcommit_memory=1, net.core.somaxconn=511) are configured by setup.py
    image: docker.io/library/redis:7.4-alpine3.21
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    # Requires REDIS_PASSWORD when set in .env
    command: >-
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        echo "Starting Redis with password authentication"
        redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy volatile-lru --slowlog-log-slower-than 10000 --slowlog-max-len 128 --stop-writes-on-bgsave-error no --requirepass "$$REDIS_PASSWORD"
      else
        echo "Starting Redis without authentication (development mode)"
        redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy volatile-lru --slowlog-log-slower-than 10000 --slowlog-max-len 128 --stop-writes-on-bgsave-error no
      fi
      '
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: >-
        sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG
        else
          redis-cli ping | grep -q PONG
        fi
        '
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # go2rtc RTSP-to-WebRTC gateway (API :1984, WebRTC :8555)
  go2rtc:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/alexxit/go2rtc:latest
    container_name: hsi-go2rtc
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GO2RTC_API_PORT:-1984}:1984' # API
      - '127.0.0.1:${GO2RTC_WEBRTC_PORT:-8555}:8555' # WebRTC
    environment:
      - GO2RTC_API_ORIGIN=*
    volumes:
      - ./config/go2rtc.yaml:/config/go2rtc.yaml:ro,z
    networks:
      - security-net
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '-O',
          '/dev/null',
          'http://localhost:1984/api/streams',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    # Writable rootfs required: entrypoint updates nginx config and generates self-signed certs

  frontend:
    tmpfs:
      - /tmp
      - /var/run # nginx pid file
      - /var/cache/nginx # nginx cache
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    ports:
      # Binds 127.0.0.1 by default; 0.0.0.0 only when setup.py derives FRONTEND_BIND_ADDRESS from EXPOSE_LAN=true
      - '${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HTTPS_PORT:-8444}:8443'
      - '${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HTTP_PORT:-8080}:8080'
    volumes:
      - frontend_certs:/etc/nginx/certs:U
    environment:
      - SSL_SAN_EXTRA=${SSL_SAN_EXTRA:-}
      # SSL disabled by default in compose (SSL_ENABLED=false; setup.py writes SSL_ENABLED=true)
      - SSL_ENABLED=${SSL_ENABLED:-false}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-/etc/nginx/certs/cert.pem}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-/etc/nginx/certs/key.pem}
      - FRONTEND_HTTPS_PORT=${FRONTEND_HTTPS_PORT:-8444}
      # Mode-gated nginx auth_request for /grafana/ and :8081 machine alert sink when EXPOSE_LAN=true
      - EXPOSE_LAN=${EXPOSE_LAN:-false}
      - MONITORING_API_KEY=${MONITORING_API_KEY:-}
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:${FRONTEND_INTERNAL_PORT:-8080}/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Grafana Tempo distributed trace backend (OTLP gRPC :4317, HTTP :3200)

  tempo:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/grafana/tempo:2.7.1
    container_name: tempo
    volumes:
      - ./monitoring/tempo/tempo-config.yml:/etc/tempo/config.yml:ro,z
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/config.yml
    ports:
      - '127.0.0.1:${TEMPO_PORT:-3200}:3200'
      - '127.0.0.1:${TEMPO_OTLP_GRPC:-4317}:4317'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3200/ready']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  prometheus:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prom/prometheus:v3.1.0
    # Renders __HSI_MONITORING_API_KEY__ into /tmp/prometheus.yml at boot for gated /api/metrics scrape
    environment:
      - MONITORING_API_KEY=${MONITORING_API_KEY:-}
    tmpfs:
      - /tmp
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./monitoring/prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml:ro,z
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro,z
      - ./monitoring/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro,z
      - ./monitoring/profiling-recording-rules.yml:/etc/prometheus/profiling-recording-rules.yml:ro,z
      - ./monitoring/profiling-regression-alerts.yml:/etc/prometheus/profiling-regression-alerts.yml:ro,z
      - ./monitoring/gpu-alerts.yml:/etc/prometheus/gpu-alerts.yml:ro,z
      - ./monitoring/ai-pipeline-alerts.yml:/etc/prometheus/ai-pipeline-alerts.yml:ro,z
      - prometheus_data:/prometheus
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        sed "s|__HSI_MONITORING_API_KEY__|$${MONITORING_API_KEY:-}|g"
        /etc/prometheus/prometheus.yml > /tmp/prometheus.yml && chmod 0600
        /tmp/prometheus.yml && exec
        /bin/prometheus --config.file=/tmp/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
        --web.enable-lifecycle --web.enable-remote-write-receiver
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9090/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  grafana:
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: ./monitoring/grafana
      dockerfile: Dockerfile
    image: nemotron-v3-home-security-intelligence-grafana:latest
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3002}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    environment:
      # Anonymous Admin in local loopback mode; disabled when EXPOSE_LAN=true enables auth.proxy
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-${GRAFANA_ANONYMOUS_ENABLED:-true}}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=${GF_AUTH_DISABLE_LOGIN_FORM:-true}
      - GF_AUTH_PROXY_ENABLED=${GRAFANA_AUTH_PROXY_ENABLED:-false}
      - GF_AUTH_PROXY_HEADER_NAME=X-Auth-User
      - GF_AUTH_PROXY_AUTO_SIGN_UP=${GRAFANA_AUTH_PROXY_AUTO_SIGN_UP:-false}
      - GF_AUTH_PROXY_AUTO_SIGN_UP_ORG_ROLE=Viewer
      - GF_USERS_AUTO_ASSIGN_ORG=true
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      - MONITORING_API_KEY=${MONITORING_API_KEY:-}
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_EXPLORE_ENABLED=true
      - GF_USERS_ALLOW_SIGN_UP=false
      # Served under /grafana/ via frontend nginx proxy
      - GF_SERVER_ROOT_URL=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ROUTER_LOGGING=true
      - GF_PATHS_PLUGINS=/opt/grafana/plugins
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${GF_SMTP_HOST:-smtp.example.com:587}
      - GF_SMTP_USER=${GF_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:-grafana@example.com}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME:-Grafana Alerts}
      - GF_SMTP_STARTTLS_POLICY=${GF_SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
      - GF_SMTP_SKIP_VERIFY=${GF_SMTP_SKIP_VERIFY:-false}
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  redis-exporter:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/oliver006/redis_exporter:v1.55.0
    ports:
      - '127.0.0.1:${REDIS_EXPORTER_PORT:-9121}:9121'
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
    # Minimal Go binary without wget/curl; health monitored by Prometheus scrape
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  json-exporter:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prometheuscommunity/json-exporter:v0.6.0
    # Renders MONITORING_API_KEY header into /tmp/json-exporter-config.yml when EXPOSE_LAN=true
    environment:
      - MONITORING_API_KEY=${MONITORING_API_KEY:-}
      - EXPOSE_LAN=${EXPOSE_LAN:-false}
    tmpfs:
      - /tmp
    ports:
      - '127.0.0.1:${JSON_EXPORTER_PORT:-7979}:7979'
    volumes:
      - ./monitoring/json-exporter-config.yml:/etc/json-exporter/config.yml:ro,z
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        case "$(printf %s "$${EXPOSE_LAN:-false}" | tr "[:upper:]" "[:lower:]"
        | tr -d "[:space:]")" in true|t|yes|y|on|1) sed
        "s|__HSI_MONITORING_API_KEY__|$${MONITORING_API_KEY:-}|g"
        /etc/json-exporter/config.yml > /tmp/json-exporter-config.yml ;; *)
        sed "/^    headers:\$/{N;d;}" /etc/json-exporter/config.yml >
        /tmp/json-exporter-config.yml ;; esac; chmod 0600
        /tmp/json-exporter-config.yml; exec /bin/json_exporter
        --config.file=/tmp/json-exporter-config.yml
        --web.listen-address=:7979
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  alertmanager:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prom/alertmanager:v0.27.0
    # Renders ALERT_SINK_URL into /tmp/alertmanager.yml at boot
    environment:
      - ALERT_SINK_URL=${ALERT_SINK_URL:-http://backend:8000/api/webhooks/alerts}
    tmpfs:
      - /tmp
    ports:
      - '127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      - alertmanager_data:/alertmanager
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        sed "s|__HSI_ALERT_SINK__|$${ALERT_SINK_URL}|g"
        /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml && chmod
        0600 /tmp/alertmanager.yml && exec
        /bin/alertmanager --config.file=/tmp/alertmanager.yml
        --storage.path=/alertmanager --web.listen-address=:9093
        --cluster.listen-address=
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9093/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          # Blackbox Exporter for endpoint probing
          cpus: '0.5'
          memory: 128M

  blackbox-exporter:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prom/blackbox-exporter:v0.24.0
    ports:
      - '127.0.0.1:${BLACKBOX_EXPORTER_PORT:-9115}:9115'
    volumes:
      - ./monitoring/blackbox-exporter.yml:/etc/blackbox_exporter/config.yml:ro,z
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
      - '--log.level=info'
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9115/metrics']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M
  # Loki log aggregation (receives container logs from Alloy)

  loki:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/grafana/loki:3.5.1
    container_name: loki
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro,z
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - '127.0.0.1:${LOKI_PORT:-3100}:3100'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3100/ready']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1G

  # Pyroscope continuous profiling server
  pyroscope:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: ./monitoring/pyroscope
      dockerfile: Dockerfile
    container_name: pyroscope
    volumes:
      - ./monitoring/pyroscope/pyroscope-config.yml:/etc/pyroscope/config.yml:ro,z
      - pyroscope_data:/data
    command: -config.file=/etc/pyroscope/config.yml
    ports:
      - '127.0.0.1:${PYROSCOPE_PORT:-4040}:4040'
    networks:
      - security-net
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4040/ready']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

  # Node Exporter for host hardware/OS metrics
  node-exporter:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prom/node-exporter:v1.8.2
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    ports:
      - '127.0.0.1:${NODE_EXPORTER_PORT:-9100}:9100'
    pid: host
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9100/metrics']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    labels:
      - 'prometheus.scrape=true'
      - 'prometheus.port=9100'

  # NVIDIA DCGM GPU metrics exporter (opt-in --profile gpu-rootful; requires rootful Podman)
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: dcgm-exporter
    restart: unless-stopped
    profiles:
      - gpu-rootful
    security_opt:
      - label=disable
    devices:
      - nvidia.com/gpu=all
    volumes:
      - ./monitoring/dcgm/custom-counters.csv:/etc/dcgm-exporter/default-counters.csv:ro,z
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
      - DCGM_EXPORTER_KUBERNETES=false
    ports:
      - '127.0.0.1:${DCGM_EXPORTER_PORT:-9400}:9400'
    cap_add:
      - SYS_ADMIN
    networks:
      - security-net
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://localhost:9400/metrics']
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana Alloy (Podman log collector, OTLP trace receiver, and eBPF profiler)
  alloy:
    image: docker.io/grafana/alloy:v1.9.2
    container_name: alloy
    cap_add:
      - SYS_ADMIN # eBPF map creation, cgroup access
      - BPF # eBPF program loading
      - PERFMON # perf_event_open for profiling
      - SYS_PTRACE # Reading /proc/<pid>/maps for symbol resolution
      - SYS_RESOURCE # setrlimit for memlock
    cap_drop:
      - ALL
    security_opt:
      - label=disable
    pid: host
    user: root
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro,z
      - ${PODMAN_SOCKET:?PODMAN_SOCKET must be set}:${PODMAN_SOCKET}
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /proc:/host/proc:ro
      - alloy_symb_cache:/tmp/symb-cache
    ulimits:
      memlock:
        soft: 8589934592
        hard: 8589934592
    environment:
      - HOST_PROC=/host/proc
      - PODMAN_SOCKET=${PODMAN_SOCKET}
    command:
      - run
      - --stability.level=public-preview
      - --storage.path=/tmp/alloy
      - /etc/alloy/config.alloy
    ports:
      - '127.0.0.1:${ALLOY_UI_PORT:-12345}:12345' # Alloy UI
      - '127.0.0.1:${ALLOY_OTLP_GRPC_PORT:-14317}:4317' # OTLP gRPC (loopback)
      - '127.0.0.1:${ALLOY_OTLP_HTTP_PORT:-14318}:4318' # OTLP HTTP (loopback)
    depends_on:
      - loki
      - pyroscope
    healthcheck:
      test: ['CMD', 'pgrep', '-f', 'alloy']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  tempo_data:
    driver: local
  hf_cache:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local
  pyroscope_data:
    driver: local
  alloy_symb_cache:
    driver: local
  frontend_certs:
    driver: local
  triton-kernel-cache:
    driver: local
  triton-tmp-cache:
    driver: local
  llama-cache:
    driver: local
  llama-nv-cache:
    driver: local

networks:
  security-net:
    driver: bridge
