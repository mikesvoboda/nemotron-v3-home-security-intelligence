# Gateway Mode Overrides (Default Deployment Mode)
#
# Routes backend AI traffic through the unified ai-gateway (Triton + FastAPI)
# instead of 5 individual AI containers. This is the default deployment mode.
#
# Usage:
#   podman compose -f docker-compose.prod.yml -f docker-compose.gateway.yml up -d
#
# To use standalone mode instead (5 individual AI containers):
#   podman compose -f docker-compose.prod.yml --profile standalone up -d

services:
  backend:
    environment:
      # Route all AI traffic through the unified gateway
      - USE_AI_GATEWAY=true
      - AI_GATEWAY_URL=http://ai-gateway:8090
      - YOLO26_URL=http://ai-gateway:8090/yolo26
      - NEMOTRON_URL=http://ai-llm:${LLM_PORT:-8091}
      - FLORENCE_URL=http://ai-gateway:8090/florence
      - CLIP_URL=http://ai-gateway:8090/clip
      - ENRICHMENT_URL=http://ai-gateway:8090/enrichment
      - ENRICHMENT_LIGHT_URL=http://ai-gateway:8090/enrich-lt
    depends_on:
      ai-gateway:
        condition: service_started
