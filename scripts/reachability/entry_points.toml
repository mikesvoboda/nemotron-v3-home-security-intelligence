# O2.3 (plan 01 §M1): declared roots of the reachability walk.
#
# Declaration rule (pinned by scripts/test_reachability.py — an entry list
# that silently rots misclassifies every module behind it):
#   1. the application roots: backend/main.py (+ the worker processes it
#      starts IN-PROCESS via pipeline_workers), ai/gateway/main.py, the
#      synthbench CLI (python -m synthbench -> __main__.py -> cli.py);
#   2. every NON-TEST .py path named by a file under .github/workflows/ or by
#      .pre-commit-config.yaml — that grep is exactly what the pin test
#      re-runs. Shell wrappers are not followed: a .sh's python payload is
#      either named by the workflow itself or reached through another entry.
#      scripts/audit/test_*.py suites are tests (never roots): a module that
#      only ever executes from inside a test is, by this model's own rule,
#      not shipping — keep.toml is where a human overrides that, per module,
#      with a reason.
#
# dynamic_allow: the one channel for string/dynamic imports (§M1). An
# un-allowlisted literal is reported `unresolved`, never silently shipped.

entries = [
