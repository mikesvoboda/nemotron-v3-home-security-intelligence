# The uplevel sandbox roster (O0.1, UR-26 and UR-28). scripts/uplevel/launch.py reads
# this; the owner runs the launcher. The roster mirrors docs/uplevel/roles/lane.md ("Who
# takes what"), docs/uplevel/roles/coordinator.md and docs/uplevel/roles/operator.md, and
# the hand start of Phases 0 and 1 is docs/uplevel/rules.md UR-28 - when the coordinator
# changes the plan, this file changes with it, in that PR.
#
# Each session: its name (agent-dgx's session; the sandbox is `agent-<name>`, its clone
# /agents/agent-<name>/workspace), its model (a key of [models] below), and its kickoff
# line, pasted into the agent's pane after the launcher prints it. A split lane's kickoff
# carries the cell sentence (roles/lane.md, "Split lanes" and "Kickoff prompt").
#
# Network profiles, allow-lists and secrets are deliberately NOT declared here: no shown
# `agent-dgx` flag takes them (history/packages-done.md §O0.1). Provisioning stays the
# owner's: tokens via `sbx secret set github --sandbox agent-<session>` (rules.md, UR-26).

# The fast model's arguments are the pair the repo already shows (synthbench/host/agent.py,
# docs/synthbench/operator-runbook.md). The strongest model's are the owner's ruling, posted
# on the O0.1 PR (#6855): no --endpoint, so the session runs on Claude Code's own upstream -
# the Anthropic API, not a DGX-served model - and no --model, so it runs Claude Code's
# default (the owner's choice; a default change is then this session's model change). A
# session naming a model with no entry here still makes the launcher refuse the whole phase
# before any change and name this file.
[models]
fast = "--agent claude --endpoint dgx"
strongest = "--agent claude"

# Phase 0 (UR-28): the owner started these two by hand; the launcher takes over whenever
# it is first run. The rows are what it would create.
[[phase]]
number = 0

[[phase.session]]
name = "uplevel-coordinator"
model = "fast"
kickoff = """\
Follow the kickoff prompt in docs/uplevel/roles/coordinator.md."""

[[phase.session]]
name = "uplevel-ops-b"
model = "fast"
kickoff = """\
Follow the kickoff prompt in docs/uplevel/roles/lane.md. \
You are cell B of the ops lane; take only packages the coordinator assigns to your cell."""

# Phase 1: the rest of the roster (roles/lane.md, "Who takes what"). The owner opened
# `uplevel-heavy-2` on 2026-10-09; its row follows `uplevel-heavy`'s.
[[phase]]
number = 1

[[phase.session]]
name = "uplevel-coordinator"
model = "fast"
kickoff = """\
Follow the kickoff prompt in docs/uplevel/roles/coordinator.md."""

[[phase.session]]
name = "uplevel-ops-a"
model = "fast"
kickoff = """\
Follow the kickoff prompt in docs/uplevel/roles/lane.md. \
You are cell A of the ops lane; take only packages the coordinator assigns to your cell."""

[[phase.session]]
name = "uplevel-ops-b"
model = "fast"
kickoff = """\
Follow the kickoff prompt in docs/uplevel/roles/lane.md. \
You are cell B of the ops lane; take only packages the coordinator assigns to your cell."""

[[phase.session]]
name = "uplevel-backend"
model = "fast"
kickoff = """\
Follow the kickoff prompt in docs/uplevel/roles/lane.md. \
You are the backend lane."""

[[phase.session]]
name = "uplevel-frontend"
model = "fast"
kickoff = """\
Follow the kickoff prompt in docs/uplevel/roles/lane.md. \
You are the frontend lane."""

[[phase.session]]
name = "uplevel-docs"
model = "fast"
kickoff = """\
Follow the kickoff prompt in docs/uplevel/roles/lane.md. \
You are the docs lane."""

# Name the prompt's file and line, never a position: the old shared plan file ended with
# the coordinator's OWN prompt, and `up` prints this line verbatim, so a positional pointer
# silently started the heavy sandbox as the coordinator. The heavy prompt is in
# roles/lane.md, never the coordinator's file.
[[phase.session]]
name = "uplevel-heavy"
model = "strongest"
kickoff = """\
Follow the kickoff prompt in docs/uplevel/roles/lane.md. \
You are uplevel-heavy."""

# The second heavy sandbox (owner rulings 28 and 50). Both heavy agents paste the same
# prompt, so the line names this one and its label: a `heavy` PR labelled `cell:heavy-2` is
# its; every other `heavy` PR is `uplevel-heavy`'s (roles/lane.md, "Heavy agents").
[[phase.session]]
name = "uplevel-heavy-2"
model = "strongest"
kickoff = """\
Follow the kickoff prompt in docs/uplevel/roles/lane.md. \
You are uplevel-heavy-2; take only heavy PRs labelled cell:heavy-2."""

# UR-30: the only GPU holder. The owner hand-started it for Phase 1; this row lets the
# launcher create it from the next phase boundary. gpu = true makes `up` add --gpu after
# the model arguments (the order in rules.md UR-30's hand-start line) and requires
# AGENT_GPU_RUNNER_URL in the launching shell. No mount for /srv/agent-models: agent-dgx
# --gpu mounts that library itself and refuses any mount at or under it.
# Name the prompt as a section, never by position: `up` prints this line verbatim, and a
# position rots when the file grows (#6864 found the heavy row doing exactly this, and
# main's heavy row now carries the section form).
# O1.10 (history/packages-done.md) first wrote the operator's line positionally ("at the
# end of ..."); ruling 13 routed that correction into its PR, so the plan text names the
# section too.
# The /synthbench mounts are read-only and owner-ruled (rulings 49 and 57): the eval stores,
# the exports and the corpus, which is its own ZFS dataset and so needs its own mount (a bind
# of /synthbench would show it empty). None is at or under /srv/agent-models.
[[phase.session]]
name = "uplevel-operator"
model = "fast"
gpu = true
mount = ["/synthbench/eval:ro", "/synthbench/exports:ro", "/synthbench/corpus:ro"]
kickoff = """\
Follow the kickoff prompt in docs/uplevel/roles/operator.md. \
It is the section named "Kickoff prompt" in that file."""

