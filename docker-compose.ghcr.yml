# Docker Compose for full GHCR-based installation
#
# This file pulls ALL pre-built images from GitHub Container Registry for easy deployment.
# No local building required - just configure environment and run.
#
# Compatible with Docker and Podman on Linux.
# NOTE: AI services require NVIDIA GPUs and are x86_64 only (no ARM support).
#
# Usage:
#   Docker:  docker compose -f docker-compose.ghcr.yml up -d
#   Podman:  podman-compose -f docker-compose.ghcr.yml up -d
#
# Environment Variables (Required):
#   - POSTGRES_PASSWORD: Database password (REQUIRED - no default for security)
#     Generate with: openssl rand -base64 32
#
# Environment Variables (Optional):
#   - IMAGE_TAG: Image version to use (default: latest)
#   - GHCR_OWNER: GitHub Container Registry owner (default: mikesvoboda)
#   - GHCR_REPO: Repository name (default: nemotron-v3-home-security-intelligence)
#   - AI_MODELS_PATH: Base path for AI models (default: /export/ai_models)
#   - FOSCAM_BASE_PATH: Camera recordings path (default: /export/foscam)
#   - FRONTEND_HTTPS_PORT: HTTPS port (default: 8443)
#   - GPU_YOLO26, GPU_FLORENCE, GPU_CLIP, GPU_ENRICHMENT: GPU assignments
#
# Quick Start:
#   1. Copy .env.example to .env and configure POSTGRES_PASSWORD
#   2. Ensure AI models are downloaded to AI_MODELS_PATH
#   3. Run: podman-compose -f docker-compose.ghcr.yml pull
#   4. Run: podman-compose -f docker-compose.ghcr.yml up -d

version: '3.8'

x-ghcr-image: &ghcr-image
  # Override these via environment variables:
  # GHCR_OWNER=your-org GHCR_REPO=your-repo IMAGE_TAG=v1.0.0
  image: ghcr.io/${GHCR_OWNER:-mikesvoboda}/${GHCR_REPO:-nemotron-v3-home-security-intelligence}

services:
  # =============================================================================
  # Core Infrastructure
  # =============================================================================

  postgres:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
    image: docker.io/library/postgres:16-alpine
    tmpfs:
      - /tmp
      - /var/run/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-security}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - run ./setup.sh or set manually}
      - POSTGRES_DB=${POSTGRES_DB:-security}
    command:
      - postgres
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_duration=on
      - -c
      - log_line_prefix=%t [%p] %u@%d
      - -c
      - log_statement=ddl
      - -c
      - log_checkpoints=on
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-security} -d ${POSTGRES_DB:-security}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  redis:
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
    sysctls:
      - net.core.somaxconn=511
    image: docker.io/library/redis:7.4-alpine3.21
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    command: >-
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        echo "Starting Redis with password authentication"
        redis-server --appendonly yes --appendfsync everysec --maxmemory 450mb --maxmemory-policy allkeys-lru --slowlog-log-slower-than 10000 --slowlog-max-len 128 --stop-writes-on-bgsave-error no --requirepass "$$REDIS_PASSWORD"
      else
        echo "Starting Redis without authentication (development mode)"
        redis-server --appendonly yes --appendfsync everysec --maxmemory 450mb --maxmemory-policy allkeys-lru --slowlog-log-slower-than 10000 --slowlog-max-len 128 --stop-writes-on-bgsave-error no
      fi
      '
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: >-
        sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG
        else
          redis-cli ping | grep -q PONG
        fi
        '
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # =============================================================================
  # AI Services (GHCR Images - x86_64 only, requires NVIDIA GPU)
  # =============================================================================

  ai-yolo26:
    labels:
      pyroscope.profile: 'true'
      pyroscope.service: 'ai-yolo26'
    image: ghcr.io/${GHCR_OWNER:-mikesvoboda}/${GHCR_REPO:-nemotron-v3-home-security-intelligence}/ai-yolo26:${IMAGE_TAG:-latest}
    ports:
      - '127.0.0.1:8095:8095'
    volumes:
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo/yolo26:/models/yolo26:ro
      - pytorch-profiles:/tmp/profiles
    environment:
      - SERVICE_NAME=ai-yolo26
      - PYROSCOPE_ENABLED=${PYROSCOPE_ENABLED:-true}
      - PYROSCOPE_URL=http://pyroscope:4040
      - PYROSCOPE_SAMPLE_RATE=${PYROSCOPE_SAMPLE_RATE:-100}
      - YOLO26_CONFIDENCE=${YOLO26_CONFIDENCE:-0.5}
      - YOLO26_MODEL_PATH=/models/yolo26/exports/yolo26m_fp16.engine
      - PYTORCH_PROFILE_ENABLED=${PYTORCH_PROFILE_ENABLED:-false}
      - PYTORCH_PROFILE_RATE=${PYTORCH_PROFILE_RATE:-0.05}
      - PYTORCH_PROFILE_DIR=/tmp/profiles
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import httpx; r = httpx.get('http://localhost:8095/health'); exit(0 if r.status_code == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_YOLO26}']
              capabilities: [gpu]

  ai-llm:
    tmpfs:
      - /tmp
      - /home/llama/.cache
    labels:
      pyroscope.profile: 'true'
      pyroscope.service: 'ai-llm'
    image: ghcr.io/${GHCR_OWNER:-mikesvoboda}/${GHCR_REPO:-nemotron-v3-home-security-intelligence}/ai-llm:${IMAGE_TAG:-latest}
    ports:
      - '127.0.0.1:8091:8091'
    volumes:
      - ${AI_MODELS_PATH:-/export/ai_models}/nemotron/nemotron-3-nano-30b-a3b-q4km:/models:ro
    environment:
      - SERVICE_NAME=ai-llm
      - PYROSCOPE_ENABLED=${PYROSCOPE_ENABLED:-true}
      - PYROSCOPE_URL=http://pyroscope:4040
      - PYROSCOPE_SAMPLE_RATE=${PYROSCOPE_SAMPLE_RATE:-100}
      - GPU_LAYERS=${GPU_LAYERS:-45}
      - CTX_SIZE=${CTX_SIZE:-65536}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8091/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ai-florence:
    tmpfs:
      - /tmp
      - /home/florence/.cache
    labels:
      pyroscope.profile: 'true'
      pyroscope.service: 'ai-florence'
    image: ghcr.io/${GHCR_OWNER:-mikesvoboda}/${GHCR_REPO:-nemotron-v3-home-security-intelligence}/ai-florence:${IMAGE_TAG:-latest}
    ports:
      - '127.0.0.1:8092:8092'
    volumes:
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo/florence-2-large:/models/florence-2-large:ro
      - hf_cache:/cache/huggingface:U
      - pytorch-profiles:/tmp/profiles
    environment:
      - SERVICE_NAME=ai-florence
      - PYROSCOPE_ENABLED=${PYROSCOPE_ENABLED:-true}
      - PYROSCOPE_URL=http://pyroscope:4040
      - PYROSCOPE_SAMPLE_RATE=${PYROSCOPE_SAMPLE_RATE:-100}
      - MODEL_PATH=/models/florence-2-large
      - HF_HOME=/cache/huggingface
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - HF_HUB_DISABLE_TELEMETRY=1
      - PYTORCH_PROFILE_ENABLED=${PYTORCH_PROFILE_ENABLED:-false}
      - PYTORCH_PROFILE_RATE=${PYTORCH_PROFILE_RATE:-0.05}
      - PYTORCH_PROFILE_DIR=/tmp/profiles
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8092/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_FLORENCE}']
              capabilities: [gpu]

  ai-clip:
    tmpfs:
      - /tmp
      - /home/clip/.cache
    labels:
      pyroscope.profile: 'true'
      pyroscope.service: 'ai-clip'
    image: ghcr.io/${GHCR_OWNER:-mikesvoboda}/${GHCR_REPO:-nemotron-v3-home-security-intelligence}/ai-clip:${IMAGE_TAG:-latest}
    ports:
      - '127.0.0.1:8093:8093'
    volumes:
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo/clip-vit-l:/models/clip-vit-l:ro
      - clip-tensorrt-cache:/cache/tensorrt
      - pytorch-profiles:/tmp/profiles
    environment:
      - SERVICE_NAME=ai-clip
      - PYROSCOPE_ENABLED=${PYROSCOPE_ENABLED:-true}
      - PYROSCOPE_URL=http://pyroscope:4040
      - PYROSCOPE_SAMPLE_RATE=${PYROSCOPE_SAMPLE_RATE:-100}
      - CLIP_MODEL_PATH=/models/clip-vit-l
      - CLIP_USE_TENSORRT=${CLIP_USE_TENSORRT:-true}
      - CLIP_ENGINE_PATH=/cache/tensorrt/vision_encoder_fp16.engine
      - PYTORCH_PROFILE_ENABLED=${PYTORCH_PROFILE_ENABLED:-false}
      - PYTORCH_PROFILE_RATE=${PYTORCH_PROFILE_RATE:-0.05}
      - PYTORCH_PROFILE_DIR=/tmp/profiles
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8093/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ai-enrichment-light:
    tmpfs:
      - /tmp
      - /home/enrichment/.cache
    labels:
      pyroscope.profile: 'true'
      pyroscope.service: 'ai-enrichment-light'
    image: ghcr.io/${GHCR_OWNER:-mikesvoboda}/${GHCR_REPO:-nemotron-v3-home-security-intelligence}/ai-enrichment:${IMAGE_TAG:-latest}
    ports:
      - '127.0.0.1:8096:8096'
    volumes:
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo/yolov8n-pose:/models/yolov8n-pose:ro
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo/threat-detection-yolov8n:/models/threat-detection-yolov8n:ro
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo/osnet-x0-25:/models/osnet-x0-25:ro
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo/pet-classifier:/models/pet-classifier:ro
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo/depth-anything-v2-small:/models/depth-anything-v2-small:ro
      - enrichment-light-tensorrt-cache:/cache/tensorrt
      - pytorch-profiles:/tmp/profiles
    environment:
      - SERVICE_NAME=ai-enrichment-light
      - GPU_TIER=light
      - PYROSCOPE_ENABLED=${PYROSCOPE_ENABLED:-true}
      - PYROSCOPE_URL=http://pyroscope:4040
      - PYROSCOPE_SAMPLE_RATE=${PYROSCOPE_SAMPLE_RATE:-100}
      - ENRICHMENT_POSE_SERVICE=${ENRICHMENT_POSE_SERVICE:-light}
      - ENRICHMENT_THREAT_SERVICE=${ENRICHMENT_THREAT_SERVICE:-light}
      - ENRICHMENT_REID_SERVICE=${ENRICHMENT_REID_SERVICE:-light}
      - ENRICHMENT_PET_SERVICE=${ENRICHMENT_PET_SERVICE:-light}
      - ENRICHMENT_DEPTH_SERVICE=${ENRICHMENT_DEPTH_SERVICE:-light}
      - POSE_MODEL_PATH=/models/yolov8n-pose/yolov8n-pose.pt
      - THREAT_MODEL_PATH=/models/threat-detection-yolov8n/weights/best.pt
      - REID_MODEL_PATH=/models/osnet-x0-25/osnet_x0_25.pth
      - PET_MODEL_PATH=/models/pet-classifier
      - DEPTH_MODEL_PATH=/models/depth-anything-v2-small
      - POSE_USE_TENSORRT=${POSE_USE_TENSORRT:-true}
      - THREAT_USE_TENSORRT=${THREAT_USE_TENSORRT:-true}
      # Default: All light models (pose, threat, reid, pet, depth) for fast inference
      - ENRICHMENT_PRELOAD_MODELS=${ENRICHMENT_LIGHT_PRELOAD_MODELS:-pose_estimator,threat_detector,person_reid,pet_classifier,depth_estimator}
      - PYTORCH_PROFILE_ENABLED=${PYTORCH_PROFILE_ENABLED:-false}
      - PYTORCH_PROFILE_RATE=${PYTORCH_PROFILE_RATE:-0.05}
      - PYTORCH_PROFILE_DIR=/tmp/profiles
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8096/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_CLIP}']
              capabilities: [gpu]

  ai-enrichment:
    tmpfs:
      - /tmp
      - /home/enrichment/.cache
    labels:
      pyroscope.profile: 'true'
      pyroscope.service: 'ai-enrichment'
    image: ghcr.io/${GHCR_OWNER:-mikesvoboda}/${GHCR_REPO:-nemotron-v3-home-security-intelligence}/ai-enrichment:${IMAGE_TAG:-latest}
    ports:
      - '127.0.0.1:8094:8094'
    volumes:
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo/vehicle-segment-classification:/models/vehicle-segment-classification:ro
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo/fashion-clip:/models/fashion-clip:ro
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo/vit-age-classifier:/models/vit-age-classifier:ro
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo/vit-gender-classifier:/models/vit-gender-classifier:ro
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo/xclip-base-patch32:/models/xclip-base-patch32:ro
      - hf_cache:/cache/huggingface:U
      - pytorch-profiles:/tmp/profiles
    environment:
      - SERVICE_NAME=ai-enrichment
      - GPU_TIER=heavy
      - PYROSCOPE_ENABLED=${PYROSCOPE_ENABLED:-true}
      - PYROSCOPE_URL=http://pyroscope:4040
      - PYROSCOPE_SAMPLE_RATE=${PYROSCOPE_SAMPLE_RATE:-100}
      - VEHICLE_MODEL_PATH=/models/vehicle-segment-classification
      - CLOTHING_MODEL_PATH=/models/fashion-clip
      - AGE_MODEL_PATH=/models/vit-age-classifier
      - GENDER_MODEL_PATH=/models/vit-gender-classifier
      - ACTION_MODEL_PATH=/models/xclip-base-patch32
      - VRAM_BUDGET_GB=6.0
      - MODEL_LOAD_TIMEOUT=30
      - HF_HOME=/cache/huggingface
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - HF_HUB_DISABLE_TELEMETRY=1
      - ENRICHMENT_PRELOAD_MODELS=${ENRICHMENT_PRELOAD_MODELS:-}
      - PYTORCH_PROFILE_ENABLED=${PYTORCH_PROFILE_ENABLED:-false}
      - PYTORCH_PROFILE_RATE=${PYTORCH_PROFILE_RATE:-0.05}
      - PYTORCH_PROFILE_DIR=/tmp/profiles
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8094/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_ENRICHMENT}']
              capabilities: [gpu]

  # =============================================================================
  # Application Services (GHCR Images)
  # =============================================================================

  backend:
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    image: ghcr.io/${GHCR_OWNER:-mikesvoboda}/${GHCR_REPO:-nemotron-v3-home-security-intelligence}/backend:${IMAGE_TAG:-latest}
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./backend/data:/app/data:z,U
      - ${FOSCAM_BASE_PATH:-/export/foscam}:/cameras:ro
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo:/models/model-zoo:ro,z
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-security}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-security}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - PYROSCOPE_ENABLED=${PYROSCOPE_ENABLED:-true}
      - PYROSCOPE_URL=http://pyroscope:4040
      - PYROSCOPE_SAMPLE_RATE=${PYROSCOPE_SAMPLE_RATE:-100}
      - PYROSCOPE_MEMORY_ENABLED=${PYROSCOPE_MEMORY_ENABLED:-true}
      - NEMOTRON_URL=http://ai-llm:8091
      - FLORENCE_URL=http://ai-florence:8092
      - CLIP_URL=http://ai-clip:8093
      - ENRICHMENT_URL=http://ai-enrichment:8094
      - ENRICHMENT_LIGHT_URL=http://ai-enrichment-light:8096
      - GO2RTC_API_URL=http://go2rtc:1984
      - GO2RTC_WEBRTC_URL=${GO2RTC_WEBRTC_URL:-http://localhost:8555}
      - ENRICHMENT_POSE_SERVICE=${ENRICHMENT_POSE_SERVICE:-light}
      - ENRICHMENT_THREAT_SERVICE=${ENRICHMENT_THREAT_SERVICE:-light}
      - ENRICHMENT_REID_SERVICE=${ENRICHMENT_REID_SERVICE:-light}
      - ENRICHMENT_PET_SERVICE=${ENRICHMENT_PET_SERVICE:-light}
      - ENRICHMENT_DEPTH_SERVICE=${ENRICHMENT_DEPTH_SERVICE:-light}
      - ENRICHMENT_VEHICLE_SERVICE=${ENRICHMENT_VEHICLE_SERVICE:-heavy}
      - ENRICHMENT_CLOTHING_SERVICE=${ENRICHMENT_CLOTHING_SERVICE:-heavy}
      - ENRICHMENT_ACTION_SERVICE=${ENRICHMENT_ACTION_SERVICE:-heavy}
      - ENRICHMENT_DEMOGRAPHICS_SERVICE=${ENRICHMENT_DEMOGRAPHICS_SERVICE:-heavy}
      - YOLO26_URL=http://ai-yolo26:8095
      - DETECTOR_TYPE=${DETECTOR_TYPE:-yolo26}
      - FRONTEND_URL=http://frontend:${FRONTEND_INTERNAL_PORT:-8080}
      - FOSCAM_BASE_PATH=/cameras
      - DEBUG=${DEBUG:-false}
      - ADMIN_ENABLED=${ADMIN_ENABLED:-false}
      - FAST_PATH_ENABLED=${FAST_PATH_ENABLED:-false}
      - FAST_PATH_CONFIDENCE_THRESHOLD=${FAST_PATH_CONFIDENCE_THRESHOLD:-0.90}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-nemotron-backend}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}
      - OTEL_TRACE_SAMPLE_RATE=${OTEL_TRACE_SAMPLE_RATE:-1.0}
      - ORCHESTRATOR_DOCKER_HOST=${ORCHESTRATOR_DOCKER_HOST:-tcp://host.containers.internal:2375}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-yolo26:
        condition: service_healthy
      ai-llm:
        condition: service_healthy
      go2rtc:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import httpx; r = httpx.get('http://localhost:8000/api/system/health/ready'); exit(0 if r.status_code == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 6G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  go2rtc:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/alexxit/go2rtc:latest
    container_name: hsi-go2rtc
    restart: unless-stopped
    ports:
      - '127.0.0.1:1984:1984'
      - '127.0.0.1:8555:8555'
    environment:
      - GO2RTC_API_ORIGIN=*
    volumes:
      - ./config/go2rtc.yaml:/config/go2rtc.yaml:ro,z
    networks:
      - security-net
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '-O',
          '/dev/null',
          'http://localhost:1984/api/streams',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  frontend:
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    image: ghcr.io/${GHCR_OWNER:-mikesvoboda}/${GHCR_REPO:-nemotron-v3-home-security-intelligence}/frontend:${IMAGE_TAG:-latest}
    ports:
      - '${FRONTEND_HTTPS_PORT:-8443}:8443'
    volumes:
      - frontend_certs:/etc/nginx/certs:U
    environment:
      - SSL_SAN_EXTRA=${SSL_SAN_EXTRA:-}
      - SSL_ENABLED=${SSL_ENABLED:-true}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-/etc/nginx/certs/cert.pem}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-/etc/nginx/certs/key.pem}
      - FRONTEND_HTTPS_PORT=${FRONTEND_HTTPS_PORT:-8444}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Use /health endpoint which returns 200 directly (avoids 301 redirect issues)
      # FRONTEND_INTERNAL_PORT configures the internal nginx port (default: 8080)
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:${FRONTEND_INTERNAL_PORT:-8080}/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # =============================================================================
  # Monitoring Stack
  # =============================================================================
  # Access points:
  #   - Grafana: http://localhost:3002 (anonymous access enabled by default)
  #   - Prometheus: http://localhost:9090
  #   - Jaeger: http://localhost:16686 (distributed tracing)
  #   - Alertmanager: http://localhost:9093

  elasticsearch:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK
    image: docker.io/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - 'ES_JAVA_OPTS=-Xms${ES_HEAP_SIZE:-2g} -Xmx${ES_HEAP_SIZE:-2g}'
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=85%
      - cluster.routing.allocation.disk.watermark.high=90%
      - cluster.routing.allocation.disk.watermark.flood_stage=95%
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./monitoring/elasticsearch:/usr/share/elasticsearch/config/ilm:ro,z
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -s http://localhost:9200/_cluster/health | grep -q ''"status":"green"\|"status":"yellow"''',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: ${ES_MEMORY_LIMIT:-4G}

  jaeger:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/jaegertracing/all-in-one:1.54
    ports:
      - '127.0.0.1:16686:16686'
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=http://elasticsearch:9200
      - ES_INDEX_PREFIX=jaeger
      - ES_TAGS_AS_FIELDS_ALL=true
      - ES_NUM_SHARDS=1
      - ES_NUM_REPLICAS=0
      - ES_BULK_SIZE=5000000
      - ES_BULK_WORKERS=1
      - ES_BULK_FLUSH_INTERVAL=200ms
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:16686']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  prometheus:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prom/prometheus:v2.48.0
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./monitoring/prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml:ro,z
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro,z
      - ./monitoring/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro,z
      - ./monitoring/gpu-alerts.yml:/etc/prometheus/gpu-alerts.yml:ro,z
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}'
      - '--web.enable-lifecycle'
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9090/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  grafana:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/grafana/grafana:10.2.3
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3002}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=${GF_AUTH_DISABLE_LOGIN_FORM:-true}
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_EXPLORE_ENABLED=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_INSTALL_PLUGINS=marcusolsson-json-datasource 1.3.0
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${GF_SMTP_HOST:-smtp.example.com:587}
      - GF_SMTP_USER=${GF_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:-grafana@example.com}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME:-Grafana Alerts}
      - GF_SMTP_STARTTLS_POLICY=${GF_SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
      - GF_SMTP_SKIP_VERIFY=${GF_SMTP_SKIP_VERIFY:-false}
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  redis-exporter:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/oliver006/redis_exporter:v1.55.0
    ports:
      - '127.0.0.1:9121:9121'
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  json-exporter:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prometheuscommunity/json-exporter:v0.6.0
    ports:
      - '127.0.0.1:7979:7979'
    volumes:
      - ./monitoring/json-exporter-config.yml:/etc/json-exporter/config.yml:ro,z
    command:
      - '--config.file=/etc/json-exporter/config.yml'
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  alertmanager:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prom/alertmanager:v0.27.0
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=:9093'
      - '--cluster.listen-address='
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9093/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  blackbox-exporter:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prom/blackbox-exporter:v0.24.0
    ports:
      - '127.0.0.1:9115:9115'
    volumes:
      - ./monitoring/blackbox-exporter.yml:/etc/blackbox_exporter/config.yml:ro,z
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
      - '--log.level=info'
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9115/metrics']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  loki:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/grafana/loki:2.9.4
    container_name: loki
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro,z
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - '127.0.0.1:3100:3100'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3100/ready']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

  pyroscope:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: ./monitoring/pyroscope
      dockerfile: Dockerfile
    container_name: pyroscope
    volumes:
      - ./monitoring/pyroscope/pyroscope-config.yml:/etc/pyroscope/config.yml:ro,z
      - pyroscope_data:/data
    command: -config.file=/etc/pyroscope/config.yml
    ports:
      - '127.0.0.1:4040:4040'
    networks:
      - security-net
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4040/ready']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - DAC_READ_SEARCH
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/lib/containers/:/var/lib/containers:ro
    ports:
      - '127.0.0.1:8088:8080'
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8080/healthz']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  node-exporter:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prom/node-exporter:v1.8.2
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    ports:
      - '127.0.0.1:9100:9100'
    pid: host
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9100/metrics']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    labels:
      - 'prometheus.scrape=true'
      - 'prometheus.port=9100'

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: dcgm-exporter
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./monitoring/dcgm/custom-counters.csv:/etc/dcgm-exporter/default-counters.csv:ro,z
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
      - DCGM_EXPORTER_KUBERNETES=false
    ports:
      - '127.0.0.1:9400:9400'
    cap_add:
      - SYS_ADMIN
    networks:
      - security-net
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://localhost:9400/metrics']
      interval: 30s
      timeout: 10s
      retries: 3

  alloy:
    image: docker.io/grafana/alloy:v1.0.0
    container_name: alloy
    # nosemgrep: yaml.docker-compose.security.privileged-service.privileged-service
    privileged: true
    pid: host
    user: root
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro,z
      - /run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /proc:/host/proc:ro
      - alloy_symb_cache:/tmp/symb-cache
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - HOST_PROC=/host/proc
    command:
      - run
      - --stability.level=public-preview
      - /etc/alloy/config.alloy
    ports:
      - '127.0.0.1:12345:12345'
      - '4317'
      - '4318'
    depends_on:
      - loki
      - pyroscope
    healthcheck:
      test: ['CMD', 'pgrep', '-f', 'alloy']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  hf_cache:
    driver: local
  enrichment-light-tensorrt-cache:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  clip-tensorrt-cache:
    driver: local
  loki_data:
    driver: local
  pyroscope_data:
    driver: local
  alloy_symb_cache:
    driver: local
  frontend_certs:
    driver: local
  pytorch-profiles:
    driver: local

networks:
  security-net:
    driver: bridge
