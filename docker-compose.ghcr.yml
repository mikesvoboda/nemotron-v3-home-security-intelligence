# Docker Compose for full GHCR-based installation
#
# This file pulls ALL pre-built images from GitHub Container Registry for easy deployment.
# No local building required - just configure environment and run.
#
# Compatible with Docker and Podman on Linux.
# NOTE: AI services require NVIDIA GPUs and are x86_64 only (no ARM support).
#
# Usage:
#   Docker:  docker compose -f docker-compose.ghcr.yml up -d
#   Podman:  podman-compose -f docker-compose.ghcr.yml up -d
#
# Environment Variables (Required):
#   - POSTGRES_PASSWORD: Database password (REQUIRED - no default for security)
#     Generate with: openssl rand -base64 32
#
# Environment Variables (Optional):
#   - IMAGE_TAG: Image version to use (default: latest)
#   - GHCR_OWNER: GitHub Container Registry owner (default: mikesvoboda)
#   - GHCR_REPO: Repository name (default: nemotron-v3-home-security-intelligence)
#   - AI_MODELS_PATH: Base path for AI models (default: /export/ai_models)
#   - FOSCAM_BASE_PATH: Camera recordings path (default: /export/foscam)
#   - FRONTEND_HTTPS_PORT: Host port for frontend HTTPS (default: 8444)
#   - GPU_AI_SERVICES: GPU for AI Gateway / Triton (default: 1)
#   - CTX_SIZE: llama.cpp TOTAL context pool for ai-llm; backend divides it by
#     PARALLEL for its per-request budget (default: 4096)
#   - PARALLEL: llama.cpp slot count used for the backend's per-request context
#     budget; default 2 matches the PARALLEL baked into the ghcr ai-llm image
#
# Quick Start:
#   1. Copy .env.example to .env and configure POSTGRES_PASSWORD
#   2. Ensure AI models are downloaded to AI_MODELS_PATH
#   3. Run: podman-compose -f docker-compose.ghcr.yml pull
#   4. Run: podman-compose -f docker-compose.ghcr.yml up -d

x-ghcr-image: &ghcr-image
  # Override these via environment variables:
  # GHCR_OWNER=your-org GHCR_REPO=your-repo IMAGE_TAG=v1.0.0
  image: ghcr.io/${GHCR_OWNER:-mikesvoboda}/${GHCR_REPO:-nemotron-v3-home-security-intelligence}

services:
  # =============================================================================
  # Core Infrastructure
  # =============================================================================

  postgres:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
    image: docker.io/library/postgres:16-alpine
    tmpfs:
      - /tmp
      - /var/run/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-security}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - run ./setup.sh or set manually}
      - POSTGRES_DB=${POSTGRES_DB:-security}
    command:
      - postgres
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_duration=on
      - -c
      - log_line_prefix=%t [%p] %u@%d
      - -c
      - log_statement=ddl
      - -c
      - log_checkpoints=on
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-security} -d ${POSTGRES_DB:-security}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  redis:
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
    sysctls:
      - net.core.somaxconn=511
    image: docker.io/library/redis:7.4-alpine3.21
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    command: >-
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        echo "Starting Redis with password authentication"
        redis-server --appendonly yes --appendfsync everysec --maxmemory 450mb --maxmemory-policy allkeys-lru --slowlog-log-slower-than 10000 --slowlog-max-len 128 --stop-writes-on-bgsave-error no --requirepass "$$REDIS_PASSWORD"
      else
        echo "Starting Redis without authentication (development mode)"
        redis-server --appendonly yes --appendfsync everysec --maxmemory 450mb --maxmemory-policy allkeys-lru --slowlog-log-slower-than 10000 --slowlog-max-len 128 --stop-writes-on-bgsave-error no
      fi
      '
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: >-
        sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG
        else
          redis-cli ping | grep -q PONG
        fi
        '
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # =============================================================================
  # AI Services (GHCR Images - x86_64 only, requires NVIDIA GPU)
  # =============================================================================

  ai-llm:
    tmpfs:
      - /tmp
      - /home/llama/.cache
    labels:
      pyroscope.profile: 'true'
      pyroscope.service: 'ai-llm'
    image: ghcr.io/${GHCR_OWNER:-mikesvoboda}/${GHCR_REPO:-nemotron-v3-home-security-intelligence}/ai-llm:${IMAGE_TAG:-latest}
    ports:
      - '127.0.0.1:8091:8091'
    volumes:
      # Using Q2_K_L (20.9GB VRAM) for single-GPU deployment
      - ${AI_MODELS_PATH:-/export/ai_models}/nemotron/quantization-benchmarks:/models:ro
    environment:
      - SERVICE_NAME=ai-llm
      - PYROSCOPE_ENABLED=${PYROSCOPE_ENABLED:-true}
      - PYROSCOPE_URL=http://pyroscope:4040
      - PYROSCOPE_SAMPLE_RATE=${PYROSCOPE_SAMPLE_RATE:-10}
      # Q2_K_L quantization for single-GPU deployment (20.9GB VRAM)
      - MODEL_PATH=/models/Nemotron-3-Nano-30B-A3B-Q2_K_L.gguf
      - GPU_LAYERS=${GPU_LAYERS:-999}
      - CTX_SIZE=${CTX_SIZE:-4096}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8091/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # AI Gateway (Triton + FastAPI) — serves YOLO26, Florence-2, CLIP and
  # enrichment models through a single service (replaces the retired
  # per-model ai-yolo26 / ai-florence / ai-clip / ai-enrichment containers)
  ai-gateway:
    security_opt:
      - no-new-privileges:true
      - label=disable
    cap_drop:
      - ALL
    image: ghcr.io/${GHCR_OWNER:-mikesvoboda}/${GHCR_REPO:-nemotron-v3-home-security-intelligence}/ai-gateway:${IMAGE_TAG:-latest}
    # Pass ALL GPUs so /dev/nvidia0 and /dev/nvidia1 both exist;
    # CUDA_VISIBLE_DEVICES restricts Triton to the AI services GPU below.
    devices:
      - nvidia.com/gpu=all
    ports:
      - '127.0.0.1:${AI_GATEWAY_PORT:-8090}:8090'
      - '127.0.0.1:${AI_GATEWAY_METRICS_PORT:-8002}:8002'
    volumes:
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo:/models/zoo:ro
      - ${AI_MODELS_PATH:-/export/ai_models}/triton:/models/cache
      - ${AI_MODELS_PATH:-/export/ai_models}/quantized:/models/quantized:ro
      # Persistent CUDA kernel cache (survives container redeploys)
      - triton-kernel-cache:/root/.nv
      # TensorRT temp artifacts cache (compilation intermediates)
      - triton-tmp-cache:/tmp
      # HuggingFace model cache (pre-downloaded models, avoids network downloads)
      - hf_cache:/root/.cache/huggingface:U
    environment:
      - SERVICE_NAME=ai-gateway
      - GATEWAY_PORT=8090
      - CUDA_VISIBLE_DEVICES=${GPU_AI_SERVICES:-1}
      # Use the pre-downloaded HF cache (staging allows hub fallback if a model is missing)
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      # INT8 quantization for vehicle/demographics models (NEM-5533)
      - VEHICLE_QUANTIZED=${VEHICLE_QUANTIZED:-false}
      - DEMOGRAPHICS_QUANTIZED=${DEMOGRAPHICS_QUANTIZED:-false}
      - QUANTIZED_MODEL_DIR=${QUANTIZED_MODEL_DIR:-/models/quantized}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8090/health']
      interval: 15s
      timeout: 10s
      retries: 5
      # Triton loads 13 models — allow 3 minutes for all to initialize
      start_period: 180s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 20G
        reservations:
          memory: 10G
          devices:
            - driver: nvidia
              device_ids: ['${GPU_AI_SERVICES:-1}']
              capabilities: [gpu]

  # =============================================================================
  # Application Services (GHCR Images)
  # =============================================================================

  backend:
    tmpfs:
      - /tmp
      - /home/appuser/.cache
    image: ghcr.io/${GHCR_OWNER:-mikesvoboda}/${GHCR_REPO:-nemotron-v3-home-security-intelligence}/backend:${IMAGE_TAG:-latest}
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./backend/data:/app/data:z,U
      - ${FOSCAM_BASE_PATH:-/export/foscam}:/cameras:ro
      - ${AI_MODELS_PATH:-/export/ai_models}/model-zoo:/models/model-zoo:ro,z
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-security}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-security}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - PYROSCOPE_ENABLED=${PYROSCOPE_ENABLED:-true}
      - PYROSCOPE_URL=http://pyroscope:4040
      - PYROSCOPE_SAMPLE_RATE=${PYROSCOPE_SAMPLE_RATE:-100}
      - PYROSCOPE_MEMORY_ENABLED=${PYROSCOPE_MEMORY_ENABLED:-true}
      - NEMOTRON_URL=http://ai-llm:8091
      # LLM context budget — must mirror the ai-llm service above so the backend's
      # per-request token budget matches the slot it is actually served from.
      # CTX_SIZE is llama.cpp's TOTAL pool (--ctx-size); PARALLEL is the slot count
      # (--parallel).  The backend divides the two itself (config.py
      # nemotron_context_window).  Defaults mirror this file's ai-llm pool: CTX_SIZE
      # 4096 from the ai-llm block above, and 2 slots because the ghcr ai-llm image
      # bakes PARALLEL=2 (ai/nemotron/Dockerfile) and this file's ai-llm service
      # passes no override — 4096 / 2 = 2048 tokens per request.  Set PARALLEL in
      # .env (and pass it to ai-llm too) if you raise the slot count.
      - CTX_SIZE=${CTX_SIZE:-4096}
      - PARALLEL=${PARALLEL:-2}
      # AI Gateway routes — all enrichment models served via Triton through ai-gateway
      - USE_AI_GATEWAY=true
      - AI_GATEWAY_URL=http://ai-gateway:8090
      - YOLO26_URL=http://ai-gateway:8090/yolo26
      - FLORENCE_URL=http://ai-gateway:8090/florence
      - CLIP_URL=http://ai-gateway:8090/clip
      - ENRICHMENT_URL=http://ai-gateway:8090/enrichment
      - ENRICHMENT_LIGHT_URL=http://ai-gateway:8090/enrich-lt
      - GO2RTC_API_URL=http://go2rtc:1984
      - GO2RTC_WEBRTC_URL=${GO2RTC_WEBRTC_URL:-http://localhost:8555}
      - DETECTOR_TYPE=${DETECTOR_TYPE:-yolo26}
      - FRONTEND_URL=http://frontend:${FRONTEND_INTERNAL_PORT:-8080}
      - FOSCAM_BASE_PATH=/cameras
      - DEBUG=${DEBUG:-false}
      - ADMIN_ENABLED=${ADMIN_ENABLED:-false}
      - FAST_PATH_ENABLED=${FAST_PATH_ENABLED:-false}
      - FAST_PATH_CONFIDENCE_THRESHOLD=${FAST_PATH_CONFIDENCE_THRESHOLD:-0.90}
      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-nemotron-backend}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}
      - OTEL_TRACE_SAMPLE_RATE=${OTEL_TRACE_SAMPLE_RATE:-1.0}
      - ORCHESTRATOR_DOCKER_HOST=${ORCHESTRATOR_DOCKER_HOST:-tcp://host.containers.internal:2375}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-llm:
        condition: service_healthy
      # AI gateway — YOLO26 and enrichment models; backend health checks yolo26 via gateway
      ai-gateway:
        condition: service_healthy
      go2rtc:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import httpx; r = httpx.get('http://localhost:8000/api/system/health/ready'); exit(0 if r.status_code == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 6G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  go2rtc:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/alexxit/go2rtc:latest
    container_name: hsi-go2rtc
    restart: unless-stopped
    ports:
      - '127.0.0.1:1984:1984'
      - '127.0.0.1:8555:8555'
    environment:
      - GO2RTC_API_ORIGIN=*
    volumes:
      - ./config/go2rtc.yaml:/config/go2rtc.yaml:ro,z
    networks:
      - security-net
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '-O',
          '/dev/null',
          'http://localhost:1984/api/streams',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  frontend:
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    image: ghcr.io/${GHCR_OWNER:-mikesvoboda}/${GHCR_REPO:-nemotron-v3-home-security-intelligence}/frontend:${IMAGE_TAG:-latest}
    ports:
      - '${FRONTEND_HTTPS_PORT:-8444}:8443'
    volumes:
      - frontend_certs:/etc/nginx/certs:U
    environment:
      - SSL_SAN_EXTRA=${SSL_SAN_EXTRA:-}
      - SSL_ENABLED=${SSL_ENABLED:-true}
      - SSL_CERT_PATH=${SSL_CERT_PATH:-/etc/nginx/certs/cert.pem}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-/etc/nginx/certs/key.pem}
      - FRONTEND_HTTPS_PORT=${FRONTEND_HTTPS_PORT:-8444}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Use /health endpoint which returns 200 directly (avoids 301 redirect issues)
      # FRONTEND_INTERNAL_PORT configures the internal nginx port (default: 8080)
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:${FRONTEND_INTERNAL_PORT:-8080}/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # =============================================================================
  # Monitoring Stack
  # =============================================================================
  # Access points:
  #   - Grafana: http://localhost:3002 (anonymous access enabled by default)
  #   - Prometheus: http://localhost:9090
  #   - Tempo: http://localhost:3200 (distributed tracing)
  #   - Alertmanager: http://localhost:9093

  # Grafana Tempo for distributed tracing (NEM-5545, replaces Jaeger+Elasticsearch)
  # Alloy receives OTLP on alloy:4317 and exports traces here — Jaeger is retired.
  tempo:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/grafana/tempo:2.7.1
    container_name: tempo
    volumes:
      - ./monitoring/tempo/tempo-config.yml:/etc/tempo/config.yml:ro,z
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/config.yml
    ports:
      - '127.0.0.1:${TEMPO_PORT:-3200}:3200'
      - '127.0.0.1:${TEMPO_OTLP_GRPC:-4317}:4317'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3200/ready']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  prometheus:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prom/prometheus:v2.48.0
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./monitoring/prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml:ro,z
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro,z
      - ./monitoring/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro,z
      - ./monitoring/profiling-recording-rules.yml:/etc/prometheus/profiling-recording-rules.yml:ro,z
      - ./monitoring/profiling-regression-alerts.yml:/etc/prometheus/profiling-regression-alerts.yml:ro,z
      - ./monitoring/gpu-alerts.yml:/etc/prometheus/gpu-alerts.yml:ro,z
      - ./monitoring/ai-pipeline-alerts.yml:/etc/prometheus/ai-pipeline-alerts.yml:ro,z
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}'
      - '--web.enable-lifecycle'
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9090/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  grafana:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/grafana/grafana:10.2.3
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3002}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=${GF_AUTH_DISABLE_LOGIN_FORM:-true}
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_EXPLORE_ENABLED=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_INSTALL_PLUGINS=marcusolsson-json-datasource 1.3.0
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${GF_SMTP_HOST:-smtp.example.com:587}
      - GF_SMTP_USER=${GF_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:-grafana@example.com}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME:-Grafana Alerts}
      - GF_SMTP_STARTTLS_POLICY=${GF_SMTP_STARTTLS_POLICY:-MandatoryStartTLS}
      - GF_SMTP_SKIP_VERIFY=${GF_SMTP_SKIP_VERIFY:-false}
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  redis-exporter:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/oliver006/redis_exporter:v1.55.0
    ports:
      - '127.0.0.1:9121:9121'
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  json-exporter:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prometheuscommunity/json-exporter:v0.6.0
    ports:
      - '127.0.0.1:7979:7979'
    volumes:
      - ./monitoring/json-exporter-config.yml:/etc/json-exporter/config.yml:ro,z
    command:
      - '--config.file=/etc/json-exporter/config.yml'
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  alertmanager:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prom/alertmanager:v0.27.0
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=:9093'
      - '--cluster.listen-address='
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9093/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  blackbox-exporter:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prom/blackbox-exporter:v0.24.0
    ports:
      - '127.0.0.1:9115:9115'
    volumes:
      - ./monitoring/blackbox-exporter.yml:/etc/blackbox_exporter/config.yml:ro,z
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
      - '--log.level=info'
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9115/metrics']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  loki:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/grafana/loki:2.9.4
    container_name: loki
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro,z
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - '127.0.0.1:3100:3100'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3100/ready']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1G

  pyroscope:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    build:
      context: ./monitoring/pyroscope
      dockerfile: Dockerfile
    container_name: pyroscope
    volumes:
      - ./monitoring/pyroscope/pyroscope-config.yml:/etc/pyroscope/config.yml:ro,z
      - pyroscope_data:/data
    command: -config.file=/etc/pyroscope/config.yml
    ports:
      - '127.0.0.1:4040:4040'
    networks:
      - security-net
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4040/ready']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - DAC_READ_SEARCH
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/lib/containers/:/var/lib/containers:ro
    ports:
      - '127.0.0.1:8088:8080'
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8080/healthz']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  node-exporter:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: docker.io/prom/node-exporter:v1.8.2
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    ports:
      - '127.0.0.1:9100:9100'
    pid: host
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9100/metrics']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    labels:
      - 'prometheus.scrape=true'
      - 'prometheus.port=9100'

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: dcgm-exporter
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./monitoring/dcgm/custom-counters.csv:/etc/dcgm-exporter/default-counters.csv:ro,z
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
      - DCGM_EXPORTER_KUBERNETES=false
    ports:
      - '127.0.0.1:9400:9400'
    cap_add:
      - SYS_ADMIN
    networks:
      - security-net
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O-', 'http://localhost:9400/metrics']
      interval: 30s
      timeout: 10s
      retries: 3

  alloy:
    image: docker.io/grafana/alloy:v1.9.2
    container_name: alloy
    # Minimal capabilities for eBPF profiling (replaces privileged: true)
    # Requires host memlock limit: /etc/security/limits.d/50-memlock.conf
    # Previously used privileged mode (NEM-4499) but alloy v1.9.2 works with caps + label=disable
    cap_add:
      - SYS_ADMIN # eBPF map creation, cgroup access
      - BPF # eBPF program loading
      - PERFMON # perf_event_open for profiling
      - SYS_PTRACE # Reading /proc/<pid>/maps for symbol resolution
      - SYS_RESOURCE # setrlimit for memlock
    cap_drop:
      - ALL
    security_opt:
      - label=disable
    pid: host
    user: root
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro,z
      # NOTE: rw required — Alloy reads container logs via Podman API
      - ${PODMAN_SOCKET:?PODMAN_SOCKET must be set}:${PODMAN_SOCKET}
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /proc:/host/proc:ro
      # eBPF profiler symbol cache for stack trace resolution (NEM-3922)
      - alloy_symb_cache:/tmp/symb-cache
    ulimits:
      # eBPF profiling requires increased memory lock limit
      # Rootless containers cannot set unlimited (-1), so use a high limit (8GB)
      # Host limit should be configured by setup.py in /etc/security/limits.d/
      memlock:
        soft: 8589934592
        hard: 8589934592
    environment:
      - HOST_PROC=/host/proc
      - PODMAN_SOCKET=${PODMAN_SOCKET}
    command:
      - run
      - --stability.level=public-preview
      - --storage.path=/tmp/alloy
      - /etc/alloy/config.alloy
    ports:
      - '127.0.0.1:${ALLOY_UI_PORT:-12345}:12345' # Alloy UI
      - '4317' # OTLP gRPC (internal only)
      - '4318' # OTLP HTTP (internal only)
    depends_on:
      - loki
      - pyroscope
    healthcheck:
      test: ['CMD', 'pgrep', '-f', 'alloy']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - security-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  tempo_data:
    driver: local
  hf_cache:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local
  pyroscope_data:
    driver: local
  alloy_symb_cache:
    driver: local
  frontend_certs:
    driver: local
  # Triton/Gateway CUDA kernel cache — persists CUDA JIT compilation across redeploys
  triton-kernel-cache:
    driver: local
  # Triton TensorRT temporary compilation artifacts
  triton-tmp-cache:
    driver: local

networks:
  security-net:
    driver: bridge
