[project]
name = "home-security-intelligence"
version = "0.1.0"
description = "AI-powered home security monitoring system"
requires-python = ">=3.14"
dependencies = [
    # Core FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.22",  # CVE-2026-24486 fix
    # Database (PostgreSQL)
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "greenlet>=3.1.0",
    # Redis
    "redis>=5.2.0",
    # File watching
    "watchdog>=6.0.0",
    # Image processing
    "pillow>=11.0.0",
    # GPU monitoring (official NVIDIA bindings - pynvml is deprecated)
    "nvidia-ml-py>=12.560.30,<14.0.0",
    # Host system monitoring
    "psutil>=5.9.0",
    # Memory profiling (runtime debugging)
    "pympler>=1.1",
    # HTTP client (for AI services)
    "httpx>=0.28.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Logging
    "python-json-logger>=2.0.7",
    # TLS/Cryptography
    "cryptography>=44.0.0",
    # Metrics
    "prometheus-client>=0.21.0",
    # Template engine (security patched)
    "jinja2>=3.1.5",
    "scikit-image>=0.26.0",
    "ultralytics>=8.4.0",  # Required for YOLO26 support
    "huggingface-hub>=0.36.0",
    "transformers>=4.57.3",
    "torchreid>=0.2.5",
    "gdown>=5.2.0",
    "piq>=0.8.0",  # BRISQUE image quality - lightweight, only needs torchvision
    "open_clip_torch>=2.29.0",
    "accelerate>=1.12.0",
    # Container orchestration
    "docker>=7.0.0",
    # Token counting for LLM context management
    "tiktoken>=0.8.0",
    # OpenTelemetry distributed tracing (NEM-1629)
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-exporter-otlp>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "opentelemetry-instrumentation-httpx>=0.44b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.44b0",
    "opentelemetry-instrumentation-redis>=0.44b0",
    # NEM-3383: Container and host resource detection for correlation
    "opentelemetry-resourcedetector-docker>=0.4.0",
    # NEM-3792: OpenTelemetry Logs SDK for unified telemetry (logs-traces correlation)
    "opentelemetry-instrumentation-logging>=0.44b0",
    "urllib3>=2.7.0",  # minimum for PYSEC-2026-141/142 (header leak on cross-origin redirect, streaming decompression bomb); was accidental exact pin ==2.6.3 from #2038
    "openpyxl>=3.1.5",
    # Continuous profiling (NEM-3102)
    "pyroscope-io>=0.8.7",
    "orjson>=3.11.5",
    # MessagePack binary serialization for WebSocket (NEM-3737)
    "msgpack>=1.0.8",
    # Video analytics and tracking (NEM-3719)
    "supervision>=0.25.0",
    # CLI tools for deployment scripts
    "typer>=0.15.0",
    "rich>=13.0.0",
    # MQTT async client for Home Assistant integration (NEM-5069)
    "aiomqtt>=2.0.0",
    # Authentication (NEM-5307)
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    # Fuzzy string matching for service provider OCR (Scene OCR feature)
    "rapidfuzz>=3.10.0",
    # ONVIF camera discovery and control (NEM-4207)
    "wsdiscovery>=2.1.2",
    "onvif-zeep>=0.2.12",
    # Timezone data (zoneinfo): schedule code accepts legacy US/* IANA keys
    # (alert_engine ZoneInfo lookups) which modern distros no longer symlink
    # (Ubuntu 24.04 ships no /usr/share/zoneinfo/US); the tzdata wheel
    # guarantees them on every platform. M1 Task 7.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# DEPRECATED: Use dependency-groups below for granular control
# Kept for backward compatibility: `uv sync --extra dev` still works
dev = [
    # Linting & Formatting
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-split>=0.9.0",  # CI sharding across runners
    "pytest-timeout>=2.3.0",
    "pytest-rerunfailures>=14.0",  # Flaky test detection - auto-retry failures
    "pytest-sugar>=1.0.0",  # Pretty progress bar and improved output
    "pytest-clarity>=1.0.0",  # Better assertion diffs
    "pytest-randomly>=4.0.0",  # Randomize test execution order
    "pytest-deadfixtures>=3.0.0",  # Detect unused fixtures
    "pytest-testmon>=2.1.0",  # Affected-only test execution
    "fakeredis>=2.20.0",
    "testcontainers>=4.0.0",
    "alembic>=1.13.0",  # Database migrations testing
    "hypothesis>=6.100.0",  # Property-based testing
    "factory-boy>=3.3.0",  # Test fixture factories
    "freezegun>=1.5.0",  # Time mocking for tests
    "syrupy>=4.8.0",  # Snapshot testing for API response schemas (NEM-3748)
    # CI/CD - Performance
    "pytest-benchmark>=4.0.0",
    "pytest-memray>=1.5.0",
    # CI/CD - Security
    "bandit>=1.7.0",
    # CI/CD - Complexity (R-1 2026-09-23: was `wily>=1.25.0`, whose transitive
    # radon 5.1.x this extra's consumers actually call. nightly.yml runs wily
    # isolated via `uv tool run`, so the project-env pin existed only to leak
    # radon — now declared directly, which also lifts wily's plotly/colorlog/
    # mando caps. ci.yml:331's `uv run radon` is a hard gate: radon ships same
    # commit as wily leaves.)
    "radon>=5.1.0",
    # CI/CD - Big-O analysis
    "big-o>=0.11.0",
    # Video processing
    "ffmpeg-python>=0.2.0",
    # XML parsing (secure)
    "defusedxml>=0.7.0",
    # Dead code detection
    "vulture>=2.11",
    # Mutation testing
    "mutmut>=3.2.0",
    # Performance profiling (NEM-1644)
    "snakeviz>=2.2.0",  # Visualize cProfile output as flamegraphs
    # Note: py-spy requires system installation (not pip) - install with:
    # pip install py-spy  # or cargo install py-spy
]
# NeMo Data Designer for synthetic test data generation
# Usage: `uv sync --extra nemo` or `uv sync --group nemo`
nemo = [
    # Lower bound raised to 0.7: data-designer <=0.6 backtracks the *global*
    # resolution (its engine pins sqlfluff/cryptography/click eras) and those
    # stale caps leak into the runtime+dev resolution, holding click at 8.3.0
    # and cryptography at 46.x despite open advisories (PYSEC-2026-2132,
    # PYSEC-2026-3552/3553/3554). 0.7+ moves click/cryptography forward.
    # WP0.2 raises 0.7.0 -> 0.9.2: engine 0.7.0 caps cryptography<47, which is
    # what held the runtime at 46.0.7 through GHSA-537c-gmf6-5ccf (fixed 48.0.1).
    # 0.9.2 requires cryptography>=48.0.1,<=49 and pyarrow>=24,<25 (clears
    # CVE-2026-25087, fixed 23.0.1) with NO opentelemetry pins, so it cannot
    # regress the runtime otel set. dependency-audit.yml's 2026-09-15 review note
    # named exactly this unblock ("revisit when data-designer supports otel 1.44").
    "data-designer>=0.9.2",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
]
# GPU quantization support (NEM-3373, NEM-3376)
# Provides 4-bit and 8-bit quantization for LLMs via bitsandbytes
# Usage: `uv sync --extra quantization`
# Requires: CUDA-capable GPU
quantization = [
    "bitsandbytes>=0.44.0",
]
# Documentation tools (MkDocs site + validation)
# Usage: `uv sync --extra docs` or `uv sync --group docs`
docs = [
    "mkdocs-material>=9.6.0",
    "mkdocs-awesome-pages-plugin>=2.10.0",
    "mkdocs-minify-plugin>=0.8.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "rich>=13.0.0",
]
# License plate recognition (NEM-5569: FastALPR replaces PaddleOCR)
# FastALPR: End-to-end plate detection + OCR (~28MB vs PaddleOCR's ~400MB)
# Works on Python 3.14+ (unlike PaddleOCR which requires <=3.13)
# Usage: `uv sync --extra alpr`
alpr = [
    "fast-alpr[onnx]>=0.3.0",  # FastALPR with ONNX CPU backend (MIT license)
]
# Legacy PaddleOCR (deprecated, Python 3.13 or earlier only)
# OCR functionality is available in the ai/enrichment container which uses Python 3.12
# ocr = [
#     "paddlepaddle>=3.0.0",  # PaddlePaddle deep learning framework (CPU)
#     "paddleocr>=2.9.0",     # PaddleOCR for text recognition
# ]

# =============================================================================
# PEP 735 Dependency Groups (uv 0.5.0+)
# =============================================================================
# Granular dependency management for different development workflows.
# Usage: uv sync --group <name> or uv sync --group lint --group test
#
# Groups:
#   lint      - Linting and formatting tools (ruff, mypy)
#   test      - Core testing framework and utilities
#   benchmark - Performance benchmarking tools
#   security  - Security scanning tools
#   mutation  - Mutation testing tools
#   nemo      - NeMo Data Designer for synthetic data generation
#   dev       - All development dependencies (includes all groups above)
# Note: OCR (PaddleOCR) is not available as a group due to Python 3.14 incompatibility
# OCR functionality is provided by the ai/enrichment container (Python 3.12)
# =============================================================================

[dependency-groups]
# Linting & Formatting
lint = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

# Core Testing Framework
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "pytest-rerunfailures>=14.0",  # Flaky test detection - auto-retry failures
    "pytest-sugar>=1.0.0",  # Pretty progress bar and improved output
    "pytest-clarity>=1.0.0",  # Better assertion diffs
    "pytest-randomly>=4.0.0",  # Randomize test execution order
    "pytest-deadfixtures>=3.0.0",  # Detect unused fixtures
    "pytest-testmon>=2.1.0",  # Affected-only test execution
    "fakeredis>=2.20.0",
    "testcontainers>=4.0.0",
    "alembic>=1.13.0",  # Database migrations testing
    "hypothesis>=6.100.0",  # Property-based testing
    "factory-boy>=3.3.0",  # Test fixture factories
    "freezegun>=1.5.0",  # Time mocking for tests
    "syrupy>=4.8.0",  # Snapshot testing for API response schemas (NEM-3748)
    # Video processing (needed for video service tests)
    "ffmpeg-python>=0.2.0",
    # XML parsing (secure - needed for test fixtures)
    "defusedxml>=0.7.0",
]

# Performance Benchmarking
benchmark = [
    "pytest-benchmark>=4.0.0",
    "pytest-memray>=1.5.0",
    "snakeviz>=2.2.0",  # Visualize cProfile output as flamegraphs
    # CI/CD - Big-O analysis
    "big-o>=0.11.0",
]

# Security Scanning
security = [
    "bandit>=1.7.0",
]

# Mutation Testing
mutation = [
    "mutmut>=3.2.0",
]

# Code Quality Analysis (complexity, dead code)
quality = [
    # R-1 2026-09-23: wily dropped (see dev-extra note at its old site);
    # radon declared directly — it is what ci.yml/weekly-audit actually run.
    "radon>=5.1.0",
    "vulture>=2.11",
]

# NeMo Data Designer (synthetic data generation for testing)
# Usage: uv sync --group nemo
# Requires NVIDIA_API_KEY environment variable
nemo = [
    # Lower bound raised to 0.7: data-designer <=0.6 backtracks the *global*
    # resolution (its engine pins sqlfluff/cryptography/click eras) and those
    # stale caps leak into the runtime+dev resolution, holding click at 8.3.0
    # and cryptography at 46.x despite open advisories (PYSEC-2026-2132,
    # PYSEC-2026-3552/3553/3554). 0.7+ moves click/cryptography forward.
    # WP0.2: 0.9.2 clears GHSA-537c-gmf6-5ccf (needs cryptography>=48.0.1) and
    # CVE-2026-25087 (needs pyarrow>=23) — see the optional-dependencies note.
    "data-designer>=0.9.2",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
]

# Documentation tools (MkDocs site + validation)
# Usage: uv sync --group docs
docs = [
    "mkdocs-material>=9.6.0",
    "mkdocs-awesome-pages-plugin>=2.10.0",
    "mkdocs-minify-plugin>=0.8.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "rich>=13.0.0",
]

# PaddleOCR for license plate and text recognition (NEM-5372)
# Note: PaddlePaddle does not yet support Python 3.14+ (requires cp313 or lower)
# OCR functionality is available in the ai/enrichment container which uses Python 3.12
# The ai/enrichment/requirements.txt includes paddlepaddle-gpu and paddleocr for container use
# Backend OCR service calls the enrichment container's OCR endpoint
# Usage: See backend/services/ocr_service.py for backend OCR integration

# All Development Dependencies (combines all groups above)
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "benchmark"},
    {include-group = "security"},
    {include-group = "mutation"},
    {include-group = "quality"},
    "types-pyyaml>=6.0.12.20250915",
    {include-group = "docs"},
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["backend"]
exclude = ["vulture_whitelist.py", "mutants/", "archive/"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print - disallow print() in production code
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "PLR0912",# too many branches (complex but intentional)
    "PLR0913",# too many arguments
    "PLR0915",# too many statements (complex business logic)
    "PLR2004",# magic value comparison
    "S101",   # use of assert detected (ok in tests)
    "SIM102", # nested if - explicit nesting more readable
    "SIM108", # ternary operator suggestion - if/else more readable in some contexts
    "UP046",  # generic class uses Generic subclass - Python 3.12+ syntax optional
    "UP047",  # generic function should use type parameters - Python 3.12+ syntax optional
    "PLC0415",# import not at top level (necessary for circular imports/isolation)
    "ASYNC109",# timeout parameter in async function (standard in Redis blpop)
    "ASYNC110",# asyncio.sleep in while loop (valid for shutdown monitoring)
    "ASYNC230",# open in async function (acceptable for small file I/O)
    "ASYNC240",# blocking pathlib ops in async fns - same accepted tradeoff as ASYNC230 (small local FS ops); revisit with a scoped async-fs audit
    "PLR0917",# too-many-positional (ruff 0.16 rule; converting 136 production signatures to keyword-only is churn, matches accepted PLR0913 stance)
    "UP042",  # str-enum -> StrEnum: changes str()/f-string formatting of members; needs a dedicated migration PR with behavior tests
    "SIM105",  # contextlib.suppress not suitable for async CancelledError patterns
    "RUF006",  # asyncio.create_task without storing (valid in signal handlers)
    "PTH110", # os.path.exists() - acceptable pattern
    "PTH123", # open() instead of Path.open() - acceptable pattern
    "TC001",  # TYPE_CHECKING imports break mocking in tests - keep imports at runtime
    "TC002",  # TYPE_CHECKING imports break mocking in tests - keep imports at runtime
    "TC003",  # TYPE_CHECKING imports break mocking in tests - keep imports at runtime
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = [
    "S101",   # assert is fine in tests
    "S105",   # hardcoded passwords ok in tests
    "S106",   # hardcoded passwords ok in tests
    "ARG001", # unused function argument in fixtures
    "ARG002", # unused method argument for fixtures used via side effects
    "PLR2004",# magic values ok in tests
    "B007",   # unused loop control variable ok in tests
    "ERA001", # section headers and documentation comments ok in tests
    "SIM108", # ternary operator suggestion - if/else more readable in test mocks
    "SIM117", # nested with statements more readable with pytest.raises and patches
    "F841",   # unused variables ok in tests (e.g., documenting expected values)
    "PLW2901",# loop variable reassignment is common pattern in tests
    "PTH101", # os.chmod is necessary for permission tests
    "S110",   # try-except-pass ok in test cleanup blocks
    "B017",   # assert Exception is ok when testing generic error handling
    "T201",   # print() ok in tests for debugging output
    "RUF059", # unused unpacked vars ok in tests (same rationale as F841 above)
    "PLW0108",# lambda wrappers ok in tests (explicit mock/patch adapters)
]
"backend/examples/**/*.py" = [
    "ERA001", # commented code ok in examples
    "T201",   # print() ok in examples for demonstration output
]
"backend/main.py" = [
    "T201",   # print() ok for startup/shutdown banners
]
"ai/**/*.py" = [
    "ASYNC230", # blocking I/O in async ok for example clients
    "T201",   # print() ok in AI example clients
    "E402",   # module level import not at top ok for Pyroscope profiling init
    "PLW0603", # global statement ok for lifespan model instance pattern
    "S104",    # binding to all interfaces ok for container deployments
    "F401",    # import for side-effect (TensorRT availability check) ok
]
"ai/**/tests/*.py" = [
    "S101",   # assert is fine in tests
    "ARG001", # unused function argument in fixtures
    "ARG002", # unused method argument for fixtures used via side effects
    "ARG005", # unused lambda argument in mock __len__
    "PLR2004",# magic values ok in tests
    "B007",   # unused loop control variable ok in tests
    "ERA001", # section headers and documentation comments ok in tests
    "F841",   # unused variables ok in tests
]
"ai/*/test_*.py" = [
    "S101",   # assert is fine in tests
    "ARG001", # unused function argument in mock callbacks
    "ARG002", # unused method argument for fixtures used via side effects
    "PLR2004",# magic values ok in tests
]
"tools/**/*.py" = [
    "T201",   # print() ok in tool scripts for CLI output
    "E402",   # module level import not at top ok for sys.path manipulation
]
"backend/evaluation/harness.py" = [
    "T201",   # print() ok for CLI output in evaluation harness
    "S311",   # pseudo-random ok for mock data generation (not security-sensitive)
]
"scripts/**/*.py" = [
    "SIM102",  # nested ifs more readable in utility scripts
    "S603",    # subprocess call ok in CI/utility scripts (trusted input)
    "S607",    # partial executable paths ok in CI scripts (uv, npm, pytest)
    "ARG001",  # unused arguments reserved for future use
    "F841",    # unused variables reserved for future use (e.g., OpenAPI fields)
    "T201",    # print() ok in utility scripts for CLI output
    "PLR0911", # many returns ok for AST parsing utilities (extract_pydantic_constraints.py)
    "PLR0912", # many branches ok for AST parsing utilities (extract_pydantic_constraints.py)
]
"backend/scripts/**/*.py" = [
    "T201",   # print() ok in benchmark/utility scripts for CLI output
]
"setup.py" = [
    "T201",   # print() ok in setup script for CLI output
]
"setup_lib/**/*.py" = [
    "T201",    # print() ok in setup library for CLI output
    "S603",    # subprocess call ok for Docker commands
    "PLR0911",# many returns ok in setup model-existence dispatchers
]
"setup_lib/tests/**/*.py" = [
    "S101",   # assert is fine in tests
    "S105",   # hardcoded passwords ok in tests
    "S106",   # hardcoded passwords ok in tests
    "ARG001", # unused function argument in fixtures
    "ARG002", # unused method argument for fixtures used via side effects
    "PLR2004",# magic values ok in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "backend.tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "backend.examples.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ai/*/tests", "ai/*/test_*.py", "setup_lib/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-n 8 --dist=worksteal -v --strict-markers --tb=short -p randomly -m 'not gpu'"
timeout = 5
# M3 T5 owner ruling (2026-09-14, docs/superpowers/rulings/2026-09-14-m3-t5-timeout-config-ruling-packet.md):
# signal fires on the MAIN thread, so it cannot kill the pytest-rerunfailures
# server thread the old scar comment feared (mechanism disproven at design
# review); thread's os._exit(1) is what produced the silent xdist
# "node down: Not properly terminated" worker deaths (ledger R-T7-WORKERDOWN).
# func_only=false so a hung fixture setup/teardown is also caught — signal's
# handler runs there too.
timeout_method = "signal"
timeout_func_only = false
# pytest-testmon is opt-in via --testmon flag for affected-only test execution
# Usage: pytest --testmon (only runs tests affected by code changes)
# Usage: pytest (runs all tests, default behavior)
markers = [
    "asyncio: mark test as an async test",
    "unit: mark test as a unit test",
    "integration: mark test as an integration test (5s timeout)",
    "e2e: mark test as an end-to-end pipeline test (60s timeout for model loading)",
    "gpu: mark test as a GPU test (runs on self-hosted GPU runner with RTX A5500, 60s timeout)",
    "slow: mark test as legitimately slow (30s timeout)",
    "benchmark: mark test as a benchmark test (requires pytest-benchmark)",
    "serial: mark test as requiring serial execution (no parallel)",
    "flaky: mark test as flaky (known to fail intermittently, quarantined)",
    "network: mark test as requiring network access (for isolation in CI)",
    "db: mark test as requiring database access",
    "redis: mark test as requiring Redis access",
    "requires_debug_mode: mark test as validating DEBUG=false enforcement (CI security check)",
    "prompt_evaluation: mark test as prompt evaluation (requires synthetic scenarios and Nemotron service or mock mode)",
    "enrichment: mark test as enrichment pipeline edge case test (tests model zoo orchestration, VRAM management, circuit breaker behavior)",
    "multimodal: mark test as multimodal evaluation test (compares local pipeline against NVIDIA vision ground truth)",
    "load: mark test as a load/performance test (verifies latency, memory, and throughput under load)",
    "ai_pipeline: mark test as AI pipeline quality smoke test (fast CI validation of LLM output quality)",
]

[tool.coverage.run]
branch = true
source = ["backend"]
omit = [
    "backend/tests/*",
    "backend/examples/*",
    "backend/main.py",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
    # Post-MVP features - need tests before enabling coverage
    "backend/api/routes/alerts.py",
    "backend/api/routes/audit.py",
    "backend/services/video_processor.py",
    "backend/services/degradation_manager.py",
    # TLS certificate generation - requires system-level testing
    "backend/core/tls.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
# Owner ruling A7.1 (2026-09-19): this 85 is the WP0.9 PR diff gate's
# RELATIVE baseline (ci.yml "Combine and check coverage threshold" publishes
# merged data and diffs against it) — NOT an absolute floor. THE executed
# absolute backend floor is 80 on combined unit+integration
# (scripts/validate.sh --fail-under=80, mirrored in nightly-full-gate.yml);
# that is the only absolute backend coverage gate that runs, and it is green.
fail_under = 85
show_missing = true
precision = 2

[tool.coverage.html]
directory = "coverage/backend"

[tool.hypothesis]
# Default settings (applied to all profiles)
# Profiles are loaded via HYPOTHESIS_PROFILE environment variable
# or settings.load_profile() in conftest.py

[tool.hypothesis.profiles.ci]
# CI profile: deterministic, fast
max_examples = 100
deadline = 1000
database = "none"
print_blob = true  # Print failing examples for reproduction

[tool.hypothesis.profiles.dev]
# Local profile: exploratory, thorough
max_examples = 500
deadline = 5000
database = "directory:.hypothesis"

# =============================================================================
# Vulture Configuration (dead code detection)
# =============================================================================
# Vulture finds unused code (dead code) in Python projects.
# Some test files use intentional "unreachable code" patterns for testing
# exception handling in async generators/context managers.
#
# Usage: uv run vulture backend/ vulture_whitelist.py --min-confidence 80
[tool.vulture]
min_confidence = 80
paths = ["backend/"]
# Exclude test files with intentional unreachable code patterns
exclude = [
    "backend/tests/unit/api/routes/test_events_coverage.py",
    "backend/tests/unit/services/test_orphan_scanner_service.py",
    "backend/tests/unit/core/test_redis_memory.py",  # Empty async generator pattern
    "backend/tests/integration/test_gpu_config_workflow.py",  # Unreachable code in mock function
    "backend/tests/unit/core/test_database_pool.py",  # Unreachable code in failing_connect mock
    "backend/tests/integration/test_system_api.py",  # Unreachable yield in error-raising async generator mock
    "backend/tests/unit/routes/test_system_routes.py",  # Unreachable yield in async generator mocks
]

# =============================================================================
# Mutation Testing Configuration (mutmut 3.x)
# =============================================================================
# Mutation testing verifies test effectiveness by making small changes (mutants)
# to source code and checking if tests catch them. A high mutation score indicates
# tests effectively detect code changes.
#
# WP4.3 (2026-09-17): the set WIDENED from 5 utility modules to the whole
# PLAN denominator -- backend/services/ and backend/api/routes/. The old
# 2.x-era keys (paths_to_mutate/tests_dir) still parsed with deprecation
# warnings, but the OLD runner call sites (--paths-to-mutate flags in
# mutation-test.sh / mutation-testing.yml) were dead under mutmut 3.8: the
# weekly schedule silently produced nothing. Runner is scripts/mutation-run.sh
# now; per-module scores from scripts/mutation-score.py; history in
# .github/mutation-history.json (committed series -- "tracked over time").
#
# Usage:
#   ./scripts/mutation-run.sh            # full widened set
#   ./scripts/mutation-run.sh severity   # one module's mutants
#   uv run mutmut results                # surviving mutants (all)
#   uv run mutmut show <mutant_key>
#
# See docs/developer/patterns/mutation-testing.md for detailed guidance.
[tool.mutmut]
# WP4.3 denominator: every service + API-route module (mutmut 3's name for
# the deprecated paths_to_mutate). Tests are excluded by construction --
# they live outside these two trees.
source_paths = [
    "backend/services",
    "backend/api/routes",
]
# Test selection = every backend UNIT test: routes tests sit under
# unit/api/routes (not unit/routes), and a service/route module may be
# exercised from any unit dir. Selection is per-mutant anyway (dependency
# tracking), so the wide net costs collection time, not per-mutant re-runs.
pytest_add_cli_args_test_selection = [
    "backend/tests/unit",
]
# Single-process pytest per mutant (mutmut parallelizes at the MUTANT level,
# so -n8 here would nest xdist 8x under every mutant). -x stops at the FIRST
# killing test: killed is all we need to know. The addopts= neutralization
# strips the repo's -n 8 / --dist / randomly / -m defaults, which break
# single-test runs; --timeout raises the 5s tier default because a mutant
# check that boots the FastAPI app graph legitimately takes longer than a
# unit assertion.
pytest_add_cli_args = [
    "-x",
    "-q",
    "--tb=short",
    "-m",
    "not gpu",
    "-p",
    "no:randomly",
    "-p",
    "no:benchmark",
    "-o",
    "addopts=",
    "--timeout=120",
]
# Mutate only lines the unit tier actually executes. Why (WP4.3 ruling): on
# a route-heavy tree a plain generation mutates ops on never-executed lines
# too; charging those to the score conflates WP4.5's coverage gap with
# test-effectiveness gap (the finding has its own WP), and spends runner
# time on mutants no test could ever see. Consequence, stated where it is
# paid: with this flag every generated mutant sits on a covered line, so the
# published score answers exactly one question -- "do tests catch behavior
# changes in code they execute" -- and the never-executed question moves to
# the gap list instead of the number. The in-denominator coverage omits
# (alerts, audit, video_processor, degradation_manager -- core/tls is a fifth
# omit but sits outside source_paths entirely) generate ZERO mutants here --
# [tool.coverage.run] omit means mutmut sees no executed lines.
# mutation-score.py's target_modules gap surfaces them every run; WP4.5
# closes them.
mutate_only_covered_lines = true
# Process isolation = forkserver (WP4.3, mutmut 3.8's own config knob).
# The default "fork" forks mutant workers from mutmut's MAIN process --
# which has already run the full suite for stats -- and every worker
# "inherit[s] whatever the test setup left in that process" (mutmut's own
# ProcessIsolation docstring). With Hypothesis in the tree that is fatal,
# twice over: (1) ForkRunner runs collect_stats AND run_clean_tests in one
# process ("Already in a clean process, so run stats directly without
# forking"), so the clean-test pass re-executes every @given test whose
# module is still in sys.modules -- Hypothesis 6.168's differing_executors
# health check fires on that second execution (deterministic repro: one
# python process, pytest.main() twice over test_valid_json_always_parses:
# rc1=0 rc2=1 FailedHealthCheck). run4 died exactly there. (2) Worse than
# the crash: a forked mutant worker inherits the same stats-pass executor
# state, so every mutant covered by a property test would error on the
# health check and be scored KILLED without its test ever running. forkserver
# keeps the main process pytest-free and forks each op -- stats, clean tests,
# forced-fail, every mutant check -- from a dedicated warm server whose
# grandchildren execute each @given test exactly once per interpreter.
# Not in config_fingerprint's groups (test_execution/test_selection/
# timeout/type_check): the stats cache survives the switch.
process_isolation = "forkserver"
# Copy into mutants/ (the harness cwd) everything the selected tests IMPORT
# or READ by path -- with no editable install, `import X` resolves under
# mutants/ only, and REPO_ROOT-style path arithmetic (Path(__file__).parents
# [N], conftest root probes) lands on mutants/ too. This is the IMPORT/READ
# set, not the MUTATE set (source_paths decides that). Assembled from a
# full-suite dry run inside the mutant home (2026-09-17: stats pass died
# twice on imports -- scripts.synthetic via unit/scripts sys.path arithmetic,
# setup_lib via test_deploy_phases -- then the clean-test gate named 17
# path/read failures, inventoried in one -n8 pass: 4 infra-exists tests
# (docker-compose.prod.yml, monitoring/, frontend/nginx.conf +
# docker-entrypoint.sh), 12 version-consistency fixtures (the drift gate's
# .nvmrc/.python-version/.github/workflows/ci.yml/Dockerfiles reads), and
# test_real_repo_passes running the gate against the mutant tree itself).
# ai/ is here because alpr_service + prompts lazy-import ai.* -- a missing
# tree would silently disable those branches while mutated. frontend FILES
# are listed individually, not the dir: frontend/node_modules (493MB) would
# be copytree'd along with them (mutmut's file_utils has no ignore), and its
# copy2-file branch makes no parent dirs -- scripts/mutation-run.sh
# pre-mkdirs mutants/frontend for exactly that reason.
also_copy = [
    "backend/",
    "scripts/",
    "setup_lib/",
    "ai/",
    "monitoring/",
    ".github/",
    "models.yml",
    ".env",
    ".nvmrc",
    ".python-version",
    "docker-compose.prod.yml",
    "frontend/nginx.conf",
    "frontend/docker-entrypoint.sh",
    "frontend/package.json",
    "frontend/Dockerfile",
]

# =============================================================================
# UV Package Manager Configuration
# =============================================================================
# Use CPU-only PyTorch wheels for the backend.
# The backend runs on CPU-only environments (python:slim-bookworm base image).
# GPU workloads (RT-DETR, Nemotron) run in separate AI containers under ai/.
#
# This eliminates ~700MB of unnecessary NVIDIA NCCL libraries that were causing
# CI Docker builds to fail with "no space left on device" errors.
[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
# Use best-match strategy to allow PyPI packages when not found on PyTorch CPU index
index-strategy = "unsafe-best-match"
