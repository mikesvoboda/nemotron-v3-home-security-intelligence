# models.yml — Single source of truth for all AI model configuration.
#
# Consumed by:
#   setup_lib/model_downloader.py       — download orchestration (setup.py deploy)
#   backend/services/model_zoo.py       — runtime model loading (backend container)
#   ai/gateway/entrypoint.sh            — device env var export + config.pbtxt patching
#   ai/gateway/patch_triton_configs.py  — rewrites Triton instance_group at startup
#
# Field reference:
#   name            Canonical identifier. Matches model_zoo dict key for backend models.
#   description     Human-readable summary.
#   service         Which service(s) load this model: backend | ai-gateway | ai-llm | both
#   hf_repo         HuggingFace repo ID. Empty string or null if using custom download.
#   local_path      Path relative to AI_MODELS_PATH. null for library/HF-cache models.
#   size_mb         Estimated download size in MB.
#   download_phase  Download priority ordering: 0=required 1=core 2=extended 3=optional
#   required        True if the system cannot function without this model.
#   sha256          Optional. Expected SHA-256 of the weights file the loader
#                   picks up. Enforced by the loader (face-recognizer-*), not by
#                   the downloader: a mismatch is a wrong/corrupt file, so the
#                   model reports unavailable rather than running unknown bytes.
#   download_method Optional. Overrides the default snapshot_download logic:
#                     nemotron_gguf  — download Nemotron GGUF file
#                     yolo26         — download via ultralytics GitHub releases
#                     osnet          — download OSNet weights via torchreid
#                     stgcn          — download ST-GCN++ via OpenMMLab
#                     yolo_world     — download YOLO-World via ultralytics
#                     hf_cache       — download into ~/.cache/huggingface/hub/ (open_clip format)
#                     skip           — no download needed (library auto-downloads or disabled)
#
#   Backend runtime fields (only used when service is "backend" or "both"):
#   category        Model category: detection | classification | embedding | pose |
#                   segmentation | depth-estimation | action-recognition | ocr |
#                   alpr | quality-assessment | preprocessing | vision-language
#   vram_mb         Estimated GPU VRAM usage in MB (0 = CPU-only).
#   enabled         Whether model_zoo enables this model for backend use.
#   priority        VRAM eviction priority: critical | high | medium | low
#   preload         Row-level opt-in for the BACKEND_MODEL_PRELOAD startup sweep:
#                   the sweep loads rows that are enabled AND preload: true
#                   (backend/main.py select_preload_candidates). Before that
#                   predicate existed this flag was parsed and read by nobody.
#   never_evict     Parsed, NOT honored: the model zoo has no eviction pass, so
#                   nothing consults it. Kept as the intended contract for the
#                   day eviction exists (ledger item 32 notes it).
#   runtime_file    Optional filename within local_path (e.g. "model.pt").
#                   When set: runtime path = AI_MODELS_PATH/local_path/runtime_file
#   runtime_path    Optional full runtime path override (for library sentinels like "piq").
#
#   AI-Gateway Triton Python backend fields (service: ai-gateway or both, Python backend only):
#   device          Target inference device: "cuda:0" | "cpu". Exported as an env var by
#                   entrypoint.sh before Triton starts so model.py workers can read it.
#                   Falls back to cpu automatically if cuda is requested but unavailable.
#   device_env_var  Name of the environment variable the model.py reads for its device.
#                   docker-compose values take precedence over models.yml defaults.
#
#   AI-Gateway Triton instance_group fields (consumed by patch_triton_configs.py):
#   triton_name     Triton model repository directory name (may differ from models.yml name).
#                   patch_triton_configs.py patches the matching config.pbtxt at startup.
#   triton_kind     Triton execution device: KIND_GPU | KIND_CPU.
#                   KIND_CPU is required for quantized models with MatMulInteger ops
#                   (e.g. clip_text) or intentionally-CPU skeleton models (stgcn_action).
#                   To change a model from CPU→GPU (or back), edit only this field.
#   triton_models   List of {triton_name, triton_kind} for models that map to multiple
#                   Triton models (e.g. siglip2 exports both clip and clip_text).
#                   Use instead of top-level triton_name/triton_kind for 1:many mappings.

models:
  # ===========================================================
  # PHASE 0 — REQUIRED (system cannot function without these)
  # ===========================================================

  - name: nemotron-3-nano-30b-a3b-q4km
    description: 'Nemotron-3-Nano-30B LLM for risk reasoning (Q4_K_M quantization, ~14.7 GB)'
    service: ai-llm
    hf_repo: unsloth/Nemotron-3-Nano-30B-A3B-GGUF
    local_path: nemotron/nemotron-3-nano-30b-a3b-q4km
    size_mb: 15073
    download_phase: 0
    required: true
    download_method: nemotron_gguf

  - name: yolo26
    description: 'YOLO26 primary object detection (n/s/m variants) — backend calls via HTTP'
    service: backend
    hf_repo: ''
    local_path: model-zoo/yolo26
    size_mb: 67
    download_phase: 0
    required: true
    download_method: yolo26
    category: detection
    vram_mb: 0
    enabled: false
    priority: medium
    preload: false
    never_evict: false
    triton_name: yolo26
    triton_kind: KIND_GPU

  - name: florence-2-base
    description: 'Florence-2-base vision-language model for ai-gateway Triton'
    service: ai-gateway
    hf_repo: microsoft/Florence-2-base
    local_path: model-zoo/florence-2-base
    size_mb: 1024
    download_phase: 0
    required: true
    device: cuda:0
    device_env_var: FLORENCE_DEVICE
    triton_name: florence2
    triton_kind: KIND_GPU

  # ===========================================================
  # PHASE 1 — CORE ENRICHMENT (ai-gateway primary models)
  # ===========================================================

  - name: osnet-ain-x1-0
    description: 'OSNet-AIN x1.0 person re-identification embeddings (single-source MSMT17->Market Rank-1 70.1)'
    service: both
    # The retired description claimed "MSMT17 Rank-1 73.3%" — that is the
    # multi-source (MS+D+C -> Market) number; single-source MSMT17->Market is
    # 70.1 (14-specialist-model-research.md flags the conflation). Erratum
    # ledgered with the swap (item 20), never a silent spec edit.
    hf_repo: ''
    local_path: model-zoo/osnet-ain-x1-0
    runtime_file: osnet_ain_x1_0_msmt17.pth
    # F12-for-person-vectors (ledger item 20): sha256 over the whole file,
    # fetched from the repo's own source (ai/download_models.sh ->
    # huggingface.co/kaiyangzhou/osnet). The loader verifies it BEFORE
    # torch.load; wrong bytes are the same answer as no bytes. osnet_model_id()
    # derives every producer's belt from this line — the one person-vector
    # space is this row.
    sha256: 8a07e8da38946f7cee37f4561617bf8b6d2fe8f3a4027852893ea092e46d919f # pragma: allowlist secret
    size_mb: 10
    download_phase: 1
    required: false
    download_method: osnet
    category: embedding
    vram_mb: 100
    enabled: true
    priority: medium
    # F11 residency: the re-ID leg and enrollment read this row's handle from the
    # model manager's registry (osnet_loader.get_reid_handle), so it must be
    # present at boot — an absent handle answers "unavailable" (~1.16 s cold load
    # per request otherwise). Ledger item 24 / item 1.
    preload: true
    never_evict: false
    triton_name: reid
    triton_kind: KIND_GPU

  # Face leg of the VLM specialist stage (F12 ruling): the two ONNX files from
  # InsightFace buffalo_l, loaded directly on CPU onnxruntime - never via the
  # insightface package's FaceAnalysis, which drags in all five pack models.
  # Both are the exact bytes extracted from buffalo_l.zip (owner-pinned 2026-09-26,
  # sha256 over the whole file). scrfd gives boxes + 5 landmarks (ArcFace
  # 5-point alignment); w600k_r50 is the 512-d embedder (IJB-C 97.25).
  # Deploy: unpack buffalo_l.zip and keep ONLY these two files under
  # model-zoo/face-recognizer/ (renaming det_10g.onnx -> scrfd_10g_bnkps.onnx),
  # or place the two files from any mirror and trust the sha256 check below.
  - name: face-detector-scrfd
    description: 'SCRFD-10G-KPS face detection, boxes + 5 landmarks (buffalo_l det_10g.onnx, WIDER easy/med/hard 95.16/93.87/83.05)'
    service: backend
    hf_repo: ''
    local_path: model-zoo/face-recognizer
    runtime_file: scrfd_10g_bnkps.onnx
    size_mb: 17
    download_phase: 3
    required: false
    download_method: skip
    sha256: 5838f7fe053675b1c7a08b633df49e7af5495cee0493c7dcf6697200b85b5b91 # pragma: allowlist secret
    category: detection
    vram_mb: 0
    enabled: true
    priority: low
    # F11 residency: the face leg reads its detector+recognizer handles from the
    # model manager's registry (face_recognizer_loader.get_face_leg_handles) and
    # never triggers a load, so both rows must be resident at boot. Ledger items 24 and 32.
    preload: true
    never_evict: false

  - name: face-recognizer
    description: 'ArcFace w600k_r50 face embedding: aligned 112x112 crop in, L2-normalized 512-d vector out (buffalo_l w600k_r50.onnx, IJB-C TAR@FAR 1e-4 97.25); CPU onnxruntime'
    service: backend
    hf_repo: ''
    local_path: model-zoo/face-recognizer
    runtime_file: w600k_r50.onnx
    size_mb: 175
    download_phase: 3
    required: false
    download_method: skip
    sha256: 4c06341c33c2ca1f86781dab0e829f88ad5b64be9fba56e56bc9ebdefc619e43 # pragma: allowlist secret
    category: embedding
    vram_mb: 0
    # enabled like every model row: the pick landed (F12). ABSENT WEIGHTS are
    # the degradation path, not this flag - the loader raises
    # FaceRecognizerUnavailable and the specialist stage renders "unavailable"
    # (same shape the yolo11-face row already relies on with weights absent).
    enabled: true
    priority: low
    # F11 residency: paired with face-detector-scrfd above — get_face_leg_handles
    # returns None unless BOTH rows are resident, so one without the other leaves
    # the leg answering "unavailable". Ledger items 24 and 32.
    preload: true
    never_evict: false

  - name: yolov8n-pose
    description: 'YOLOv8n-pose human pose estimation, 17 COCO keypoints'
    service: both
    hf_repo: ultralytics/yolov8n-pose
    local_path: model-zoo/yolov8n-pose
    size_mb: 6
    download_phase: 1
    required: false
    category: pose
    vram_mb: 200
    enabled: true
    priority: medium
    preload: false
    never_evict: false
    runtime_file: yolov8n-pose.pt
    triton_name: pose
    triton_kind: KIND_GPU

  - name: threat-detection-yolov8n
    description: 'YOLOv8n threat/weapon detection (knives, guns, bats)'
    service: both
    hf_repo: Subh775/Threat-Detection-YOLOv8n
    local_path: model-zoo/threat-detection-yolov8n
    size_mb: 25
    download_phase: 1
    required: false
    category: detection
    vram_mb: 300
    enabled: true
    priority: medium
    preload: false
    never_evict: false
    triton_name: threat
    triton_kind: KIND_GPU

  # ===========================================================
  # PHASE 2 — DEMOGRAPHICS AND ACTION RECOGNITION
  # ===========================================================

  # ===========================================================
  # PHASE 3 — SPECIALIZED BACKEND + ADDITIONAL MODELS
  # ===========================================================

  - name: yolo11-face
    description: 'YOLO11n face detection on person crops'
    service: both
    hf_repo: AdamCodd/YOLOv11n-face-detection
    local_path: model-zoo/yolo11-face-detection
    size_mb: 11
    download_phase: 3
    required: false
    category: detection
    vram_mb: 200
    enabled: true
    priority: medium
    preload: false
    never_evict: false
    runtime_file: model.pt

  - name: yolo11-license-plate
    description: 'YOLO11n license plate detection (multiple model variants)'
    service: both
    hf_repo: morsetechlab/yolov11-license-plate-detection
    local_path: model-zoo/yolo11-license-plate
    size_mb: 650
    download_phase: 3
    required: false
    category: detection
    vram_mb: 300
    enabled: true
    priority: medium
    preload: false
    never_evict: false
    runtime_file: license-plate-finetune-v1n.pt

  # ===========================================================
  # LIBRARY / SPECIAL — no HF download, auto-managed by library
  # ===========================================================

  - name: fast-alpr
    description: 'FastALPR end-to-end license plate detection+OCR, ONNX auto-download (~28 MB)'
    service: backend
    hf_repo: null
    local_path: null
    size_mb: 28
    download_phase: 3
    required: false
    download_method: skip
    category: alpr
    vram_mb: 28
    enabled: true
    priority: medium
    preload: false
    never_evict: false
    runtime_path: fast-alpr

  - name: paddleocr
    description: 'PaddleOCR text recognition (superseded by fast-alpr for license plates)'
    service: backend
    hf_repo: null
    local_path: model-zoo/paddleocr
    size_mb: 100
    download_phase: 3
    required: false
    download_method: skip
    category: ocr
    vram_mb: 100
    enabled: true
    priority: medium
    preload: false
    never_evict: false

  # ===========================================================
  # DISABLED / FUTURE
  # ===========================================================

  - name: yolo26-general
    description: 'YOLO26 general detection via ultralytics (future release, TBD)'
    service: backend
    hf_repo: null
    local_path: null
    size_mb: 400
    download_phase: 3
    required: false
    download_method: skip
    category: detection
    vram_mb: 400
    enabled: false
    priority: medium
    preload: false
    never_evict: false
    runtime_path: 'ultralytics/yolo26'

