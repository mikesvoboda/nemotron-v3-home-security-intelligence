# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install && pre-commit install --hook-type pre-push && pre-commit install --hook-type commit-msg
# Run all: pre-commit run --all-files
#
# Performance Notes:
# -----------------
# Pre-commit runs fast linting/formatting checks (ruff, eslint, prettier, mypy).
# Pre-push runs parallel validation to catch failures before CI/CD.
#
# Test Strategy:
#   - pre-commit: Linting, formatting, type-checking only (~10-30 seconds)
#   - pre-push: Parallel validation (~2-3 minutes total, 60-70% faster than sequential)
#       Job 1: Backend unit tests with 85% coverage (pytest)
#       Job 2: E2E + Accessibility tests (Playwright Chromium)
#       Job 3: API types contract check (openapi-typescript)
#       Job 4: Backend integration tests (subset for speed)
#       Job 5: Frontend unit tests (vitest with coverage)
#   - CI: Full test suite (unit + integration + E2E multi-browser)
#   - Local dev: Use ./scripts/validate.sh for full validation before PRs
#
# Skipping Hooks (emergencies only):
#   SKIP=parallel-tests git push         # Skip all parallel tests on push
#   git push --no-verify                  # Skip ALL pre-push hooks (use sparingly!)
#   git commit --no-verify               # Skip commit-msg linting (use sparingly!)
#
# To run full tests manually before pushing:
#   ./scripts/validate.sh              # Full backend + frontend validation
#   ./scripts/validate.sh --backend    # Backend only
#

# Hook venvs must track the project runtime (requires-python >=3.14, mypy
# python_version=3.14, ruff target py314). Without this, pre-commit builds hook
# venvs under the interpreter of the tool install (3.12 here), and mypy then
# fails to PARSE valid 3.14 syntax (PEP 758 unparenthesized except) that CI's
# `uv run mypy` (3.14) accepts — a false red that no amount of code fixing can
# fix. Pin the interpreter so the gate sees the same grammar as CI.
default_language_version:
  python: python3.14

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # O1.5 removed the archive-tree exclusions here with the archive itself
      # (UR-19): the tree was mutation-triage EVIDENCE (mutmut diff dumps,
      # dossier prose) kept byte-for-byte, same ruling as the ^mutants/
      # exclusions that remain below — but an ignore whose target does not
      # exist is dead quarantine, and scripts/test_workflow_paths.py reddens
      # on such a pattern (O1.4 set the precedent with ^\.wp25-feed/).
      - id: trailing-whitespace
        exclude: \.ambr$ # Syrupy snapshot files require trailing whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml uses Python tags (!!python/name:) that safe_load can't
        # parse; config/docker-compose.gb300.yml uses podman-compose
        # !override tags with the same failure mode (compose itself parses
        # them fine — CI/podman accept the file; only this safe_load hook
        # chokes). scripts/uplevel-real-tier/docker-compose.b14-real.yml tags !reset the
        # same way. All excluded; schema validation lives in the compose
        # validation steps, not here.
        exclude: (mkdocs\.yml$|^config/docker-compose\.gb300\.yml$|^scripts/uplevel-real-tier/docker-compose\.b14-real\.yml$)
      - id: check-json
        exclude: tsconfig.*\.json$
      - id: check-added-large-files
        args: ['--maxkb=1000']
        # docs/images PNGs: reviewed visual assets. .test_durations: pytest-
        # split's shard-planning file (~4 MB JSON, 32,931 keys) — machine-
        # regenerated wholesale by scripts/mint-test-durations.py, never
        # hand-edited, ~418 KB zlib-compressed, and its SIZE IS ITS CONTENT
        # (one key per test; shrinking it means dropping planning data). The
        # consumer contract is gated by scripts/test_shard_durations.py, not
        # by byte count. Scope is this one exact path, not a class.
        exclude: (^docs/images/.*\.png$|^\.test_durations$)
      - id: check-merge-conflict
      - id: detect-private-key
        # Exclude test files that contain mock/fake private keys for testing.
        # (O1.5 removed the triage-evidence-tree alternative with the archive.)
        exclude: ^backend/tests/.*test_config\.py$

  # Commit message linting - enforces conventional commit format
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - chore
          - refactor
          - test
          - style
          - perf
          - build
          - ci
          - revert

  # Secret detection - prevents committing secrets and credentials
  # Uses .secrets.baseline for known false positives
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # compose-render.env is test evidence with deliberate fake stubs (its header
        # testifies); no inline `pragma: allowlist secret` instead, because the file is
        # fed to compose as a literal --env-file, where `#` is not comment syntax.
        # The dot in compose-render.env is UNESCAPED on purpose (O1.5 finding E): the
        # regenerate helper embeds this same string in a bash entry, and
        # scripts/test_workflow_paths.py's command-domain tokenizer slices regex text
        # at `\.`, turning `compose-render\.env` into a phantom address that exists
        # nowhere. Unescaped, the sliced token names the real fixture and the gate
        # resolves it; the cost is a regex dot that would also match compose-renderXenv
        # — no such file, and the $ anchor bounds it. Do not "tidy" the backslash back.
        exclude: (package-lock\.json|uv\.lock|\.secrets\.baseline|^mutants/|\.tsbuildinfo$|^synthbench/generate/manifests/.*\.json$|^backend/tests/fixtures/compose-render.env$)

  # Auto-regenerate secrets baseline if it has conflicts or is out of date
  # Runs on every commit but only regenerates when baseline is invalid/conflicted
  - repo: local
    hooks:
      - id: regenerate-secrets-baseline
        name: Regenerate secrets baseline
        # O1.5 self-review (finding E, 2026-10-09): this --exclude-files string and the
        # detect-secrets hook's exclude above MUST stay character-identical. A baseline
        # is a fixed point of the scan view that maintains it; the narrower string this
        # helper used carried two missing patterns, so a conflict rebuild re-added 45
        # findings (synthbench/generate/manifests/*.json, compose-render.env) that the
        # real hook never scans — findings it would prune again on the next view,
        # leaving a permanently dirty baseline. scripts/test_precommit_config.py now
        # reddens if the two strings diverge.
        entry: bash -c 'if grep -q "^<<<<<<" .secrets.baseline 2>/dev/null; then echo "Detected merge conflicts in .secrets.baseline, regenerating..."; detect-secrets scan --baseline .secrets.baseline --exclude-files "(package-lock\.json|uv\.lock|\.secrets\.baseline|^mutants/|\.tsbuildinfo$|^synthbench/generate/manifests/.*\.json$|^backend/tests/fixtures/compose-render.env$)" && git add .secrets.baseline; fi'
        language: system
        pass_filenames: false
        always_run: true

  # Hadolint - Dockerfile linting
  # Requires: brew install hadolint (macOS) or download binary
  - repo: local
    hooks:
      - id: hadolint
        name: Hadolint Dockerfile Linting
        # Gate fails on hadolint ERRORs only. The tree carries a known backlog
        # of info/warning advisories (DL3066 non-numeric user-id, DL3025 JSON
        # exec-form, DL3064 ARG-env) that hadolint 2.15.1 newly flags and CI
        # never runs hadolint on — clearing that debt is lint-hygiene work,
        # not a merge blocker. Warnings still print; they just don't fail.
        entry: hadolint --failure-threshold error
        language: system
        types: [dockerfile]
        exclude: ^mutants/

  # Semgrep - Shift-left security scanning
  # Note: Uses Python 3.12 because protobuf doesn't support Python 3.14 yet
  - repo: https://github.com/semgrep/semgrep
    rev: v1.96.0
    hooks:
      - id: semgrep
        name: Semgrep Security Scan
        language_version: python3.12
        # semgrep 1.96 imports pkg_resources at startup (opentelemetry's
        # instrumentation layer does), and modern setuptools removed it — a
        # freshly-built hook env dies ModuleNotFoundError before any scan.
        # Locally it hides: envs built by older toolchains still carry
        # setuptools. CI's O1.12 job builds the env clean (run 37812639795:
        # pysemgrep traceback, exit 1, before scanning a single file), so the
        # env must declare its own provider. 75.8.0 is the last line still
        # bundling pkg_resources — the same pin the sandbox recipe uses.
        additional_dependencies:
          - setuptools==75.8.0
        args:
          - --config=semgrep.yml
          - --config=p/python
          - --error
        types: [python]
        # Exclude mutants/, test_database_isolation.py (uses intentional raw SQL for advisory locks),
        # test_database_failover.py (text("SELECT 1") is a connection health probe, not user input),
        # and conftest.py (table names come from SQLAlchemy reflection, not user input).
        # O1.4 removed three dead alternatives: ^\.wp25-feed/ (tree moved into
        # the deleted archive), backend/alembic/helpers\.py$ (alembic removed at #4465),
        # and backend/services/vehicle_classifier_loader\.py$ (loader never
        # re-added after its move). O1.5 removed the archive-tree pattern with the archive
        # itself (UR-19). scripts/test_workflow_paths.py reddens on any of
        # them reappearing.
        exclude: (^mutants/|backend/tests/integration/test_database_isolation\.py$|backend/tests/integration/test_database_failover\.py$|backend/tests/integration/conftest\.py$)

  # Python - Ruff (fast linter + formatter)
  # NOTE: Keep in sync with uv.lock ruff version for consistent behavior
  # rev tracks the ruff version in uv.lock (CI runs `uv run ruff` from the
  # lock; a stale rev here re-lints staged files under an older rule set and
  # can diverge both directions — false passes AND unparseable new rule codes)
  #
  # Scope mirrors CI: ruff runs over backend/ ONLY (ci.yml
  # `uv run ruff check backend/` / `ruff format --check backend/`). The rest
  # of the tree (ai/ setup_lib/ scripts/ tools/ tests/ monitoring/) predates
  # the backend lint program and was never formatted under py314 target
  # semantics: 0.16.x with target py314 rewrites valid py313-era
  # `except (A, B):` to unparenthesized PEP 758 style, and blanket --all-files
  # sweeps then diff ~170 unrelated files on every local run. Widening the
  # ruff program to those trees is a deliberate future task, not gate noise.
  # Per-directory config shims (ai/pyproject.toml etc.) pin each subtree's
  # own target-version so a future widening formats from its own semantics.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        files: ^(backend|synthbench)/
        exclude: ^mutants/
      - id: ruff-format
        types_or: [python, pyi]
        files: ^(backend|synthbench)/
        exclude: ^mutants/

  # Python - Type checking with mypy
  # rev + additional_dependencies track uv.lock so the hook and CI's
  # `uv run mypy` see identical stubs (unpinned deps here drifted the hook
  # away from CI verdicts)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic==2.13.5
          - sqlalchemy==2.0.53
          - fastapi==0.141.1
          - redis==8.1.0
          - types-PyYAML
          - numpy==2.5.3
        args: [--ignore-missing-imports]
        files: ^(backend|synthbench)/

  # Prettier (Formatting) - Non-TypeScript, non-frontend files only
  # TypeScript files use local prettier-frontend hook to avoid type parameter stripping bug
  # Frontend CSS/JSON/MD use local prettier-frontend hook to access tailwindcss plugin
  # Exclude tsconfig.json which uses JSONC format (trailing commas)
  # Exclude docs/openapi.json which is auto-generated by generate-openapi hook
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [css, json, markdown, yaml]
        # (O1.5 removed the archive-tree alternative with the archive itself —
        # the tree was triage PROSE-COMPUTE: prettier pairs mid-word
        # underscores into emphasis (read_through_cache ->
        # read*through_cache). O1.4 removed the dead ^\.wp25-feed/
        # alternative.)
        exclude: (^frontend/|tsconfig.*\.json$|^docs/openapi\.json$|^docs/index\.md$)
        additional_dependencies:
          # Owner ruling 24 (2026-10-09): ONE prettier for the whole repo — this
          # hook now runs the frontend lockfile's 3.9.9 (frontend/package.json
          # pins ^3.9.9; the `prettier-frontend` hook below resolves it from
          # node_modules). Before this, the two hooks formatted the same .md
          # files with 3.2.4 vs 3.9.9 and the version changed the answer — the
          # split-brain that reddened #6869 for main's formatting and blocked
          # #6861/#6907 (assignment #6913, measurements in its body). The
          # mirrors-prettier `rev:` stays v3.1.0 on purpose: the mirror is
          # `language: node`, so its rev only scaffolds the hook and
          # additional_dependencies (npm, not PyPI) is the real version pin.
          - prettier@3.9.9

  # OpenAPI spec generation - auto-regenerates docs/openapi.json on backend changes
  # Runs before commit so the generated spec is included in the commit
  #
  # Performance (NEM-2587):
  #   - Skip path (no changes): ~5-10ms (hash comparison only)
  #   - Regeneration path: ~1.5-2s (full app import + spec generation)
  #   - Uses .openapi-cache file for hash-based change detection
  - repo: local
    hooks:
      - id: generate-openapi
        name: Generate OpenAPI Spec
        entry: bash -c 'uv run python scripts/generate-openapi.py && git add docs/openapi.json'
        language: system
        files: ^backend/(api|models|schemas)/.*\.py$
        pass_filenames: false

  # TypeScript API types generation - auto-regenerates frontend/src/types/generated/api.ts
  # Runs when backend API files change so generated types are included in the commit
  # This prevents pre-push failures due to outdated types
  - repo: local
    hooks:
      - id: generate-api-types
        name: Generate TypeScript API Types
        entry: bash -c './scripts/generate-types.sh && git add frontend/src/types/generated/api.ts'
        language: system
        files: ^backend/(api|models|schemas)/.*\.py$
        pass_filenames: false

  # Frontend Prettier - Uses local prettier with tailwindcss plugin
  # Handles all frontend files: TS/TSX/JS/JSX plus CSS/JSON/MD
  - repo: local
    hooks:
      - id: prettier-frontend
        name: Prettier (Frontend)
        # "$@" + trailing `bash` sentinel: pre-commit APPENDS filenames after
        # this string, and `bash -c` binds the first appended word to $0 —
        # without a sentinel the command string saw ZERO filenames and
        # prettier exited 0 formatting nothing (every pass here was vacuous
        # until 2026-09-16; scripts/test_precommit_config.py guards it).
        # ${@#frontend/} rebases repo-root-relative names onto this cd.
        entry: bash -c 'cd frontend && npx prettier --write --ignore-unknown ${@#frontend/}' bash
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|css|json|md)$
        exclude: package-lock\.json$
        pass_filenames: true

      - id: eslint
        name: ESLint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      - id: typescript-check
        name: TypeScript Type Check
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

  # Dependency lock consistency checks
  - repo: local
    hooks:
      - id: uv-lock-check
        name: Check uv lock file is up-to-date
        entry: bash -c 'cd "$0" && uv lock --check' .
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: npm-install-check
        name: Check npm dependencies are installed
        entry: bash -c 'cd frontend && npm ci --prefer-offline --no-audit --dry-run'
        language: system
        files: ^frontend/(package\.json|package-lock\.json)$
        pass_filenames: false

      - id: version-consistency
        name: Check runtime versions agree with .nvmrc/.python-version
        entry: ./scripts/check-version-consistency.sh
        language: system
        pass_filenames: false
        always_run: true

  # Test validation hooks
  # NOTE: Full test suite runs in CI. Pre-commit focuses on fast lint/format checks.
  - repo: local
    hooks:
      # Auto-rebase on origin/main before pushing
      # Keeps feature branches up-to-date and avoids merge conflicts
      # Skip with: SKIP=auto-rebase git push
      - id: auto-rebase
        name: Auto-rebase on origin/main
        entry: ./scripts/pre-push-rebase.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # WP2.4 fast-tier pre-push - 3 jobs concurrently, SELECTED for the pushed diff
      # Job 1: API types contract check (openapi-typescript) - ~10-20s
      # Job 2: SELECTED backend tier (fast_select -> unit+contracts -> runner)
      # Job 3: SELECTED frontend tier (vitest --related via fast-frontend-runner)
      # Budget: FAST_PREPUSH_BUDGET (default 900s). MEASURED wired-shape
      # p50 428s p95 513s max 3014s (n=20, ledger WP2.4 row + commit body):
      # the 300s plan target RAISED (tiered, owner ruling 2026-09-16); mega
      # diffs hit the budget and get a loud handoff notice, never a narrowed
      # selection - the timeout bounds wall time only.
      # Selection-driven: no fixed smoke set; integration keeps its own -n0 gate.
      # Skip with: SKIP=parallel-tests git push  (repo rule: never actually do)
      - id: parallel-tests
        name: Fast Pre-Push Tier (API Types + Selected Backend + Selected Frontend)
        entry: ./scripts/pre-push-tests.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: check-test-mocks
        name: Check integration tests mock slow services
        entry: python3 scripts/check-test-mocks.py
        language: system
        files: ^backend/tests/integration/.*\.py$
        pass_filenames: true

      - id: check-test-timeouts
        name: Check tests mock slow sleeps/timeouts
        entry: python3 scripts/check-test-timeouts.py
        language: system
        files: ^backend/tests/.*\.py$
        pass_filenames: true

      - id: check-mock-spec
        name: Check new mock patches carry autospec (WP4.2 ratchet)
        # Fast path only: flags unspecced convertible patch() sites on the
        # ADDED lines of the staged diff (the tree carries 322 licensed
        # sites; whole-file scanning would block every touch). The ratchet
        # in CI is the completeness layer -- see scripts/check-mock-spec.py.
        entry: python3 scripts/check-mock-spec.py --staged
        language: system
        files: ^backend/tests/.*\.py$
        pass_filenames: true

      # Validation alignment hook - detects drift between Pydantic and Zod schemas
      # Warns when backend Pydantic schemas are modified to verify frontend Zod alignment
      # This is a warning-only hook - commits are not blocked
      # Set VALIDATION_DRIFT_VERBOSE=1 for detailed info messages
      - id: check-validation-drift
        name: Check validation drift (Pydantic/Zod)
        entry: python3 scripts/check-validation-drift.py
        language: system
        files: ^(backend/api/schemas/.*\.py|frontend/src/schemas/.*\.ts)$
        pass_filenames: true

      # Test automation enforcement hooks
      # These ensure new files include proper test stubs and integration tests

      - id: check-integration-tests
        name: Check for integration tests on API/service changes
        entry: python3 scripts/check-integration-tests.py
        language: system
        files: ^backend/(api/routes|services)/.*\.py$
        pass_filenames: true
        stages: [pre-commit, pre-push]

      - id: check-new-files-have-tests
        name: Detect new source files without test files
        entry: python3 scripts/check-test-coverage-gate.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
