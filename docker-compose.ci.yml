# CI Docker Compose for Smoke Tests
#
# This configuration is designed for GitHub Actions CI runners:
# - No GPU requirements (AI services are mocked/optional)
# - Uses pre-built images from GHCR
# - Fast startup with minimal resources
# - All services on a single network for easy testing
#
# Usage in CI:
#   docker compose -f docker-compose.ci.yml up -d --wait
#   ./scripts/ci-smoke-test.sh
#   docker compose -f docker-compose.ci.yml down -v
#
# Environment Variables:
#   - IMAGE_TAG: Image tag to use (default: latest)
#   - GHCR_OWNER: GitHub Container Registry owner (default: mikesvoboda)
#   - GHCR_REPO: GitHub Container Registry repository

services:
  postgres:
    image: postgres:16-alpine
    # Security hardening: Drop all capabilities, prevent privilege escalation
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The image's entrypoint starts as root and drops to postgres via chown/
    # setpriv — capabilities cap_drop: ALL just removed. Start as that user
    # (uid 70:70, read from the container with `id`) and no privilege is ever
    # needed; without this every CI push dies on
    # `chown: /var/lib/postgresql/data: Operation not permitted`.
    user: '70:70'
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=security
      - POSTGRES_PASSWORD=ci_test_password
      - POSTGRES_DB=security
      # The tmpfs mount point /var/lib/postgresql/data is root-owned and
      # uid 70 cannot chmod a mount point it doesn't own (cap_drop ALL).
      # One level down, initdb creates and owns the datadir itself.
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U security -d security']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data
      - /tmp
      - /var/run/postgresql
    networks:
      - ci-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  redis:
    image: redis:7.4-alpine3.21
    # Security hardening: Drop all capabilities, prevent privilege escalation
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Same as postgres: the entrypoint drops root→redis with setpriv, whose
    # SETUID/SETGID caps cap_drop: ALL removed, and dies on
    # `setpriv: setresuid failed: Operation not permitted` (exit 127).
    # Start as that user (uid 999:1000, read with `id`) instead.
    user: '999:1000'
    # Redis tuning for connection handling
    sysctls:
      - net.core.somaxconn=511
    tmpfs:
      - /tmp
    ports:
      - '6379:6379'
    # Disable persistence failures blocking writes in CI (ephemeral environment)
    command: redis-server --stop-writes-on-bgsave-error no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ci-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  backend:
    image: ghcr.io/${GHCR_OWNER:-mikesvoboda}/${GHCR_REPO:-nemotron-v3-home-security-intelligence}/backend:${IMAGE_TAG:-latest}
    # Security hardening: Drop all capabilities, prevent privilege escalation
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Security: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.cache
      # The lifespan FileWatcher inotify-watches FOSCAM_BASE_PATH=/cameras
      # unconditionally; on a read-only rootfs the mkdir/watch raises
      # [Errno 30] inside the Redis try-block, which swallows it and leaves
      # pipeline_manager unregistered — then /health/ready answers 503
      # forever ("Pipeline manager not registered"). A tmpfs gives the
      # watcher a writable (empty) tree, which is all CI needs: the other
      # composes bind-mount real camera folders.
      - /cameras
    ports:
      - '8000:8000'
    environment:
      # No PYTHON_GIL=0 here: this job pulls backend:latest, whose prod stage
      # is python:3.14-slim-bookworm — GIL-enabled (Py_GIL_DISABLED=0). The
      # free-threaded base (docker/python-freethreaded/) is not wired into
      # that build, so the env var made every python in the container fatal
      # ("config_read_gil: Disabling the GIL is not supported by this
      # build"), entrypoint included. Revisit only together with the build.
      - DATABASE_URL=postgresql+asyncpg://security:ci_test_password@postgres:5432/security
      - REDIS_URL=redis://redis:6379
      # R8 S3 retired the florence/clip/enrichment URLs (their services cannot
      # boot: the Triton repository prunes to yolo26/reid/threat and
      # GATEWAY_MODEL_SET hard-raises), so no row is injected for them — a
      # settings field they'd land on no longer exists.
      - FOSCAM_BASE_PATH=/cameras
      - DEBUG=false
      # config.py's environment field defaults to 'production', and the
      # production path hard-raises without REDIS_PASSWORD. The prod and
      # ghcr composes both set 'development' explicitly; the CI compose
      # silently inherited the production default and backend died at
      # Settings validation before uvicorn started.
      - ENVIRONMENT=development
      # Disable file watcher in CI (no camera folders)
      - FILE_WATCHER_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import httpx; r = httpx.get('http://localhost:8000/api/system/health/ready'); exit(0 if r.status_code == 200 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - ci-net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  frontend:
    image: ghcr.io/${GHCR_OWNER:-mikesvoboda}/${GHCR_REPO:-nemotron-v3-home-security-intelligence}/frontend:${IMAGE_TAG:-latest}
    # Security hardening: Drop all capabilities, prevent privilege escalation
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # read_only NOT used — same NOTE as docker-compose.prod.yml:897: the
    # image's entrypoint sed -i's /etc/nginx/conf.d/default.conf at startup
    # and dies on a read-only rootfs (`sed: can't create temp file ...
    # Read-only file system`, measured against frontend:latest from GHCR).
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    ports:
      # The image is nginxinc/nginx-unprivileged: listens on 8080
      # (frontend/nginx.conf), never 80 — the old '3000:80' mapped to nothing.
      - '3000:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Use /health endpoint which returns 200 directly (avoids 301 redirect issues)
      # 8080 = the port nginx-unprivileged actually listens on (image HEALTHCHECK
      # uses the same); 'localhost:80' inside this image reaches nothing.
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8080/health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ci-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  ci-net:
    driver: bridge
