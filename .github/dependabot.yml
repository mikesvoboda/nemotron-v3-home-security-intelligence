# Dependabot configuration for automated dependency updates
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # =============================================================================
  # Python Dependencies (uv)
  # =============================================================================
  # pyproject.toml is at the repository root, lockfile is uv.lock. The `uv`
  # ecosystem resolves through uv.lock; the `pip` ecosystem it replaces could not
  # read uv.lock, so it scanned requirements*.txt at '/' and kept opening PRs
  # against the generated `uv export` artifact (requirements-audit.txt, now
  # untracked — CI regenerates it per job; nothing reads a committed copy).
  #
  # KNOWN SCOPE — review these hunks by hand: the uv ecosystem also rewrites
  # hand-maintained ai/*/requirements.txt floors. PR #6544 (d1546bee,
  # 2026-09-15) lifted ai/florence/requirements.txt from torch>=2.0.0 to
  # >=2.14.0 and transformers>=4.49 to >=5.17 in one commit. No CI job
  # validates those floors — build-base-image.yml triggers only on
  # requirements-base.txt (never dependabot-touched to date) — so a green
  # check does not mean those installs work.
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Chicago'
    target-branch: 'main'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    # Group minor and patch updates to reduce PR noise
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      python-security:
        applies-to: security-updates
        patterns:
          - '*'

  # =============================================================================
  # Node.js Dependencies (npm)
  # =============================================================================
  # frontend/package.json with package-lock.json
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Chicago'
    target-branch: 'main'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'javascript'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    # Group minor and patch updates to reduce PR noise
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
      # Group React ecosystem updates together
      react:
        applies-to: version-updates
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-router-dom'
          - '@types/react'
          - '@types/react-dom'
      # Group testing libraries together
      testing:
        applies-to: version-updates
        patterns:
          - '@testing-library/*'
          - '@playwright/test'
          - 'vitest'
          - '@vitest/*'
      # Group ESLint ecosystem together
      eslint:
        applies-to: version-updates
        patterns:
          - 'eslint'
          - 'eslint-plugin-*'
          - 'typescript-eslint'
          - '@eslint/*'

  # =============================================================================
  # GitHub Actions
  # =============================================================================
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'America/Chicago'
    target-branch: 'main'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'

  # =============================================================================
