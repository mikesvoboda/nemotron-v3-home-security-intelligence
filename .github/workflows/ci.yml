  # Test Performance Audit Job (main-only)
  # WP0.5 (owner ruling 2026-09-16: "gate at raised thresholds"): this job was
  # main-only, red-and-advisory forever (46 rows over the 1.0s unit threshold).
  # It now GATES: raised thresholds (unit 4.0s / integration 10.0s, measured
  # from the main-run distribution — see ledger WP0.5 row) that the honest
  # baseline passes with zero laundering (replay of main run 35049640472
  # artifacts: FAIL(46) -> PASS), the 2 residual >4s outliers tracked in
  # audit-test-durations.py's SLOW_TEST_PATTERNS (60s cap), the job runs on
  # PRs under unit-tests' own trigger (a gate main-only is a post-merge
  # reporter), and missing test data FAILS the job — never a vacuous pass.
  test-performance-audit:
    name: Test Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # WP1.3: actions:read for fetching the previous main run's junit artifacts
    # (the baseline). Repo default "read" covers contents/metadata/packages
    # only — the Actions artifact API is NOT in it; without this line the
    # fetch 403s and the job fail-closes on every run (silent old behavior).
    permissions:
      contents: read
      actions: read
    needs:
      - detect-changes
      - lint
      - build-backend-deps
      - unit-tests
      - integration-tests-api
      - integration-tests-api-retry
      - integration-tests-websocket
      - integration-tests-services
      - integration-tests-models
      - frontend-e2e
    # Mirrors unit-tests' availability exactly: when unit-tests was skipped
    # (frontend/docs-only PR, lint red), the audit has no data by design and
    # must SKIP honestly; when the tier ran, its artifacts are here (uploaded
    # if: always()) and zero XML is a pipeline break -> fail.
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.backend == 'true') &&
      needs.lint.result != 'failure' &&
      needs.build-backend-deps.result != 'failure'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Download all test results
        # OB.2 reason: best-effort inputs — the per-run junit artifacts exist
        # only if the shard jobs uploaded them; a missing/broken download
        # degrades this report's detail, it must not red the job. The job's
        # own gate verdict stays on the calibration fetch below, which fails
        # CLOSED (WP1.3) — that asymmetry is deliberate.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*
          path: test-results/
          merge-multiple: true
        continue-on-error: true

      - name: Download E2E test results
        # OB.2 reason: same best-effort doctrine as the download above.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: playwright-test-results-*
          path: test-results/
          merge-multiple: true
        continue-on-error: true

      - name: List downloaded artifacts
        run: |
          if [ -d "test-results/" ]; then
            echo "Test results directory exists"
            find test-results/ -type f -name "*.xml" | head -30 || echo "No XML files found"
          else
            echo "Warning: test-results/ directory not found"
            mkdir -p test-results/
          fi

      - name: Fetch baseline junit (previous main run)
        # WP1.3: the runner's own previous run is the only honest calibration
        # (suite-wide medians are identical red-vs-green — global calibration
        # is dead BY DATA, ledger WP1.3). WP1.5: the selection rule moved to
        # scripts/fetch-ci-artifacts.py — it had been transcribed in curl/jq
        # twice in one day and bitten both known traps (generic
        # /actions/runs?branch=main mixes sibling workflows and silently
        # misses CI; selecting the current run baselines it against itself).
        # One tested implementation (scripts/test_flake_consumer.py drives it
        # through a canned API). Fetch failure => baseline/ empty => the audit
        # FAILS CLOSED (every breach red, exactly the pre-WP1.3 gate) — a
        # broken fetch can never silently widen the gate.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # token via stdin, never argv (ps + logs stay clean)
          echo "$GH_TOKEN" | python3 scripts/fetch-ci-artifacts.py \
            --repo "${{ github.repository }}" \
            --current-run-id "${{ github.run_id }}" \
            --out baseline

      - name: Analyze test durations
        # WP0.5: no more "skip + exit 0" on missing data — the audit only runs
        # when its tier ran (job `if:`), so zero XML is a pipeline break and
        # the script fails it. Thresholds are the owner-ruled raised pair;
        # distribution evidence + tracked-slow list in the ledger WP0.5 row.
        # WP1.3: --baseline-dir makes a mild one-run spike on a
        # baseline-healthy test a warning; persistence (breached there too),
        # severity (>=3x limit) and new tests stay RED (rules + fixtures:
        # scripts/test_audit_gate.sh cases 8-13; measurements: ledger WP1.3).
        run: uv run python scripts/audit-test-durations.py test-results/ --baseline-dir baseline/
        env:
          UNIT_TEST_THRESHOLD: '4.0'
          INTEGRATION_TEST_THRESHOLD: '10.0'
          E2E_TEST_THRESHOLD: '10.0'
          SLOW_TEST_THRESHOLD: '60.0'
          WARN_THRESHOLD_PERCENT: '80'

      - name: Real-sleep budget gate (ruling 93)
        # Owner ruling 93 (amending 74): the same post-run gate over the
        # durations CI already records, at the audit's OWN limits above
        # (unit 4.0 / integration 10.0 / e2e 10.0) and with no "healthy in the
        # previous main run" downgrade. That missing downgrade is the gate's
        # entire content over the audit — a real sleep is the same value every
        # run, so forgiving a duration by history forgives exactly what is
        # being hunted. No baseline file: the 1.5 s line that ruled 74's hard
        # budget sits inside the runner's noise band (the over-1.5 victim set
        # rotates 12/13/10 ids between same-code green runs), so it is demoted
        # to a WARN — every unit test over 1.5 s is listed in this job's
        # summary and never fails. Hard budgets flip ZERO ids across the three
        # measured green corpora. The tracked-slow bucket keeps its 60 s cap
        # (SLOW_TEST_THRESHOLD above; the census entry IS the adjudication).
        # Reuses the audit's tier classifier so the two never disagree about a
        # test's tier. Zero XML fails closed here too — both downloads above
        # are continue-on-error.
        run: uv run python scripts/check-test-duration-budget.py test-results/
        env:
          SLEEP_GATE_UNIT_BUDGET: '4.0'
          SLEEP_GATE_INTEGRATION_BUDGET: '10.0'
          SLEEP_GATE_E2E_BUDGET: '10.0'
          SLEEP_GATE_WARN_BUDGET: '1.5'
          # UR-125 as amended: a unit-tier breach re-runs once before it can
          # redden the run. The script ships this OFF, because a junit corpus
          # describes the machine that wrote it and replaying one on a laptop
          # compares two boxes — it could clear a genuine breach. This job is
          # the one place the checkout IS the tree that produced these XMLs
          # (same commit, same runner class, same job), which is what the
          # ruling's "re-runs only that test, once, in the same job" means. The
          # key needs the dev extra, which the uv sync above already installs.
          SLEEP_GATE_RERUN: '1'

      - name: Create Linear issue on failure
        # WP0.5: the job now gates PRs too — a PR failure is a red check the
        # author sees inline; only post-merge main failures file the follow-up.
        if: vars.LINEAR_ENABLED == 'true' && (failure() && github.ref == 'refs/heads/main')
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          TITLE="[CI] Test Performance Audit failed on main"

          # Check for existing open issue with same title
          EXISTING=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d '{
              "query": "query SearchIssues($filter: IssueFilter) { issues(filter: $filter) { nodes { id identifier } } }",
              "variables": {
                "filter": {
                  "team": { "key": { "eq": "NEM" } },
                  "title": { "eq": "'"$TITLE"'" },
                  "state": { "type": { "nin": ["completed", "canceled"] } }
                }
              }
            }')

          EXISTING_ID=$(echo "$EXISTING" | jq -r '.data.issues.nodes[0].id // empty')

          if [ -n "$EXISTING_ID" ]; then
            # Add comment to existing issue
            COMMENT="**Another failure detected**\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateComment($input: CommentCreateInput!) { commentCreate(input: $input) { success } }",
                "variables": {
                  "input": {
                    "issueId": "'"$EXISTING_ID"'",
                    "body": "'"$COMMENT"'"
                  }
                }
              }'
            echo "Added comment to existing issue"
          else
            # Create new issue
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateIssue($input: IssueCreateInput!) { issueCreate(input: $input) { success issue { identifier url } } }",
                "variables": {
                  "input": {
                    "teamId": "998946a2-aa75-491b-a39d-189660131392",
                    "title": "'"$TITLE"'",
                    "description": "Test performance audit found slow tests after merge to main.\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease review and optimize slow tests.",
                    "priority": 3
                  }
                }
              }'
            echo "Created new issue"
          fi

  # WP1.5: the flaky-tracking CONSUMER. Every shard writes
  # flaky-test-tracking-*.jsonl and uploads it inside test-results-*, and
  # until now NOTHING read them — `flake_allowlist: 0` was evidence of no
  # consumer, not of no flakes (P WP1.5). This job harvests the last few main
  # runs' artifacts (scripts/fetch-ci-artifacts.py — same tested selection
  # TPA's baseline uses: newest main runs, never the current run) and runs
  # the analyzer with --owner-summary: a RANKED flake list whose Owner column
  # shows the allowlist tracking ref, or the literal "no owner" — the named-
  # owner list P's done-when asks for. Linear-triaged (WP0.6 class), like the
  # audit's own failure path.
  flake-report:
    name: Flake Report (consumer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions:read for the artifact harvest — repo default "read" lacks it
    # (WP1.3 measurement: without this line the fetch 403s every run).
    permissions:
      contents: read
      actions: read
    # Main only: the corpus is main's history; PR branches have no flake
    # history of their own to rank, and harvesting main artifacts from a PR
    # would blame main's flakes on the branch.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Harvest previous main runs' flaky tracking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | python3 scripts/fetch-ci-artifacts.py \
            --repo "${{ github.repository }}" \
            --current-run-id "${{ github.run_id }}" \
            --harvest-runs 6 \
            --out flaky-corpus

      - name: Rank flakes with owners
        run: |
          python3 scripts/analyze-flaky-tests.py flaky-corpus/ \
            --output flaky-test-report.json \
            --allowlist-file .github/flake-allowlist.yml \
            --owner-summary
        env:
          FLAKY_THRESHOLD: '0.9'
          # one run = one sample per test; with 6 harvested runs a test needs
          # >=2 samples before a pass-rate can mean anything (analyzer MIN_RUNS)
          MIN_RUNS: '2'

      - name: Upload flaky test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-test-report-${{ github.run_id }}
          path: flaky-test-report.json
          retention-days: 30

      - name: Create Linear issue on failure
        if: vars.LINEAR_ENABLED == 'true' && (failure())
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          TITLE="[CI] Flake-report consumer failed on main"

          # Check for existing open issue with same title
          EXISTING=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d '{
              "query": "query SearchIssues($filter: IssueFilter) { issues(filter: $filter) { nodes { id identifier } } }",
              "variables": {
                "filter": {
                  "team": { "key": { "eq": "NEM" } },
                  "title": { "eq": "'"$TITLE"'" },
                  "state": { "type": { "nin": ["completed", "canceled"] } }
                }
              }
            }')

          EXISTING_ID=$(echo "$EXISTING" | jq -r '.data.issues.nodes[0].id // empty')

          if [ -n "$EXISTING_ID" ]; then
            echo "Existing issue found ($EXISTING_ID), skipping creation"
          else
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateIssue($input: IssueCreateInput!) { issueCreate(input: $input) { success issue { identifier url } } }",
                "variables": {
                  "input": {
                    "teamId": "998946a2-aa75-491b-a39d-189660131392",
                    "title": "'"$TITLE"'",
                    "description": "The WP1.5 flake-report consumer failed on main — the per-run flaky tracking has no working reader again.\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "priority": 3
                  }
                }
              }'
            echo "Created new issue"
          fi

  # Test Count Verification Job (weekly schedule)
  # Prevents accidental test deletion by comparing against baseline counts
  # Run weekly instead of every main push to reduce CI load

  test-count-verification:
    name: Test Count Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Count and verify backend tests
        run: |
          # Count backend tests using pytest collection
          echo "Counting backend tests..."
          UNIT_COUNT=$(uv run pytest backend/tests/unit/ --collect-only -q 2>/dev/null | tail -1 | grep -oE '[0-9]+' | head -1 || echo "0")
          INTEGRATION_COUNT=$(uv run pytest backend/tests/integration/ --collect-only -q 2>/dev/null | tail -1 | grep -oE '[0-9]+' | head -1 || echo "0")

          echo "Backend Unit Tests: $UNIT_COUNT"
          echo "Backend Integration Tests: $INTEGRATION_COUNT"

          # Baseline thresholds - update these as tests are added
          # These represent minimum acceptable test counts
          UNIT_MIN=2900
          INTEGRATION_MIN=600

          if [ "$UNIT_COUNT" -lt "$UNIT_MIN" ]; then
            echo "::error::Backend unit test count ($UNIT_COUNT) is below minimum threshold ($UNIT_MIN). Tests may have been accidentally deleted."
            exit 1
          fi

          if [ "$INTEGRATION_COUNT" -lt "$INTEGRATION_MIN" ]; then
            echo "::error::Backend integration test count ($INTEGRATION_COUNT) is below minimum threshold ($INTEGRATION_MIN). Tests may have been accidentally deleted."
            exit 1
          fi

          echo "Test count verification passed!"

      - name: Count and verify frontend tests
        run: |
          # Count frontend tests by scanning test files
          echo "Counting frontend tests..."
          cd frontend

          # Count test files and estimate tests
          TEST_FILES=$(find src -name "*.test.ts" -o -name "*.test.tsx" | wc -l)
          E2E_SPECS=$(find tests/e2e -name "*.spec.ts" | wc -l)

          echo "Frontend Test Files: $TEST_FILES"
          echo "Frontend E2E Spec Files: $E2E_SPECS"

          # Baseline thresholds
          TEST_FILES_MIN=50
          E2E_SPECS_MIN=15

          if [ "$TEST_FILES" -lt "$TEST_FILES_MIN" ]; then
            echo "::error::Frontend test file count ($TEST_FILES) is below minimum threshold ($TEST_FILES_MIN). Tests may have been accidentally deleted."
            exit 1
          fi

          if [ "$E2E_SPECS" -lt "$E2E_SPECS_MIN" ]; then
            echo "::error::Frontend E2E spec count ($E2E_SPECS) is below minimum threshold ($E2E_SPECS_MIN). Tests may have been accidentally deleted."
            exit 1
          fi

          echo "Frontend test count verification passed!"

      - name: Create Linear issue on failure
        if: vars.LINEAR_ENABLED == 'true' && (failure())
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          TITLE="[CI] Test Count Verification failed on main"

          # Check for existing open issue with same title
          EXISTING=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d '{
              "query": "query SearchIssues($filter: IssueFilter) { issues(filter: $filter) { nodes { id identifier } } }",
              "variables": {
                "filter": {
                  "team": { "key": { "eq": "NEM" } },
                  "title": { "eq": "'"$TITLE"'" },
                  "state": { "type": { "nin": ["completed", "canceled"] } }
                }
              }
            }')

          EXISTING_ID=$(echo "$EXISTING" | jq -r '.data.issues.nodes[0].id // empty')

          if [ -n "$EXISTING_ID" ]; then
            # Add comment to existing issue
            COMMENT="**Another failure detected**\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateComment($input: CommentCreateInput!) { commentCreate(input: $input) { success } }",
                "variables": {
                  "input": {
                    "issueId": "'"$EXISTING_ID"'",
                    "body": "'"$COMMENT"'"
                  }
                }
              }'
            echo "Added comment to existing issue"
          else
            # Create new issue
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateIssue($input: IssueCreateInput!) { issueCreate(input: $input) { success issue { identifier url } } }",
                "variables": {
                  "input": {
                    "teamId": "998946a2-aa75-491b-a39d-189660131392",
                    "title": "'"$TITLE"'",
                    "description": "Test count verification failed after merge to main - tests may have been accidentally deleted.\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease investigate and restore any missing tests.",
                    "priority": 2
                  }
                }
              }'
            echo "Created new issue"
          fi

  # Security Scanning Jobs (Matrix Strategy for Parallelization)
  # WP0.3: the duplicate `trivy-scan` matrix job was REMOVED here. Two Trivy
  # pipelines scanned overlapping targets on every push/PR; the standalone
  # .github/workflows/trivy.yml survives as the single Trivy home — it is a
  # strict superset (fs scan of '.' with .trivyignore, config scan of '.'
  # covering both Dockerfiles + all IaC, image scans, SARIF upload, SBOM,
  # and .trivyignore expiry checks). Surface-equivalence proof and rationale:
  # ledger 2026-09-12-context-map-doc-updates.md, WP0.3 row.

  # OB.2: this job's `npm Audit (Frontend)` leg moved to
  # .github/workflows/dependency-audit.yml (the one dependency-audit
  # workflow) and returns here as security-dependency-audit below —
  # WP1.2's call-job wiring, so ci-gate still carries the verdict.
  security-tests:
    name: Security Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/security_test # pragma: allowlist secret
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/security_test # pragma: allowlist secret
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      LOG_DB_ENABLED: 'false'
      ENVIRONMENT: development # Avoid production password validation in CI
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run security tests
        run: |
          uv run pytest backend/tests/security/ \
            -n0 \
            --timeout=30 \
            -v \
            --tb=short

      # NEM-4459: Explicit admin endpoint security validation
      # This validates that admin endpoints return 403 when DEBUG=false
      # Critical security check to prevent admin exposure in production
      - name: Validate admin endpoint protection (DEBUG=false)
        env:
          DEBUG: 'false'
          ADMIN_ENABLED: 'false'
          ENVIRONMENT: 'production'
        run: |
          echo "Validating admin endpoints are blocked in production mode..."
          uv run pytest backend/tests/security/test_admin_access_control.py \
            -n0 \
            --timeout=30 \
            -v \
            --tb=short \
            -k "production or blocked"

  # Version Consistency - every runtime-version declaration must agree with
  # .nvmrc / .python-version (kills the "label said 3.11, uv ran 3.14" class)
  version-consistency:
    name: Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check versions against source of truth
        run: ./scripts/check-version-consistency.sh

  # WP1.2: the three security workflows, formerly standalone advisory push/PR
  # workflows (10 jobs, ZERO of them reachable from ci-gate — a green CI Gate
  # was compatible with a leaked credential, new Bandit/Semgrep findings, and
  # new CVEs). Called here so their aggregate verdicts land in ci-gate via a
  # direct need + check_job line — the only wiring the WP0.6 invariant
  # accepts. A `uses:` job's conclusion IS the reusable workflow's aggregate:
  # one inner-job red reddens the call job. Deliberately NO needs and NO path
  # filter: a secret scan that "wasn't needed for this diff" is the exact
  # invisibility class this WP kills. Permissions are set HERE, not in the
  # reusable files — a called workflow's top-level `permissions:` is ignored;
  # the caller's job-level block governs the token its inner jobs get.
  # secrets: inherit carries LINEAR_API_KEY (the workflows file their own
  # failure-issue steps). Concurrency: their standalone triggers are deleted
  # so nothing else fires these workflows and races the parent in the shared
  # `github.ref` group — a `cancelled` call job would be a FALSE gate red.
  # Trivy's heavy image-scan jobs keep their push||dispatch condition INSIDE
  # trivy.yml (event_name flows through from the caller): PRs get
  # fs/config/CVE-expiry, main pushes also get SBOM + both image scans.
  security-gitleaks:
    name: Security - Secret Detection
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit # pragma: allowlist secret
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    uses: ./.github/workflows/gitleaks.yml

  security-sast:
    name: Security - SAST
    permissions:
      contents: read
    secrets: inherit # pragma: allowlist secret
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    uses: ./.github/workflows/sast.yml

  security-trivy:
    name: Security - Trivy
    permissions:
      contents: read
      security-events: write
    secrets: inherit # pragma: allowlist secret
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    uses: ./.github/workflows/trivy.yml

  # OB.2: dependency audit joins the WP1.2 call set (four workflows now).
  # This call job REPLACES ci.yml's own npm-audit job — the check moved into
  # .github/workflows/dependency-audit.yml so pip-audit and npm audit each
  # execute in exactly one file. The job id keeps the security-* prefix
  # because scripts/test_ci_job_graph.py's WP0.6 invariant reads it by class:
  # direct need + check_job line below, and a `uses:` job's conclusion IS the
  # reusable's aggregate (one inner-job red reddens this job).
  security-dependency-audit:
    name: Security - Dependency Audit
    permissions:
      contents: read
    secrets: inherit # pragma: allowlist secret
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    # [r291] UR-122: the call SELECTS the gate mode. A called workflow
    # inherits the caller's event, so the mode must travel as an input -
    # this call arrives there as event_name=push on PR merges, identical
    # to dependency-audit.yml's own main-only full-lockfile push leg.
    with:
      audit-mode: gate
    uses: ./.github/workflows/dependency-audit.yml

  # Ruling 105: the fake-stack feature check joins the graph as a job here and
  # ci-gate needs it — a red golden path (F2.3's proof that a feature works)
  # could not block a merge while it lived in a separate workflow the gate did
  # not read. This job is that workflow's `fake` job, step for step, plus
  # setup-uv (ruling 105's first bullet: the harness's BACKEND_GOLDEN stage
  # runs `uv run pytest`, and the old runner had no uv — FileNotFoundError
  # since main first carried backend/tests/golden/**). The standalone workflow
  # retired so it does not run twice; scripts/retired_paths.txt records it.
  # workflow_dispatch stays reachable (ruling 105 bullet 4): dispatching THIS
  # workflow runs the feature check regardless of the change filter.
  #
  # [r264] Build: `Feature check (fake AI)` becomes N=4 shard jobs (one stack
  # each; N=4 picked from measured runs 39190299978/39193472495/39202004102,
  # tables on PR #7264: the slowest 4/4 shard's harness finished in 18.3 min,
  # under the package's ~20-minute bar) and one fan-in job. The shards run
  # Playwright's own --shard selector and do NOT run the inventory witness;
  # `feature-check-fan-in` merges their playwright_specs (plus shard 1's
  # backend_specs — the backend golden tests run once, in one shard, feature_check.py
  # records "skipped on shard i/N" on the rest) into ONE fake-mode summary and
  # runs the witness once over it, so a row is judged on the union exactly as
  # the single run judged it today. The measure workflow that picked this
  # shape retired when this landed (scripts/retired_paths.txt records it).
  feature-check-shards:
    name: Feature check (fake AI)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # matrix.pair is slash-free ("i-of-N"): artifact names reject the
        # slash the --shard flag's value carries (upload-artifact rejects `/`
        # outright). The fan-in matches this name's shape, not the record's
        # `shard` field, so the rename stays local to the workflow.
        pair: ['1-of-4', '2-of-4', '3-of-4', '4-of-4']
    # ruling 189, re-measured for the sharded shape (run 39202004102, #7264):
    # each shard's harness clock (setup included) topped at 1097 s; worst setup
    # 320 s and worst teardown 31 s stand inside the single job's old budget,
    # so the budget is NOT raised by hand and the margin pin moves to the
    # sharded shape with the re-measured numbers.
    # ops-b's review reads this job as shared, where UR-121 would otherwise bar a changed flag;
    # UR-122 licenses the edit because ruling 189 orders it.
    timeout-minutes: 64
    needs: detect-changes
    # O2.2's filter, expressed through detect-changes: a change that touches
    # only Markdown cannot break a golden path, so `feature` (below) is the
    # old workflow's paths-ignore: '**.md' turned into a named set — everything
    # the run executes: the harness, the backend, the frontend, the compose
    # files that define the stack, and the uv-pinned env.
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      github.event_name == 'workflow_dispatch' ||
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.feature == 'true')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ruling 105's setup-uv: the harness payload feature_check.py's golden()
      # opens the BACKEND_GOLDEN guard whenever backend/tests/golden/**/test_*.py
      # exist (since #6979) and invokes uv for the pytest leg. It runs only via
      # the shell wrapper (O2.3's entries rule: wrappers are not followed, so
      # the path is deliberately un-prefixed here). Same canonical invocation as
      # every other backend job (version from the env block). Every shard gets
      # uv: shard 1 is the one whose backend leg the fan-in merges. Shards 2–4
      # never invoke uv (the backend golden leg runs once, in shard 1), so
      # UV_CACHE_DIR never materializes on them and the action's post step —
      # with its default ignore-nothing-to-cache: false — errors "Cache path
      # ... does not exist on disk" whenever the pre-restore finds nothing
      # (measured on run 39209710736: shards 2, 3 and 4 all failed in Post Set
      # up uv while every test leg stayed green; shard 1 succeeded because its
      # `uv run pytest` leg populates the cache dir). The input exists for
      # exactly this shape: nothing to save, so skip the save.
      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          ignore-nothing-to-cache: true

      - name: Free disk space (minimal)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      # A builder of its own for the two image builds (it reads the GHA cache
      # that ci.yml's build jobs write); `use: false` leaves the default
      # builder in place, which sees the loaded images, so compose can build
      # the fake AI image FROM this commit's backend.
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false

      - name: Image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # The names docker-compose.ci.yml pulls; built here, never pushed.
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./backend/Dockerfile
          target: prod
          tags: ghcr.io/mikesvoboda/nemotron-v3-home-security-intelligence/backend:${{ env.TAG }}
          cache-from: type=gha,scope=backend
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./frontend
          file: ./frontend/Dockerfile
          target: prod
          tags: ghcr.io/mikesvoboda/nemotron-v3-home-security-intelligence/frontend:${{ env.TAG }}
          cache-from: type=gha,scope=frontend
          load: true

      # F2.1: the harness's golden() stage runs `npx playwright test
      # --project=golden` from frontend/ against the live stack, so the job
      # needs the same Node + Chromium provisioning the other Playwright
      # workflows use (visual-tests.yml). Deliberately after the image builds:
      # node_modules and the browser live on the runner disk, and O2.2's MEASURE
      # (a 5m33s job) freed disk before building — this way the browser never
      # competes with the backend build for the space that step reclaims.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd frontend && npx playwright install-deps chromium

      - name: Feature check (--fake --shard)
        id: harness
        env:
          FEATURE_CHECK_ROOT: ${{ runner.temp }}/feature-check
          SHARD_PAIR: ${{ matrix.pair }}
          # [r282] Opt into the manifest split: the harness reads the
          # checked-in frontend/golden-shards.json, hands this shard its own
          # file list to the leg as FEATURE_CHECK_GOLDEN_FILES, and the
          # golden project's testIgnore ignores every spec outside it. The
          # manifest's shard_count must equal this matrix's N or the run
          # fails closed at the leg (matrix/manifest drift is caught at the
          # leg, named in the error). Without this opt-in [r264]'s
          # count-based --shard applies unchanged.
          FEATURE_CHECK_SHARD_MANIFEST: '1'
        run: |
          # split "i-of-N" into --shard I/N; Actions has no arithmetic, so the
          # pair arrives as one slash-free string from the matrix (artifact
          # names reject the slash the flag form carries). Each shard runs its
          # OWN stack (compose up, seed, backend golden pytest on shard 1
          # only — feature_check.py records "skipped on shard i/N" on the
          # others — and the sharded golden Playwright run). [r282] The
          # manifest selects the shard's files; --shard still names the cell
          # for the record and the artifact label, and the backend leg stays
          # on shard 1 ([r264]'s rule, the manifest is packed around it).
          I="${SHARD_PAIR%%-of-*}"
          N="${SHARD_PAIR##*-of-}"
          scripts/feature-check.sh --fake --shard "$I/$N" --image-tag "$TAG"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feature-check-shard-${{ matrix.pair }}
          # Only each run's artifacts/: the run directory also holds the
          # throwaway admin's password (admin.json) and the camera folders.
          path: ${{ runner.temp }}/feature-check/*/artifacts
          retention-days: 14
          if-no-files-found: warn

  # [r264] The fan-in. `if: always()` is DELIBERATE and is the package's third
  # bullet: the gate counts a skipped job as passed, so a fan-in skipped after
  # a red shard would leave the gate green. It fails when any shard failed or
  # was cancelled — its merge step reads needs.feature-check-shards.result
  # (the matrix aggregate: failure when ANY shard failed or was cancelled)
  # and exits on anything but success, which is also the edge the WP0.6
  # graph walker follows to reach the shards — or when a leg of the
  # reference set (`playwright test --list --project=golden` at this head plus
  # the backend golden tests) is missing from the shards' union. It then
  # merges the shards' legs into ONE fake-mode summary and runs the witness
  # once over it, so every row is judged on the union exactly as the single
  # job judged it. The witness step runs whenever the fan-in runs, red or
  # green merge: a missing leg is itself a witness failure.
  feature-check-fan-in:
    name: Feature check (fake AI) — fan-in
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: feature-check-shards
    # The guard mirrors the shard jobs': a draft or a docs-only change skips
    # the shards, and a fan-in that ran over their absence would red every run
    # the shards themselves are excused from (the skip is the shape the gate's
    # check_job already forgives, same as the single job before this change).
    # `always()` keeps the fan-in RUNNING on a red or cancelled shard so its
    # own merge step can fail with the reason, rather than skipping into the
    # gate's forgiveness. The guard sits LEFT of the top-level && (the shape
    # test_workflow_draft_guards.py pins: guard-AND-condition); always()'
    # effect (no implicit success() gate) is position-independent.
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && always()
      && (
      github.event_name == 'workflow_dispatch' ||
      needs.feature-check-shards.result != 'skipped'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # The reference leg set (the Build box): `playwright test --list
      # --project=golden` at this head. The --list collector needs the env the
      # harness exports (measured in this repo's tree: the four REQUIRED urls
      # and credentials construct the harness, the cameras map the harness
      # reads, the scenario book and root for the images readDropHarness
      # checks) — and a cameras.json, because the fake stack writes one at
      # runtime and this job runs no stack. The values are dummies never sent
      # anywhere; only their names are load-bearing (the harness's own
      # fixture comments state the same rule). Without them the lister emits
      # "Total: 0 tests" (readTimelineHarness throws at collection time), and
      # the derivation below fails on an empty set, fail-closed.
      - name: Derive the reference leg set (--list)
        id: reference
        env:
          FEATURE_CHECK_UI_URL: http://127.0.0.1:8080
          FEATURE_CHECK_API_URL: http://127.0.0.1:8081
          FEATURE_CHECK_ADMIN_USERNAME: reference-derivation
          FEATURE_CHECK_ADMIN_PASSWORD: reference-derivation # pragma: allowlist secret
          FEATURE_CHECK_CAMERAS: ${{ runner.temp }}/reference-cameras.json
          FEATURE_CHECK_CAMERA_ROOT: ${{ runner.temp }}/reference-cameras
          # Absolute, not repo-relative: the step runs `npx playwright` from
          # frontend/ (the --list must resolve the specs' own imports), and the
          # specs read this path with existsSync against their cwd — a
          # repo-relative value dies as frontend/backend/... and every
          # scenario-book spec SKIPs... except event-detail-modal, whose
          # module-scope constants dereference the harness past its own
          # test.skip guard and crash collection instead. Measured: the
          # relative value reddened run 39209710736's fan-in on exactly this
          # ("Cannot read properties of undefined (reading 'verdict')",
          # event-detail-modal.spec.ts:377); the absolute value derives the
          # 245-leg reference set. The real leg never sees the relative form —
          # feature_check.py:2349 exports an absolute path — so this mirrors
          # the proven container shape instead of inventing a new one.
          FEATURE_CHECK_SCENARIOS: ${{ github.workspace }}/backend/ai_contract/fake/scenario_fixtures/scenarios.json
        run: |
          # The cameras map the golden specs read (one camera id per scenario
          # name); the ids are well-formed UUIDs standing in for the ones the
          # seeded stack's cameras.json carries, never real devices.
          python3 - <<'PYEOF'
          import json, os
          from pathlib import Path
          book = json.loads(Path("backend/ai_contract/fake/scenario_fixtures/scenarios.json").read_text())
          names = [s["name"] for s in book["scenarios"]]
          out = {name: f"00000000-0000-0000-0000-{i:012d}" for i, name in enumerate(names)}
          Path(os.environ["FEATURE_CHECK_CAMERAS"]).write_text(json.dumps(out))
          print(f"reference cameras: {len(out)}")
          PYEOF
          cd frontend
          npx playwright test --list --project=golden --reporter=json > "${RUNNER_TEMP}/golden-list.json" 2> "${RUNNER_TEMP}/golden-list.err" || true
          cd ..
          # Fail closed on an empty reference: a listing that collected
          # nothing derives nothing, and an empty set would pass any
          # "missing leg" check vacuously.
          python3 - "${RUNNER_TEMP}/golden-list.json" <<'PYEOF'
          import json, os, sys
          from pathlib import Path

          def suite_keys(suites, prefix, keys):
              for s in suites:
                  t = s.get("title")
                  seg = [] if (t and t == s.get("file")) else ([t] if t else [])
                  chain = prefix + seg
                  for sp in s.get("specs") or []:
                      keys.append(f"{s.get('file')}::{' › '.join(chain + [sp['title']])}")
                  suite_keys(s.get("suites") or [], chain, keys)

          data = json.loads(Path(sys.argv[1]).read_text())
          keys: list[str] = []
          suite_keys(data.get("suites") or [], [], keys)
          if not keys:
              print(f"FATAL: --list derived 0 golden tests (stats: {data.get('stats')}, "
                    f"errors: {data.get('errors')}) — an empty reference set would "
                    "pass the union check vacuously", file=sys.stderr)
              sys.exit(1)
          Path(os.environ["RUNNER_TEMP"]).joinpath("reference-keys.txt").write_text(
              "\n".join(sorted(keys)) + "\n"
          )
          print(f"reference leg set: {len(keys)} golden playwright legs")
          PYEOF

      - name: Download shard artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: feature-check-shard-*
          path: runs/
          merge-multiple: false

      # The merge, the reference check, and the witness, one step, so the
      # witness reads the summary the merge just wrote (a second step would
      # need to re-derive the run-dir path). Exits non-zero on: the shards'
      # aggregate result being anything but success (checked first, above),
      # a missing shard summary (a failed or cancelled shard uploads nothing
      # usable), a shard label outside 1/4..4/4, a duplicate shard, one leg
      # running on two shards (any outcome — the split must partition), a leg
      # of the union that is not in the reference set, a reference leg missing
      # from the union, or the witness's own exits (1: a row claims more than
      # the run shows; 2: unreadable input — fail closed).
      - name: Merge shards and run the inventory witness
        env:
          FEATURE_CHECK_ROOT: ${{ runner.temp }}/feature-check
        run: |
          # The shards' verdict, read here and not only through the job's own
          # `if:` — this is the edge that carries a shard's red to the fan-in's
          # own conclusion (and the edge scripts/test_ci_job_graph.py's walker
          # follows). The matrix aggregate: failure when ANY shard failed or
          # was cancelled, success only when all four succeeded — the package's
          # "fails if any shard failed or was cancelled".
          echo "shards verdict: ${{ needs.feature-check-shards.result }}"
          if [ "${{ needs.feature-check-shards.result }}" != "success" ]; then
            echo "FATAL: feature-check-shards concluded ${{ needs.feature-check-shards.result }}; " \
                 "the union cannot be built from a failed or cancelled shard" >&2
            exit 1
          fi
          python3 - "${RUNNER_TEMP}" <<'PYEOF'
          import json, os, sys
          from pathlib import Path

          temp = Path(sys.argv[1])
          runs = Path("runs")
          found = sorted(runs.glob("feature-check-shard-*/**/artifacts/summary.json"))
          want = {f"{i}/4" for i in range(1, 5)}
          summaries = {}
          for path in found:
              s = json.loads(path.read_text())
              label = s.get("shard")
              if label not in want:
                  print(f"FATAL: {path}: shard label {label!r} is not one of "
                        f"{sorted(want)}", file=sys.stderr)
                  sys.exit(1)
              if label in summaries:
                  print(f"FATAL: shard {label} appears twice ({summaries[label][0]} "
                        f"and {path})", file=sys.stderr)
                  sys.exit(1)
              summaries[label] = (path, s)
          missing = sorted(want - set(summaries))
          if missing:
              print(f"FATAL: no summary.json for shard(s) {' '.join(missing)} — the "
                    "shard job failed, was cancelled, or uploaded nothing (fail "
                    "closed: the union would be missing its legs)", file=sys.stderr)
              sys.exit(1)

          pw_union: dict[str, str] = {}
          backend_specs: dict[str, str] = {}
          for label in sorted(summaries, key=lambda x: int(x.split("/")[0])):
              path, s = summaries[label]
              golden = s.get("results", {}).get("golden", {})
              specs = golden.get("playwright_specs") or {}
              for key, outcome in specs.items():
                  if key in pw_union:
                      # A leg present on two shards fails regardless of outcome
                      # (owner answer 6266229360, Q2): a correct split never puts
                      # one leg on two shards, same outcome or not.
                      print(f"FATAL: leg {key!r} ran on two shards "
                            f"({pw_union[key]} on the earlier shard vs {outcome} "
                            f"on shard {label}) — the shard split no longer "
                            "partitions the suite", file=sys.stderr)
                      sys.exit(1)
                  pw_union[key] = outcome
              if label == "1/4":
                  backend_specs = dict(golden.get("backend_specs") or {})

          reference = set(temp.joinpath("reference-keys.txt").read_text().splitlines())
          # Set equality both ways (owner answer 6266229360, Q2): the union must
          # have exactly the reference set's legs — no reference leg missing,
          # and no leg the shards ran that the reference set does not name.
          missing_legs = sorted(reference - set(pw_union))
          if missing_legs:
              print(f"FATAL: {len(missing_legs)} golden leg(s) of the reference set "
                    f"are missing from the shards' union ({len(pw_union)} legs ran, "
                    f"{len(reference)} referenced): {missing_legs[:8]}"
                    + (" ..." if len(missing_legs) > 8 else ""), file=sys.stderr)
              sys.exit(1)
          extra_legs = sorted(set(pw_union) - reference)
          if extra_legs:
              print(f"FATAL: {len(extra_legs)} leg(s) ran on the shards but are "
                    f"not in the reference set ({len(pw_union)} legs ran, "
                    f"{len(reference)} referenced): {extra_legs[:8]}"
                    + (" ..." if len(extra_legs) > 8 else ""), file=sys.stderr)
              sys.exit(1)

          # One merged fake-mode summary, laid out the way find_summary()
          # requires: <run-root>/<run-dir>/artifacts/summary.json. project
          # and commit feed the witness's run label ("hsi-check-merged at
          # <sha9>"). The union's legs keep each shard's recorded outcomes —
          # a failed leg in any shard fails the row here, exactly as it did
          # in the single job.
          out_dir = Path(os.environ["FEATURE_CHECK_ROOT"]) / "hsi-check-merged" / "artifacts"
          out_dir.mkdir(parents=True)
          merged = {
              "date": max(s.get("date", "") for _, s in summaries.values()),
              "mode": "fake",
              "project": "hsi-check-merged",
              "commit": "${{ github.sha }}",
              "results": {
                  "golden": {
                      "playwright": "ok",
                      "playwright_specs": pw_union,
                      "backend": "ok" if backend_specs else "no specs yet",
                      "backend_specs": backend_specs,
                  }
              },
          }
          (out_dir / "summary.json").write_text(json.dumps(merged, indent=1))
          print(f"merged: {len(pw_union)} playwright legs + {len(backend_specs)} backend "
                f"legs == the reference set ({len(reference)} legs)")
          PYEOF
          python3 -m scripts.uplevel.inventory_witness --run-root "$FEATURE_CHECK_ROOT"

      - name: Upload merged artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feature-check-fan-in
          # the merged run the witness just judged (only its artifacts/: the
          # merged run directory holds no secrets — no admin.json, no cameras)
          path: ${{ runner.temp }}/feature-check/*/artifacts
          retention-days: 14
          if-no-files-found: warn
  # DOCS-NJT: the negative-tooling-claim gate as ITS OWN job, per the hot-file
  # rule UR-121 (rules.md, cited by rule id, never by line: that file renumbers
  # with every ruling, so a line cite drifts while still looking plausible. A
  # new check on ci.yml is its own job or its own workflow file, never an edit
  # to a shared one).
  # It ran here as a path appended to collection-sanity's battery line; that was
  # the shape the rule forbids. It was also the only entry that did not have its
  # own line, and that doubling lived in THIS branch, not in main: at `da350bd4c`
  # the battery is 38 argv / 32 `.py` paths with `test_r2_python_dead_list.py
  # scripts/test_negative_tooling_claims.py` sharing one line. Everywhere else a
  # per-line count finds exactly one path per line — measured 31 at `4a83b61a1`
  # and `9bc51ece0`, 32 at `2079e4a21` (MAIN's own addition), 31 at this head
  # (mine moved out to the job below). A bare "at origin/main" version of this
  # sentence went stale in review, so each figure names the SHA it was read at.
  # If you re-verify a per-line count, use a DIGIT-INCLUSIVE class: `[a-z_]`
  # skips `test_r2_python_dead_list.py` and manufactures a contradiction that is
  # your regex, not the file. (Cited by structure, not by line range: a `ci.yml:N`
  # cite drifts the moment anyone inserts a line above it — and so does any count
  # quoted against a ref-name.)
  # Why the JOB lives here, not in its own workflow file: `needs:` is file-local,
  # so ci-gate can only need a job declared in this file, and branch protection
  # requires exactly one context, `CI Gate (Required Checks)` (read live from
  # /branches/main/protection). A second workflow file would have to make its OWN
  # check name required to gate anything — which is the shape WP1.2 removed. Note
  # this is about the job's DECLARATION site, not its body: six jobs here already
  # delegate their work to a reusable file with job-level
  # `uses: ./.github/workflows/x.yml` and are still gated — the four security-*
  # (gitleaks/sast/trivy/dependency-audit) are DIRECT ci-gate needs, the two
  # integration-shard callers reach it transitively through
  # integration-coverage-merge / integration-tests-summary. Gating follows the
  # need+result-read edge, not the file the body sits in. This suite needs no
  # reuse, so it takes the plain job here, where a direct need is one line.
  # Placed last in the job block but BEFORE ci-gate, which stays the file's
  # final job. Deliberately no `ci.yml:N` cite anywhere in this block: this
  # package's own gate class is stale line numbers, and a comment citing its own
  # line number is the one cite GUARANTEED to drift — any insert above it moves
  # it. Cite the job name (`docs-negative-claims`), which cannot drift. The
  # cite-neutrality argument lives in the PR instead (measured there: no document
  # cites a ci.yml line above 3676 at origin/main, so a job placed here re-anchors
  # nothing).
  # The step mirrors collection-sanity's battery INVOCATION (same `uv run python
  # -m pytest … -q` shape, same project env) — because this suite's
  # @pytest.mark.timeout needs the project's pytest-timeout, and because this
  # is the recipe that actually runs, not one I guessed. It does NOT mirror the
  # timeout. `uv run` syncs the project env on first use and setup-uv caches
  # nothing unless `enable-cache: true` is passed (neither job passes it), so the
  # job's floor is that sync, not the suite's measured 3.4 s — and 5 was the
  # repo's cheap-job timeout, chosen for a job whose whole cost is one suite.
  # collection-sanity gets 15 for the same sync plus 31 suites; 10 is sync plus
  # one with room for a slow runner.
  docs-negative-claims:
    name: Negative Tooling Claims in Docs (DOCS-NJT)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
      - name: Every "no CI runs X" in docs/ must be true
        run: >-
          uv run python -m pytest scripts/test_negative_tooling_claims.py
          -q

  # [r149e]: type-check the golden specs — ITS OWN job, per the hot-file rule
  # UR-121 (rules.md, cited by rule id, never by line: that file renumbers with
  # every ruling). UR-121 allows exactly one shape of edit to a shared job in
  # this file — one appended entry to a list a step already reads — and there is
  # no such list to append to here: `npm run typecheck` is a `run:` command
  # (this file's only occurrence), not an item in a list, so a `tsc -p` step
  # added to frontend-typecheck would be a new step, which is what the rule
  # sends to its own job. docs-negative-claims above is the in-repo precedent
  # for exactly this move, and the wiring below (direct need + check_job line)
  # is the only shape scripts/test_ci_job_graph.py's WP0.6 invariant accepts for
  # a red-able job: bare `needs:` membership is ORDERING, not gating.
  #
  # WHY THIS JOB EXISTS AT ALL. ci.yml's Frontend Type Check runs
  # `cd frontend && npm run typecheck` = `tsc --noEmit`, and frontend/tsconfig.json
  # declares `"include": ["src"]`. Everything under frontend/tests/golden/ was
  # therefore opened by CI's Feature check job and by nothing that ever
  # type-checked it: ~15 spec files, executed on every PR that touches the
  # feature tier, were never parsed by the compiler that would have caught a
  # wrong event name, a stray unused import, or a cast that checks nothing. The
  # first run of frontend/tsconfig.golden.json over that tree found 9 real
  # errors (the package's own count, reproduced exactly), so the gap was not
  # theoretical. The 9 are fixed in this PR; see the PR body for what each one
  # was silently doing.
  #
  # WHY `npx tsc -p` AND NOT A NEW npm SCRIPT. Adding `typecheck:golden` to
  # frontend/package.json is a second change to a file this package does not
  # name, and the package's CI clause says `tsc --noEmit` — which is the
  # command, not the script name. One line here keeps the diff to the two files
  # the package asks for (the config and this job).
  #
  # WHY THE SAME FILTER AS ITS SIBLING. The checked tree is frontend/tests/golden/,
  # so `frontend` is the right path filter, and should-run-all covers main pushes
  # and workflow edits — a spec that drifts past the compiler on a docs-only PR
  # is not possible (the tree is only reachable through `frontend`). Same guard,
  # same shape as frontend-typecheck: the draft clause must stay the LEFT operand
  # of the top-level &&, because GitHub's expressions bind && tighter than ||,
  # and a guard appended after a || gates only the last disjunct (pinned by
  # scripts/test_workflow_draft_guards.py).
  #
  # timeout-minutes: 10, the same figure as frontend-typecheck, which runs the
  # same `npm ci` against the same lockfile. The step itself is not the cost:
  # `time -p npx tsc -p tsconfig.golden.json --noEmit` on the current tree,
  # three consecutive warm runs in frontend/, real = 2.96 / 2.95 / 3.02 s. So
  # the job is install-bound like its sibling and inherits its headroom rather
  # than a number guessed here.
  frontend-golden-typecheck:
    name: Golden Spec Type Check (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      needs.detect-changes.outputs.should-run-all == 'true' ||
      needs.detect-changes.outputs.frontend == 'true'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript check (golden specs)
        # -p is the whole contract: it resolves tsconfig.golden.json from the
        # CWD (frontend/), which inherits tsconfig.json's compilerOptions and
        # REPLACES its `include` with the golden subtree. `--noEmit` is restated
        # on the command line so the step says out loud what the package asked
        # for, even though the config already sets it.
        run: cd frontend && npx tsc -p tsconfig.golden.json --noEmit

  # Ruling 127 / 187: the seeded golden project (DEBUG=true, request recorder,
  # breaker/threshold fault seed, orphan file fixture) runs in its own CI job
  # so it does not lengthen Feature check (fake AI) (ruling 187 item 3).
  feature-check-seeded:
    name: Feature check (seeded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: detect-changes
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      github.event_name == 'workflow_dispatch' ||
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.feature == 'true')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space (minimal)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false

      - name: Image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./backend/Dockerfile
          target: prod
          tags: ghcr.io/mikesvoboda/nemotron-v3-home-security-intelligence/backend:${{ env.TAG }}
          cache-from: type=gha,scope=backend
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./frontend
          file: ./frontend/Dockerfile
          target: prod
          tags: ghcr.io/mikesvoboda/nemotron-v3-home-security-intelligence/frontend:${{ env.TAG }}
          cache-from: type=gha,scope=frontend
          load: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Feature check (--fake --seeded)
        id: harness
        env:
          FEATURE_CHECK_ROOT: ${{ runner.temp }}/feature-check-seeded
        run: scripts/feature-check.sh --fake --seeded --image-tag "$TAG"

      # Ruling 218: the same inventory witness as Feature check (fake AI), over this job's legs.
      - name: Inventory witness (ruling 218)
        if: ${{ !cancelled() && steps.harness.outcome != 'skipped' }}
        env:
          FEATURE_CHECK_ROOT: ${{ runner.temp }}/feature-check-seeded
        run: python3 -m scripts.uplevel.inventory_witness --run-root "$FEATURE_CHECK_ROOT"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feature-check-seeded
          path: ${{ runner.temp }}/feature-check-seeded/*/artifacts
          retention-days: 14
          if-no-files-found: warn

  # O3.4 (ruling 257, ruling 289): Python (O2.3) + frontend Knip (F3.2)
  # reachability gates in their own job per UR-121, wired into ci-gate (UR-119,
  # WP0.6). Invoked by module name (`python -m scripts.reachability_gate`) so
  # `test_reachability.py`'s workflow script-path scan does not force a
  # walk-neutral change to `entry_points.toml` and `r2-python-dead-list` stamp.
  reachability-gates:
    name: Reachability Gates (O3.4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Check Python and frontend reachability (O3.4)
        run: uv run --no-project --python "${{ env.PYTHON_VERSION }}" python -m scripts.reachability_gate

  # CI Gate - Aggregates all required checks for branch protection
  # This job provides a single status check that depends on all required jobs.
  # WP0.6 invariant (scripts/test_ci_job_graph.py enforces it): a job either
  # converges here, or it cannot go red on PR/push, or its red is triaged at
  # runtime (Linear step / schedule-only), or it is coverage plumbing.
  # Use this as the required check in branch protection to simplify configuration.
  # Non-blocking workflows can use workflow_run trigger on CI completion.
  # Note: Jobs may be skipped based on changed files (detect-changes job)
  ci-gate:
    name: CI Gate (Required Checks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect-changes
      - lint
      - typecheck
      - unit-tests-summary
      - integration-tests-summary
      - frontend-lint
      - frontend-typecheck
      - frontend-golden-typecheck
      - frontend-tests-summary
      - frontend-e2e-summary
      - api-types-check
      - version-consistency
      # WP0.6: every job that can go red on a PR/push converges here. The
      # 2026-09-16 main baseline sat red on Dead Code / Test Performance Audit
      # / Trivy x2 while CI Gate reported SUCCESS — the WP0.2 invisibility
      # class, one layer up. Jobs gated here that only run on main
      # (contract-tests, dead-code, build-*) arrive as `skipped` on PRs,
      # which check_job treats as OK.
      - contract-tests
      - dead-code
      - security-tests
      - api-coverage
      - build-backend
      - build-frontend
      - test-performance-audit
      # WP0.6 follow-up (2026-09-17): both of these were reachable from ci-gate
      # only across `needs:` edges that nobody inspects, so their red could
      # never arrive here — the same conclusion-vs-verdict lie WP0.6 exists to
      # kill, one layer further down.
      #   collection-sanity runs the census, the ratchet, the expiry check and
      #     the anti-rot gate suites. Its dependents carry `if: !cancelled()` and
      #     read only their own shard results, so a red ratchet left CI Gate
      #     green and Phase 1 was advisory.
      #   build-backend-deps gates every backend job through
      #     `if: needs.build-backend-deps.result != 'failure'`, which SKIPS
      #     them on failure — and check_job forgives `skipped`. A broken
      #     `uv sync --frozen` passed the gate.
      # Direct need + a check_job line below is the only wiring that carries a
      # red to the verdict. Enforced by scripts/test_ci_job_graph.py.
      - collection-sanity
      - build-backend-deps
      # WP6.5: the ai/ tier job. Direct need + check_job below - the WP0.6
      # invariant (needs-but-never-inspects is the invisibility class).
      - ai-tests
      # (PR-C retired the AI YOLO26 image-smoke job: its need + check_job
      # line went with it - yolo26 is gated through ai-tests now.)
      # WP1.2: the three security workflows, gating for the first time. Each
      # call job's conclusion aggregates its reusable workflow's jobs; the
      # check_job lines below are what the WP0.6 graph test demands of a need.
      - security-gitleaks
      - security-sast
      - security-trivy
      # OB.2: the dependency-audit call job (replaces the old direct npm-audit
      # need — the check itself now executes in dependency-audit.yml).
      - security-dependency-audit
      # WP2.5 (AUDIT §2.1): the three coverage-merge jobs compute the R-1
      # absolute floors and `exit 1` on a breach — but sat OUTSIDE this
      # closure, so a floor-red merge reddened a job ci-gate never saw: floors
      # computed, published, and stopped nothing. They were exempted as
      # "plumbing" in scripts/test_ci_job_graph.py while carrying an
      # `exit 1` verdict path; the exemption was the bug, codified. Direct
      # need + check_job below is the WP0.6 invariant's only wiring that
      # carries a red. Safe on PRs that skip the merge jobs (detect-changes
      # gate): check_job forgives `skipped` — same semantics as every
      # main-only job above.
      - unit-tests-coverage-merge
      - integration-coverage-merge
      - frontend-coverage-merge
      # O1.12 (UR-37): the hooks run in the gate. Direct need + check_job line
      # below — the WP0.6 wiring. Runs unconditionally on every PR (hooks
      # self-select by files:/types:), so it is never `skipped` on PRs.
      - precommit-hooks
      # Ruling 105: the fake-stack feature check. Direct need + check_job
      # below — the WP0.6 wiring (needs-but-never-inspects is the invisibility
      # class). This is the change's whole point: `CI Gate (Required Checks)`
      # is the ONLY context branch protection requires, and until now a red
      # golden path — the check that answers "does the feature work" — could
      # not block a merge. Skipped (docs-only PR via the `feature` filter) is
      # forgiven by check_job, same semantics as every filtered job above.
      # [r264] The single fake job became 4 shard jobs + a fan-in (feature-check-shards,
      # feature-check-fan-in): the gate needs the FAN-IN in place of the single job (the
      # package's fifth bullet — the gate still requires exactly one fake-check edge), and
      # the fan-in's needs.feature-check-shards.result read (below) is what reaches the
      # four shards for the job-graph walker. The direct-needs count stays 33 —
      # this swap replaces one need with one, it does not add one — and the cap
      # scripts/test_check_gate_reachability.py pins still holds; the next edge is a
      # review, not a silent edit.
      - feature-check-fan-in
      - feature-check-seeded
      # DOCS-NJT: docs' negative-tooling-claim gate. Own job per the hot-file
      # rule UR-121 (rules.md, cited by rule id, never by line: that file
      # renumbers with every ruling) — direct need + check_job below, the only
      # wiring scripts/test_ci_job_graph.py's WP0.6 invariant accepts for a
      # red-able job.
      - docs-negative-claims
      # O3.4 (ruling 257): Python + Knip reachability gates. Own job per UR-121,
      # direct need + check_job below per WP0.6 / UR-119.
      - reachability-gates
    if: always()
    steps:
      - name: Check required job results
        run: |
          echo "## Required CI Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check each required job
          FAILED=false

          check_job() {
            local name="$1"
            local result="$2"
            if [ "$result" == "success" ] || [ "$result" == "skipped" ]; then
              echo "✅ $name: $result" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ $name: $result" >> $GITHUB_STEP_SUMMARY
              FAILED=true
            fi
          }

          check_job "Pre-commit Hooks (changed files)" "${{ needs.precommit-hooks.result }}"
          check_job "Backend Lint (Ruff)" "${{ needs.lint.result }}"
          check_job "Backend Type Check (Mypy)" "${{ needs.typecheck.result }}"
          check_job "Backend Unit Tests" "${{ needs.unit-tests-summary.result }}"
          check_job "Backend Integration Tests" "${{ needs.integration-tests-summary.result }}"
          check_job "Frontend Lint (ESLint)" "${{ needs.frontend-lint.result }}"
          check_job "Frontend Type Check (TypeScript)" "${{ needs.frontend-typecheck.result }}"
          check_job "Golden Spec Type Check (TypeScript)" "${{ needs.frontend-golden-typecheck.result }}"
          check_job "Frontend Tests (Vitest)" "${{ needs.frontend-tests-summary.result }}"
          check_job "E2E Tests (Chromium)" "${{ needs.frontend-e2e-summary.result }}"
          check_job "API Types Contract Check" "${{ needs.api-types-check.result }}"
          check_job "Version Consistency" "${{ needs.version-consistency.result }}"
          check_job "Contract Tests (API Schema)" "${{ needs.contract-tests.result }}"
          check_job "Dead Code Detection" "${{ needs.dead-code.result }}"
          check_job "Security Test Suite" "${{ needs.security-tests.result }}"
          check_job "API Endpoint Coverage" "${{ needs.api-coverage.result }}"
          # OB.2: the npm-audit check_job line moved down with the audit —
          # ci-gate now carries the reusable's aggregate verdict.
          check_job "Dependency Audit (pip-audit + npm)" "${{ needs.security-dependency-audit.result }}"
          check_job "Build Docker (backend)" "${{ needs.build-backend.result }}"
          check_job "Build Docker (frontend)" "${{ needs.build-frontend.result }}"
          check_job "Test Performance Audit" "${{ needs.test-performance-audit.result }}"
          check_job "Collection Sanity" "${{ needs.collection-sanity.result }}"
          check_job "Build Backend Dependencies" "${{ needs.build-backend-deps.result }}"
          check_job "AI Tier Tests" "${{ needs.ai-tests.result }}"
          # WP1.2: security converges here for the first time.
          check_job "Secret Detection (Gitleaks + TruffleHog)" "${{ needs.security-gitleaks.result }}"
          check_job "SAST (Bandit + Semgrep)" "${{ needs.security-sast.result }}"
          check_job "Trivy Security Scan" "${{ needs.security-trivy.result }}"
          # WP2.5: the coverage floors' verdicts converge here (see the
          # needs: comment — AUDIT §2.1; skipped == the tier didn't run).
          check_job "Backend Unit Coverage Floor" "${{ needs.unit-tests-coverage-merge.result }}"
          check_job "Backend Integration Coverage Floor" "${{ needs.integration-coverage-merge.result }}"
          check_job "Frontend Coverage Floors" "${{ needs.frontend-coverage-merge.result }}"
          # Ruling 105: the golden paths' verdict, first time inside the gate.
          # [r264]: the fan-in replaces the single fake job as the gate's edge.
          # Its name is what lane_tick's gate() renders (minus the GATE_CHECK
          # name). A dead shard reaches the gate as a FAN-IN failure — the
          # fan-in's merge step reads the shards' aggregate itself and exits
          # non-zero on anything but success — never as a read here: this run
          # body mentions only the fan-in's result, so the job-graph walker
          # sees exactly one fake-check edge out of the gate (no phantom
          # comment-swallowed read).
          check_job "Feature Check (Fake AI) — fan-in" "${{ needs.feature-check-fan-in.result }}"
          # Ruling 127 / 187: the seeded golden project's verdict.
          check_job "Feature check (seeded)" "${{ needs.feature-check-seeded.result }}"
          # DOCS-NJT: a docs claim that no CI runs a tool is a claim this gate
          # now disproves on every PR. Own need + own line (WP0.6 wiring).
          check_job "Negative Tooling Claims in Docs (DOCS-NJT)" "${{ needs.docs-negative-claims.result }}"
          # O3.4: Python (O2.3) + frontend Knip (F3.2, ruling 257) reachability gates.
          check_job "Reachability Gates (O3.4)" "${{ needs.reachability-gates.result }}"

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$FAILED" == "true" ]; then
            echo "**Status: ❌ FAILED** - One or more required checks failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "**Status: ✅ PASSED** - All required checks passed" >> $GITHUB_STEP_SUMMARY
          fi
