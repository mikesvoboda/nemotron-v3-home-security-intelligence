      LOG_DB_ENABLED: 'false'
      ENVIRONMENT: development # Avoid production password validation in CI
      CI: 'true'
      # WP5.1: non-hidden pytest-cov DATA file for the merge combine
      COVERAGE_FILE: coverage-integration-models-py${{ matrix.python-version }}.dat
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run Models integration tests
        # Model tests: test_models*.py, test_database*.py, test_baseline*.py, test_alert_*.py, test_enrichment*.py, test_cache*.py
        # WP3.4 (2026-09-21): the four terms appended below were NIGHTLY-ONLY
        # (no PR-CI `-k` matched them — census in the WP3.4 ledger entry): the
        # repositories/ suite (`repositories` is a path component of exactly
        # the 7 green-proved files there) plus the two models/ files, the
        # database/ isolation suite, and the two root files sharing their
        # stems (test_soft_delete.py, test_notification_preferences_api.py —
        # double-running those was checked by collect census, they were
        # previously selected nowhere). Same proof bar as the services shard.
        # -n0 runs tests serially to avoid database deadlocks from concurrent schema creation
        run: |
          set -euo pipefail
          RERUNS=""
          if [ -f .github/flake-allowlist.yml ]; then
            RERUNS=$(uv run --no-project python scripts/flake-k-filter.py 2>/dev/null || true)
          fi
          if [ -n "$RERUNS" ]; then
            echo "Rerunning registered flakes: $RERUNS"
            uv run pytest backend/tests/integration/ -k "$RERUNS" -n0 --timeout=30 \
              --reruns 2 --reruns-delay 5 || true
          fi
          uv run pytest backend/tests/integration/ \
            -k "test_models or test_model_cascades or test_database or test_baseline or test_alert_dedup or test_alert_engine or test_alert_models or test_cache_service_integration or repositories or test_soft_delete or test_notification_preferences or test_isolation_levels" \
            -n0 \
            --timeout=30 \
            --cov=backend \
            --cov-fail-under=0 \
            --cov-report=xml:coverage-integration-models.xml \
            --cov-report=term-missing \
            --junit-xml=test-results-integration-models.xml \
            --durations=20 \
            -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-integration-models-py${{ matrix.python-version }}
          path: test-results-integration-models.xml
          retention-days: 7

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # WP5.1: DATA file rides with the XML for the merge combine
          name: coverage-integration-models-py${{ matrix.python-version }}
          path: |
            coverage-integration-models.xml
            coverage-integration-models-py${{ matrix.python-version }}.dat
          retention-days: 7

  # Merge coverage from all integration test shards
  integration-coverage-merge:
    name: Merge Integration Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      [
        detect-changes,
        integration-tests-api,
        integration-tests-api-retry,
        integration-tests-websocket,
        integration-tests-services,
        integration-tests-models,
      ]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.backend == 'true')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # WP5.1: combine needs `coverage` installed — same setup as the unit
      # merge job above (mirrored, kept honest by test_github_workflows'
      # TestIntegrationCoverageMergeWiring, which asserts this job has these
      # steps before the combine step runs).
      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Download all coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-integration-*
          path: coverage-reports/
          merge-multiple: true

      - name: List coverage files
        run: find coverage-reports/ -name "*.xml" | head -20

      # WP5.1/A2: this merge was download -> find -> Codecov with NO combine
      # step, so the integration tier never produced a single real percentage.
      # It now combines the .dat data files into one measurement. WP2.2 made
      # it report line/branch/blended; WP2.3 (R-1) wires the ABSOLUTE floor at
      # the measured merged value 37 (percent=37.01, run 35486259345) — but
      # ONLY when every integration shard passed: a cancelled/failed shard
      # means partial .dat data and a floor verdict on it is a test failure
      # wearing a coverage costume (the WP2.3 class; api-retry rescues a
      # cancelled shard, and the retry path conservatively skips enforcement).
      # combine consumes its inputs; the XML copies stay for Codecov.
      - name: Combine integration coverage
        run: |
          if compgen -G "coverage-reports/*.dat" > /dev/null 2>&1; then
            uv run coverage combine --data-file=.coverage-integration coverage-reports/*.dat
            total="$(uv run coverage report --data-file=.coverage-integration \
              --format=total --fail-under=0)"
            # WP2.2: report the split, not just the blended --format=total
            # figure (measured: blended != line != branch under branch=true).
            # Same extraction-not-floor --fail-under=0 (extraction stays
            # extraction; the FLOOR block below is the enforcement point).
            uv run coverage json --data-file=.coverage-integration \
              -o coverage-integration-totals.json --fail-under=0
            line="$(jq -r '.totals.percent_statements_covered_display' coverage-integration-totals.json)"
            branch="$(jq -r '.totals.percent_branches_covered_display' coverage-integration-totals.json)"
            echo "Integration merged coverage: line ${line}% / branch ${branch}% / blended ${total}%" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "percent=${total}"
            # WP2.3 (R-1): absolute floor at the measured 37, gated on the
            # WHOLE tier having passed — all four shard jobs, not just the
            # API matrix: a cancelled WS/services/models shard would mean
            # partial .dat data, and a floor verdict on partial data is the
            # WP2.3 misattribution class. (integration-tests-api-retry is
            # deliberately absent: it only RUNS when api was cancelled, which
            # the api result check below already excludes from enforcement.)
            INTEG_RESULTS='${{ needs.integration-tests-api.result }} ${{ needs.integration-tests-websocket.result }} ${{ needs.integration-tests-services.result }} ${{ needs.integration-tests-models.result }}'
            for r in $INTEG_RESULTS; do
              if [ "$r" != 'success' ]; then
                echo "::warning::integration tier results [$INTEG_RESULTS] — absolute floor NOT enforced on partial data (a non-success shard's own red is the real verdict)"
                exit 0
              fi
            done
            if awk "BEGIN{exit !($total < 37)}"; then
              echo "::error::FLOOR FAIL (integration) merged coverage ${total}% < floor 37 (R-1 measured: percent=37.01 run 35486259345)"
              exit 1
            fi
            echo "FLOOR PASS (integration): ${total}% >= 37"
          else
            echo "::warning::no integration .dat data files found to combine"
          fi

      - name: Upload merged coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: coverage-reports/
          flags: backend-integration
          fail_ci_if_error: false

  # Summary job for branch protection - aggregates all integration test shards
  integration-tests-summary:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        detect-changes,
        lint,
        collection-sanity,
        integration-tests-api,
        integration-tests-api-retry,
        integration-tests-websocket,
        integration-tests-services,
        integration-tests-models,
      ]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && !cancelled() }}
    steps:
      - name: Check integration test results
        run: |
          # Skip check if tests were skipped due to no backend changes
          if [ "${{ needs.detect-changes.outputs.should-run-all }}" != "true" ] && \
             [ "${{ needs.detect-changes.outputs.backend }}" != "true" ]; then
            echo "Integration tests skipped - no backend changes detected"
            echo "## Backend Integration Tests" >> $GITHUB_STEP_SUMMARY
            echo "Skipped - no backend changes detected" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # CANCELLED IS NOT A VERDICT — it's the slow-runner class (WP0.5
          # ruling, 2026-09-18). The bug this replaces: this gate only turned
          # red on the literal "failure", so a shard cancelled at GitHub's
          # 30m job cap fell through to "All integration tests passed" and CI
          # Gate — the repo's only branch-protection context — went green on
          # run 35353201418 attempt 4 with the tier dead. A cancelled API
          # shard now stays red UNLESS the slow-runner retry ran and passed.
          API_RESULT="${{ needs.integration-tests-api.result }}"
          API_RETRY="${{ needs.integration-tests-api-retry.result }}"
          if [ "$API_RESULT" == "cancelled" ] && [ "$API_RETRY" != "success" ]; then
            echo "API integration shard cancelled; slow-runner retry did not pass (retry result: $API_RETRY)"
            exit 1
          fi

          # WP1.4: the cancelled-is-not-a-verdict rule above covered ONLY the API
          # shard (it's the one with a slow-runner retry). The three non-API
          # shards still forgave cancellation — a shard killed at the job cap fell
          # through to the green branch. They have no retry lane, so cancelled is
          # unconditionally not-success there.
          # (API cancelled deliberately NOT added here: if execution reached this
          # point with a cancelled API shard, the retry passed — the WP0.5
          # exception stays alive.)
          if [ "$API_RESULT" == "failure" ] || \
             [ "${{ needs.integration-tests-websocket.result }}" == "failure" ] || \
             [ "${{ needs.integration-tests-websocket.result }}" == "cancelled" ] || \
             [ "${{ needs.integration-tests-services.result }}" == "failure" ] || \
             [ "${{ needs.integration-tests-services.result }}" == "cancelled" ] || \
             [ "${{ needs.integration-tests-models.result }}" == "failure" ] || \
             [ "${{ needs.integration-tests-models.result }}" == "cancelled" ]; then
            echo "One or more integration test jobs failed or were cancelled"
            exit 1
          fi
          echo "All integration tests passed"

  # Contract tests for API schema validation
  # Main-only: redundant with api-types-check, runs post-merge for validation
  contract-tests:
    name: Contract Tests (API Schema)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # WP1.1 (2026-09-20): was `if: github.ref == 'refs/heads/main'` — the
    # job arrived `skipped` on EVERY PR and check_job forgives `skipped`, so
    # the PR gate and the main gate were different gates: #6570's stale
    # registry pin crossed green and detonated on the landing push (runs
    # 35482667110/35484007823). Next week every VSS PR inherits this blind
    # spot. Fix = P's option 1: run on PRs too. Cost MEASURED first: 88s
    # wall on main (run 35484007823), runs' own Postgres/Redis service
    # containers, no secrets needed for the test itself. Gated by
    # detect-changes like unit-tests so docs-only PRs don't pay for it.
    needs: [detect-changes, lint, build-backend-deps]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.backend == 'true') &&
      needs.lint.result != 'failure' &&
      needs.build-backend-deps.result != 'failure'
      )
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run contract tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/security_test # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379/15
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          LOG_DB_ENABLED: 'false'
          ENVIRONMENT: development # Avoid production password validation in CI
        run: |
          uv run pytest backend/tests/contracts/ \
            -n0 \
            --timeout=30 \
            -v \
            --junit-xml=test-results-contracts.xml \
            --durations=10

      - name: Upload contract test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-contracts
          path: test-results-contracts.xml
          retention-days: 7

      - name: Create Linear issue on failure
        # WP1.1: main-only, as the title says. A PR red is the whole point of
        # running this job on PRs now — the author sees it on the PR; an
        # issue filed per red PR would be noise, and the title lies anyway.
        if: vars.LINEAR_ENABLED == 'true' && (failure() && github.ref == 'refs/heads/main')
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          TITLE="[CI] Contract Tests failed on main"

          # Check for existing open issue with same title
          EXISTING=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d '{
              "query": "query SearchIssues($filter: IssueFilter) { issues(filter: $filter) { nodes { id identifier } } }",
              "variables": {
                "filter": {
                  "team": { "key": { "eq": "NEM" } },
                  "title": { "eq": "'"$TITLE"'" },
                  "state": { "type": { "nin": ["completed", "canceled"] } }
                }
              }
            }')

          EXISTING_ID=$(echo "$EXISTING" | jq -r '.data.issues.nodes[0].id // empty')

          if [ -n "$EXISTING_ID" ]; then
            # Add comment to existing issue
            COMMENT="**Another failure detected**\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateComment($input: CommentCreateInput!) { commentCreate(input: $input) { success } }",
                "variables": {
                  "input": {
                    "issueId": "'"$EXISTING_ID"'",
                    "body": "'"$COMMENT"'"
                  }
                }
              }'
            echo "Added comment to existing issue"
          else
            # Create new issue
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateIssue($input: IssueCreateInput!) { issueCreate(input: $input) { success issue { identifier url } } }",
                "variables": {
                  "input": {
                    "teamId": "998946a2-aa75-491b-a39d-189660131392",
                    "title": "'"$TITLE"'",
                    "description": "Contract tests failed after merge to main.\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease investigate and fix.",
                    "priority": 2
                  }
                }
              }'
            echo "Created new issue"
          fi

  # WP1.1 (2026-09-20): was main-only "for code hygiene" — same blind spot as
  # contract-tests (skipped-on-PR + check_job's skipped-is-OK). The first
  # ever main vulture red (eada4ba9, test_conformance_vocabulary fake_registered,
  # rc=3) was exactly the class of finding a PR could have carried instead of
  # main. Cost MEASURED: 46s wall (run 35484007823). No secrets for the scan
  # itself (the Linear step below keeps its main-only title contract).
  dead-code:
    name: Dead Code Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes, lint, build-backend-deps]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.backend == 'true') &&
      needs.lint.result != 'failure' &&
      needs.build-backend-deps.result != 'failure'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run Vulture (dead code detection)
        run: uv run vulture backend/ vulture_whitelist.py --config pyproject.toml

      - name: Create Linear issue on failure
        # WP1.1: title says "on main"; a PR red belongs on the PR, not Linear.
        if: vars.LINEAR_ENABLED == 'true' && (failure() && github.ref == 'refs/heads/main')
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          TITLE="[CI] Dead Code Detection failed on main"

          # Check for existing open issue with same title
          EXISTING=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d '{
              "query": "query SearchIssues($filter: IssueFilter) { issues(filter: $filter) { nodes { id identifier } } }",
              "variables": {
                "filter": {
                  "team": { "key": { "eq": "NEM" } },
                  "title": { "eq": "'"$TITLE"'" },
                  "state": { "type": { "nin": ["completed", "canceled"] } }
                }
              }
            }')

          EXISTING_ID=$(echo "$EXISTING" | jq -r '.data.issues.nodes[0].id // empty')

          if [ -n "$EXISTING_ID" ]; then
            # Add comment to existing issue
            COMMENT="**Another failure detected**\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateComment($input: CommentCreateInput!) { commentCreate(input: $input) { success } }",
                "variables": {
                  "input": {
                    "issueId": "'"$EXISTING_ID"'",
                    "body": "'"$COMMENT"'"
                  }
                }
              }'
            echo "Added comment to existing issue"
          else
            # Create new issue
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateIssue($input: IssueCreateInput!) { issueCreate(input: $input) { success issue { identifier url } } }",
                "variables": {
                  "input": {
                    "teamId": "998946a2-aa75-491b-a39d-189660131392",
                    "title": "'"$TITLE"'",
                    "description": "Dead code detection (Vulture) found issues after merge to main.\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease investigate and remove dead code.",
                    "priority": 3
                  }
                }
              }'
            echo "Created new issue"
          fi

  # Frontend Jobs

  api-types-check:
    name: API Types Contract Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    # Run when backend or frontend changes (contract spans both)
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      needs.detect-changes.outputs.should-run-all == 'true' ||
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.frontend == 'true'
      )
    env:
      DATABASE_URL: postgresql://user:pass@localhost/db # pragma: allowlist secret
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: uv sync --extra dev --frozen

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Generate types from OpenAPI and check for diffs
        run: ./scripts/generate-types.sh --check

      - name: Check WebSocket types are current
        run: uv run python scripts/generate-ws-types.py --check

      - name: Check OpenAPI spec is current
        run: uv run python scripts/generate-openapi.py --check

      # WP7.1: the AI-tier contract registry (backend/ai_contract) is
      # generated from the deployed gateway adapters + client map + LLM wire;
      # a surface moved without regeneration goes red here, naming the file.
      - name: Check AI contract registry is current
        run: uv run python scripts/gen-ai-contract.py --check

      - name: Validate API type contract consistency
        run: ./scripts/validate-api-types.sh --verbose

  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      needs.detect-changes.outputs.should-run-all == 'true' ||
      needs.detect-changes.outputs.frontend == 'true'
      )
    env:
      NODE_VERSION: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: ESLint
        run: cd frontend && npm run lint

      - name: Dead code detection (Knip)
        # Non-blocking initially - reports issues without failing CI
        continue-on-error: true
        run: cd frontend && npx knip

  frontend-typecheck:
    name: Frontend Type Check (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      needs.detect-changes.outputs.should-run-all == 'true' ||
      needs.detect-changes.outputs.frontend == 'true'
      )
    env:
      NODE_VERSION: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript check
        run: cd frontend && npm run typecheck

  frontend-tests:
    name: Frontend Tests (Vitest ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    # WP3.5: 10 -> 20 min. Halving shards doubles per-shard compute (~204s ->
    # ~410s expected, max-shard extrapolation ~480s + install/teardown); the
    # cap stays a runaway guard, not a hair trigger.
    timeout-minutes: 20
    # Wait for lint to pass first - fail fast on code quality issues
    # Skip if only backend/docs changed (checked via detect-changes)
    needs: [detect-changes, frontend-lint]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.frontend == 'true') &&
      needs.frontend-lint.result != 'failure'
      )
    strategy:
      fail-fast: false
      matrix:
        # WP3.5: 16 -> 8 shards. Measured on run 35175054058 (Jobs API, queue
        # = started_at - queued/created_at, compute = completed - started):
        # shard queue median 573s (range 371-686) vs compute median ~204s --
        # the matrix waits 3x its own runtime for scheduler slots against the
        # WP3.1-measured ~20-job ceiling. 16+6+4 = 26 concurrent test jobs land
        # at once; halving Vitest puts the whole fan-out (57 -> 49) under the
        # cap so queue waits collapse. Per shard, compute roughly doubles
        # (~204s -> ~410s); the spec's own words: fewer, better-packed jobs
        # beat more shards until fan-out drops below the cap.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NODE_VERSION: '24'
      # 6GB heap with GC exposure - needed for Vitest itself
      # GitHub Actions runner has 7GB RAM
      # Deliberately NOT raised by the spec SS5.1 honesty change: the CI heap cap
      # moves only alongside a *measured* runner-OOM issue (spec SS3.3 follow-up /
      # SS5.1 measured-exception path). --expose-gc stays because
      # frontend/src/test/setup.ts calls global.gc() when it is available.
      NODE_OPTIONS: '--max-old-space-size=6144 --expose-gc'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # WP3.3: a previous "Restore npm cache with fallback" actions/cache step
      # here cached root node_modules alongside ~/.npm. Root node_modules is
      # never read by this job (npm ci runs in frontend/ and, being npm not
      # bun, deletes and reinstalls whatever is at its own target), and this
      # repo commits no root package-lock.json -- so the step could never
      # restore or save anything real. setup-node's cache: 'npm' (above) is
      # the one that actually works and stays.
      - name: Install dependencies with retry
        # npm ci can fail due to network issues, add retry logic for resilience
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3: Installing npm dependencies..."
            if cd frontend && npm ci; then
              echo "npm dependencies installed successfully"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "Installation failed, retrying in 10s..."
              sleep 10
            fi
          done
          echo "ERROR: Failed to install npm dependencies after 3 attempts"
          exit 1

      - name: Detect registered frontend flakes
        # T2's apply-flake-reruns convention, ported to vitest (spec SS5.2).
        # flake-k-filter.py prints allowlisted ids " or "-joined (pytest -k
        # syntax); vitest --testNamePattern is a JS regex, so the separators
        # become |. stdlib-only script, so bare python3 (this job has no uv
        # setup step). An empty allowlist (flakes: [] today) leaves the
        # pattern empty and the rerun step below is skipped entirely.
        run: |
          RERUNS=$(python3 scripts/flake-k-filter.py 2>/dev/null || true)
          echo "RERUN_PATTERN=${RERUNS// or /|}" >> "$GITHUB_ENV"
        shell: bash

      - name: Run registered flakes first (allowlist only; never masks verdict)
        if: env.RERUN_PATTERN != ''
        # Mirrors the pytest jobs' rerun block (ci.yml:455-463 et al.): runs
        # BEFORE the strict run, --retry 2 ~ --reruns 2, "|| true" ~ their
        # "|| true". Skipped while the allowlist is empty.
        run: |
          set -uo pipefail
          cd frontend
          npx vitest run --shard=${{ matrix.shard }}/8 \
            --testNamePattern="$RERUN_PATTERN" --passWithNoTests --retry 2 \
            --reporter=default --teardownTimeout=1000 2>&1 \
            | tee /tmp/vitest-rerun-${{ matrix.shard }}.log || true
        shell: bash

      - name: Run tests (shard ${{ matrix.shard }}/8)
        # Real exit code (fast-confidence-loop spec SS5.1). The previous step
        # grepped for the first 'passed' summary line, SIGKILLed vitest and
        # exit 0'd 5s later - an OOM workaround that also hid every failing
        # frontend test (the R-T7-VITEST class: 62 deterministic test-drift
        # failures invisible to CI, now quarantined in vite.config.ts).
        # Memory stays bounded exactly as before: sequential files within the
        # shard (fileParallelism default-off, spec SS3.3 - CI does NOT set
        # VITEST_PARALLEL unless a measured runner OOM is referenced, per
        # SS5.1's measured-exception path), pool=forks + isolate + the
        # 6144 MB job-level NODE_OPTIONS.
        # Shard tests across 16 runners for better memory distribution
        # Coverage collected per-shard and merged in frontend-coverage-merge job
        # NOTE: Do NOT add --coverage here - it triggers per-shard threshold checks
        # that fail because each shard only has ~6% of total coverage (with 16 shards)
        # If a runner OOM recurs with the real exit code, that is evidence for a
        # runner-size conversation (spec SS5.5), not for restoring the hack.
        env:
          # --teardownTimeout still travels here as a CLI flag; the npm-script
          # VITEST_HEAP_MB wrapper is bypassed on purpose - this step calls
          # npx directly, and NODE_OPTIONS (job env) is the heap lever in CI.
          VITEST_PARALLEL: '0'
        run: |
          set -euo pipefail
          cd frontend
          # tee's exit status is masked by the pipe - pipefail makes vitest's
          # status the step's verdict instead (the acceptance property).
          #
          # WP5.2: coverage is collected per shard now. The old comment here
          # said "Do NOT add --coverage" because per-shard threshold checks
          # fail at ~1/8 of the suite - right about the thresholds, wrong as
          # a reason to never measure. The thresholds are zeroed per shard
          # (vitest has no disable switch) and the real four-metric numbers
          # are computed in frontend-coverage-merge by
          # scripts/merge-shard-coverage.mjs. reportsDirectory is shard-
          # UNIQUE: all 8 shards writing coverage/coverage-final.json collide
          # under upload + download-artifact merge-multiple flattening.
          npx vitest run --shard=${{ matrix.shard }}/8 \
            --coverage --coverage.reporter=json \
            --coverage.reportsDirectory=coverage/shard-${{ matrix.shard }} \
            --coverage.thresholds.statements=0 \
            --coverage.thresholds.branches=0 \
            --coverage.thresholds.functions=0 \
            --coverage.thresholds.lines=0 \
            --reporter=default --teardownTimeout=1000 2>&1 \
            | tee /tmp/vitest-shard-${{ matrix.shard }}.log
        shell: bash

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage-shard-${{ matrix.shard }}-of-8-node-${{ env.NODE_VERSION }}
          path: frontend/coverage/
          retention-days: 7

  # WP6.5: the ai/ tier (the deployed AI provider surface - Triton gateway
  # adapters + Triton client + per-service model servers). WP6.1-6.4
  # un-darkened it. Staged wiring: a collect-only gate over the WHOLE tier
  # (import-error-visible: triton shadowing, flat-slot collisions - the WP6.2
  # class) plus RUN steps for subtrees green today: ai/gateway and the ai/tests
  # module-hygiene probes. Subtrees with ledger-classified parked reds
  # (ai/yolo26, ai/triton, and the rest of ai/tests: the cuda/GPU-adjacent
  # suites) join this run list as each drains - recorded in the plan ledger,
  # never quarantined, so a parked-red subtree can never hold the branch red
  # for a RECORDED reason.
  ai-tests:
    name: AI Tier Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, build-backend-deps]
    # ai/** is already inside detect-changes' `backend` paths filter - no new
    # output key invented; same if-shape as the other backend jobs.
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.backend == 'true') &&
      needs.build-backend-deps.result != 'failure'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Collection gate (import errors fail the tier)
        # check-test-collection.py only AST-parses files - it passed clean
        # (0.159s, measured) on a tree with 19 collection errors. --collect-only
        # IMPORTS them, so the triton-package shadow and flat-module name
        # collisions WP6.1/WP6.2 fixed surface here as rc=2. Locally green:
        # 957 collected, 0 errors.
        run: uv run pytest ai/ --collect-only -q --color=no

      - name: AI gateway suite (deployed provider)
        # 252 passed / 0 failed locally, no network required; the repo addopts
        # exclude -m gpu nodes by default.
        run: uv run pytest ai/gateway -q --color=no

      - name: Module hygiene probes (import-time poisoning + triton shadow)
        # The probes run their collection passes in subprocesses and assert the
        # verdicts: sys.modules["ai"] stays the real package after a full ai/
        # collect, and `import triton` never resolves to the repo's ai/triton.
        # The whole-tier collect step above proves files IMPORT; these prove
        # nothing poisons the process state while doing it.
        run: uv run pytest ai/tests/test_module_hygiene.py -q --color=no

  # RETIRED (PR-C, gateway consolidation): the AI YOLO26 image-smoke job that
  # lived here was the ONLY CI proof of the standalone ai/yolo26 image's flat
  # /app COPY - contract.py sitting next to model.py inside the BUILT image,
  # proven by `import model` in a container (the A7.3 invariant). The AI Tier
  # Tests job above proves the gateway serving path ONLY
  # (ai/gateway/tests/test_adapters_yolo26.py - the /yolo26 health + Triton
  # model-ready path against a mocked Triton client). Owner ruling 2026-09-23
  # retired the image fully: no CI or deploy job builds an ai/yolo26 image any
  # more (build-ai / merge-ai / sbom-and-sign / slsa-provenance matrices no
  # longer list it), and the serving Dockerfile + requirements.txt +
  # export_tensorrt.py moved to the ai-yolo26-image archive tree. Triton on ai-gateway
  # serves yolo26 among the 14 models. The standalone benchmark Dockerfile had
  # moved earlier as the archive's Dockerfile.yolo26-benchmark. ai/yolo26 itself
  # STAYS: contract.py is backend prompt-building's live pure leaf (prompts.py
  # imports it) and model.py/pose_estimation.py are AST-read by the AI-contract
  # conformance tests.

  # Merge frontend coverage from all shards and upload to Codecov
  frontend-coverage-merge:
    name: Merge Frontend Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes, frontend-tests]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.frontend == 'true')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Download all coverage artifacts
        # Downloads artifacts from all Node version + shard combinations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: frontend-coverage-shard-*-node-*
          path: coverage-reports/
          merge-multiple: true

      - name: List coverage files
        run: find coverage-reports/ -name "*.json" -o -name "*.xml" | head -20

      # WP5.2: this job used to be download -> find -> Codecov — it merged
      # nothing and measured nothing. The merger is stdlib-only Node with its
      # own unit checks (node --test) that run HERE, before its numbers are
      # trusted — no npm ci needed for either.
      #
      # WP2.3 (R-1 + R-7): the four floors are now the MEASURED values
      # (run 35486259345's merged totals, re-pinned to run 39161827871's by
      # owner ruling 261 — one-off) and this step ENFORCES
      # them — R-FEFLOOR's "reported only" posture is retired now that the
      # baseline is the measurement instead of an aspirational 83/77/81/84
      # that never held. The guard is the same defect class WP2.3 fixes in
      # the nightly: a red shard means PARTIAL coverage data, and partial
      # data under a floor is a test-failure verdict wearing a coverage
      # costume — so enforcement runs only when every shard passed (the
      # shard summary job still reddens that case with the true reason).
      - name: Merge frontend coverage
        run: |
          node --test frontend/scripts/merge-shard-coverage-test.mjs
          ENFORCE=''
          if [ "${{ needs.frontend-tests.result }}" = 'success' ]; then
            ENFORCE='--enforce'
          else
            echo "::warning::frontend shards did not all pass (${{ needs.frontend-tests.result }}) — merging for the record, floors NOT enforced on partial data"
          fi
          node frontend/scripts/merge-shard-coverage.mjs coverage-reports/ --out coverage-merged $ENFORCE

      # The enforcement lives in the merge step above; this step keeps the
      # human-readable summary line with the per-metric floors named.
      - name: 'Report frontend coverage (floors enforced by merge step)'
        if: always()
        run: |
          if [ -f coverage-merged/coverage-summary.json ]; then
            node -e '
              const s = require("./coverage-merged/coverage-summary.json").total;
              const line = `Frontend merged coverage — statements ${s.statements.pct}% (floor 79.5), branches ${s.branches.pct}% (floor 74.3), functions ${s.functions.pct}% (floor 77.2), lines ${s.lines.pct}% (floor 80.5). Enforced by the merge step when all shards pass (WP2.3, ruling 261 — floors are the measured values rounded down).`;
              console.log(line);
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
            '
          else
            echo "::warning::no merged frontend coverage summary — shards produced no coverage-final.json?"
          fi

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: coverage-reports/
          flags: frontend
          fail_ci_if_error: false

  # Summary job for branch protection - aggregates all Vitest shards
  frontend-tests-summary:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes, frontend-tests, collection-sanity]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && !cancelled() }}
    steps:
      - name: Check shard results
        run: |
          # Skip check if tests were skipped due to no frontend changes
          if [ "${{ needs.detect-changes.outputs.should-run-all }}" != "true" ] && \
             [ "${{ needs.detect-changes.outputs.frontend }}" != "true" ]; then
            echo "Frontend tests skipped - no frontend changes detected"
            echo "## Frontend Tests (Vitest)" >> $GITHUB_STEP_SUMMARY
            echo "Skipped - no frontend changes detected" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # WP1.4: cancelled is not a verdict — see unit-tests-summary's comment
          # for the measured history; identical defect, identical fix.
          VT_RESULT="${{ needs.frontend-tests.result }}"
          if [ "$VT_RESULT" == "failure" ] || [ "$VT_RESULT" == "cancelled" ]; then
            echo "One or more Vitest shards failed or were cancelled (result: $VT_RESULT)"
            exit 1
          fi
          echo "All Vitest shards passed"

  api-coverage:
    name: API Endpoint Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check API coverage
        run: ./scripts/check-api-coverage.sh

  # Primary E2E tests (Chromium) - required for merge
  # WP3.5: 6 -> 3 shards. Measured queue median ~386s vs compute median ~66s
  # (run 35175054058): these jobs queue 6x their own runtime, and playwright's
  # CI workers=4 already parallelizes within each shard. 3x compute (~66 ->
  # ~140s) is far under the queueing they pay today.
  frontend-e2e:
    name: E2E Tests (chromium ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Wait for lint to pass first - fail fast on code quality issues
    # Skip if only backend/docs changed (checked via detect-changes)
    needs: [detect-changes, frontend-lint]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.frontend == 'true') &&
      needs.frontend-lint.result != 'failure'
      )
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    env:
      NODE_VERSION: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium with retry
        # Retry loop for browser installation (3 attempts with exponential backoff)
        # Handles transient network failures and concurrent installation conflicts
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3: Installing Playwright Chromium..."
            # Clean up any partial installation on retry
            if [ $attempt -gt 1 ]; then
              echo "Cleaning up partial installation before retry..."
              rm -rf ~/.cache/ms-playwright || true
            fi
            if cd frontend && npx playwright install chromium --with-deps 2>&1 | tee /tmp/playwright-install.log; then
              echo "Playwright Chromium installed successfully"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              wait_time=$((10 * attempt))
              echo "Installation failed, waiting ${wait_time}s before retry..."
              sleep $wait_time
            fi
          done
          echo "ERROR: Failed to install Playwright Chromium after 3 attempts"
          cat /tmp/playwright-install.log || true
          exit 1

      - name: Verify Playwright Chromium installation
        run: |
          if npx playwright --version; then
            echo "Playwright CLI verified"
          fi
          if [ -d ~/.cache/ms-playwright ]; then
            echo "Playwright cache directory exists:"
            ls -lah ~/.cache/ms-playwright/chromium-*/
          else
            echo "ERROR: Playwright cache directory not found"
            exit 1
          fi

      - name: Install Playwright system dependencies (if cached)
        # Only needed if browsers were already cached
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd frontend && npx playwright install-deps chromium

      - name: Run E2E tests (Chromium shard ${{ matrix.shard }}) with retry
        # Retry loop: 3 attempts with 10s wait between retries for transient failures
        # Browser installation issues are caught by separate installation step
        # Uses subshell () to ensure cd doesn't affect subsequent retry iterations
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if (cd frontend && npx playwright test --project=chromium --shard=${{ matrix.shard }}); then
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "Test failed, retrying in 10s..."
              sleep 10
            fi
          done
          exit 1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-chromium-${{ strategy.job-index }}-node-${{ env.NODE_VERSION }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-chromium-${{ strategy.job-index }}-node-${{ env.NODE_VERSION }}
          path: frontend/test-results/
          retention-days: 7

  # Summary job for branch protection - aggregates all E2E shards
  frontend-e2e-summary:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes, frontend-e2e]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && !cancelled() }}
    steps:
      - name: Check shard results
        run: |
          # Skip check if tests were skipped due to no frontend changes
          if [ "${{ needs.detect-changes.outputs.should-run-all }}" != "true" ] && \
             [ "${{ needs.detect-changes.outputs.frontend }}" != "true" ]; then
            echo "E2E tests skipped - no frontend changes detected"
            echo "## E2E Tests (Chromium)" >> $GITHUB_STEP_SUMMARY
            echo "Skipped - no frontend changes detected" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # WP1.4: cancelled is not a verdict — see unit-tests-summary's comment
          # for the measured history; identical defect, identical fix.
          E2E_RESULT="${{ needs.frontend-e2e.result }}"
          if [ "$E2E_RESULT" == "failure" ] || [ "$E2E_RESULT" == "cancelled" ]; then
            echo "One or more E2E shards failed or were cancelled (result: $E2E_RESULT)"
            exit 1
          fi
          echo "All E2E shards passed"

  # Secondary E2E tests (Firefox/WebKit) - nightly schedule only to improve PR merge velocity
  # Intentionally kept on a single Node version (no matrix) to avoid excessive CI time
  # Nightly-only: Firefox/WebKit have known infrastructure flakiness (timeouts)
  # Move to nightly - too slow for every main push (20+ minutes)
  frontend-e2e-secondary:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright ${{ matrix.browser }} with retry
        # Retry loop for browser installation (3 attempts with exponential backoff)
        # Firefox/WebKit tend to have more infrastructure flakiness than Chromium
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3: Installing Playwright ${{ matrix.browser }}..."
            # Clean up any partial installation on retry
            if [ $attempt -gt 1 ]; then
              echo "Cleaning up partial installation before retry..."
              rm -rf ~/.cache/ms-playwright || true
            fi
            if cd frontend && npx playwright install ${{ matrix.browser }} --with-deps 2>&1 | tee /tmp/playwright-install.log; then
              echo "Playwright ${{ matrix.browser }} installed successfully"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              wait_time=$((10 * attempt))
              echo "Installation failed, waiting ${wait_time}s before retry..."
              sleep $wait_time
            fi
          done
          echo "ERROR: Failed to install Playwright ${{ matrix.browser }} after 3 attempts"
          cat /tmp/playwright-install.log || true
          exit 1

      - name: Verify Playwright ${{ matrix.browser }} installation
        run: |
          if npx playwright --version; then
            echo "Playwright CLI verified"
          fi
          if [ -d ~/.cache/ms-playwright ]; then
            echo "Playwright cache directory exists:"
            ls -lah ~/.cache/ms-playwright/ | grep -E "${{ matrix.browser }}|chromium"
          else
            echo "ERROR: Playwright cache directory not found"
            exit 1
          fi

      - name: Install Playwright system dependencies (if cached)
        # Only needed if browsers were already cached
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd frontend && npx playwright install-deps ${{ matrix.browser }}

      - name: Run E2E tests (${{ matrix.browser }}) with retry
        # Retry loop: 3 attempts with 10s wait between retries for transient test failures
        # Browser installation issues are caught by separate installation step
        # Uses subshell () to ensure cd doesn't affect subsequent retry iterations
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if (cd frontend && npx playwright test --project=${{ matrix.browser }}); then
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              wait_time=$((10 * attempt))
              echo "Test failed, waiting ${wait_time}s before retry..."
              sleep $wait_time
            fi
          done
          exit 1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-${{ matrix.browser }}
          path: frontend/test-results/
          retention-days: 7

      - name: Create Linear issue on failure
        if: vars.LINEAR_ENABLED == 'true' && (failure())
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          TITLE="[CI] E2E Tests (${{ matrix.browser }}) failed on main"

          # Check for existing open issue with same title
          EXISTING=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d '{
              "query": "query SearchIssues($filter: IssueFilter) { issues(filter: $filter) { nodes { id identifier } } }",
              "variables": {
                "filter": {
                  "team": { "key": { "eq": "NEM" } },
                  "title": { "eq": "'"$TITLE"'" },
                  "state": { "type": { "nin": ["completed", "canceled"] } }
                }
              }
            }')

          EXISTING_ID=$(echo "$EXISTING" | jq -r '.data.issues.nodes[0].id // empty')

          if [ -n "$EXISTING_ID" ]; then
            # Add comment to existing issue
            COMMENT="**Another failure detected**\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateComment($input: CommentCreateInput!) { commentCreate(input: $input) { success } }",
                "variables": {
                  "input": {
                    "issueId": "'"$EXISTING_ID"'",
                    "body": "'"$COMMENT"'"
                  }
                }
              }'
            echo "Added comment to existing issue"
          else
            # Create new issue
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateIssue($input: IssueCreateInput!) { issueCreate(input: $input) { success issue { identifier url } } }",
                "variables": {
                  "input": {
                    "teamId": "998946a2-aa75-491b-a39d-189660131392",
                    "title": "'"$TITLE"'",
                    "description": "E2E tests for ${{ matrix.browser }} failed after merge to main.\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease investigate - may be infrastructure flakiness or real test failure.",
                    "priority": 3
                  }
                }
              }'
            echo "Created new issue"
          fi

  # Build Jobs (main-only - verify Docker builds after merge)
  # Separate jobs for backend/frontend to avoid disk space issues

  build-backend:
    name: Build Docker (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # WP1.1 (2026-09-20): was main-only. Option 1 (P's preference): runs on
    # PRs touching the backend surface now. This PR IS the cost measurement —
    # the plan demands the added wall-time be measured before choosing, and it
    # cannot be measured without running; PR duration lands in L. Inputs for
    # feasibility: main cost 410s (run 35484007823), GHA cache scope is
    # shared across branches so PRs build warm, --load (no push) so no
    # write-permission question for same-repo PRs, and the (since-retired in
    # PR-C) A7.3 yolo26 image smoke had already proven docker builds run
    # green on PRs in this repo.
    needs: [detect-changes]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.backend == 'true')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space (minimal)
        # Remove only what's needed for Docker builds
        # Minimal cleanup is faster than full jlumbroso/free-disk-space action
        run: |
          # Remove only what's needed for Docker builds
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af --volumes
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image with retry
        # Retry logic for transient registry 502 errors
        # Docker registry can return 502 during layer blob writes due to infrastructure issues
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            docker buildx build \
              --file ./backend/Dockerfile \
              --target prod \
              --tag backend:${{ github.sha }} \
              --cache-from type=gha,scope=backend \
              --cache-to type=gha,mode=max,scope=backend \
              --load \
              .

      - name: Create Linear issue on failure
        if: vars.LINEAR_ENABLED == 'true' && (failure())
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          TITLE="[CI] Backend Docker build failed on main"

          # Check for existing open issue with same title
          EXISTING=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d '{
              "query": "query SearchIssues($filter: IssueFilter) { issues(filter: $filter) { nodes { id identifier } } }",
              "variables": {
                "filter": {
                  "team": { "key": { "eq": "NEM" } },
                  "title": { "eq": "'"$TITLE"'" },
                  "state": { "type": { "nin": ["completed", "canceled"] } }
                }
              }
            }')

          EXISTING_ID=$(echo "$EXISTING" | jq -r '.data.issues.nodes[0].id // empty')

          if [ -n "$EXISTING_ID" ]; then
            # Add comment to existing issue
            COMMENT="**Another failure detected**\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateComment($input: CommentCreateInput!) { commentCreate(input: $input) { success } }",
                "variables": {
                  "input": {
                    "issueId": "'"$EXISTING_ID"'",
                    "body": "'"$COMMENT"'"
                  }
                }
              }'
            echo "Added comment to existing issue"
          else
            # Create new issue
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateIssue($input: IssueCreateInput!) { issueCreate(input: $input) { success issue { identifier url } } }",
                "variables": {
                  "input": {
                    "teamId": "998946a2-aa75-491b-a39d-189660131392",
                    "title": "'"$TITLE"'",
                    "description": "Backend Docker build failed after merge to main.\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease investigate - Docker build must work for deployment.",
                    "priority": 1
                  }
                }
              }'
            echo "Created new issue"
          fi

  build-frontend:
    name: Build Docker (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # WP1.1: option 1, same reasoning as build-backend — main cost MEASURED
