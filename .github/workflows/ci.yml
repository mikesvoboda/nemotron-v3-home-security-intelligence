name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '24'
  UV_VERSION: '0.9.18' # Update this single location to change uv version across all workflows
  PYROSCOPE_ENABLED: 'false' # Disable profiling in CI (pyroscope-io not installed)

jobs:
  # Change Detection Job - determines which tests to run based on changed files
  # Always runs tests on main branch pushes and when workflow file changes
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs-only: ${{ steps.filter.outputs.docs-only }}
      workflow: ${{ steps.filter.outputs.workflow }}
      feature: ${{ steps.filter.outputs.feature }}
      should-run-all: ${{ github.ref == 'refs/heads/main' || steps.filter.outputs.workflow == 'true' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Without this the default quantifier ('some') OR-s a '!' pattern in, and
          # '!frontend/**/*.md' matches every file outside frontend/: frontend was
          # true on every PR, so docs- and backend-only PRs ran all 18 frontend jobs.
          predicate-quantifier: 'some-with-excludes'
          # '.test_durations' rides the backend filter (batch-9 row 2): the
          # committed shard-planning file steers the backend shards' pytest-split
          # groups, so a refresh must re-run the tier it re-plans (and the gate
          # that reads it). A root dotfile matches no other backend pattern.
          filters: |
            backend:
              - 'backend/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'ai/**'
              - 'scripts/**/*.py'
              - 'synthbench/**'
              - '.test_durations'
            frontend:
              - 'frontend/**'
              - '!frontend/**/*.md'
            docs-only:
              - 'docs/**'
              - '**/*.md'
              - '!frontend/**'
              - '!backend/**'
            workflow:
              - '.github/workflows/ci.yml'
            # Ruling 105: the feature-check job's filter — the retired
            # standalone workflow's `paths-ignore: '**.md'` as a named set,
            # i.e. every path the run actually executes: the harness and its
            # scripts, backend and frontend code, the compose files defining
            # the fake stack, the uv-pinned env. A docs-only PR matches none.
            feature:
              - 'backend/**'
              - 'frontend/**'
              - '!frontend/**/*.md'
              - 'ai/**'
              - 'synthbench/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'docker-compose.ci.yml'
              - 'docker-compose.fake-ai.yml'
              - '.github/workflows/ci.yml'
              # Ruling 218: the inventory witness step reads it, so a status edit is judged.
              - 'docs/reference/feature-inventory.md'

      - name: Log detected changes
        run: |
          echo "## Change Detection Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ steps.filter.outputs.backend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ steps.filter.outputs.frontend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docs Only | ${{ steps.filter.outputs.docs-only }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow | ${{ steps.filter.outputs.workflow }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Feature check | ${{ steps.filter.outputs.feature }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Is Main Branch | ${{ github.ref == 'refs/heads/main' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ steps.filter.outputs.workflow }}" == "true" ]; then
            echo "**Running all tests** (main branch push or workflow changes)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.filter.outputs.backend }}" == "true" ] && [ "${{ steps.filter.outputs.frontend }}" == "true" ]; then
            echo "**Running all tests** (both backend and frontend changes)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.filter.outputs.backend }}" == "true" ]; then
            echo "**Running backend tests only** (frontend unchanged)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.filter.outputs.frontend }}" == "true" ]; then
            echo "**Running frontend tests only** (backend unchanged)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Skipping tests** (docs-only changes)" >> $GITHUB_STEP_SUMMARY
          fi

  collection-sanity:
    name: Collection Sanity (zero-byte / zero-test tracked files)
    runs-on: ubuntu-latest
    # 10 -> 15 (WP0.8): the gate-test step now collects the whole unit tier
    # (the governance test's real-tree sweep), which imports every module.
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
      - name: Pin the compose CLI the render gates are certified against
        # [r162] The compose files this job renders use a top-level `include:`
        # that merges a volume into a service the importing file also declares
        # (owner ruling 186's mechanism). That merge is spec-legal and renders
        # identically on both CLIs this contract is written against -- compose
        # v5.5.1 (every local dev + the sandbox these pins were certified on)
        # and podman-compose 1.6.0 (the operator's CLI, per
        # docs/operator/deployment/README.md). The ubuntu-24.04 runner image
        # ships docker-compose v2.38.2 (runner-images tag 20261012.334
        # "Docker Compose 2.38.2"), whose import-time check rejects the merge
        # outright: `services.backend conflicts with imported resource`,
        # reproduced at #7114 run 38670581001 AND locally by pointing the HOME
        # plugin dir at that exact binary (sha256-verified). No include:
        # SPELLING passes v2.38.2 -- the plain string form, the spec's
        # `- path:`/`action: merge` form, all measured rc=1 there; the action
        # flag is v2.20+ but its deep merge was added in v2.24.4, so the v2
        # line is out at any pin. Rather than bend the config around an
        # end-of-line runner plugin, pin the CLI to the version the suite is
        # certified on. Control proving the pin regresses nothing: main's
        # prod.yml (no include:) renders 123 passed on v5.5.1 across all four
        # pre-existing render files. `docker compose config` is daemon-free
        # (rc=0 against an unreachable DOCKER_HOST, measured), so this needs
        # no daemon; $HOME/.docker/cli-plugins wins over the image's
        # /usr/libexec copy (measured both directions with this exact plugin
        # mechanism). Same shape/version as the Backend Unit Tests job's step.
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL -o "$HOME/.docker/cli-plugins/docker-compose" \
            https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64
          echo "db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c -
          chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version # the witness: this leg's failures now name the CLI that rendered them
      - name: Check tracked test files collect real tests
        # `ai` added by WP6.5 - the tier was never even census-gated before.
        # Cheap and NOT sufficient (AST-only: rc=0 measured on a tree with 19
        # collection errors); the ai-tests job's --collect-only step is the
        # import-error-visible gate.
        run: uv run --no-project python scripts/check-test-collection.py backend frontend ai
      - name: Flake allowlist hygiene
        run: uv run --no-project python scripts/check-flake-allowlist.py
      # WP1.1: the escape-hatch census, measured on every CI run. The
      # --expect value is the ratchet's seed value: the exact baseline the
      # spec records AND that this tree reproduces (verified equal to a
      # census of origin/main itself, and stable across consecutive runs).
      # CI failing here means either the census drifted from the measured
      # tree or a suppression changed without the baseline being adjudicated
      # — WP1.3's ratchet turns this from a stability check into a
      # counts-may-only-fall gate.
      # WP4.3 (2026-09-21): the expect was a hand-transcribed literal of
      # suppression-baseline.json — PR #6595 (unspecced 233->142) proved the
      # copies ROT: the baseline moved in-commit via the sanctioned
      # `ratchet-check --update` path and this literal reddened Collection
      # Sanity on a fully adjudicated fall. Deriving from the committed
      # baseline keeps both teeth: a RISE fails here and in ratchet-check;
      # a fall without editing the baseline file still fails HERE (census !=
      # baseline), so adjudication stays a human diff — one file to move
      # instead of two hand-synced ones. Same doctrine as #6592 minting the
      # contract count instead of pinning it.
      - name: Suppression census (baseline stable)
        run: |-
          uv run python scripts/suppression-census.py --expect "$(cat .github/suppression-baseline.json)"
      # WP1.3: the ratchet. The --expect above says "the census must not
      # drift"; this says "counts may only FALL" — an unregistered
      # @pytest.mark.skip (or any new suppression of any category) fails CI
      # naming its id, and a registry entry whose site vanished goes stale.
      # Baseline: .github/suppression-baseline.json; decreases lower via
      # `ratchet-check.py --update`, an increase needs registry entries AND a
      # hand-raised baseline in the same reviewed commit.
      - name: Suppression ratchet (counts may only fall)
        run: uv run python scripts/ratchet-check.py
      # WP9.1: cross-provider AI parity. The golden list (.github/ai-parity-
      # baseline.json) pins the adjudicated divergence set and is EMPTY on the
      # shipped tree — every Tier-A surface it once named is gone; the
      # per-id record of what took each one lives in
      # scripts/test_check_ai_provider_parity.py. The gate FAILS on any
      # divergence not in the list, and a VANISHING id fails too (GOLDEN-LOST)
      # so fixes re-ratchet instead of rotting the baseline. Provider #4 cannot
      # drift silently: a new
      # divergence fails here naming its id until adjudicated, and fixing a
      # defect means removing its id from .github/ai-parity-baseline.json in
      # the same commit (same same-commit doctrine as the suppression
      # baseline above; list members may only fall without owner review).
      - name: AI provider parity (golden divergence list)
        run: >-
          uv run python scripts/check-ai-provider-parity.py
          --expect .github/ai-parity-baseline.json
      # WP1.2's --check mode, shipped with the generator and invoked until now
      # by nothing. It is NOT a second drift check: the ratchet above already
      # catches stale entries whose site vanished and unregistered new
      # suppressions. What it adds is that registry METADATA cannot be edited
      # by hand. `expires` is minted from `kind` (EXPIRES map) and `kind` from
      # the census reason text (classify()), so a suppression facing its WP1.4
      # deadline cannot be quietly moved -- neither by rewriting the date nor
      # by relabelling the kind to buy a later one. Both drift; this returns 1.
      # WP1.4 made expiry bite, and the natural response to a gate that bites
      # is to move the date: this is what makes the date immovable.
      # Invoked via `uv run python`, NOT bare `python3` -- the script uses PEP
      # 758 unparenthesized `except`, which is 3.14-only, and the runner's
      # python3 is 3.12 (the 16ac407d outage; the same form is still live at
      # suppression-registry-gen.py:211 and suppression-census.py:137).
      - name: Suppression registry is machine-minted (no hand-edits)
        run: uv run python scripts/suppression-registry-gen.py --check
      # WP0.7: the two gates above are themselves tested; the suites sit
      # outside testpaths on purpose (no self-collection) — run explicitly.
      # A regression in either gate script fails here (scripts/test_*.py).
      # WP0.9 added the coverage-diff gate's own tests to the same list;
      # the pre-push timeout checker's contract tests joined after its
      # chaos-comment repair; the WP1.1 census tests joined with the census
      # itself (a gate with no CI is a gate that rots). Phase 2: the fast
      # tier's own tests (selector + manifest contract) joined with the
      # deleted-test phantom fix — the same doctrine, one tier later.
      # WP0.1 (2026-09-20): the doctrine notes that used to live INSIDE the
      # folded scalar below silently killed it. A `>-` block folds to ONE
      # shell line, so the first `# WP4.1:` began a bash comment mid-command:
      # every file after it (autospec-sweep, mock-spec, mutation-score,
      # parity suites AND the -q) never executed. CI proved it — step 10
      # logged "86 passed", exactly the 10 files listed BEFORE the first
      # comment (main run 35484007823). The four suites that joined under
      # "a gate with no CI is a gate that rots" rotted inside the very
      # mechanism meant to prevent rotting. Prose now lives HERE, as real
      # YAML comments; nothing with a `#` may re-enter a run: block.
      # (WP4.1: autospec sweep. WP4.2: unspecced-mock gate. WP4.3: mutation
      # scorer's verdict-table pin. WP9.1: AI parity checker — the suite
      # whose absent run let the registry_ops==38 pin rot on main.)
      # WP2.5 (#6586): the gate-reachability guard's own suite joined the
      # list — same doctrine, one tier later (it is why this step's argv can no
      # longer shrink silently).
      # The ai-surface census suite pins the surviving *_loader set to exactly
      # the three lookup loaders — the guard against a specialist leg being
      # quietly added or deleted. It sits outside testpaths and runs here (a
      # gate with no CI is a gate that rots).
      # O1.4 (D9): the workflow-path gate joined the list — every repository
      # path addressed in .github/workflows/*.yml and .pre-commit-config.yaml
      # must exist (the deploy.yml phantom-artifact class made permanent).
      # O1.8: the pip-audit exemption checker's own suite joined the list.
      # Its test_unexempted_fixture_advisory_is_red IS the package's Done-when
      # clause ("the CI audit fails on a fixture advisory that is not on the
      # dismissal list") — a Done-when that only runs locally is a Done-when
      # that rots, same doctrine as every other suite in this argv.
      # O1.7 (rule 3): the five committed measurement scanners joined the
      # list — a census nobody runs in CI is a census that rots, and these
      # five produce the [C] baselines B3.3, W1.1, W3.3, O3.3, BB.1 and
      # Phase 4 measure against. scripts/audit/AGENTS.md has the doctrine;
      # the comment lives HERE (outside the folded scalar) per the WP0.1
      # lesson: a `#` inside `>-` becomes a bash comment mid-command and
      # silently kills every file listed after it.
      # O2.3 (§M1): the reachability walker's suite joined the list. It is
      # the ONLY mechanical check of the shipping/non-shipping verdict the
      # rest of the programme (M2 scoring, R-surface deletions) reads, and
      # its Done-when says the suite must pass IN CI — six pins against the
      # real tree (redis_json/scenario_classifier/managed_service/
      # orphan_cleanup_service dead; vlm_analyzer/backend/evaluation live)
      # rot the moment they stop running.
      # O2.3b (ruling 73): the R2-input generator's suite joined the list,
      # same doctrine — a committed deletion list that stops matching the
      # tool is how B3.2 deletes a shipping file. The job has no path filter
      # (verified at claim time), so the freshness gate runs on docs-only
      # PRs too: the regions cannot be hand-edited past it. The generator is
      # named here by role, not by scripts/ path: the entries pin in
      # scripts/test_reachability.py scans THIS file's comments for non-test
      # script paths and demands each be a declared entry point, and naming
      # it would change the tool-inputs stamp for a walk-neutral reason.
      # #7064 (UR-89 follow-up): the uplevel cite gate's own suite joined the
      # list. It lives in the unit tier, but on a docs-only PR the unit shards
      # never run: ci.yml gates them on backend/should-run-all and the summary
      # job exit-0s on that skip — measured at #7054's be801744d (shards
      # skipped, "Backend Unit Tests" success, CI Gate green: vacuous green).
      # The cite gate reads only docs/uplevel/** and its committed snapshot
      # data, so this step is the tier that reaches its subject — a cite
      # otherwise rots with every check green. Drafts stay uncovered:
      # detect-changes skips on drafts, so no docs-only condition can see one.
      # [r162] (owner ruling 186) joined the list: the render pins for the
      # conditional engine socket. Same leg as the prod-shape drift test it
      # complements — both need the moby `docker compose` CLI this job already
      # provides, and a missing binary FAILS there rather than skipping (a
      # skipped socket guard would read as a green package, the doctrine the
      # drift test states at scripts/test_prodshape_override.py:126-130).
      # The rationale lives HERE, not beside its argv entry: this step's `run`
      # is a folded scalar, where a `#` line comments out the rest of the
      # folded sequence — scripts/test_check_gate_reachability.py's
      # TestRunStepCommentSwallow caught exactly that when the note sat inside.
      - name: Run the anti-rot gates' own tests
        run: >-
          uv run python -m pytest
          scripts/test_check_test_collection.py
          scripts/test_check_flake_allowlist.py
          scripts/test_check_coverage_diff.py
          scripts/test_check_gate_changed_files.py
          scripts/test_check_test_timeouts.py
          scripts/test_suppression_census.py
          scripts/test_ratchet_check.py
          scripts/test_fast_select.py
          scripts/test_fast_runners_manifest.py
          scripts/test_precommit_config.py
          scripts/test_autospec_sweep.py
          scripts/test_check_mock_spec.py
          scripts/test_mutation_score.py
          scripts/test_check_ai_provider_parity.py
          scripts/test_check_gate_reachability.py
          scripts/test_check_inventory_summary_arith.py
          scripts/test_ai_surface_census.py
          scripts/test_check_npm_audit_exemptions.py
          scripts/test_check_pip_audit_exemptions.py
          scripts/test_agents_md_validator.py
          scripts/test_validate_docs_symbol_context.py
          scripts/test_pipeline_vs_independent_arm.py
          scripts/test_retired_paths.py
          scripts/test_check_coe_reasons.py
          scripts/test_workflow_paths.py
          backend/tests/unit/scripts/test_check_uplevel_cites.py
          scripts/test_workflow_draft_guards.py
          scripts/audit/test_retired_names.py
          scripts/audit/test_settings_orphans.py
          scripts/audit/test_dead_symbols.py
          scripts/audit/test_env_dead_vars.py
          scripts/audit/test_battery_census.py
          scripts/audit/test_literal_groups.py
          scripts/test_shard_durations.py
          scripts/test_reachability.py
          scripts/test_r2_python_dead_list.py
          scripts/test_coordinator_snapshot.py
          scripts/test_lane_tick.py
          scripts/test_plan_lint.py
          scripts/test_post_record.py
          scripts/test_queue_update.py
          scripts/test_prodshape_override.py
          scripts/test_orchestrator_engine_socket.py
          scripts/test_pr_watch.py
          scripts/test_inventory_witness.py
          scripts/test_mutation_diff.py
          scripts/test_reachability_gate.py
          scripts/test_gen_ai_contract.py
          scripts/test_synthetic_media.py
          scripts/test_scripts_truth.py
          -q
      # Ruling 197: the plan fields the lane digest acts on (roster queues, package `**PR:**`
      # fields, ruling-map record ids), linted with the digest's own parsers. On a PR it fails
      # only on findings its BASE lacks: this job has no paths filter and feeds the CI Gate, so a
      # plan defect already on main must red main's own push run, not every PR after it. The base
      # is the checked-out merge commit's FIRST parent -- the main this run merged the PR into --
      # not the event's pull_request.base.sha, which is main as of the PR's last update and so
      # reads a defect that reached main since then as the PR's own. The checkout is depth-1: the
      # commit object still names its parents (cat-file reads the raw object), and that one parent
      # is fetched. No parent is a broken premise, so the step fails closed with exit 2 and says
      # why. Named by module, not path, as the docs-citation step below is: naming a scripts path
      # here makes it a declared reachability entry, which moves the R2 list's tool-inputs stamp
      # for a walk-neutral reason (scripts/ is not a candidate tree).
      - name: Plan lint (ruling 197)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "pull_request" ]; then
            BASE_SHA="$(git cat-file -p HEAD | awk '/^parent / { if (!n++) print $2 }')"
            if [ -z "${BASE_SHA}" ]; then
              echo "plan lint: HEAD $(git rev-parse HEAD) names no parent; no baseline, nothing judged" >&2
              exit 2
            fi
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            uv run python -m scripts.uplevel.plan_lint --baseline "${BASE_SHA}"
          else
            uv run python -m scripts.uplevel.plan_lint
          fi
      # Docs level-1: every source citation in the scoped docs dirs names a
      # file that exists. Level 1 only (--no-ast --no-code-match --no-cross-ref
      # --no-staleness) — that is what catches a dead source_ref, and it is
      # sub-second over these dirs. SCOPE IS A FLOOR: the dirs below are exactly
      # the ones measured green; docs/ carries known-dead citations elsewhere,
      # so widening the list must follow each fix, never precede it (a newly
      # wired gate must not land red).
      - name: Docs citation existence (level 1, scoped dirs)
        run: |
          set -euo pipefail
          for d in docs/decisions docs/deployment docs/getting-started docs/operations docs/ui; do
            uv run python -m scripts.validate_docs "$d" \
              --no-ast --no-code-match --no-cross-ref --no-staleness --errors-only
          done
      # WP0.8: standalone gate test (no pytest cases — invoked as a script,
      # NOT added to the pytest list above, which would collect zero).
      - name: Flaky-marker governance gate test
        run: uv run python scripts/test_flaky_marker_governance.py

      # WP2.3: the coverage-denominator / floors / diff-gate suites. These
      # gate scripts (check-test-coverage-gate.py) and CI workflow SHAPE
      # (the merge/nightly step bodies they execute), so a regression there
      # fails HERE — a coverage gate with no CI is a coverage gate that rots.
      # BLOCK SCALAR (`|`), deliberately NOT the folded `>-` list above: a
      # folded block turns its `#` comment lines into argv literals and, at a
      # word boundary, a shell comment that silently drops every later file
      # (the exact swallow #6572 unwedges — this step avoids the trap by
      # construction rather than waiting on that PR). Self-contained coverage
      # here needs no Postgres/Redis: the E2Es mint a synthetic scratch project.
      - name: Coverage gate suites (WP2.1/2.2/2.3)
        run: |
          uv run python -m pytest \
            scripts/test_coverage_denominator.py \
            scripts/test_coverage_floors.py \
            scripts/test_check_coverage_diff.py \
            -q

      # WP0.6 follow-up (2026-09-17): same script-style shape — the job-graph
      # invariant shipped with WP0.6 but was never invoked anywhere, so it
      # could not have reported the two ungated jobs it now catches
      # (collection-sanity, build-backend-deps). A gate with no CI is a gate
      # that rots, and this one rotted before its first run.
      - name: CI job-graph invariant (WP0.6)
        run: uv run python scripts/test_ci_job_graph.py

      # O1.12 (UR-37): the same script-style shape for the hooks job — the
      # graph test cannot see a job's CONTENT (which command it runs, whether
      # the self-test step exists), and a hooks job quietly gutted of its
      # `pre-commit run` would be exactly the invisibility class WP0.6 exists
      # to kill. Red on main's ci.yml until the job lands (fixture-first).
      - name: Pre-commit gate wiring (O1.12)
        run: uv run python scripts/test_precommit_gate_wiring.py

      # WP0.5 follow-through (2026-09-18): pins the slow-runner retry wiring —
      # the cancelled-only gate (never 'failure': retry-masking real failures),
      # the UNRAISED 30-min cap, artifact-suffix uniqueness, and the summary's
      # cancelled-is-not-a-verdict rule. Script-style like the two above; a
      # wiring drift here re-creates the attempt-4 invisibility bug.
      - name: Shard-retry wiring invariant
        run: uv run python scripts/test_shard_retry_wiring.py

      # WP0.5's gate test — also script-style, also never invoked until now.
      # Proves audit-test-durations.py is an honest GATE at the owner-ruled
      # thresholds: an empty results dir FAILS rather than passing vacuously,
      # and a tracked-slow test that blows the 60s cap still bites (7 cases).
      - name: Test Performance Audit gate test (WP0.5)
        run: bash scripts/test_audit_gate.sh

      # WP0.1's gate test. It was written at 00:13 on 2026-09-16 against the
      # smoke-test hook and went stale at 16:33 when WP2.4 rewrote
      # pre-push-tests.sh -- invisibly, because it ran nowhere. Retargeted to
      # the shipped contract (owner ruling 2026-09-17: an unrunnable tier is a
      # DEFECT, so pytest rc=5 and vitest rc=127 both fail closed; the old
      # import/tsc fallbacks stay removed) and wired here so it cannot rot
      # again. 11 cases, incl. three real `git push` blocks.
      - name: Pre-push hook gate test (WP0.1)
        run: bash scripts/test_pre_push_gate.sh

  # O1.12 (UR-37): the gate runs the hooks agents push through. Before this
  # job the required gate ran only ruff+radon (lint), so a PR could pass every
  # required check and still block every later push crossing its files — the
  # 2026-10-08 record: #6888 (semgrep), #6890 (slow-test guard), #6891, #6892.
  # This job runs the COMMITTED .pre-commit-config.yaml over the PR's
  # changed-file range — the same delta a push delta gets. Wiring is a direct
  # need + check_job line in ci-gate (scripts/test_ci_job_graph.py's WP0.6
  # doctrine); the job's CONTENT is pinned by scripts/test_precommit_gate_wiring.py,
  # which is red on main's ci.yml by design (write the failing check first).
  #
  # Local-only hooks this job does NOT run (every one listed, per the package's
  # no-silent-gap clause — a RULING item for the owner's batch). Four hooks
  # outside the pre-commit stage (the config's only stages: keys — verified
  # by grep this turn):
  #   auto-rebase / parallel-tests (pre-push): a detached CI checkout has no
  #     branch to rebase onto, and CI already runs every test tier the push
  #     script would run locally;
  #   check-new-files-have-tests (pre-push): its gate script's own suites run
  #     in collection-sanity;
  #   conventional-pre-commit (commit-msg): CI never authors the PR's commits.
  # check-integration-tests runs HERE — its pre-commit stage is in scope.
  # Known in-stage gap (same clause, a second RULING item): check-mock-spec's
  # entry hard-codes --staged, and CI's detached checkout has an empty index,
  # so its fast path is vacuous in this job (self-review: exit 1 staged,
  # exit 0 clean-index). Its completeness layer is the census gate —
  # suppression-census.py --expect runs in collection-sanity and delegates
  # measurement to this same script (suppression-census.py:530-540).
  precommit-hooks:
    name: Pre-commit Hooks (changed files)
    runs-on: ubuntu-latest
    # Semgrep env build is the tail (cold ~90s on a python-touching PR); the
    # remaining hooks are seconds. Wall-clock is MEASURED on real PRs and
    # reported in the O1.12 PR body, not guessed here.
    timeout-minutes: 15
    needs: [detect-changes]
    env:
      # Pinned like everything else in this job (the config's rev: pins, the
      # SHA-pinned actions); 4.6.2 is what the O1.12 sandbox evidence ran.
      PRE_COMMIT_VERSION: 4.6.2
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The hooks compare two refs; a depth-1 checkout has neither side.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python 3.12 + 3.14 (the config needs BOTH interpreters)
        # 3.14: the config's default_language_version (config lines 31-38 —
        # hook venvs must track the project runtime or mypy false-reds on
        # PEP 758 syntax). 3.12: the semgrep hook's language_version pin
        # (protobuf has no 3.14 wheel yet — the config's own note).
        # pre-commit discovers interpreters on PATH; uv python install
        # symlinks them into ~/.local/bin, on PATH on hosted runners.
        # A missing 3.14 kills every python-language env build (virtualenv
        # "failed to find interpreter", pre-commit exit 3) — caught by
        # self-review before CI could; the self-test's exit-code case below
        # is what makes such a crash loud instead of a false green.
        run: uv python install 3.12 3.14

      - name: Set up Node.js (prettier / eslint / tsc hooks)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (eslint/tsc hooks are system language)
        run: cd frontend && npm ci

      - name: Install hadolint (Dockerfile hook, system language)
        # language: system — the hook needs hadolint ON PATH. First attempt
        # (hadolint-action v3.3.0) was an executor misuse caught by CI at run
        # 37807695759: it docker-runs its OWN lint of one dockerfile input
        # (failed: "hadolint: Dockerfile: does not exist"), and v3.3.0 has no
        # hadolint-release input at all. So: fetch the official static binary,
        # pinned by tag AND verified against the sha256 the GitHub release API
        # publishes as that asset's digest (verified against downloaded bytes
        # in the sandbox, 2026-10-08). v2.15.1 is the version the config's own
        # comment adjudicated: its extra info/warning advisories stay
        # non-blocking under the hook's --failure-threshold error.
        run: |
          mkdir -p "$RUNNER_TEMP/hadolint-bin"
          curl -fsSL -o "$RUNNER_TEMP/hadolint-bin/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  $RUNNER_TEMP/hadolint-bin/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint-bin/hadolint"
          # GITHUB_PATH serves LATER steps (the hook finds hadolint there);
          # it does NOT update PATH inside this step, so export it here too
          # — otherwise the --version sanity below is a 127 on a good install.
          echo "$RUNNER_TEMP/hadolint-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/hadolint-bin:$PATH"
          hadolint --version

      - name: Install hook runners
        # pre-commit itself is the runner (not installed anywhere in CI today);
        # the CLI on PATH also serves the regenerate-secrets-baseline hook.
        run: uv tool install pre-commit==${{ env.PRE_COMMIT_VERSION }}

      - name: Cache pre-commit environments
        # Version in the key: bumping PRE_COMMIT_VERSION must not reuse envs
        # built by the old runner.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.PRE_COMMIT_VERSION }}-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Hooks gate-test self-test (B1.3 class)
        # The job must prove its own hooks catch the fixture class that
        # motivated it: `secret = "webhook-secret"` in a test file — exactly
        # the line #6888 had to nosemgrep (verified exit 1 in-sandbox:
        # detect-secrets AND semgrep both fail on it). If the hooks PASS it,
        # this job is hollow (misinstalled runner, config drift) — say so
        # instead of reporting a silent green.
        run: |
          cat > backend/tests/unit/test_o112_hooks_selftest.py <<'PY'
          """O1.12 gate self-test - written by CI, never committed."""


          def test_o112_hooks_selftest():
              secret = "webhook-secret"
              assert secret
          PY
          rc=0
          pre-commit run --files backend/tests/unit/test_o112_hooks_selftest.py || rc=$?
          rm -f backend/tests/unit/test_o112_hooks_selftest.py
          # Discriminate the exit code — a CRASH is not detection:
          #   1  hooks FAILED the fixture  -> the invariant this job exists for
          #   0  hooks PASSED the fixture  -> job is hollow (misinstall/drift)
          #   >=2 pre-commit itself died   -> e.g. missing interpreter, env
          #       build failed; claiming "self-test OK" here would be the
          #       false green WP0.6 doctrine exists to kill
          case "$rc" in
            1) echo "self-test OK: the hooks fail on the B1.3/#6888 fixture class" ;;
            0) echo "::error::O1.12 self-test: the hooks PASSED a #6888-class fixture — this job is hollow"
               exit 1 ;;
            *) echo "::error::O1.12 self-test: pre-commit exited $rc — a crash is not proof of detection"
               exit 1 ;;
          esac

      - name: Hooks over the PR's changed files
        # The push-delta form: base..head, exactly what a push's pre-commit
        # stage would check. (Deliberately NOT gated on detect-changes file
        # filters — hooks select by their own files:/types:, and this job must
        # run on EVERY PR per the O1.12 Done-when.)
        #
        # Owner ruling 24 (c) (2026-10-09): a fixer hook rewriting the tree
        # used to fail as pre-commit's own "files were modified by this
        # hook" — it names the hook and buries the files. Here a rewritten
        # file IS the finding: each dirty path gets a ::error:: annotation
        # plus the diff (prettier --check style), then the tree is restored
        # to HEAD and the step fails. A genuine hook failure (clean tree,
        # rc>=1) still exits with pre-commit's own code, output untouched.
        run: |
          set +e            # this step inspects exit codes itself; -e would abort before classifying
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pre-commit run --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD
            rc=$?
          elif git rev-parse --verify -q 'HEAD^' >/dev/null; then
            pre-commit run --from-ref 'HEAD^' --to-ref HEAD
            rc=$?
          else
            echo "no parent commit to compare (first commit) — nothing to run"
            exit 0
          fi
          # pre-commit STAGES the files it rewrote, so plain `git checkout
          # -- .` would restore the rewritten bytes straight back out of the
          # index; reset --hard is the only restore that means HEAD.
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo
            # "hook", not "formatter": the first real violator of this
            # step (this PR's own run) was detect-secrets rewriting
            # .secrets.baseline — line resyncs, new findings, stale prunes.
            # The rewrite itself is usually correct; what's missing is the
            # commit of the hook's own output.
            echo "=== Hook-rewrite fixpoint violation (owner ruling 24 (c)) ==="
            # porcelain v1: "XY path", renames as "XY old -> new" (keep new)
            printf '%s\n' "$dirty" | sed -E 's/^..[ ]//; s/.* -> //' | while IFS= read -r f; do
              echo "::error file=$f::$f is not at its hook's fixpoint — run 'pre-commit run --files $f' and commit the hook's rewrite"
            done
            git --no-pager diff --stat HEAD
            git --no-pager diff HEAD | head -n 200
            git reset -q --hard
            [ "$rc" -eq 0 ] && rc=1
          fi
          exit "$rc"

  # Backend Jobs

  # Shared backend dependencies - built once, used by all backend jobs
  build-backend-deps:
    name: Build Backend Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      needs.detect-changes.outputs.should-run-all == 'true' ||
      needs.detect-changes.outputs.backend == 'true'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        # WP3.2: cache-suffix "backend-deps" put this pre-warm in a namespace
        # none of the 13 downstream backend jobs read (they all use setup-uv's
        # default cache key). Dropped rather than mirrored onto 13 jobs —
        # one shared namespace, one line, no drift risk.
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Verify installation
        run: uv run python -c "import pytest; print('Dependencies ready')"

  lint:
    name: Backend Lint (Ruff) - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes, build-backend-deps]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.backend == 'true') &&
      needs.build-backend-deps.result != 'failure'
      )
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff check
        run: uv run ruff check backend/ synthbench/

      - name: Ruff format check
        run: uv run ruff format --check backend/ synthbench/

      - name: Complexity check (Radon)
        run: |
          uv run radon cc backend/ -a -nc
          uv run radon mi backend/ -nc

  typecheck:
    name: Backend Type Check (Mypy) - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes, build-backend-deps]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.backend == 'true') &&
      needs.build-backend-deps.result != 'failure'
      )
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Mypy
        run: uv run mypy backend/ synthbench/ --ignore-missing-imports

  # Backend unit tests split into 4 shards for faster execution
  unit-tests:
    name: Backend Unit Tests (${{ matrix.shard }}/4) - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
        shard: [1, 2, 3, 4]
    # Wait for lint to pass first - fail fast on code quality issues
    # This saves CI minutes by not running expensive tests when lint fails
    # Skip if only frontend/docs changed (checked via detect-changes)
    needs: [detect-changes, lint, build-backend-deps]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.backend == 'true') &&
      needs.lint.result != 'failure' &&
      needs.build-backend-deps.result != 'failure'
      )
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/security_test # pragma: allowlist secret
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/security_test # pragma: allowlist secret
      LOG_DB_ENABLED: 'false'
      ENVIRONMENT: development # Avoid production password validation in CI
      FLAKY_TEST_RESULTS_FILE: flaky-test-tracking-unit-shard-${{ matrix.shard }}.jsonl
      # WP5.1: pytest-cov's DATA file, not just the XML. Named non-hidden
      # because upload-artifact v6 drops dotfiles unless include-hidden-files,
      # and the merge job's combine needs the measured data, which XML cannot
      # carry across runners (line numbers survive, merge semantics don't).
      COVERAGE_FILE: coverage-unit-shard-${{ matrix.shard }}-py${{ matrix.python-version }}.dat
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Pin the compose CLI the render gates are certified against
        # [r162] Same pin as the collection-sanity job (see its step for the
        # full measurement): this shard's unit tier renders docker-compose.prod
        # .yml too -- backend/tests/unit/core/{test_compose_render_lists_ai_vlm,
        # test_frontend_expose_lan_bind,test_monitoring_expose_lan_credentials}
        # .py -- so it needs the same compose v5.5.1 the include: merge is
        # certified on. The postgres service above is created by the RUNNER's
        # own docker, not by `docker compose`, so overriding the compose plugin
        # here cannot disturb it.
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL -o "$HOME/.docker/cli-plugins/docker-compose" \
            https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64
          echo "db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c -
          chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version

      - name: Run unit tests with coverage (shard ${{ matrix.shard }}/4)
        # Unit coverage here is COLLECTED, not gated (see --cov-fail-under=0
        # below). A7.1 record: the executed absolute floor is 80% combined
        # (validate.sh / nightly-full-gate); pyproject fail_under=85 is the
        # PR diff gate's relative baseline. The old "should reach 95%"
        # comment matched no gate that exists.
        # -n auto enables xdist parallelization with worksteal scheduler within shard
        # --timeout=60 (WP1.4): the old --timeout=0 made backend/tests/conftest.py
        # disable EVERY per-test timeout, so the REQUIRED tier was blind to hangs —
        # a hung test waited out the 15-min job cap, the shard ended `cancelled`,
        # and the (then-forgiving) summary waved it through. Measured (WP1.4):
        # 447,391 unit rows over 17 TPA-red corpora + green main 35486259345, max
        # 19.02s, ZERO over 20s — 60 is 3.2x the worst sample and equals TPA's
        # SLOW_TEST_THRESHOLD, so the tier watchdog never fails a test the audit's
        # own slow list forgives; it only turns a hang into a named 60s FAILURE.
        # Duration discipline stays TPA's job (persistence rule), not the tier's.
        # --cov-fail-under=0 disables threshold check here (checked after combining coverage)
        # pytest-split groups tests by --group for cross-runner sharding
        # --randomly-seed=run_id (WP2.1): the repo addopts carry -p randomly, and
        # pytest-randomly draws a fresh seed PER PROCESS. Each shard job shuffled
        # the suite differently BEFORE pytest-split sliced it, so the four --group
        # slices overlapped and the run executed a fraction of the tier. Measured
        # 2026-09-20: run 35475023071's junits hold 27,647 case rows but only
        # 18,520 unique tests (67%); collect-only reproduces it (random seeds ->
        # union 18,256/27,555, pairwise overlap 1,449; fixed seed -> union
        # 27,555/27,555, overlap 0). coverage-baseline.json therefore undercounted
        # the unit tier by ~14pp (70.3 published vs 84.1 executed). github.run_id
        # is identical across the four shard jobs (disjoint groups) and differs
        # next run (order randomization keeps its cross-run value). Pinned by
        # scripts/test_coverage_denominator.py.
        run: |
          uv run pytest backend/tests/unit/ \
            -n auto --dist=worksteal \
            --splits 4 --group ${{ matrix.shard }} \
            --splitting-algorithm=least_duration \
            --randomly-seed=${{ github.run_id }} \
            --timeout=60 \
            --cov=backend \
            --cov-config=pyproject.toml \
            --cov-fail-under=0 \
            --cov-report=term-missing \
            --cov-report=xml:coverage-unit-shard-${{ matrix.shard }}.xml \
            --junit-xml=test-results-unit-shard-${{ matrix.shard }}.xml \
            --durations=20 \
            -v

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-unit-shard-${{ matrix.shard }}-py${{ matrix.python-version }}
          path: |
            test-results-unit-shard-${{ matrix.shard }}.xml
            flaky-test-tracking-unit-shard-${{ matrix.shard }}.jsonl
          retention-days: 7

      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # WP5.1: carries the pytest-cov DATA file (via COVERAGE_FILE, named
          # non-hidden .dat) alongside the per-shard XML. The merge job combines
          # the .dat files — that is what finally makes `merged=true` real and
          # lets coverage-baseline.json publish (WP0.9). Keep the XML for
          # Codecov. Artifact NAME unchanged: the merge's download glob and
          # test_shard_retry_wiring.py's coupling pin depend on it.
          name: coverage-unit-shard-${{ matrix.shard }}-py${{ matrix.python-version }}
          path: |
            coverage-unit-shard-${{ matrix.shard }}.xml
            coverage-unit-shard-${{ matrix.shard }}-py${{ matrix.python-version }}.dat
          retention-days: 7

  # Merge coverage from all unit test shards and verify threshold
  unit-tests-coverage-merge:
    name: Backend Unit Tests Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes, unit-tests]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.backend == 'true')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Download all coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-unit-shard-*
          path: coverage-reports/
          merge-multiple: true

      - name: List coverage files
        run: find coverage-reports/ -name "*.xml" | head -20

      - name: Combine and check coverage threshold
        id: combine
        run: |
          # WP5.1: combine the shard DATA files from the download dir.
          # Before this fix the shards only uploaded Cobertura XML, this
          # glob looked for `.coverage.*` in the job CWD (where nothing
          # ever lands — download-artifact writes coverage-reports/),
          # so the else-branch vacuous `touch .coverage` ran on EVERY run,
          # merged=true never fired, and the 85% floor was enforced by
          # zero gates on a PR. combine deletes its inputs by design; the
          # XML copies under coverage-reports/ stay for Codecov.
          echo "Available coverage files:"
          find coverage-reports/ -type f | head -20 || true

          # Only run combine if DATA files exist
          if compgen -G "coverage-reports/*.dat" > /dev/null 2>&1; then
            uv run coverage combine --data-file=.coverage coverage-reports/*.dat
            uv run coverage xml -o coverage-unit.xml --rcfile=/dev/null
            echo "Coverage merged successfully"
            # WP0.9: publish a machine-readable baseline from REAL merged data
            # only. The else-branch `touch .coverage` vacuous fill (logged as a
            # residual in the WP0.6 ledger row) must never mint a baseline —
            # merged=true is set exclusively on this path.
            # --fail-under=0 here is number EXTRACTION, not a floor change:
            # [tool.coverage.report] fail_under=85 would make this command exit
            # 1 and redden the job (and drop the codecov artifact) exactly when
            # coverage moves. The 85% floor lives in the diff gate (WP0.9) and
            # the ci-gate checks — same rationale as the shard jobs'
            # --cov-fail-under=0.
            total="$(uv run coverage report \
              --data-file=.coverage --format=total --fail-under=0)"
            # WP2.2: --format=total is the BLENDED statements+branches figure
            # (branch=true in pyproject; measured against this repo's coverage
            # 7.16.1: 84.12 blended vs 86.02 line vs 76.27 branch). Publishing
            # only it meant the number was neither line nor branch coverage and
            # neither of those existed anywhere. The json report is the only
            # place coverage emits the split; --fail-under=0 for the same
            # extraction-not-floor reason as the report call above. Repo config
            # is honored (pyproject omit/exclude_lines = the ONE shared
            # denominator, 78,916 stmts — see docs/developer/testing.md).
            uv run coverage json --data-file=.coverage \
              -o coverage-unit-totals.json --fail-under=0
            line="$(jq -r '.totals.percent_statements_covered_display' coverage-unit-totals.json)"
            branch="$(jq -r '.totals.percent_branches_covered_display' coverage-unit-totals.json)"
            # percent_covered stays the FIRST key and keeps its flat, parseable
            # shape — test-coverage-gate.yml fetches this artifact as
            # COVERAGE_BASE_JSON and check-test-coverage-gate.py reads the flat
            # key (scripts/test_coverage_denominator.py pins writer+reader
            # together; add siblings, never move it).
            printf '{"percent_covered": %s, "percent_line": %s, "percent_branch": %s, "source": "ci.yml unit-tests-coverage-merge @ %s"}\n' \
              "$total" "$line" "$branch" "${GITHUB_SHA}" > coverage-baseline.json
            cat coverage-baseline.json
            echo "Unit merged coverage: **line ${line}%** / **branch ${branch}%** (blended ${total}% published as percent_covered)" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "merged=true" >> "$GITHUB_OUTPUT"
            # WP2.3 (R-1): the ABSOLUTE floor at the MEASURED value. WP2.3
            # wired the enforcement but had to keep 70: the only post-WP2.1
            # measurements then were pending (70 was the pre-pin published
            # lineage, which WP2.1 proved was a shard-overlap UNDERCOUNT).
            # WP2.5 (AUDIT §2.1/B-2) re-measures from five seed-pinned runs:
            # 84.12 local single-process, 84.11 local 4-shard sim, and CI
            # runs 35502275842/35503899696/35506580757 published 84.11/84.11/
            # 84.09. Observed spread 0.03pp -> floor = observed minimum
            # 84.09 floored to 84. A 70 floor on a tier that measures 84.09+
            # would let a 14-point collapse ship green — the floors-are-
            # decorative class WP2.5 exists to close. R-1: floor AT measured,
            # never above (first run under 84 is a real signal, not flake).
            # Before WP2.3 this step extracted a number and enforced nothing
            # anywhere. Enforce ONLY on a fully-passed tier
            # (needs.unit-tests) — a red shard means partial data, and
            # partial data under a floor is a test failure wearing a coverage
            # costume (the WP2.3 class). A floor-red run exits BEFORE
            # "Publish coverage baseline" runs, so main's published baseline
            # stays the last honest number instead of promoting the sub-floor
            # run to be everyone's diff base.
            if [ '${{ needs.unit-tests.result }}' = 'success' ]; then
              if awk "BEGIN{exit !($total < 84)}"; then
                echo "::error::FLOOR FAIL (unit) merged coverage ${total}% < floor 84 (R-1 measured: five seed-pinned runs 84.09-84.12, WP2.5)"
                exit 1
              fi
              echo "FLOOR PASS (unit): ${total}% >= 84"
            else
              echo "::warning::unit tier result '${{ needs.unit-tests.result }}' — absolute floor NOT enforced on partial data (the tier's own red is the real verdict)"
            fi
          else
            echo "::warning::No coverage files found to merge"
            # Create empty coverage files to prevent downstream failures
            touch .coverage
            touch coverage-unit.xml
          fi

      # WP0.9: main-only. test-coverage-gate.yml fetches this artifact from the
      # latest successful main run as COVERAGE_BASE_JSON, so PRs diff against
      # main's real merged number without re-running the suite on base.
      - name: Publish coverage baseline (main)
        if: steps.combine.outputs.merged == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-baseline
          path: coverage-baseline.json
          retention-days: 30

      - name: Upload merged unit test coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage-unit.xml
          flags: backend-unit
          fail_ci_if_error: false

  # Summary job for branch protection - aggregates all unit test shards
  unit-tests-summary:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes, unit-tests, collection-sanity]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && !cancelled() }}
    steps:
      - name: Check unit test shard results
        run: |
          # Skip check if tests were skipped due to no backend changes
          if [ "${{ needs.detect-changes.outputs.should-run-all }}" != "true" ] && \
             [ "${{ needs.detect-changes.outputs.backend }}" != "true" ]; then
            echo "Backend tests skipped - no backend changes detected"
            echo "## Backend Unit Tests" >> $GITHUB_STEP_SUMMARY
            echo "Skipped - no backend changes detected" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # WP1.4: cancelled is not a verdict (WP0.5's rule, extended — that fix
          # covered only the integration API shard). A shard killed at the job cap
          # used to fall through "== failure" to the green branch below.
          # skipped stays forgiven: a never-run shard is not a verdict (same stance
          # as ci-gate's check_job).
          UNIT_RESULT="${{ needs.unit-tests.result }}"
          if [ "$UNIT_RESULT" == "failure" ] || [ "$UNIT_RESULT" == "cancelled" ]; then
            echo "One or more unit test shards failed or were cancelled (result: $UNIT_RESULT)"
            exit 1
          fi
          echo "All unit test shards passed"

  # Integration tests split into 4 domain-based parallel jobs for faster execution
  # Each job runs tests for a specific domain with within-shard parallelization
  #
  # The API tier DELEGATES to .github/workflows/integration-shard.yml (reusable
  # workflow) so the primary and the slow-runner RETRY below cannot drift apart
  # -- WP4.3's mutmut 2.x flag rot was exactly what N independent copies of one
  # procedure fester into. The reusable file's header carries the 2026-09-18
  # shard-1/2 evidence and the two owner rulings it encodes: the retry fires on
  # `cancelled` ONLY, and the 30-min cap stays UNRAISED (raising it to pass is
  # gate-widening). scripts/test_shard_retry_wiring.py pins both.
  integration-tests-api:
    name: Integration Tests (API shard ${{ matrix.shard }}/4)
    uses: ./.github/workflows/integration-shard.yml
    secrets: inherit # pragma: allowlist secret (detect-secrets: `secrets:` kwarg, no value)
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
        # 4-way split. SUPERSEDES WP3.7's 2-way (run 35178314774: single job
        # compute 1437s, +24.8 min after run start vs <= +10.1 min for every
        # other path). WP3.7's reasoning was right and its 2-way was the right
        # call THEN; this widens it on newer evidence, it does not overturn it.
        #
        # Re-measured 2026-09-19 from run 35455064785's own junit artifacts:
        # 833 cases, 2755.5s junit-sum, and the tier is the DAG's long pole on
        # the unlimited-capacity critical path (detect-changes 16s +
        # build-backend-deps 42s + integration-tests-api 859s + perf-audit 59s
        # + ci-gate 3s = 979s, i.e. this job is 88% of the floor).
        #
        # Why 4 is safe where Vitest's 8->4 was not: this tier runs -n auto
        # (xdist) INSIDE each shard, so splitting multiplies runners without
        # losing in-shard parallelism. Measured wall 14.3m (shard 1) / 11.9m
        # (shard 2) against a junit-sum of 25.3m/20.7m -> ~1.8x in-shard
        # speedup that survives the split.
        #
        # Why it was urgent: at 2-way, shard wall time sits close enough to
        # GitHub's 30m0s job cap that contention pushes it over. Observed twice
        # on 2026-09-19 (runs 35461092103 shard 1/2, 35461901025 shard 2/2),
        # both CANCELLED at the cap, both recovered only by the WP0.5 retry.
        # Ideal duration-balanced 4-way is 653.4s junit (~6.2m wall) -- roughly
        # 5x cap headroom instead of ~2x.
        #
        # 2026-10-09 (batch-9 row 2): the tracked durations file landed. With
        # no .test_durations pytest-split count-balanced, and because
        # pytest-randomly permutes whole module files as blocks, count-balance
        # was not time-balance: run 37940703535's shards held 7851/7851/7851/
        # 7849 tests but 168.2/166.8/148.3/76.2s of junit time (2.207x spread).
        # The committed file plus --splitting-algorithm=least_duration closes
        # that AND makes placement a function of the tree, not the seed (the
        # per-run reshuffle measured 76.9%); see scripts/test_shard_durations.py.
        shard: [1, 2, 3, 4]
    # Run in parallel with lint - dependencies checked in integration-tests-summary
    # Skip if only frontend/docs changed (checked via detect-changes)
    needs: [detect-changes, build-backend-deps]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.backend == 'true') &&
       needs.build-backend-deps.result != 'failure'
      )
    with:
      shard: ${{ matrix.shard }}
      python-version: ${{ matrix.python-version }}
      artifact-suffix: ''

  # Slow-runner recovery (WP0.5 follow-through, owner ruling 2026-09-18):
  # shard 1/2 degraded across three full attempts of the SAME commit --
  # 23m54s pass -> per-test 30s timeouts -> cancelled at the 30m job cap
  # (run 35353201418, 2026-09-18). Runner degradation, not code -- and a
  # retry INSIDE a job cannot recover that terminal mode (the cap the first
  # attempt exhausted is the constraint), so recovery is a FRESH JOB with a
  # fresh budget, gated on result == 'cancelled' ONLY. Never 'failure': a
  # slow-runner failure is indistinguishable from a regression and stays red
  # for the owner (retry-masking real failures is the class WP0.5 ruled
  # against). integration-tests-summary folds this job's green into the
  # roll-up, so CI Gate still sees ONE integration verdict.
  integration-tests-api-retry:
    name: Integration Tests (API shard ${{ matrix.shard }}/4) RETRY
    uses: ./.github/workflows/integration-shard.yml
    secrets: inherit # pragma: allowlist secret (detect-secrets: `secrets:` kwarg, no value)
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
        shard: [1, 2, 3, 4]
    needs: [integration-tests-api]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      !cancelled() &&
      needs.integration-tests-api.result == 'cancelled'
      )
    with:
      shard: ${{ matrix.shard }}
      python-version: ${{ matrix.python-version }}
      artifact-suffix: '-retry'

  integration-tests-websocket:
    name: Integration Tests (WebSocket) - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    # Run in parallel with lint - dependencies checked in integration-tests-summary
    # Skip if only frontend/docs changed (checked via detect-changes)
    needs: [detect-changes, build-backend-deps]
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
      && (
      !cancelled() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.backend == 'true') &&
      needs.build-backend-deps.result != 'failure'
      )
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/security_test # pragma: allowlist secret
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/security_test # pragma: allowlist secret
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      LOG_DB_ENABLED: 'false'
      ENVIRONMENT: development # Avoid production password validation in CI
      CI: 'true'
      FLAKY_TEST_RESULTS_FILE: flaky-test-tracking-integration-websocket.jsonl
      # WP5.1: non-hidden pytest-cov DATA file for the merge combine
      COVERAGE_FILE: coverage-integration-websocket-py${{ matrix.python-version }}.dat
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run WebSocket integration tests
        # WebSocket tests: test_websocket*.py, test_broadcast*.py, test_pubsub*.py
        # -n0 runs tests serially to avoid database deadlocks from concurrent schema creation
        run: |
          set -euo pipefail
          RERUNS=""
          if [ -f .github/flake-allowlist.yml ]; then
            RERUNS=$(uv run --no-project python scripts/flake-k-filter.py 2>/dev/null || true)
          fi
          if [ -n "$RERUNS" ]; then
            echo "Rerunning registered flakes: $RERUNS"
            uv run pytest backend/tests/integration/ -k "$RERUNS" -n0 --timeout=30 \
              --reruns 2 --reruns-delay 5 || true
          fi
          uv run pytest backend/tests/integration/ \
            -k "test_websocket or test_system_broadcaster or test_redis_pubsub" \
            -n0 \
            --timeout=30 \
            --cov=backend \
            --cov-fail-under=0 \
            --cov-report=xml:coverage-integration-websocket.xml \
            --cov-report=term-missing \
            --junit-xml=test-results-integration-websocket.xml \
            --durations=20 \
            -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-integration-websocket-py${{ matrix.python-version }}
          path: |
            test-results-integration-websocket.xml
            flaky-test-tracking-integration-websocket.jsonl
          retention-days: 7

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # WP5.1: DATA file rides with the XML for the merge combine
          name: coverage-integration-websocket-py${{ matrix.python-version }}
          path: |
            coverage-integration-websocket.xml
            coverage-integration-websocket-py${{ matrix.python-version }}.dat
          retention-days: 7

