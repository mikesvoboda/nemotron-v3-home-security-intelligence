  # Merge coverage from all integration test shards
  integration-coverage-merge:
    name: Merge Integration Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      [
        detect-changes,
        integration-tests-api,
        integration-tests-api-retry,
        integration-tests-websocket,
        integration-tests-services,
        integration-tests-models,
      ]
    if: |
      always() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.backend == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # WP5.1: combine needs `coverage` installed — same setup as the unit
      # merge job above (mirrored, kept honest by test_github_workflows'
      # TestIntegrationCoverageMergeWiring, which asserts this job has these
      # steps before the combine step runs).
      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Download all coverage artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: coverage-integration-*
          path: coverage-reports/
          merge-multiple: true

      - name: List coverage files
        run: find coverage-reports/ -name "*.xml" | head -20

      # WP5.1/A2: this merge was download -> find -> Codecov with NO combine
      # step, so the integration tier never produced a single real percentage.
      # It now combines the .dat data files into one measurement. Per the
      # "make it compute, don't make it gate" split this REPORTS the number to
      # the step summary and does NOT enforce a threshold — R-COVDENOM
      # (parked, L) decides whether "combined" is the denominator and whether
      # it ever gates. combine consumes its inputs; the XML copies stay for
      # Codecov.
      - name: Combine integration coverage
        run: |
          if compgen -G "coverage-reports/*.dat" > /dev/null 2>&1; then
            uv run coverage combine --data-file=.coverage-integration coverage-reports/*.dat
            total="$(uv run coverage report --data-file=.coverage-integration \
              --format=total --fail-under=0)"
            echo "Integration merged coverage: ${total}% (reported only — R-COVDENOM gates nothing)" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "percent=${total}"
          else
            echo "::warning::no integration .dat data files found to combine"
          fi

      - name: Upload merged coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          directory: coverage-reports/
          flags: backend-integration
          fail_ci_if_error: false

  # Summary job for branch protection - aggregates all integration test shards
  integration-tests-summary:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        detect-changes,
        lint,
        collection-sanity,
        integration-tests-api,
        integration-tests-api-retry,
        integration-tests-websocket,
        integration-tests-services,
        integration-tests-models,
      ]
    if: always()
    steps:
      - name: Check integration test results
        run: |
          # Skip check if tests were skipped due to no backend changes
          if [ "${{ needs.detect-changes.outputs.should-run-all }}" != "true" ] && \
             [ "${{ needs.detect-changes.outputs.backend }}" != "true" ]; then
            echo "Integration tests skipped - no backend changes detected"
            echo "## Backend Integration Tests" >> $GITHUB_STEP_SUMMARY
            echo "Skipped - no backend changes detected" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # CANCELLED IS NOT A VERDICT — it's the slow-runner class (WP0.5
          # ruling, 2026-09-18). The bug this replaces: this gate only turned
          # red on the literal "failure", so a shard cancelled at GitHub's
          # 30m job cap fell through to "All integration tests passed" and CI
          # Gate — the repo's only branch-protection context — went green on
          # run 35353201418 attempt 4 with the tier dead. A cancelled API
          # shard now stays red UNLESS the slow-runner retry ran and passed.
          API_RESULT="${{ needs.integration-tests-api.result }}"
          API_RETRY="${{ needs.integration-tests-api-retry.result }}"
          if [ "$API_RESULT" == "cancelled" ] && [ "$API_RETRY" != "success" ]; then
            echo "API integration shard cancelled; slow-runner retry did not pass (retry result: $API_RETRY)"
            exit 1
          fi

          if [ "$API_RESULT" == "failure" ] || \
             [ "${{ needs.integration-tests-websocket.result }}" == "failure" ] || \
             [ "${{ needs.integration-tests-services.result }}" == "failure" ] || \
             [ "${{ needs.integration-tests-models.result }}" == "failure" ]; then
            echo "One or more integration test jobs failed"
            exit 1
          fi
          echo "All integration tests passed"

  # Contract tests for API schema validation
  # Main-only: redundant with api-types-check, runs post-merge for validation
  contract-tests:
    name: Contract Tests (API Schema)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run contract tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/security_test # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379/15
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          LOG_DB_ENABLED: 'false'
          ENVIRONMENT: development # Avoid production password validation in CI
        run: |
          uv run pytest backend/tests/contracts/ \
            -n0 \
            --timeout=30 \
            -v \
            --junit-xml=test-results-contracts.xml \
            --durations=10

      - name: Upload contract test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results-contracts
          path: test-results-contracts.xml
          retention-days: 7

      - name: Create Linear issue on failure
        if: failure()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          TITLE="[CI] Contract Tests failed on main"

          # Check for existing open issue with same title
          EXISTING=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d '{
              "query": "query SearchIssues($filter: IssueFilter) { issues(filter: $filter) { nodes { id identifier } } }",
              "variables": {
                "filter": {
                  "team": { "key": { "eq": "NEM" } },
                  "title": { "eq": "'"$TITLE"'" },
                  "state": { "type": { "nin": ["completed", "canceled"] } }
                }
              }
            }')

          EXISTING_ID=$(echo "$EXISTING" | jq -r '.data.issues.nodes[0].id // empty')

          if [ -n "$EXISTING_ID" ]; then
            # Add comment to existing issue
            COMMENT="**Another failure detected**\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateComment($input: CommentCreateInput!) { commentCreate(input: $input) { success } }",
                "variables": {
                  "input": {
                    "issueId": "'"$EXISTING_ID"'",
                    "body": "'"$COMMENT"'"
                  }
                }
              }'
            echo "Added comment to existing issue"
          else
            # Create new issue
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateIssue($input: IssueCreateInput!) { issueCreate(input: $input) { success issue { identifier url } } }",
                "variables": {
                  "input": {
                    "teamId": "998946a2-aa75-491b-a39d-189660131392",
                    "title": "'"$TITLE"'",
                    "description": "Contract tests failed after merge to main.\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease investigate and fix.",
                    "priority": 2
                  }
                }
              }'
            echo "Created new issue"
          fi

  # Main-only: dead code detection runs post-merge for code hygiene
  dead-code:
    name: Dead Code Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run Vulture (dead code detection)
        run: uv run vulture backend/ vulture_whitelist.py --config pyproject.toml

      - name: Create Linear issue on failure
        if: failure()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          TITLE="[CI] Dead Code Detection failed on main"

          # Check for existing open issue with same title
          EXISTING=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d '{
              "query": "query SearchIssues($filter: IssueFilter) { issues(filter: $filter) { nodes { id identifier } } }",
              "variables": {
                "filter": {
                  "team": { "key": { "eq": "NEM" } },
                  "title": { "eq": "'"$TITLE"'" },
                  "state": { "type": { "nin": ["completed", "canceled"] } }
                }
              }
            }')

          EXISTING_ID=$(echo "$EXISTING" | jq -r '.data.issues.nodes[0].id // empty')

          if [ -n "$EXISTING_ID" ]; then
            # Add comment to existing issue
            COMMENT="**Another failure detected**\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateComment($input: CommentCreateInput!) { commentCreate(input: $input) { success } }",
                "variables": {
                  "input": {
                    "issueId": "'"$EXISTING_ID"'",
                    "body": "'"$COMMENT"'"
                  }
                }
              }'
            echo "Added comment to existing issue"
          else
            # Create new issue
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateIssue($input: IssueCreateInput!) { issueCreate(input: $input) { success issue { identifier url } } }",
                "variables": {
                  "input": {
                    "teamId": "998946a2-aa75-491b-a39d-189660131392",
                    "title": "'"$TITLE"'",
                    "description": "Dead code detection (Vulture) found issues after merge to main.\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease investigate and remove dead code.",
                    "priority": 3
                  }
                }
              }'
            echo "Created new issue"
          fi

  # Frontend Jobs

  api-types-check:
    name: API Types Contract Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    # Run when backend or frontend changes (contract spans both)
    if: |
      needs.detect-changes.outputs.should-run-all == 'true' ||
      needs.detect-changes.outputs.backend == 'true' ||
      needs.detect-changes.outputs.frontend == 'true'
    env:
      DATABASE_URL: postgresql://user:pass@localhost/db # pragma: allowlist secret
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: uv sync --extra dev --frozen

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Generate types from OpenAPI and check for diffs
        run: ./scripts/generate-types.sh --check

      - name: Check WebSocket types are current
        run: uv run python scripts/generate-ws-types.py --check

      - name: Check OpenAPI spec is current
        run: uv run python scripts/generate-openapi.py --check

      # WP7.1: the AI-tier contract registry (backend/ai_contract) is
      # generated from the deployed gateway adapters + client map + LLM wire;
      # a surface moved without regeneration goes red here, naming the file.
      - name: Check AI contract registry is current
        run: uv run python scripts/gen-ai-contract.py --check

      - name: Validate API type contract consistency
        run: ./scripts/validate-api-types.sh --verbose

  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.should-run-all == 'true' ||
      needs.detect-changes.outputs.frontend == 'true'
    env:
      NODE_VERSION: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: ESLint
        run: cd frontend && npm run lint

      - name: Dead code detection (Knip)
        # Non-blocking initially - reports issues without failing CI
        continue-on-error: true
        run: cd frontend && npx knip

  frontend-typecheck:
    name: Frontend Type Check (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.should-run-all == 'true' ||
      needs.detect-changes.outputs.frontend == 'true'
    env:
      NODE_VERSION: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript check
        run: cd frontend && npm run typecheck

  frontend-tests:
    name: Frontend Tests (Vitest ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    # WP3.5: 10 -> 20 min. Halving shards doubles per-shard compute (~204s ->
    # ~410s expected, max-shard extrapolation ~480s + install/teardown); the
    # cap stays a runaway guard, not a hair trigger.
    timeout-minutes: 20
    # Wait for lint to pass first - fail fast on code quality issues
    # Skip if only backend/docs changed (checked via detect-changes)
    needs: [detect-changes, frontend-lint]
    if: |
      always() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.frontend == 'true') &&
      needs.frontend-lint.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        # WP3.5: 16 -> 8 shards. Measured on run 35175054058 (Jobs API, queue
        # = started_at - queued/created_at, compute = completed - started):
        # shard queue median 573s (range 371-686) vs compute median ~204s --
        # the matrix waits 3x its own runtime for scheduler slots against the
        # WP3.1-measured ~20-job ceiling. 16+6+4 = 26 concurrent test jobs land
        # at once; halving Vitest puts the whole fan-out (57 -> 49) under the
        # cap so queue waits collapse. Per shard, compute roughly doubles
        # (~204s -> ~410s); the spec's own words: fewer, better-packed jobs
        # beat more shards until fan-out drops below the cap.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NODE_VERSION: '24'
      # 6GB heap with GC exposure - needed for Vitest itself
      # GitHub Actions runner has 7GB RAM
      # Deliberately NOT raised by the spec SS5.1 honesty change: the CI heap cap
      # moves only alongside a *measured* runner-OOM issue (spec SS3.3 follow-up /
      # SS5.1 measured-exception path). --expose-gc stays because
      # frontend/src/test/setup.ts calls global.gc() when it is available.
      NODE_OPTIONS: '--max-old-space-size=6144 --expose-gc'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # WP3.3: a previous "Restore npm cache with fallback" actions/cache step
      # here cached root node_modules alongside ~/.npm. Root node_modules is
      # never read by this job (npm ci runs in frontend/ and, being npm not
      # bun, deletes and reinstalls whatever is at its own target), and this
      # repo commits no root package-lock.json -- so the step could never
      # restore or save anything real. setup-node's cache: 'npm' (above) is
      # the one that actually works and stays.
      - name: Install dependencies with retry
        # npm ci can fail due to network issues, add retry logic for resilience
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3: Installing npm dependencies..."
            if cd frontend && npm ci; then
              echo "npm dependencies installed successfully"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "Installation failed, retrying in 10s..."
              sleep 10
            fi
          done
          echo "ERROR: Failed to install npm dependencies after 3 attempts"
          exit 1

      - name: Detect registered frontend flakes
        # T2's apply-flake-reruns convention, ported to vitest (spec SS5.2).
        # flake-k-filter.py prints allowlisted ids " or "-joined (pytest -k
        # syntax); vitest --testNamePattern is a JS regex, so the separators
        # become |. stdlib-only script, so bare python3 (this job has no uv
        # setup step). An empty allowlist (flakes: [] today) leaves the
        # pattern empty and the rerun step below is skipped entirely.
        run: |
          RERUNS=$(python3 scripts/flake-k-filter.py 2>/dev/null || true)
          echo "RERUN_PATTERN=${RERUNS// or /|}" >> "$GITHUB_ENV"
        shell: bash

      - name: Run registered flakes first (allowlist only; never masks verdict)
        if: env.RERUN_PATTERN != ''
        # Mirrors the pytest jobs' rerun block (ci.yml:455-463 et al.): runs
        # BEFORE the strict run, --retry 2 ~ --reruns 2, "|| true" ~ their
        # "|| true". Skipped while the allowlist is empty.
        run: |
          set -uo pipefail
          cd frontend
          npx vitest run --shard=${{ matrix.shard }}/8 \
            --testNamePattern="$RERUN_PATTERN" --passWithNoTests --retry 2 \
            --reporter=default --teardownTimeout=1000 2>&1 \
            | tee /tmp/vitest-rerun-${{ matrix.shard }}.log || true
        shell: bash

      - name: Run tests (shard ${{ matrix.shard }}/8)
        # Real exit code (fast-confidence-loop spec SS5.1). The previous step
        # grepped for the first 'passed' summary line, SIGKILLed vitest and
        # exit 0'd 5s later - an OOM workaround that also hid every failing
        # frontend test (the R-T7-VITEST class: 62 deterministic test-drift
        # failures invisible to CI, now quarantined in vite.config.ts).
        # Memory stays bounded exactly as before: sequential files within the
        # shard (fileParallelism default-off, spec SS3.3 - CI does NOT set
        # VITEST_PARALLEL unless a measured runner OOM is referenced, per
        # SS5.1's measured-exception path), pool=forks + isolate + the
        # 6144 MB job-level NODE_OPTIONS.
        # Shard tests across 16 runners for better memory distribution
        # Coverage collected per-shard and merged in frontend-coverage-merge job
        # NOTE: Do NOT add --coverage here - it triggers per-shard threshold checks
        # that fail because each shard only has ~6% of total coverage (with 16 shards)
        # If a runner OOM recurs with the real exit code, that is evidence for a
        # runner-size conversation (spec SS5.5), not for restoring the hack.
        env:
          # --teardownTimeout still travels here as a CLI flag; the npm-script
          # VITEST_HEAP_MB wrapper is bypassed on purpose - this step calls
          # npx directly, and NODE_OPTIONS (job env) is the heap lever in CI.
          VITEST_PARALLEL: '0'
        run: |
          set -euo pipefail
          cd frontend
          # tee's exit status is masked by the pipe - pipefail makes vitest's
          # status the step's verdict instead (the acceptance property).
          #
          # WP5.2: coverage is collected per shard now. The old comment here
          # said "Do NOT add --coverage" because per-shard threshold checks
          # fail at ~1/8 of the suite - right about the thresholds, wrong as
          # a reason to never measure. The thresholds are zeroed per shard
          # (vitest has no disable switch) and the real four-metric numbers
          # are computed in frontend-coverage-merge by
          # scripts/merge-shard-coverage.mjs. reportsDirectory is shard-
          # UNIQUE: all 8 shards writing coverage/coverage-final.json collide
          # under upload + download-artifact merge-multiple flattening.
          npx vitest run --shard=${{ matrix.shard }}/8 \
            --coverage --coverage.reporter=json \
            --coverage.reportsDirectory=coverage/shard-${{ matrix.shard }} \
            --coverage.thresholds.statements=0 \
            --coverage.thresholds.branches=0 \
            --coverage.thresholds.functions=0 \
            --coverage.thresholds.lines=0 \
            --reporter=default --teardownTimeout=1000 2>&1 \
            | tee /tmp/vitest-shard-${{ matrix.shard }}.log
        shell: bash

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-coverage-shard-${{ matrix.shard }}-of-8-node-${{ env.NODE_VERSION }}
          path: frontend/coverage/
          retention-days: 7

  # WP6.5: the ai/ tier (the deployed AI provider surface - Triton gateway
  # adapters + Triton client + per-service model servers) was NEVER run in CI:
  # no job invoked it and the collection checker only received backend and
  # frontend. WP6.1-6.4 un-darkened the tier (1764 collected / 0 collection
  # errors; ai/gateway 226 passed / 0 failed). Staged wiring: a collect-only
  # gate over the WHOLE tier (import-error-visible: triton shadowing, flat-slot
  # collisions - the WP6.2 class) plus RUN steps for subtrees green today.
  # Subtrees with WP6.4 ledger-classified parked reds (ai/yolo26,
  # ai/enrichment, ai/enrichment_light, ai/triton, ai/tests) join this run
  # list as each drains - recorded in the plan ledger, never quarantined, so a
  # parked-red subtree can never hold the branch red for a RECORDED reason.
  ai-tests:
    name: AI Tier Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes, build-backend-deps]
    # ai/** is already inside detect-changes' `backend` paths filter - no new
    # output key invented; same if-shape as the other backend jobs.
    if: |
      always() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.backend == 'true') &&
      needs.build-backend-deps.result != 'failure'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Collection gate (import errors fail the tier)
        # check-test-collection.py only AST-parses files - it passed clean
        # (0.159s, measured) on a tree with 19 collection errors. --collect-only
        # IMPORTS them, so the triton-package shadow and flat-module name
        # collisions WP6.1/WP6.2 fixed surface here as rc=2. Locally green:
        # 1764 collected, 0 errors.
        run: uv run pytest ai/ --collect-only -q --color=no

      - name: AI gateway suite (deployed provider)
        # 226 passed / 0 failed locally after WP6.4, no network required; the
        # repo addopts exclude -m gpu nodes by default.
        run: uv run pytest ai/gateway -q --color=no

  # A7.3 (WP6-A): model.py's `from contract import ...` is only valid once the
  # image ships contract.py flat next to it - the ONLY proof of a COPY is
  # building the image and importing the module (plan: "Without it the only
  # thing proving the COPY is reading the Dockerfile, and a mistake surfaces
  # on the GPU host rather than in a PR"). A7.3 licenses the Dockerfile edit
  # exactly under this job shipping in the same PR. Import is GPU-free: every
  # torch.cuda / YOLO() call in model.py sits behind a function boundary.
  ai-yolo26-image-smoke:
    name: AI YOLO26 Image Smoke (A7.3)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [detect-changes]
    # Runs when the image's flat /app COPY surface changes (any ai/yolo26
    # file - its sibling imports resolve flat in-container - or the four
    # ai/*.py modules the Dockerfile copies next to it), and unconditionally
    # on main.
    if: |
      always() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.ai_yolo26 == 'true')
    steps:
      - name: Free disk space
        # AI base image is multi-GB (NVIDIA tensorrt base + torch); same
        # cleanup the deploy.yml AI-image builders run.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ai/yolo26 image
        # No registry login: the tensorrt base pulls anonymously (deploy.yml
        # builds this same Dockerfile without an nvcr login). Retry mirrors
        # build-backend's stance on transient registry 502s during layer
        # writes - a deterministic Dockerfile breakage stays red (attempt 2
        # re-runs the same steps). PREBUILD_TENSORRT defaults off, so no GPU
        # is needed to build.
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 40
          max_attempts: 2
          command: |
            docker buildx build \
              --file ./ai/yolo26/Dockerfile \
              --tag ai-yolo26:smoke \
              --cache-from type=gha,scope=ai-yolo26 \
              --cache-to type=gha,mode=max,scope=ai-yolo26 \
              --load \
              .

      - name: Import model.py inside the image
        # The container's own startup path minus GPU work: ai-entrypoint.sh
        # execs "$@", so this replaces CMD python model.py with an import.
        # Full-identity assertions (unavailable repo-side, where conftest
        # keeps a package/bare dual-module pair): inside the image there is
        # ONE contract module, so model.py's symbols must BE the leaf's.
        run: |
          docker run --rm -i ai-yolo26:smoke python - <<'SMOKE'
          import contract
          import inspect
          import model

          for name in (
              "ConfidenceQuality",
              "compute_confidence_quality",
              "get_confidence_explanation",
              "SpatialContext",
              "compute_spatial_context",
              "EnhancedDetection",
              "enhance_detections",
          ):
              assert getattr(model, name) is getattr(contract, name), name
              assert getattr(model, name).__module__ == "contract", name
          # The A7.3 duplicate stays dead: model.py must not RE-declare the
          # seam (same ratchet TestContractSeam runs repo-side, now executed
          # inside the shipped artifact).
          src = inspect.getsource(model)
          assert "class ConfidenceQuality" not in src
          assert "def enhance_detections" not in src
          print("SMOKE OK: model.py imports; seam == contract leaf")
          SMOKE

  # Merge frontend coverage from all shards and upload to Codecov
  frontend-coverage-merge:
    name: Merge Frontend Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes, frontend-tests]
    if: |
      always() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.frontend == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'

      - name: Download all coverage artifacts
        # Downloads artifacts from all Node version + shard combinations
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: frontend-coverage-shard-*-node-*
          path: coverage-reports/
          merge-multiple: true

      - name: List coverage files
        run: find coverage-reports/ -name "*.json" -o -name "*.xml" | head -20

      # WP5.2: this job used to be download -> find -> Codecov — it merged
      # nothing and measured nothing. The merger is stdlib-only Node with its
      # own unit checks (node --test) that run HERE, before its numbers are
      # trusted — no npm ci needed for either.
      - name: Merge frontend coverage
        run: |
          node --test frontend/scripts/merge-shard-coverage-test.mjs
          node frontend/scripts/merge-shard-coverage.mjs coverage-reports/ --out coverage-merged

      # R-FEFLOOR (plan P ADDENDUM A3, parked): measured actuals sit 2.4-3.1
      # points under the declared thresholds 83/77/81/84. Publishing the four
      # numbers is WP5.2's remit; flipping enforcement is the owner's. This
      # step CANNOT redden the build (no process.exit on shortfall).
      - name: 'Report frontend coverage (R-FEFLOOR: not enforced)'
        run: |
          if [ -f coverage-merged/coverage-summary.json ]; then
            node -e '
              const s = require("./coverage-merged/coverage-summary.json").total;
              const line = `Frontend merged coverage — statements ${s.statements.pct}% (floor 83), branches ${s.branches.pct}% (floor 77), functions ${s.functions.pct}% (floor 81), lines ${s.lines.pct}% (floor 84). REPORTED ONLY — R-FEFLOOR parked, thresholds not enforced.`;
              console.log(line);
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
            '
          else
            echo "::warning::no merged frontend coverage summary — shards produced no coverage-final.json?"
          fi

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          directory: coverage-reports/
          flags: frontend
          fail_ci_if_error: false

  # Summary job for branch protection - aggregates all Vitest shards
  frontend-tests-summary:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes, frontend-tests, collection-sanity]
    if: always()
    steps:
      - name: Check shard results
        run: |
          # Skip check if tests were skipped due to no frontend changes
          if [ "${{ needs.detect-changes.outputs.should-run-all }}" != "true" ] && \
             [ "${{ needs.detect-changes.outputs.frontend }}" != "true" ]; then
            echo "Frontend tests skipped - no frontend changes detected"
            echo "## Frontend Tests (Vitest)" >> $GITHUB_STEP_SUMMARY
            echo "Skipped - no frontend changes detected" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "${{ needs.frontend-tests.result }}" == "failure" ]; then
            echo "One or more Vitest shards failed"
            exit 1
          fi
          echo "All Vitest shards passed"

  api-coverage:
    name: API Endpoint Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check API coverage
        run: ./scripts/check-api-coverage.sh

  # Primary E2E tests (Chromium) - required for merge
  # WP3.5: 6 -> 3 shards. Measured queue median ~386s vs compute median ~66s
  # (run 35175054058): these jobs queue 6x their own runtime, and playwright's
  # CI workers=4 already parallelizes within each shard. 3x compute (~66 ->
  # ~140s) is far under the queueing they pay today.
  frontend-e2e:
    name: E2E Tests (chromium ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Wait for lint to pass first - fail fast on code quality issues
    # Skip if only backend/docs changed (checked via detect-changes)
    needs: [detect-changes, frontend-lint]
    if: |
      always() &&
      (needs.detect-changes.outputs.should-run-all == 'true' ||
       needs.detect-changes.outputs.frontend == 'true') &&
      needs.frontend-lint.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    env:
      NODE_VERSION: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium with retry
        # Retry loop for browser installation (3 attempts with exponential backoff)
        # Handles transient network failures and concurrent installation conflicts
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3: Installing Playwright Chromium..."
            # Clean up any partial installation on retry
            if [ $attempt -gt 1 ]; then
              echo "Cleaning up partial installation before retry..."
              rm -rf ~/.cache/ms-playwright || true
            fi
            if cd frontend && npx playwright install chromium --with-deps 2>&1 | tee /tmp/playwright-install.log; then
              echo "Playwright Chromium installed successfully"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              wait_time=$((10 * attempt))
              echo "Installation failed, waiting ${wait_time}s before retry..."
              sleep $wait_time
            fi
          done
          echo "ERROR: Failed to install Playwright Chromium after 3 attempts"
          cat /tmp/playwright-install.log || true
          exit 1

      - name: Verify Playwright Chromium installation
        run: |
          if npx playwright --version; then
            echo "Playwright CLI verified"
          fi
          if [ -d ~/.cache/ms-playwright ]; then
            echo "Playwright cache directory exists:"
            ls -lah ~/.cache/ms-playwright/chromium-*/
          else
            echo "ERROR: Playwright cache directory not found"
            exit 1
          fi

      - name: Install Playwright system dependencies (if cached)
        # Only needed if browsers were already cached
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd frontend && npx playwright install-deps chromium

      - name: Run E2E tests (Chromium shard ${{ matrix.shard }}) with retry
        # Retry loop: 3 attempts with 10s wait between retries for transient failures
        # Browser installation issues are caught by separate installation step
        # Uses subshell () to ensure cd doesn't affect subsequent retry iterations
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if (cd frontend && npx playwright test --project=chromium --shard=${{ matrix.shard }}); then
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "Test failed, retrying in 10s..."
              sleep 10
            fi
          done
          exit 1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report-chromium-${{ strategy.job-index }}-node-${{ env.NODE_VERSION }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-test-results-chromium-${{ strategy.job-index }}-node-${{ env.NODE_VERSION }}
          path: frontend/test-results/
          retention-days: 7

  # Summary job for branch protection - aggregates all E2E shards
  frontend-e2e-summary:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [detect-changes, frontend-e2e]
    if: always()
    steps:
      - name: Check shard results
        run: |
          # Skip check if tests were skipped due to no frontend changes
          if [ "${{ needs.detect-changes.outputs.should-run-all }}" != "true" ] && \
             [ "${{ needs.detect-changes.outputs.frontend }}" != "true" ]; then
            echo "E2E tests skipped - no frontend changes detected"
            echo "## E2E Tests (Chromium)" >> $GITHUB_STEP_SUMMARY
            echo "Skipped - no frontend changes detected" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "${{ needs.frontend-e2e.result }}" == "failure" ]; then
            echo "One or more E2E shards failed"
            exit 1
          fi
          echo "All E2E shards passed"

  # Secondary E2E tests (Firefox/WebKit) - nightly schedule only to improve PR merge velocity
  # Intentionally kept on a single Node version (no matrix) to avoid excessive CI time
  # Nightly-only: Firefox/WebKit have known infrastructure flakiness (timeouts)
  # Move to nightly - too slow for every main push (20+ minutes)
  frontend-e2e-secondary:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright ${{ matrix.browser }} with retry
        # Retry loop for browser installation (3 attempts with exponential backoff)
        # Firefox/WebKit tend to have more infrastructure flakiness than Chromium
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3: Installing Playwright ${{ matrix.browser }}..."
            # Clean up any partial installation on retry
            if [ $attempt -gt 1 ]; then
              echo "Cleaning up partial installation before retry..."
              rm -rf ~/.cache/ms-playwright || true
            fi
            if cd frontend && npx playwright install ${{ matrix.browser }} --with-deps 2>&1 | tee /tmp/playwright-install.log; then
              echo "Playwright ${{ matrix.browser }} installed successfully"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              wait_time=$((10 * attempt))
              echo "Installation failed, waiting ${wait_time}s before retry..."
              sleep $wait_time
            fi
          done
          echo "ERROR: Failed to install Playwright ${{ matrix.browser }} after 3 attempts"
          cat /tmp/playwright-install.log || true
          exit 1

      - name: Verify Playwright ${{ matrix.browser }} installation
        run: |
          if npx playwright --version; then
            echo "Playwright CLI verified"
          fi
          if [ -d ~/.cache/ms-playwright ]; then
            echo "Playwright cache directory exists:"
            ls -lah ~/.cache/ms-playwright/ | grep -E "${{ matrix.browser }}|chromium"
          else
            echo "ERROR: Playwright cache directory not found"
            exit 1
          fi

      - name: Install Playwright system dependencies (if cached)
        # Only needed if browsers were already cached
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd frontend && npx playwright install-deps ${{ matrix.browser }}

      - name: Run E2E tests (${{ matrix.browser }}) with retry
        # Retry loop: 3 attempts with 10s wait between retries for transient test failures
        # Browser installation issues are caught by separate installation step
        # Uses subshell () to ensure cd doesn't affect subsequent retry iterations
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if (cd frontend && npx playwright test --project=${{ matrix.browser }}); then
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              wait_time=$((10 * attempt))
              echo "Test failed, waiting ${wait_time}s before retry..."
              sleep $wait_time
            fi
          done
          exit 1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-test-results-${{ matrix.browser }}
          path: frontend/test-results/
          retention-days: 7

      - name: Create Linear issue on failure
        if: failure()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          TITLE="[CI] E2E Tests (${{ matrix.browser }}) failed on main"

          # Check for existing open issue with same title
          EXISTING=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d '{
              "query": "query SearchIssues($filter: IssueFilter) { issues(filter: $filter) { nodes { id identifier } } }",
              "variables": {
                "filter": {
                  "team": { "key": { "eq": "NEM" } },
                  "title": { "eq": "'"$TITLE"'" },
                  "state": { "type": { "nin": ["completed", "canceled"] } }
                }
              }
            }')

          EXISTING_ID=$(echo "$EXISTING" | jq -r '.data.issues.nodes[0].id // empty')

          if [ -n "$EXISTING_ID" ]; then
            # Add comment to existing issue
            COMMENT="**Another failure detected**\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateComment($input: CommentCreateInput!) { commentCreate(input: $input) { success } }",
                "variables": {
                  "input": {
                    "issueId": "'"$EXISTING_ID"'",
                    "body": "'"$COMMENT"'"
                  }
                }
              }'
            echo "Added comment to existing issue"
          else
            # Create new issue
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateIssue($input: IssueCreateInput!) { issueCreate(input: $input) { success issue { identifier url } } }",
                "variables": {
                  "input": {
                    "teamId": "998946a2-aa75-491b-a39d-189660131392",
                    "title": "'"$TITLE"'",
                    "description": "E2E tests for ${{ matrix.browser }} failed after merge to main.\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease investigate - may be infrastructure flakiness or real test failure.",
                    "priority": 3
                  }
                }
              }'
            echo "Created new issue"
          fi

  # Build Jobs (main-only - verify Docker builds after merge)
  # Separate jobs for backend/frontend to avoid disk space issues

  build-backend:
    name: Build Docker (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Free disk space (minimal)
        # Remove only what's needed for Docker builds
        # Minimal cleanup is faster than full jlumbroso/free-disk-space action
        run: |
          # Remove only what's needed for Docker builds
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af --volumes
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image with retry
        # Retry logic for transient registry 502 errors
        # Docker registry can return 502 during layer blob writes due to infrastructure issues
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            docker buildx build \
              --file ./backend/Dockerfile \
              --target prod \
              --tag backend:${{ github.sha }} \
              --cache-from type=gha,scope=backend \
              --cache-to type=gha,mode=max,scope=backend \
              --load \
              .

      - name: Create Linear issue on failure
