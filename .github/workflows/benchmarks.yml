name: Benchmarks

# Performance benchmarks for regression detection.
# Runs pytest-benchmark on backend tests and reports >20% regression from baseline.
#
# Nightly + manual only (owner ruling 100, following ruling 71's #6968 pattern):
# no push trigger — the post-merge baseline/trend work runs on the schedule
# below, and workflow_dispatch stays for on-demand runs.
# Creates Linear issue on JOB failure for tracking and follow-up. The benchmark
# verdict itself travels through steps.benchmarks.outputs.exit_code and the
# uploaded artifacts, not the job result: the run step deliberately keeps the
# job green on a regression (pre-existing design; see the step's comment).

on:
  schedule:
    # Daily 04:47 UTC — off the :00 herd; 30+ min behind nightly-full-gate's
    # 04:17 and done ~05:17 before visual-tests opens at 05:23 (owner ruling 100)
    - cron: '47 4 * * *'
  # Manual trigger for on-demand benchmarking
  workflow_dispatch:
    inputs:
      compare_baseline:
        description: 'Compare against baseline'
        required: false
        default: true
        type: boolean
      regression_threshold:
        description: 'Regression threshold percentage'
        required: false
        default: '20'
        type: string

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  UV_VERSION: '0.9.18'

jobs:
  # ============================================================================
  # Performance Benchmarks
  # ============================================================================
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    # No continue-on-error here since ruling 100 removed the push trigger: the
    # old expression was push-only, so it evaluated false for every event this
    # workflow can now start on. A setup failure (checkout, uv sync, cache)
    # fails the job; a benchmark REGRESSION still does not — the run step
    # reports it through steps.benchmarks.outputs.exit_code and artifacts.
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test # Use test environment to bypass production password validation
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/security_test # pragma: allowlist secret
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/security_test # pragma: allowlist secret
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Determine benchmark options
        id: options
        run: |
          # Set regression threshold (default 20%)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            THRESHOLD="${{ github.event.inputs.regression_threshold }}"
            COMPARE="${{ github.event.inputs.compare_baseline }}"
          else
            THRESHOLD="20"
            COMPARE="true"
          fi
          echo "threshold=$THRESHOLD" >> $GITHUB_OUTPUT
          echo "compare=$COMPARE" >> $GITHUB_OUTPUT
          echo "Using regression threshold: $THRESHOLD%"

      - name: Download baseline benchmark results
        if: steps.options.outputs.compare == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: benchmark-cache
        with:
          path: .benchmarks
          key: benchmark-baseline-${{ runner.os }}-${{ hashFiles('backend/tests/benchmarks/**/*.py') }}
          restore-keys: |
            benchmark-baseline-${{ runner.os }}-

      - name: Run performance benchmarks
        id: benchmarks
        # The trailing `|| echo "exit_code=$?"` is deliberate: under the
        # runner's default `bash -eo pipefail` a --benchmark-compare-fail
        # verdict (exit 1) would redden the job, and the `|| echo` is what
        # keeps this job green while publishing the true exit code as
        # steps.benchmarks.outputs.exit_code (the same soft-fail idiom as
        # load-tests' k6 step). No consumer reads that output yet — wiring
        # the summary/Linear guards to it is ruling 96 item 8 territory.
        run: |
          mkdir -p .benchmarks benchmark-results

          # Build benchmark command
          BENCHMARK_CMD="uv run pytest backend/tests/benchmarks/ \
            -v \
            --benchmark-only \
            --benchmark-autosave \
            --benchmark-save-data \
            --benchmark-json=benchmark-results/benchmark-results.json \
            --benchmark-min-rounds=5 \
            --benchmark-warmup=on \
            --timeout=120 \
            -n0"

          # Add comparison if baseline exists
          if [ "${{ steps.options.outputs.compare }}" == "true" ] && [ -d ".benchmarks" ] && [ "$(ls -A .benchmarks 2>/dev/null)" ]; then
            echo "Comparing against baseline with ${{ steps.options.outputs.threshold }}% threshold"
            BENCHMARK_CMD="$BENCHMARK_CMD --benchmark-compare --benchmark-compare-fail=mean:${{ steps.options.outputs.threshold }}%"
          else
            echo "No baseline found, running without comparison"
          fi

          # Run benchmarks
          echo "Running: $BENCHMARK_CMD"
          $BENCHMARK_CMD 2>&1 | tee benchmark-results/benchmark-output.txt || echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Generate benchmark summary
        if: always()
        run: |
          echo "## Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Regression Threshold:** ${{ steps.options.outputs.threshold }}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "benchmark-results/benchmark-results.json" ]; then
            echo "### Benchmark Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Extract key metrics from JSON
            uv run python -c "
          import json
          import sys

          try:
              with open('benchmark-results/benchmark-results.json') as f:
                  data = json.load(f)

              benchmarks = data.get('benchmarks', [])
              if not benchmarks:
                  print('No benchmark results found.')
                  sys.exit(0)

              print('| Test | Mean (ms) | Std Dev | Min | Max | Rounds |')
              print('|------|-----------|---------|-----|-----|--------|')

              for bench in benchmarks:
                  name = bench.get('name', 'Unknown')
                  stats = bench.get('stats', {})
                  mean_ms = stats.get('mean', 0) * 1000
                  std_ms = stats.get('stddev', 0) * 1000
                  min_ms = stats.get('min', 0) * 1000
                  max_ms = stats.get('max', 0) * 1000
                  rounds = stats.get('rounds', 0)

                  # Truncate long test names
                  if len(name) > 50:
                      name = name[:47] + '...'

                  print(f'| {name} | {mean_ms:.3f} | {std_ms:.3f} | {min_ms:.3f} | {max_ms:.3f} | {rounds} |')

              print('')
              print(f'**Total benchmarks:** {len(benchmarks)}')
          except Exception as e:
              print(f'Error parsing results: {e}')
          " >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f "benchmark-results/benchmark-output.txt" ]; then
            echo "### Test Output" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '<details><summary>Full benchmark output</summary>' >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 benchmark-results/benchmark-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo '</details>' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Save baseline for future comparisons
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .benchmarks
          key: benchmark-baseline-${{ runner.os }}-${{ hashFiles('backend/tests/benchmarks/**/*.py') }}-${{ github.sha }}

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            benchmark-results/
            .benchmarks/
          retention-days: 30

  # ============================================================================
  # Summary and Issue Creation
  # ============================================================================
  benchmark-summary:
    name: Benchmark Summary
    runs-on: ubuntu-latest
    needs: [benchmarks]
    if: always()
    steps:
      - name: Check benchmark results
        run: |
          if [ "${{ needs.benchmarks.result }}" == "failure" ]; then
            echo "::warning::Performance benchmarks detected a regression. Review the artifacts for details."
            echo ""
            echo "To run benchmarks locally:"
            echo "  uv run pytest backend/tests/benchmarks/ --benchmark-only -v"
            echo ""
            echo "To compare against baseline:"
            echo "  uv run pytest backend/tests/benchmarks/ --benchmark-only --benchmark-compare"
          else
            echo "Performance benchmarks passed!"
          fi

      - name: Create Linear issue on failure
        # Create a Linear issue when the benchmark JOB fails on main
        # (nightly schedule or a manual run from main) — a setup/infra failure,
        # not a regression verdict: the run step keeps regressions out of the
        # job result, so the gate here reads needs.benchmarks.result honestly.
        # Event key re-typed from `push` to the surviving triggers (ruling 100).
        if: vars.LINEAR_ENABLED == 'true' && (needs.benchmarks.result == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Determine context (nightly run vs manual dispatch)
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            CONTEXT="manual run ($REF_NAME)"
            REF="$REF_NAME"
          else
            CONTEXT="nightly schedule ($REF_NAME)"
            REF="$REF_NAME"
          fi

          TITLE="[CI] Performance benchmark regression ($CONTEXT)"

          # Check for existing open issue with same title
          EXISTING=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d '{
              "query": "query SearchIssues($filter: IssueFilter) { issues(filter: $filter) { nodes { id identifier } } }",
              "variables": {
                "filter": {
                  "team": { "key": { "eq": "NEM" } },
                  "title": { "eq": "'"$TITLE"'" },
                  "state": { "type": { "nin": ["completed", "canceled"] } }
                }
              }
            }')

          EXISTING_ID=$(echo "$EXISTING" | jq -r '.data.issues.nodes[0].id // empty')

          if [ -n "$EXISTING_ID" ]; then
            # Add comment to existing issue instead of creating duplicate
            COMMENT="**Another failure detected**\n\n**Context:** $CONTEXT\n**Branch:** $REF\n**Commit:** $COMMIT_SHA\n**Run:** $SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"
            curl -s -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateComment($input: CommentCreateInput!) { commentCreate(input: $input) { success } }",
                "variables": {
                  "input": {
                    "issueId": "'"$EXISTING_ID"'",
                    "body": "'"$COMMENT"'"
                  }
                }
              }'
            echo "Added comment to existing issue"
          else
            # Create new issue via Linear API
            curl -X POST https://api.linear.app/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: $LINEAR_API_KEY" \
              -d '{
                "query": "mutation CreateIssue($input: IssueCreateInput!) { issueCreate(input: $input) { success issue { id identifier url } } }",
                "variables": {
                  "input": {
                    "teamId": "998946a2-aa75-491b-a39d-189660131392",
                    "title": "'"$TITLE"'",
                    "description": "## Performance Benchmark Regression\n\nThe pytest-benchmark tests detected a >20% performance regression.\n\n**Context:** '"$CONTEXT"'\n**Branch:** '"$REF"'\n**Commit:** '"$COMMIT_SHA"'\n**Run:** '"$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"'\n\n### Action Required\n\n1. Review the benchmark results in the workflow artifacts\n2. Identify which benchmarks regressed\n3. Run benchmarks locally to investigate:\n   ```bash\n   uv run pytest backend/tests/benchmarks/ --benchmark-only -v\n   uv run pytest backend/tests/benchmarks/ --benchmark-only --benchmark-compare\n   ```\n4. Common causes of regressions:\n   - New database queries in hot paths\n   - Inefficient serialization\n   - Increased object allocations\n   - Missing caching\n\n### Benchmark Files\n\n- `backend/tests/benchmarks/test_api_benchmarks.py` - API endpoint response times\n- `backend/tests/benchmarks/test_performance.py` - Core operations (JSON, DB, services)\n- `backend/tests/benchmarks/test_bigo.py` - Algorithmic complexity\n- `backend/tests/benchmarks/test_memory.py` - Memory profiling",
                    "priority": 3,
                    "labelIds": ["fef74b6f-0631-42e2-87f9-3c31e4bab170"]
                  }
                }
              }'
            echo "Linear issue created successfully"
          fi

  # ============================================================================
  # Memory Profiling (Linux only - pytest-memray)
  # ============================================================================
  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-latest
    # No continue-on-error since ruling 100: the old expression was push-only
    # and therefore false for every event this workflow can now start on.
    # Memory-threshold violations never reddened this job anyway — the run step
    # below soft-fails by design, as in the benchmarks job.
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test # Use test environment to bypass production password validation
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/security_test # pragma: allowlist secret
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/security_test # pragma: allowlist secret
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run memory profiling tests
        id: memory_tests
        run: |
          mkdir -p memory-results

          # Run memray tests with memory limit enforcement
          # pytest-memray is Linux-only, which is why this job only runs on ubuntu
          uv run pytest backend/tests/benchmarks/test_memory.py \
            --memray \
            -v \
            --timeout=120 \
            -n0 \
            2>&1 | tee memory-results/memory-output.txt || echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Generate memory profiling summary
        if: always()
        run: |
          echo "## Memory Profiling Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "memory-results/memory-output.txt" ]; then
            echo "### Test Output" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '<details><summary>Full memory profiling output</summary>' >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 memory-results/memory-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo '</details>' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload memory profiling results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-profiling-results
          path: memory-results/
          retention-days: 14
