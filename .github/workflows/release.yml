name: Release

# OB.2 (CI dedupe): this is the ONE release mechanism — three existed.
# The retired two (names and rationale: the OB.2 entry in
# scripts/retired_paths.txt — living text may not name a retired path) were:
#   * the tag-push "Create GitHub Release" generator: NEVER RAN. Measured —
#     the workflow lists zero runs ever, across v0.1.0..v0.41.3 and 40+ tags,
#     while every published body verifiably carries the OTHER generator's
#     template ("### Linear Issues", 4/4 sampled; its own "### Contributors"
#     section appears in zero published releases). Its changelog never once
#     survived to a published release.
#   * the PR-label draft bot: its categories key on PR labels (feat/fix/...)
#     that the labeler never applies (measured: 0 of the last 100 PRs carry
#     any categorization label), so it maintained a floating draft no
#     publisher consumed (v0.41.3, published=null) — and every time the
#     engine published, the bot's stale draft body was the loser of a
#     last-writer-wins race over the SAME tag's release.
# The surviving engine analyzes conventional commits on main pushes, tags the
# analyzed SHA (a tag ref, so strict branch protection does not gate it —
# see the removed-bump note the engine's release job still carries), and
# publishes the release in the same job. No second writer remains.
#
# The engine's jobs are ported VERBATIM (analyze / release / dry-run) —
# only this header, the name, and the file moved. Manual dispatch keeps its
# release_type / dry_run inputs.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (major, minor, patch, or specific version like 1.2.3)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  # Used for commit analysis
  HUSKY: 0

jobs:
  analyze:
    name: Analyze Commits
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.analyze.outputs.should_release }}
      next_version: ${{ steps.analyze.outputs.next_version }}
      release_type: ${{ steps.analyze.outputs.release_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: get_tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Analyze commits for release
        id: analyze
        env:
          LATEST_TAG: ${{ steps.get_tag.outputs.latest_tag }}
          MANUAL_VERSION: ${{ inputs.release_type }}
        run: |
          # Use environment variables (not direct interpolation) to avoid shell injection

          # If manual version specified, use it
          if [ -n "$MANUAL_VERSION" ]; then
            if [[ "$MANUAL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              # Specific version provided
              echo "next_version=v$MANUAL_VERSION" >> $GITHUB_OUTPUT
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "release_type=manual" >> $GITHUB_OUTPUT
              echo "Manual release: v$MANUAL_VERSION"
              exit 0
            elif [[ "$MANUAL_VERSION" =~ ^(major|minor|patch)$ ]]; then
              # Version type provided - calculate next version
              CURRENT=$(echo "$LATEST_TAG" | sed 's/^v//')
              IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

              case "$MANUAL_VERSION" in
                major)
                  NEXT_VERSION="v$((MAJOR + 1)).0.0"
                  ;;
                minor)
                  NEXT_VERSION="v${MAJOR}.$((MINOR + 1)).0"
                  ;;
                patch)
                  NEXT_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
                  ;;
              esac

              echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "release_type=$MANUAL_VERSION" >> $GITHUB_OUTPUT
              echo "Manual release ($MANUAL_VERSION): $NEXT_VERSION"
              exit 0
            fi
          fi

          # Analyze commits since last tag
          COMMITS=$(git log ${LATEST_TAG}..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          HAS_BREAKING=false
          HAS_FEAT=false
          HAS_FIX=false

          while IFS= read -r commit; do
            # Check for breaking changes
            if [[ "$commit" =~ ^[a-z]+(\(.+\))?!: ]] || [[ "$commit" =~ BREAKING\ CHANGE ]]; then
              HAS_BREAKING=true
            fi
            # Check for features
            if [[ "$commit" =~ ^feat(\(.+\))?: ]]; then
              HAS_FEAT=true
            fi
            # Check for fixes
            if [[ "$commit" =~ ^fix(\(.+\))?: ]]; then
              HAS_FIX=true
            fi
          done <<< "$COMMITS"

          # Determine release type and next version
          CURRENT=$(echo "$LATEST_TAG" | sed 's/^v//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [ "$HAS_BREAKING" = true ]; then
            NEXT_VERSION="v$((MAJOR + 1)).0.0"
            RELEASE_TYPE="major"
          elif [ "$HAS_FEAT" = true ]; then
            NEXT_VERSION="v${MAJOR}.$((MINOR + 1)).0"
            RELEASE_TYPE="minor"
          elif [ "$HAS_FIX" = true ]; then
            NEXT_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            RELEASE_TYPE="patch"
          else
            echo "No releasable commits found"
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT
          echo "Next version: $NEXT_VERSION ($RELEASE_TYPE)"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: analyze
    if: needs.analyze.outputs.should_release == 'true' && (github.event.inputs.dry_run != 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # No setup-node: it existed only to serve the (removed) package.json
      # bump machinery. Everything left in this job is bash + git, and
      # softprops/action-gh-release declares node24 in its action.yml - the
      # runner supplies that runtime itself.

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        env:
          NEXT_VERSION: ${{ needs.analyze.outputs.next_version }}
          PREV_TAG: ${{ steps.prev_tag.outputs.prev_tag }}
          RELEASE_TYPE: ${{ needs.analyze.outputs.release_type }}
          REPO: ${{ github.repository }}
        run: |
          # Use environment variables (not direct interpolation) to avoid shell injection

          # Determine commit range
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          # Generate changelog
          cat > CHANGELOG_RELEASE.md << 'HEADER'
          ## What's Changed

          HEADER

          # Features
          FEATURES=$(git log $RANGE --pretty=format:"- %s (%h)" --grep="^feat" 2>/dev/null || true)
          if [ -n "$FEATURES" ]; then
            echo "### Features" >> CHANGELOG_RELEASE.md
            echo "$FEATURES" >> CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md
          fi

          # Bug Fixes
          FIXES=$(git log $RANGE --pretty=format:"- %s (%h)" --grep="^fix" 2>/dev/null || true)
          if [ -n "$FIXES" ]; then
            echo "### Bug Fixes" >> CHANGELOG_RELEASE.md
            echo "$FIXES" >> CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md
          fi

          # Performance
          PERF=$(git log $RANGE --pretty=format:"- %s (%h)" --grep="^perf" 2>/dev/null || true)
          if [ -n "$PERF" ]; then
            echo "### Performance" >> CHANGELOG_RELEASE.md
            echo "$PERF" >> CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md
          fi

          # Documentation
          DOCS=$(git log $RANGE --pretty=format:"- %s (%h)" --grep="^docs" 2>/dev/null || true)
          if [ -n "$DOCS" ]; then
            echo "### Documentation" >> CHANGELOG_RELEASE.md
            echo "$DOCS" >> CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md
          fi

          # Breaking Changes
          if [ "$RELEASE_TYPE" = "major" ]; then
            echo "### Breaking Changes" >> CHANGELOG_RELEASE.md
            git log $RANGE --pretty=format:"- %s (%h)" | grep -i "breaking\|!" >> CHANGELOG_RELEASE.md || true
            echo "" >> CHANGELOG_RELEASE.md
          fi

          # Linear Issues
          echo "### Linear Issues" >> CHANGELOG_RELEASE.md
          LINEAR_ISSUES=$(git log $RANGE --pretty=format:"%s %b" 2>/dev/null | grep -oE "NEM-[0-9]+" | sort -u || true)
          if [ -n "$LINEAR_ISSUES" ]; then
            for issue in $LINEAR_ISSUES; do
              echo "- [$issue](https://linear.app/nemotron-v3-home-security/issue/$issue)" >> CHANGELOG_RELEASE.md
            done
          else
            echo "- No Linear issues referenced" >> CHANGELOG_RELEASE.md
          fi
          echo "" >> CHANGELOG_RELEASE.md

          # Full changelog link
          if [ -n "$PREV_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${NEXT_VERSION}" >> CHANGELOG_RELEASE.md
          fi

          cat CHANGELOG_RELEASE.md

      # No "Update version in package.json" + "Commit version bump" + push.
      # Those three steps (the old tail of this job) committed
      # "chore(release): vX.Y.Z" and pushed it to main, which branch
      # protection can never accept: strict mode requires CI Gate to have
      # passed on the pushed commit, impossible for a bot commit CI never
      # saw (GH006, the reason every release push failed since protection
      # went strict). Tagging the analyzed SHA below is unaffected - tag
      # refs are not branch refs - and HEAD here IS the analyzed SHA, so
      # the tag lands exactly where main does. See header comment for why
      # no consumer lost anything.

      - name: Create tag
        env:
          VERSION: ${{ needs.analyze.outputs.next_version }}
        run: |
          # Annotated tags record a tagger identity, and the runner image
          # ships no git user ("Committer identity unknown", exit 128).
          # Until #6711 these two config lines lived in the removed
          # "Commit version bump" step - the tag step silently depended on
          # them. Same identity the v0.1.0 tag object carries.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.analyze.outputs.next_version }}
          name: ${{ needs.analyze.outputs.next_version }}
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.analyze.outputs.next_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** ${{ needs.analyze.outputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.analyze.outputs.next_version }}" >> $GITHUB_STEP_SUMMARY

  dry-run:
    name: Dry Run Analysis
    runs-on: ubuntu-latest
    needs: analyze
    if: needs.analyze.outputs.should_release == 'true' && github.event.inputs.dry_run == 'true'
    steps:
      - name: Dry Run Summary
        run: |
          echo "## Dry Run - No Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Would release version:** ${{ needs.analyze.outputs.next_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release type:** ${{ needs.analyze.outputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run without dry_run to create the actual release." >> $GITHUB_STEP_SUMMARY
