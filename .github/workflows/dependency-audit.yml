name: Dependency Audit

# OB.2 (CI dedupe): this is the ONE dependency-audit workflow. Before this
# change pip-audit executed in four files and npm audit in four (the retired
# advisory copies are named in scripts/retired_paths.txt); the package's
# Done-when is "each concern runs in exactly one workflow". The advisory
# copies went (each verdict mapped in the OB.2 PR body); ci.yml's gating
# npm audit CHECK moved here as a WP1.2 workflow_call — the same surgery
# that made gitleaks/sast/trivy blocking ("a green CI Gate was compatible
# with ... new CVEs").
# CI Gate still sees one aggregate verdict: the `security-dependency-audit`
# call job in ci.yml is a direct ci-gate need with a check_job line, and a
# `uses:` job's conclusion IS the reusable's aggregate.
#
# Job-id spelling is PINNED: scripts/test_check_pip_audit_exemptions.py
# splits this file on the two job-id keys below (with trailing colon) and
# asserts the checker + registry live inside the python leg and --ignore-vuln
# does not. Renaming either job = edit that test in the same commit — and
# never cite those two literals colon-suffixed in a comment ABOVE the jobs:
# the split finds the first occurrence, and a comment that comes first
# becomes the "leg" (measured: this package's own header did exactly that).
#
# on: schedule (DAILY since [r291]) + workflow_call + a push leg of its own
# on main. The scheduled scan is what catches NEW advisories against UNCHANGED
# code — a PR-time-only audit goes blind to the advisory published Wednesday
# against last week's lock. On a PR the audit runs only through ci.yml's call
# job (no standalone push/PR trigger: that would race the parent inside the
# shared concurrency group — see below); the push trigger below is MAIN-ONLY
# and carries the full-lockfile mode, deliberately OUTSIDE ci.yml (UR-119:
# CI Gate does not read it; a red is raised and routed, never queued against).
# MODES ([r291]): full-lockfile = today's checks unchanged on the checked-out
# tree. gate = the PR-time delta: audit head AND base in the same job, fail
# only on a finding the change ADDS. ci.yml's call selects gate via
# workflow_call input (a called workflow inherits the caller's event, so
# event_name cannot discriminate); push/schedule/dispatch run full-lockfile.
on:
  workflow_call:
    # [r291]: ci.yml's security-dependency-audit call job passes audit-mode:
    # gate. A called workflow inherits the CALLER's event, so event_name
    # cannot discriminate the modes (a call from ci.yml on a push to main
    # arrives here as event_name=push, same as this file's own push leg) -
    # the mode must travel as an explicit input (UR-122: ci.yml's call
    # SELECTS the gate mode). Everything not called with `gate` runs
    # full-lockfile: today's checks unchanged.
    inputs:
      audit-mode:
        description: 'gate = delta vs the base tree (ci.yml calls); full-lockfile = audit this tree alone'
        required: false
        default: 'full-lockfile'
        type: string
  push:
    branches: [main]
    # [r291]: the full-lockfile run on main is THIS workflow's own push leg
    # (a red job in CI would fail the whole CI run, which queue_update.py
    # reads as red main - the queue freeze UR-185 rules out). It is NOT a
    # ci-gate need and NOT read by CI Gate (UR-119); a red is raised and
    # routed, not queued against.
  schedule:
    - cron: '17 6 * * *' # [r291] DAILY at 06:17 UTC (was Monday-only '0 6 * * 1'): full-lockfile on unchanged code still catches new advisories daily
  workflow_dispatch:

# WP1.2 fix (probe3, run 35492418369): root `concurrency:` is BANNED in a
# called workflow. The child run renders `${{ github.workflow }}` as the
# CALLER's name, so with ci.yml's group every child registered the PARENT's
# own group; cancel-in-progress then killed the call job at initialization
# (no check-run, no logs, needs.*.result=failure — proven one-variable: w5
# dies, w6 same-parent green). Precedent: gitleaks.yml, sast.yml, trivy.yml,
# integration-shard.yml. The standalone push/PR triggers the old file carried
# are gone with the deletion, so a group here would guard nothing on the
# schedule leg either (cron does not pile up runs the way PR pushes did).

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '24'
  UV_VERSION: '0.9.18'

# r291 security pass, LOW: the file's jobs read nothing and write nothing
# outside the run (no cache, no artifact, no security-events upload), so
# read-only contents is the whole grant - the same floor gitleaks.yml and
# trivy.yml already pin.
permissions:
  contents: read

jobs:
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    outputs:
      audit-ran: ${{ steps.mode.outputs.skip_audits != 'true' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # [r291] gate mode: the base is the tested merge tree's FIRST PARENT
          # (github.event.pull_request.base.sha can lag it), which needs the
          # parent commits local. Full-lockfile mode ignores the extra fetch.
          # r291 security pass, LOW: the audit persists no credentials.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the audit mode
        id: mode
        run: |
          # r291 security pass, LOW: expression-interpolating the input into
          # the script makes it bash-source text. A case allowlist keeps the mode a
          # selector, not an injection surface - anything but the two known
          # names fails closed to full-lockfile.
          case "${{ inputs.audit-mode || 'full-lockfile' }}" in
            gate|full-lockfile) ;;
            *) echo "audit-mode '${{ inputs.audit-mode }}' is not gate|full-lockfile - running full-lockfile" >&2 ;;
          esac
          echo "mode=${{ inputs.audit-mode || 'full-lockfile' }}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.audit-mode || 'full-lockfile' }}" = "gate" ]; then
            # The tested merge tree's first parent IS the PR's base commit as
            # CI tests it; pull_request.base.sha can lag (a branch pushed
            # after main moved). On non-PR callers of gate mode (none today)
            # the first parent is the previous main commit, which is the
            # package's stated push-to-main base.
            base_sha="$(git rev-parse HEAD^1)"
            echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
            echo "gate base = $base_sha" >&2
            # [r291] skip: a change touching none of the dependency files may
            # skip both audits - a docs- or code-only change cannot move what
            # pip-audit or npm audit see. The skip is GATE-MODE-ONLY
            # (full-lockfile audits its tree unconditionally on its own
            # triggers), and the audit machinery itself is deliberately NOT
            # skippable: a change editing dependency-audit.yml, ci.yml or
            # either checker must still run both audits, so this package's
            # own PR - and later edits to the gate - are audited.
            # --no-renames: a RENAMED dependency file must read as touched -
            # rename detection prints only the destination path, which no
            # pathspec here matches, and the skip would fire on a change that
            # moved a lockfile. Delete+add rendering keeps the old path visible.
            # r291 security pass, HIGH (CWE-184/345): the PR's own dependency
            # CONFIG steers or skips the audit, so those files are dependencies
            # here too: frontend/.npmrc carries `registry=` (steers npm audit
            # at the bulk advisory endpoint), uv.toml overrides pyproject's
            # [tool.uv] indexes (uv's own precedence - measured), and
            # .python-version selects the interpreter the export runs under.
            # A change touching any of them can never take the skip; the env
            # pins below hold the indexes fixed while the audits run.
            deps_touched="$(git diff --no-renames --name-only "$base_sha"..HEAD -- \
              pyproject.toml uv.lock uv.toml .python-version \
              frontend/package.json frontend/package-lock.json frontend/.npmrc \
              .pip-audit-exemptions.json frontend/.npm-audit-exemptions.json)"
            machinery_touched="$(git diff --no-renames --name-only "$base_sha"..HEAD -- \
              .github/workflows/dependency-audit.yml .github/workflows/ci.yml \
              scripts/check-pip-audit-exemptions.py scripts/check-npm-audit-exemptions.py)"
            if [ -z "$deps_touched" ] && [ -z "$machinery_touched" ]; then
              echo "skip_audits=true" >> "$GITHUB_OUTPUT"
              echo "no dependency or audit-machinery file changed - both audits skip (gate mode)" >&2
            fi
          fi

      # [r291] gate mode only: check the base tree out beside the head tree.
      # checkout@v7 refuses a second checkout in one job, so this is a plain
      # git worktree add of the resolved base SHA - read-only evidence for
      # the base side's audit, never the tree CI tests.
      - name: Check out the base tree (gate mode)
        if: steps.mode.outputs.mode == 'gate' && steps.mode.outputs.skip_audits != 'true'
        run: |
          git worktree add "$RUNNER_TEMP/base-tree" "${{ steps.mode.outputs.base_sha }}"

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: uv tool install pip-audit

      - name: Run pip-audit on dependencies
        if: steps.mode.outputs.mode != 'gate' || steps.mode.outputs.skip_audits != 'true'
        # r291 security pass, HIGH (CWE-345): the audited export must come from
        # the pinned indexes, not from whatever the PR's config files name.
        # UV_DEFAULT_INDEX beats a uv.toml default index (uv's own precedence,
        # proven against a hostile local uv.toml); --locked makes the export a
        # lock-file restatement - on a stale lock (pyproject touched without
        # the lock, e.g. a new dependency added only to pyproject) uv would
        # re-resolve, and under a PR-chosen uv.toml that re-resolution contacts
        # the PR's index (proven with a --verbose trace). --frozen would export
        # the stale lock silently - the new dependency would go UNAUDITED - so
        # the gate fails closed on staleness instead. Step env beats project
        # config for the npm leg below on the same principle.
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: |
          # Export dependencies to requirements format for pip-audit
          # [r291] gate mode audits the BASE tree first (its own uv export +
          # pip-audit run inside the worktree), then the head tree: the two
          # recorded JSONs are the delta's inputs. Full-lockfile mode runs
          # only the head-tree half, byte-identical to before this package.
          if [ "${{ steps.mode.outputs.mode }}" = "gate" ]; then
            cd "$RUNNER_TEMP/base-tree"
            uv export --locked --no-hashes > requirements-audit.txt
            grep -v '+cpu' requirements-audit.txt > requirements-audit-filtered.txt || true
            rc=0
            pip-audit -r requirements-audit-filtered.txt --desc -f json > pip-audit.json || rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "pip-audit itself failed on the BASE tree (rc=$rc) - the gate fails closed" >&2
              exit "$rc"
            fi
            cp pip-audit.json "$GITHUB_WORKSPACE/pip-audit-base.json"
            cp .pip-audit-exemptions.json "$GITHUB_WORKSPACE/pip-audit-base-registry.json"
            cd "$GITHUB_WORKSPACE"
          fi
          uv export --locked --no-hashes > requirements-audit.txt
          # Remove torch packages with +cpu suffix (from PyTorch custom index, not on PyPI)
          # These packages are audited separately via their official security advisories
          grep -v '+cpu' requirements-audit.txt > requirements-audit-filtered.txt || true
          # -f json to the checker, NOT --ignore-vuln here. O1.8 removed the
          # inline CVE-2026-0994 ignore by measurement, not by taste: its own
          # comment carried "Review date: 2026-01-23", that date passed, and
          # the advisory no longer fires anyway (lock protobuf 7.36.1; OSV
          # last_affected 33.4; pip-audit 2.10.1 reports zero findings on
          # this export WITHOUT any flag). The bare flag fails open two ways:
          # no reason/owner/expiry on the carve-out, and a stale ignore that
          # suppresses nothing reads as if one were still needed.
          # Same CI-exact invocation as before (-f json is the only change).
          # pip-audit exits 1 when it FINDS advisories; under bash -e that
          # would kill the step before the registry is consulted, which is
          # exactly backwards — an exempted advisory must reach the checker.
          # rc<=1 is data, rc>=2 is a real audit error and still fails here;
          # the checker also fails CLOSED on unparsable/empty JSON, so a
          # truncated run cannot read as clean (the npm leg's checker handles
          # npm's exit-1-with-findings the same way).
          rc=0
          pip-audit -r requirements-audit-filtered.txt --desc -f json > pip-audit.json || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "pip-audit itself failed (rc=$rc) - the gate fails closed" >&2
            exit "$rc"
          fi
      - name: Audit check (exemption registry)
        # Same doctrine as the npm leg below: the registry is the allowlist,
        # findings without an entry (reason + owner + REVIEW BY) are red,
        # dead entries are red, and a released fix invalidates the exemption.
        # [r291] gate mode passes the base side's recorded audit + registry
        # snapshot and reds only a finding/violation the change ADDS.
        if: steps.mode.outputs.mode != 'gate'
        run: python3 scripts/check-pip-audit-exemptions.py --audit-json pip-audit.json --registry .pip-audit-exemptions.json --warn-days 14
        continue-on-error: false

      - name: Audit check (gate delta)
        if: steps.mode.outputs.mode == 'gate' && steps.mode.outputs.skip_audits != 'true'
        run: |
          # The base tree's registry snapshot rides out of the worktree with
          # its audit; both sides fail closed (unparsable audit, missing or
          # malformed registry) and only the DELTA can go red-or-green on.
          python3 scripts/check-pip-audit-exemptions.py \
            --audit-json pip-audit.json \
            --registry .pip-audit-exemptions.json \
            --base-audit-json pip-audit-base.json \
            --base-registry pip-audit-base-registry.json \
            --warn-days 14
        continue-on-error: false

  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    outputs:
      audit-ran: ${{ steps.mode.outputs.skip_audits != 'true' }}
    defaults:
      run:
        working-directory: frontend
    # r291 security pass, HIGH (CWE-345): the audit's registry is pinned, not
    # the PR's. frontend/.npmrc can set `registry=` and steer `npm audit --json`
    # at npm's bulk advisory endpoint on an attacker-controlled host (measured:
    # arborist's audit-report contacts <registry>/-/npm/v1/security/advisories/
    # bulk). NPM_CONFIG_REGISTRY (env) beats project config - proven - and a
    # job-level env reaches every step INCLUDING the checker's own internal
    # `npm audit` run on the head tree, and npm ci on both trees.
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # [r291] gate mode resolves the merge tree's first parent.
          # r291 security pass, LOW: the audit persists no credentials.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the audit mode
        id: mode
        working-directory: .
        run: |
          # r291 security pass, LOW: case allowlist, mirroring the python job
          # above - the input is a mode selector, never script text.
          case "${{ inputs.audit-mode || 'full-lockfile' }}" in
            gate|full-lockfile) ;;
            *) echo "audit-mode '${{ inputs.audit-mode }}' is not gate|full-lockfile - running full-lockfile" >&2 ;;
          esac
          echo "mode=${{ inputs.audit-mode || 'full-lockfile' }}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.audit-mode || 'full-lockfile' }}" = "gate" ]; then
            base_sha="$(git rev-parse HEAD^1)"
            echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
            echo "gate base = $base_sha" >&2
            # [r291] skip: a change touching none of the dependency files may
            # skip both audits - a docs- or code-only change cannot move what
            # pip-audit or npm audit see. The skip is GATE-MODE-ONLY
            # (full-lockfile audits its tree unconditionally on its own
            # triggers), and the audit machinery itself is deliberately NOT
            # skippable: a change editing dependency-audit.yml, ci.yml or
            # either checker must still run both audits, so this package's
            # own PR - and later edits to the gate - are audited.
            # --no-renames: a RENAMED dependency file must read as touched -
            # rename detection prints only the destination path, which no
            # pathspec here matches, and the skip would fire on a change that
            # moved a lockfile. Delete+add rendering keeps the old path visible.
            # r291 security pass, HIGH (CWE-184/345): the PR's own dependency
            # CONFIG steers or skips the audit, so those files are dependencies
            # here too: frontend/.npmrc carries `registry=` (steers npm audit
            # at the bulk advisory endpoint), uv.toml overrides pyproject's
            # [tool.uv] indexes (uv's own precedence - measured), and
            # .python-version selects the interpreter the export runs under.
            # A change touching any of them can never take the skip; the env
            # pins below hold the indexes fixed while the audits run.
            deps_touched="$(git diff --no-renames --name-only "$base_sha"..HEAD -- \
              pyproject.toml uv.lock uv.toml .python-version \
              frontend/package.json frontend/package-lock.json frontend/.npmrc \
              .pip-audit-exemptions.json frontend/.npm-audit-exemptions.json)"
            machinery_touched="$(git diff --no-renames --name-only "$base_sha"..HEAD -- \
              .github/workflows/dependency-audit.yml .github/workflows/ci.yml \
              scripts/check-pip-audit-exemptions.py scripts/check-npm-audit-exemptions.py)"
            if [ -z "$deps_touched" ] && [ -z "$machinery_touched" ]; then
              echo "skip_audits=true" >> "$GITHUB_OUTPUT"
              echo "no dependency or audit-machinery file changed - both audits skip (gate mode)" >&2
            fi
          fi

      - name: Check out the base tree (gate mode)
        if: steps.mode.outputs.mode == 'gate' && steps.mode.outputs.skip_audits != 'true'
        working-directory: .
        run: |
          git worktree add "$RUNNER_TEMP/base-tree" "${{ steps.mode.outputs.base_sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.mode.outputs.mode != 'gate' || steps.mode.outputs.skip_audits != 'true'
        run: npm ci

      # [r291] gate mode: the base tree gets the same npm ci treatment as the
      # head (a fresh lockfile-faithful tree), but NO npm audit here - unlike
      # pip-audit, the npm CHECKER runs `npm audit` itself on both trees (the
      # recorded-JSON handoff this step once did would audit the base twice).
      # npm ci in a worktree is a second full install; the delta is worth it
      # exactly when the change touches the frontend lockfiles, which is the
      # only way gate mode reaches this job (ci.yml's detect-changes gates
      # the call).
      - name: npm ci on the base tree (gate mode)
        if: steps.mode.outputs.mode == 'gate' && steps.mode.outputs.skip_audits != 'true'
        working-directory: ${{ runner.temp }}/base-tree/frontend
        run: npm ci

      # Same gate as ci.yml's `npm Audit (Frontend)` leg this job absorbs:
      # the registry checker, not a bare `npm audit --audit-level=high`
      # (which fails open on an advisory with no released fix - the braces
      # chain). python3 because this job is Node-only and the checker is
      # stdlib-only. working-directory is frontend/, hence ../scripts and
      # --frontend . here.
      - name: Audit check (exemption registry)
        if: steps.mode.outputs.mode != 'gate'
        run: python3 ../scripts/check-npm-audit-exemptions.py --frontend . --warn-days 14
        continue-on-error: false

      - name: Audit check (gate delta)
        if: steps.mode.outputs.mode == 'gate' && steps.mode.outputs.skip_audits != 'true'
        run: |
          # The checker runs `npm audit` ITSELF on both trees (head: frontend/,
          # base: the worktree) - no recorded-JSON handoff exists on this leg.
          # Each side's registry is read from its own tree, so the delta
          # adjudicates exactly the files CI would test on each side.
          python3 ../scripts/check-npm-audit-exemptions.py \
            --frontend . \
            --base-frontend "$RUNNER_TEMP/base-tree/frontend" \
            --base-registry "$RUNNER_TEMP/base-tree/frontend/.npm-audit-exemptions.json" \
            --warn-days 14
        continue-on-error: false

  audit-summary:
    name: Audit Summary
    runs-on: ubuntu-latest
    needs: [python-audit, npm-audit]
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && always()
    steps:
      - name: Generate audit summary
        run: |
          echo "## Dependency Audit Summary - $(date +'%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Audit | ${{ needs.python-audit.outputs.audit-ran == 'true' && needs.python-audit.result || 'skipped (gate: no dependency change)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.outputs.audit-ran == 'true' && needs.npm-audit.result || 'skipped (gate: no dependency change)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ${{ needs.python-audit.result != 'success' || needs.npm-audit.result != 'success' }}; then
            echo "### Action Required" >> $GITHUB_STEP_SUMMARY
            echo "Dependency vulnerabilities detected. Review the job logs above for details and update dependencies." >> $GITHUB_STEP_SUMMARY
          fi
