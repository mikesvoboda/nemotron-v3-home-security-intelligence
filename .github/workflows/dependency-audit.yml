name: Dependency Audit

# OB.2 (CI dedupe): this is the ONE dependency-audit workflow. Before this
# change pip-audit executed in four files and npm audit in four (the retired
# advisory copies are named in scripts/retired_paths.txt); the package's
# Done-when is "each concern runs in exactly one workflow". The advisory
# copies went (each verdict mapped in the OB.2 PR body); ci.yml's gating
# npm audit CHECK moved here as a WP1.2 workflow_call — the same surgery
# that made gitleaks/sast/trivy blocking ("a green CI Gate was compatible
# with ... new CVEs").
# CI Gate still sees one aggregate verdict: the `security-dependency-audit`
# call job in ci.yml is a direct ci-gate need with a check_job line, and a
# `uses:` job's conclusion IS the reusable's aggregate.
#
# Job-id spelling is PINNED: scripts/test_check_pip_audit_exemptions.py
# splits this file on the two job-id keys below (with trailing colon) and
# asserts the checker + registry live inside the python leg and --ignore-vuln
# does not. Renaming either job = edit that test in the same commit — and
# never cite those two literals colon-suffixed in a comment ABOVE the jobs:
# the split finds the first occurrence, and a comment that comes first
# becomes the "leg" (measured: this package's own header did exactly that).
#
# on: keeps schedule + workflow_call. The weekly scan is what catches NEW
# advisories against UNCHANGED code — a PR-time-only audit goes blind to the
# advisory published Wednesday against last week's lock. On a PR the audit
# runs only through ci.yml's call job (no standalone push/PR trigger: that
# would race the parent inside the shared concurrency group — see below).
on:
  workflow_call:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 6 AM UTC (kept: new-advisory discovery on unchanged code)
  workflow_dispatch:

# WP1.2 fix (probe3, run 35492418369): root `concurrency:` is BANNED in a
# called workflow. The child run renders `${{ github.workflow }}` as the
# CALLER's name, so with ci.yml's group every child registered the PARENT's
# own group; cancel-in-progress then killed the call job at initialization
# (no check-run, no logs, needs.*.result=failure — proven one-variable: w5
# dies, w6 same-parent green). Precedent: gitleaks.yml, sast.yml, trivy.yml,
# integration-shard.yml. The standalone push/PR triggers the old file carried
# are gone with the deletion, so a group here would guard nothing on the
# schedule leg either (cron does not pile up runs the way PR pushes did).

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '24'
  UV_VERSION: '0.9.18'

jobs:
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: uv tool install pip-audit

      - name: Run pip-audit on dependencies
        run: |
          # Export dependencies to requirements format for pip-audit
          uv export --no-hashes > requirements-audit.txt
          # Remove torch packages with +cpu suffix (from PyTorch custom index, not on PyPI)
          # These packages are audited separately via their official security advisories
          grep -v '+cpu' requirements-audit.txt > requirements-audit-filtered.txt || true
          # -f json to the checker, NOT --ignore-vuln here. O1.8 removed the
          # inline CVE-2026-0994 ignore by measurement, not by taste: its own
          # comment carried "Review date: 2026-01-23", that date passed, and
          # the advisory no longer fires anyway (lock protobuf 7.36.1; OSV
          # last_affected 33.4; pip-audit 2.10.1 reports zero findings on
          # this export WITHOUT any flag). The bare flag fails open two ways:
          # no reason/owner/expiry on the carve-out, and a stale ignore that
          # suppresses nothing reads as if one were still needed.
          # Same CI-exact invocation as before (-f json is the only change).
          # pip-audit exits 1 when it FINDS advisories; under bash -e that
          # would kill the step before the registry is consulted, which is
          # exactly backwards — an exempted advisory must reach the checker.
          # rc<=1 is data, rc>=2 is a real audit error and still fails here;
          # the checker also fails CLOSED on unparsable/empty JSON, so a
          # truncated run cannot read as clean (the npm leg's checker handles
          # npm's exit-1-with-findings the same way).
          rc=0
          pip-audit -r requirements-audit-filtered.txt --desc -f json > pip-audit.json || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "pip-audit itself failed (rc=$rc) - the gate fails closed" >&2
            exit "$rc"
          fi
      - name: Audit check (exemption registry)
        # Same doctrine as the npm leg below: the registry is the allowlist,
        # findings without an entry (reason + owner + REVIEW BY) are red,
        # dead entries are red, and a released fix invalidates the exemption.
        run: python3 scripts/check-pip-audit-exemptions.py --audit-json pip-audit.json --registry .pip-audit-exemptions.json --warn-days 14
        continue-on-error: false

  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same gate as ci.yml's `npm Audit (Frontend)` leg this job absorbs:
      # the registry checker, not a bare `npm audit --audit-level=high`
      # (which fails open on an advisory with no released fix - the braces
      # chain). python3 because this job is Node-only and the checker is
      # stdlib-only. working-directory is frontend/, hence ../scripts and
      # --frontend . here.
      - name: Audit check (exemption registry)
        run: python3 ../scripts/check-npm-audit-exemptions.py --frontend . --warn-days 14
        continue-on-error: false

  audit-summary:
    name: Audit Summary
    runs-on: ubuntu-latest
    needs: [python-audit, npm-audit]
    if: always()
    steps:
      - name: Generate audit summary
        run: |
          echo "## Dependency Audit Summary - $(date +'%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Audit | ${{ needs.python-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ${{ needs.python-audit.result != 'success' || needs.npm-audit.result != 'success' }}; then
            echo "### Action Required" >> $GITHUB_STEP_SUMMARY
            echo "Dependency vulnerabilities detected. Review the job logs above for details and update dependencies." >> $GITHUB_STEP_SUMMARY
          fi
