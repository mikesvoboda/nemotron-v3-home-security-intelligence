name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 6 AM UTC

# WP3.4: repeated pushes to a PR branch piled up redundant runs of this
# workflow that all competed for the measured ~20-job scheduler ceiling
# (spec WP3.1: concurrency 20 pinned). Same pattern as ci.yml:10-12.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '24'
  UV_VERSION: '0.9.18'

jobs:
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: uv tool install pip-audit

      - name: Run pip-audit on dependencies
        run: |
          # Export dependencies to requirements format for pip-audit
          uv export --no-hashes > requirements-audit.txt
          # Remove torch packages with +cpu suffix (from PyTorch custom index, not on PyPI)
          # These packages are audited separately via their official security advisories
          grep -v '+cpu' requirements-audit.txt > requirements-audit-filtered.txt || true
          # Run pip-audit with ignored CVEs
          # CVE-2026-0994: protobuf DoS in json_format.ParseDict() with nested Any messages
          #   - Severity: Moderate (DoS only, no data breach/RCE)
          #   - Impact: We don't use ParseDict() with untrusted nested Any messages
          #   - Status: Awaiting upstream fix from google/protobuf
          #   - Review date: 2026-01-23
          # CVE-2024-23342: python-ecdsa Minerva timing attack
          #   - Severity: Moderate (requires local timing measurement for attack)
          #   - Impact: ecdsa is transitive dep (used by jose for JWT signing)
          #   - Status: Upstream considers side-channel attacks out of scope, no fix planned
          #   - Review date: 2026-02-03
          # PYSEC-2026-1325: python-ecdsa Minerva timing attack on P-256
          #   - The current registry advisory ID for the same out-of-scope class
          #     as CVE-2024-23342 above (advisory text itself states "no planned
          #     fix"); ecdsa 0.19.2 is the newest release.
          #   - Review date: 2026-09-15
          # CVE-2026-85394: python-jose algorithm-confusion guard bypassed by
          #   DER-encoded public keys (advisory published in the 2026-10-06
          #   weekend wave; pip-audit newly flags python-jose 3.5.0)
          #   - Severity: Critical upstream, but the forge premise is an
          #     attacker-held ASYMMETRIC public key fed to HS256 verification.
          #   - Impact: none here — all three JWT call sites (auth_service.py
          #     :162/:197 jwt.encode, :217 jwt.decode) pin
          #     algorithm/algorithms explicitly and verify with a symmetric
          #     secret; no call path accepts a caller-supplied key or omits
          #     algorithms=. That is exactly the mitigation the advisory
          #     prescribes ("when algorithms are not explicitly restricted").
          #   - Status: no released fix (OSV "affected", no fix versions;
          #     3.5.0 is the newest release). A JWT dependency fork is a
          #     separate owner-sized call if upstream never ships.
          #   - Review date: 2027-01-06
          pip-audit -r requirements-audit-filtered.txt --desc \
            --ignore-vuln CVE-2026-0994 \
            --ignore-vuln CVE-2024-23342 \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln CVE-2026-85394
        continue-on-error: false

  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same gate as ci.yml's `npm Audit (Frontend)`: the registry checker,
      # not a bare `npm audit --audit-level=high` (which fails open on an
      # advisory with no released fix - the braces chain). python3 because
      # this job is Node-only and the checker is stdlib-only. working-directory
      # is frontend/, hence ../scripts and --frontend . here.
      - name: Audit check (exemption registry)
        run: python3 ../scripts/check-npm-audit-exemptions.py --frontend . --warn-days 14
        continue-on-error: false

  audit-summary:
    name: Audit Summary
    runs-on: ubuntu-latest
    needs: [python-audit, npm-audit]
    if: always()
    steps:
      - name: Generate audit summary
        run: |
          echo "## Dependency Audit Summary - $(date +'%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Audit | ${{ needs.python-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NPM Audit | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ${{ needs.python-audit.result != 'success' || needs.npm-audit.result != 'success' }}; then
            echo "### Action Required" >> $GITHUB_STEP_SUMMARY
            echo "Dependency vulnerabilities detected. Review the job logs above for details and update dependencies." >> $GITHUB_STEP_SUMMARY
          fi
