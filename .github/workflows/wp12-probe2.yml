name: WP12 probe2 (PR context)

on:
  pull_request:
    branches: [main]

# ci.yml's exact root block, own group name
concurrency:
  group: WP12 probe2-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.9.18'

jobs:
  # w1: byte-for-byte WP1.2 shape — real gitleaks.yml (root concurrency +
  # root permissions kept), caller grant is a superset of the callee request.
  # This is what #6575 ran; it never materialized. Reproduce here.
  w1:
    name: w1 full shape
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit # pragma: allowlist secret
    uses: ./.github/workflows/gitleaks.yml
  # w2: callee minus its root concurrency block (the integration-shard
  # precedent has no root concurrency).
  w2:
    name: w2 callee minus concurrency
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit # pragma: allowlist secret
    uses: ./.github/workflows/gitleaks-noc.yml
  # w3: callee minus root concurrency AND minus root permissions.
  w3:
    name: w3 callee minus both
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit # pragma: allowlist secret
    uses: ./.github/workflows/gitleaks-noc-noperm.yml
  # w4: caller job WITHOUT a permissions block (integration-shard shape).
  # Callee also stripped so no grant-vs-request escalation is possible.
  w4:
    name: w4 caller minus perms
    secrets: inherit # pragma: allowlist secret
    uses: ./.github/workflows/gitleaks-noc-noperm.yml
  consumer:
    name: Consumer - reads call results
    runs-on: ubuntu-latest
    needs: [w1, w2, w3, w4]
    if: always()
    steps:
      - run: |
          echo "w1=${{ needs.w1.result }} w2=${{ needs.w2.result }} w3=${{ needs.w3.result }} w4=${{ needs.w4.result }}"
