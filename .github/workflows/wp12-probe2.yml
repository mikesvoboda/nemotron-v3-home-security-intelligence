name: WP12 probe2 (PR context)

on:
  pull_request:
    branches: [main]

# ci.yml's exact root block, own group name
concurrency:
  group: WP12 probe2-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.9.18'

jobs:
  v-a:
    name: Control - bare call
    uses: ./.github/workflows/probe-v-min.yml
  v-b:
    name: Real - perms and secrets inherit
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit # pragma: allowlist secret
    uses: ./.github/workflows/gitleaks.yml
  v-c:
    name: Real - perms only
    permissions:
      contents: read
    uses: ./.github/workflows/gitleaks.yml
  v-d:
    name: Real - secrets only
    secrets: inherit # pragma: allowlist secret
    uses: ./.github/workflows/gitleaks.yml
  v-e:
    name: Fix preview - gitleaks minus concurrency
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit # pragma: allowlist secret
    uses: ./.github/workflows/gitleaks-noc.yml
  consumer:
    name: Consumer - reads call results
    runs-on: ubuntu-latest
    needs: [v-a, v-b, v-c, v-d, v-e]
    if: always()
    steps:
      - run: |
          echo "v-a=${{ needs.v-a.result }} v-b=${{ needs.v-b.result }} v-c=${{ needs.v-c.result }} v-d=${{ needs.v-d.result }} v-e=${{ needs.v-e.result }}"
