name: Deploy

on:
  push:
    branches: [main]

# One Deploy on main at a time; later pushes QUEUE (never cancel — killing a
# run mid-publish can strand half-pushed images). Queueing is what closes the
# :latest race a reviewer flagged: two overlapping pushes could interleave
# smoke→publish so the slower run's OLDER digest re-tagged :latest after the
# newer one. Unlike a called workflow (see the caller-group trap documented at
# the top of trivy.yml), this file is triggered directly, so a static group
# name is safe here.
concurrency:
  group: deploy-main
  cancel-in-progress: false

# O1.9 (D12): merge-core publishes ONLY the immutable per-commit tag; :latest
# moves in publish-latest, after the smoke test passes. There is no IMAGE_TAG
# here on purpose: GitHub expressions have no substring function, and the tag
# metadata-action actually pushes is the 7-char SHORT sha (type=sha with an
# empty prefix — measured in merge-core's own log at 67ca4870: the only tags
# were frontend:latest and frontend:67ca487). A workflow-level IMAGE_TAG of
# `${{ github.sha }}` would therefore name a tag that does not exist — the same
# 40-vs-7-char mistake that kept `Sign container image` red (see
# backend/tests/unit/scripts/test_deploy_workflow_signs_by_digest.py). Each job
# that needs the tag derives it in bash as ${GITHUB_SHA::7} and passes it to
# docker-compose.ci.yml via IMAGE_TAG.
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # Build core services (backend, frontend) on both architectures
  build-core:
    name: Build ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          # This workflow publishes backend + frontend only. The retired AI
          # image matrix (ai-yolo26 owner ruling 2026-09-23; ai-llm retired by
          # R8 S2; ai-florence / ai-clip / ai-enrichment deleted by R8 S3 in
          # 3b73b9b6) left this file after those trees were already gone —
          # every main push red on buildx "lstat ai/florence: no such file"
          # until the R8 follow-up slice removed the dead jobs. The shipped
          # GPU services ai-gateway and ai-vlm are built by compose and were
          # never matrix images here. A prebuilt-image compose file that used
          # to pull ai-gateway (with no ai-vlm service) was the reported
          # publish gap behind that ruling; O1.2 (UR-17) deleted that file, so
          # the gap closed by removal — the publish surface here stayed
          # backend + frontend, owner-adjudicated, still do not "expand" it
          # without a ruling.
          - name: backend
            context: .
            dockerfile: ./backend/Dockerfile
            target: prod
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            target: prod
        platform:
          - runner: ubuntu-latest
            arch: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            arch: linux/arm64
            suffix: arm64

    steps:
      - name: Free disk space
        if: matrix.image.name == 'backend'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          # type=sha,prefix= only: no :latest here. The per-platform manifest is
          # not what anyone pulls, and tagging :latest before the smoke test has
          # run is half of D12 (publish-latest moves the pointer afterwards).
          tags: |
            type=sha,prefix=

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target || '' }}
          platforms: ${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.suffix }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.image.name }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.image.name }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.suffix }}
          path: /tmp/digests/${{ matrix.image.name }}/*
          if-no-files-found: error
          retention-days: 1

  # Merge architecture-specific images into multi-arch manifests (core services)
  merge-core:
    name: Create multi-arch manifest (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: build-core
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image: [backend, frontend]

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.image }}-*
          path: /tmp/digests/${{ matrix.image }}
          merge-multiple: true

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          # The multi-arch manifest is tagged with the short sha ONLY. :latest is
          # moved by publish-latest once the smoke test has booted this commit's
          # images (O1.9 box 2), so until that succeeds the pointer keeps naming
          # the most recent build whose smoke test passed.
          tags: |
            type=sha,prefix=

      - name: Create manifest list and push
        working-directory: /tmp/digests/${{ matrix.image }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          # Inspect the tag this job actually pushed — the short sha. :latest is
          # not tagged here any more (O1.9 box 2), so inspecting it would print
          # the PREVIOUS commit's manifest and read as verification of this one.
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${GITHUB_SHA::7}

  # Smoke test deployment verification
  # Runs after images are pushed to verify containers work correctly
  smoke-test:
    name: Smoke Test Deployment
    runs-on: ubuntu-latest
    needs: merge-core
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_REPO: ${{ github.event.repository.name }}
        run: |
          # O1.9 box 2: test THIS commit. ${GITHUB_SHA::7} is the tag merge-core
          # pushes (metadata-action type=sha,prefix=); pulling :latest would test
          # whatever a later push had meanwhile pointed the pointer at.
          TAG="${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:"$TAG"
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:"$TAG"

      - name: Start services
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_REPO: ${{ github.event.repository.name }}
          IMAGE_TAG: ${{ env.TAG }}
        run: |
          # Start services using CI docker-compose, pinned to this commit's tag.
          docker compose -f docker-compose.ci.yml up -d

          # Show container status
          docker compose -f docker-compose.ci.yml ps

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to become healthy..."

          # Wait for backend with timeout
          timeout 120 bash -c '
            until docker compose -f docker-compose.ci.yml exec -T backend python -c "import httpx; r = httpx.get(\"http://localhost:8000/api/system/health/ready\"); exit(0 if r.status_code == 200 else 1)" 2>/dev/null; do
              echo "Waiting for backend..."
              sleep 5
            done
          ' || {
            echo "Backend health check timed out"
            docker compose -f docker-compose.ci.yml logs backend
            exit 1
          }

          echo "Backend is healthy!"

          # Wait for frontend with timeout
          timeout 60 bash -c '
            until curl -sf http://localhost:3000/ > /dev/null 2>&1; do
              echo "Waiting for frontend..."
              sleep 5
            done
          ' || {
            echo "Frontend health check timed out"
            docker compose -f docker-compose.ci.yml logs frontend
            exit 1
          }

          echo "Frontend is healthy!"

      - name: Run smoke tests
        run: |
          chmod +x ./scripts/ci-smoke-test.sh
          ./scripts/ci-smoke-test.sh \
            --backend-url http://localhost:8000 \
            --frontend-url http://localhost:3000 \
            --timeout 60 \
            --skip-websocket

      - name: Validate health against the CI stack contract
        run: |
          # O1.9 (D12). The previous version of this step required
          # /api/system/health/full to return 200. It never can on this stack:
          # docker-compose.ci.yml starts no AI service, and system.py marks
          # yolo26 critical: True — so the endpoint correctly answers 503
          # "Critical services unhealthy: yolo26" (measured: run 37726762316,
          # the run's only red job, at head acfe5b56). That one step kept Deploy
          # red on every push to main since 2026-01-05, and every red opened an
          # "Automated Rollback" issue for a rollback that never happened.
          #
          # The check now asserts scripts/ci-smoke-contract.json: compose.ci's
          # services healthy, the contract's AI services REPORTED unreachable,
          # and any service missing from the report a failure. The logic lives in
          # scripts/ci-smoke-test.sh so the guard test exercises the same code
          # this job runs, against the payload recorded from this very failure.
          echo "Testing /api/system/health/ready (must be 200)..."
          HTTP_CODE=$(curl -s -o /tmp/ready.json -w "%{http_code}" \
            http://localhost:8000/api/system/health/ready)
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::/api/system/health/ready failed with status $HTTP_CODE"
            cat /tmp/ready.json
            exit 1
          fi

          echo "Testing /api/system/health/full against the CI stack contract..."
          # /health/full legitimately answers 503 here, so curl -f is unusable;
          # capture the body and let the CONTRACT decide.
          FULL_CODE=$(curl -s -o /tmp/full.json -w "%{http_code}" \
            http://localhost:8000/api/system/health/full)
          echo "HTTP $FULL_CODE"
          jq . /tmp/full.json
          ./scripts/ci-smoke-test.sh --check-contract /tmp/full.json

      - name: Check deployment readiness
        if: success()
        run: |
          # if: success() of the step above IS the verdict — the contract check
          # exits non-zero on any mismatch, so reaching this line is the pass.
          # An earlier version also wrote health-check-passed=true to
          # $GITHUB_OUTPUT; no step id named this step and no expression read
          # the output, so it was a verdict nobody acted on (the exact class
          # this package deletes elsewhere).
          echo "Deployment validation successful!"
          echo ""
          echo "Summary:"
          echo "  Backend: Healthy and responding"
          echo "  Frontend: Serving content"
          echo "  Database: Connected and operational"
          echo "  Cache: Connected and operational"
          echo ""
          echo "Images are ready for production deployment"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker compose -f docker-compose.ci.yml logs backend --tail=100

          echo "=== Frontend Logs ==="
          docker compose -f docker-compose.ci.yml logs frontend --tail=50

          echo "=== Postgres Logs ==="
          docker compose -f docker-compose.ci.yml logs postgres --tail=50

          echo "=== Redis Logs ==="
          docker compose -f docker-compose.ci.yml logs redis --tail=50

          echo "=== Container Status ==="
          docker compose -f docker-compose.ci.yml ps -a

          echo "=== Health Check Details ==="
          curl -s http://localhost:8000/api/system/health/full 2>/dev/null | jq . || echo "Could not retrieve full health status"

      - name: Tear down services
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down -v --remove-orphans

  # O1.9 (D12) box 2: move the :latest pointer only for a commit whose smoke test
  # passed. merge-core tags the immutable short sha; this job is the sole writer
  # of :latest, so the tag an operator's runbook or manual pull follows by
  # default names the most recent deploy-validated build rather than whatever
  # was pushed last. On a red deploy the pointer simply does not move —
  # which, together with the red run, IS the signal the owner ruled on
  # (2026-10-08) instead of rollback.yml filing an issue that rolls back nothing.
  publish-latest:
    name: Publish :latest
    runs-on: ubuntu-latest
    needs: smoke-test
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image: [backend, frontend]

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :latest at this commit
        run: |
          # Re-create the manifest list under :latest from the short-sha manifest
          # this run already pushed. Same digest, second tag — no rebuild, and
          # the per-architecture digests are already in the registry.
          TAG="${GITHUB_SHA::7}"
          SRC="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}"
          MANIFEST=$(docker buildx imagetools inspect "$SRC:$TAG" --format '{{json .Manifest}}' \
            | jq -r '.digest')
          test -n "$MANIFEST" && test "$MANIFEST" != "null"
          echo "Moving :latest for ${{ matrix.image }} to $MANIFEST"
          docker buildx imagetools create -t "$SRC:latest" "$SRC@$MANIFEST"
          docker buildx imagetools inspect "$SRC:latest"

  # Generate SBOM and sign container images for supply chain security
  sbom-and-sign:
    name: SBOM & Sign (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: merge-core
    permissions:
      contents: read
      packages: write
      id-token: write # Required for cosign OIDC signing

    strategy:
      matrix:
        image: [backend, frontend]

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve this commit's image tag
        run: |
          # metadata-action (type=sha,prefix=) pushes the 7-char short sha.
          # Derive it HERE because an action input is not a shell: a
          # ${GITHUB_SHA::7} written under with: reaches the action as
          # sixteen literal characters (guarded by
          # test_deploy_workflow_action_inputs_are_literals.py).
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # The per-commit tag, not :latest — since O1.9 the pointer lags this
          # build deliberately (it moves only after the smoke test passes), so
          # scanning it would attest the previous commit's contents.
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ env.SHORT_SHA }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json
          retention-days: 30

      - name: Sign container image
        run: |
          # Sign the manifest list BY DIGEST. The pushed tags are now the 7-char
          # SHORT sha only (:latest moved to publish-latest, O1.9 box 2) — the
          # old `:${{ github.sha }}` (40 chars) named a manifest that was never
          # pushed and died MANIFEST_UNKNOWN on every deploy (fail-fast then
          # cancelled the backend sibling). A cosign signature attaches to a
          # digest either way, so one digest sign covers every current and future
          # tag; cosign v4 also warns that tag-based signing will stop working.
          # Resolve THIS commit's tag, not :latest, which since O1.9 can name an
          # older commit while this job runs.
          DIGEST=$(docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${GITHUB_SHA::7} \
            --format '{{json .Manifest}}' | jq -r '.digest')
          test -n "$DIGEST" && test "$DIGEST" != "null"
          echo "Signing ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@$DIGEST"
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@$DIGEST

      - name: Attach SBOM to image
        run: |
          # Attach SBOM as attestation to the same digest (see above).
          DIGEST=$(docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${GITHUB_SHA::7} \
            --format '{{json .Manifest}}' | jq -r '.digest')
          test -n "$DIGEST" && test "$DIGEST" != "null"
          cosign attest --yes --predicate sbom-${{ matrix.image }}.spdx.json \
            --type spdxjson \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@$DIGEST

  # Generate SLSA provenance attestations for supply chain security
  # SLSA Level 3: Provides cryptographic proof of build provenance
  slsa-provenance:
    name: SLSA Provenance (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: merge-core
    permissions:
      contents: read
      packages: write
      id-token: write # Required for SLSA provenance generation
      attestations: write # Required for GitHub attestation API

    strategy:
      matrix:
        image: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get image digest
        id: digest
        run: |
          # Digest of THIS commit's manifest (see sbom-and-sign above): :latest
          # now lags by design, so attesting it would attach this build's
          # provenance to the previous commit's image.
          DIGEST=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${GITHUB_SHA::7} --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Image digest: $DIGEST"

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
