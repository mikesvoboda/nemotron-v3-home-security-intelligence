name: Visual Regression Tests

# Runs nightly + on demand only (not on push, not on PRs) to save runner
# capacity — owner ruling 71: the known-failing suite (defect tracked on #6942)
# no longer reddens main pushes; its failure stays a defect, just a nightly one.

on:
  schedule:
    - cron: '23 5 * * *' # Daily 05:23 UTC — off the :00 herd (nightly-full-gate convention)
  # Allow manual trigger for updating baselines
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Update baseline snapshots'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    # Non-blocking for now while baselines are established
    continue-on-error: true
    # The TRUE test verdict, exported for the summary job: a job-level
    # continue-on-error masks needs.<this job>.result to "success" even on a
    # 97/108 failure (measured at run 38070247080 — the summary received
    # "success"), but step outcomes are NOT masked, so the verdict travels
    # through this output. Same idiom as accessibility-tests.yml.
    outputs:
      test-outcome: ${{ steps.visual-run.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd frontend && npx playwright install-deps chromium

      - name: Run Visual Regression Tests
        id: visual-run
        if: github.event.inputs.update_snapshots != 'true'
        run: cd frontend && npx playwright test --project=visual-chromium

      - name: Update Baseline Snapshots
        if: github.event.inputs.update_snapshots == 'true'
        run: cd frontend && npx playwright test --project=visual-chromium --update-snapshots

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-test-results
          path: frontend/test-results/
          retention-days: 14

      - name: Upload snapshot diff artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-diffs
          path: |
            frontend/tests/e2e/visual/**/*-diff.png
            frontend/tests/e2e/visual/**/*-actual.png
          retention-days: 14

      - name: Upload updated snapshots
        if: github.event.inputs.update_snapshots == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updated-snapshots
          path: frontend/tests/e2e/visual/**/*.png
          retention-days: 30

  # Summary job for PR status
  visual-tests-summary:
    name: Visual Tests Summary
    runs-on: ubuntu-latest
    needs: [visual-regression]
    if: always()
    steps:
      - name: Check visual test results
        run: |
          # Reads the test STEP's outcome via the job output, not
          # needs.visual-regression.result: continue-on-error masks the job
          # result to "success" whatever the suite did (measured), so a
          # result-based guard could never announce the nightly red this
          # workflow now exists to surface.
          outcome="${{ needs.visual-regression.outputs.test-outcome }}"
          if [ "$outcome" == "failure" ]; then
            echo "::warning::Visual regression tests detected differences. Review the artifacts for details."
            echo "If the changes are intentional, update the baselines by running:"
            echo "  npx playwright test --project=visual-chromium --update-snapshots"
            echo ""
            echo "Or trigger the workflow manually with 'Update baseline snapshots' checked."
          elif [ "$outcome" == "success" ]; then
            echo "Visual regression tests passed!"
          else
            echo "::warning::Visual regression suite produced no verdict (test step outcome: ${outcome:-none} — baseline-update dispatch or cancellation)."
          fi

      - name: Create Linear issue on failure
        if: vars.LINEAR_ENABLED == 'true' && (needs.visual-regression.outputs.test-outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          # Only create issue for failures on main's scheduled/dispatch runs (not PRs)
          curl -X POST https://api.linear.app/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d '{
              "query": "mutation CreateIssue($input: IssueCreateInput!) { issueCreate(input: $input) { success issue { id identifier url } } }",
              "variables": {
                "input": {
                  "teamId": "998946a2-aa75-491b-a39d-189660131392",
                  "title": "Visual regression test failure on main",
                  "description": "## Visual Regression Test Failure\n\nThe visual regression tests failed on the nightly run of main.\n\n**Commit:** ${{ github.sha }}\n**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n### Action Required\n\n1. Review the snapshot diffs in the workflow artifacts\n2. If changes are intentional, update baselines:\n   ```bash\n   cd frontend && npx playwright test --project=visual-chromium --update-snapshots\n   ```\n3. If changes are unintentional, investigate and fix the UI regression",
                  "priority": 3,
                  "labelIds": ["fef74b6f-0631-42e2-87f9-3c31e4bab170"]
                }
              }
            }'
