name: WP12 probe3 (concurrency collision)

on:
  pull_request:
    branches: [main]

# Literal = what gitleaks.yml's own root concurrency renders when the CALLER
# name flows through (github.workflow -> caller). If called-job concurrency
# evaluates the CALLER's workflow name, this parent sits in the SAME group the
# child registers in -> collision reproduces what #6575 showed (call job dies,
# needs.*.result=failure). If w5 goes GREEN, caller-name rendering is dead.
concurrency:
  group: WP12 probe3 (concurrency collision)-${{ github.ref }}
  cancel-in-progress: true

jobs:
  w5:
    name: w5 ci.yml-exact parent shape
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit # pragma: allowlist secret
    uses: ./.github/workflows/gitleaks.yml
  w6:
    name: w6 gitleaks minus root concurrency
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit # pragma: allowlist secret
    uses: ./.github/workflows/gitleaks-noc.yml
  consumer3:
    name: Consumer3
    runs-on: ubuntu-latest
    needs: [w5, w6]
    if: always()
    steps:
      - run: echo "w5=${{ needs.w5.result }} w6=${{ needs.w6.result }}"
