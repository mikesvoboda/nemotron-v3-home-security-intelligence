# [r264] MEASURE box (ruling 264, record 6257854715): measure the golden
# Playwright project in shards BEFORE any gate change, and post the table on
# the PR. This workflow is the measurement instrument, not the gate, and it is
# deliberately outside ci.yml — a ci.yml job that ci-gate does not reach turns
# the job-graph check red (scripts/test_ci_job_graph.py) — and outside any
# pull_request trigger: a pull_request workflow has to list ready_for_review,
# guard every job against drafts, and raise the workflow count that
# scripts/test_workflow_draft_guards.py pins, and a workflow_dispatch run
# resolves its workflow off the DEFAULT branch, so it cannot run this branch's
# file. A push trigger limited to the claim branch avoids all three (the
# owner's note on the PR names the same three). The file goes when the
# package's Build box lands.
#
# The matrix runs each shape (N in 2, 3, 4) twice: `pair` is the shard label
# as one string so every matrix key is a plain literal — Actions has no
# arithmetic, and include entries carrying only non-axis keys merge into every
# combination rather than naming one cell.
#
# Each shard runs the FULL fake-tier harness with --shard I/N: its own stack
# under its own compose project, its own image builds, its own Playwright leg,
# and its own run record whose `shard` key names I/N and whose
# results.golden.playwright_specs is the legs that shard executed. One
# unsharded reference run at the same head is the other side of the union
# comparison. The fan-in prints the table; it gates nothing and does not run
# the inventory witness (the witness step flips inventory rows — the package
# orders this measurement not to).

name: Feature check shard measure
on:
  push:
    branches:
      - 'uplevel/r264-sharded-golden-playwright'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Mirrored from ci.yml's env block. A standalone file inherits nothing from
  # another workflow's `env:`, and feature_check.py's backend leg resolves uv
  # the way every other backend job does (version from these literals).
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '24'
  UV_VERSION: '0.9.18'

permissions:
  contents: read

jobs:
  # The unsharded reference at the same head: the union comparison's other
  # side. Same harness invocation the ci.yml job makes, minus the witness.
  reference:
    name: Reference (unsharded)
    runs-on: ubuntu-latest
    timeout-minutes: 64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Free disk space (minimal)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false

      - name: Image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./backend/Dockerfile
          target: prod
          tags: ghcr.io/mikesvoboda/nemotron-v3-home-security-intelligence/backend:${{ env.TAG }}
          cache-from: type=gha,scope=backend
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./frontend
          file: ./frontend/Dockerfile
          target: prod
          tags: ghcr.io/mikesvoboda/nemotron-v3-home-security-intelligence/frontend:${{ env.TAG }}
          cache-from: type=gha,scope=frontend
          load: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd frontend && npx playwright install-deps chromium

      - name: Feature check (--fake, unsharded reference)
        id: harness
        env:
          FEATURE_CHECK_ROOT: ${{ runner.temp }}/feature-check
        run: scripts/feature-check.sh --fake --image-tag "$TAG"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measure-reference
          # The same paths the ci.yml job uploads (artifacts/ only — the run
          # directory also holds the throwaway admin's password and the camera
          # folders).
          path: ${{ runner.temp }}/feature-check/*/artifacts
          retention-days: 7
          if-no-files-found: warn

  # The shards: shape N in {2,3,4}, twice each (`rep`), shard i of N. `pair`
  # carries "i/N" as one string; i is split back out in shell, because Actions
  # has no arithmetic to derive it.
  shard:
    name: Shard ${{ matrix.pair }} (rep ${{ matrix.rep }})
    runs-on: ubuntu-latest
    timeout-minutes: 64
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
        # "i-of-N": artifact names reject forward slashes (NTFS-reserved
        # characters), so the shard label cannot carry the `i/N` form the
        # harness flag takes; it is split back out in shell on "-of-".
        pair:
          ['1-of-2', '2-of-2', '1-of-3', '2-of-3', '3-of-3', '1-of-4', '2-of-4', '3-of-4', '4-of-4']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Free disk space (minimal)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false

      - name: Image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./backend/Dockerfile
          target: prod
          tags: ghcr.io/mikesvoboda/nemotron-v3-home-security-intelligence/backend:${{ env.TAG }}
          cache-from: type=gha,scope=backend
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./frontend
          file: ./frontend/Dockerfile
          target: prod
          tags: ghcr.io/mikesvoboda/nemotron-v3-home-security-intelligence/frontend:${{ env.TAG }}
          cache-from: type=gha,scope=frontend
          load: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd frontend && npx playwright install-deps chromium

      - name: Feature check (--fake --shard)
        id: harness
        env:
          FEATURE_CHECK_ROOT: ${{ runner.temp }}/feature-check
          SHARD_PAIR: ${{ matrix.pair }}
        run: |
          # split "i-of-N" into --shard I/N; Actions has no arithmetic, so the
          # pair arrives as one slash-free string from the matrix (artifact
          # names reject the slash the flag form carries)
          I="${SHARD_PAIR%%-of-*}"
          N="${SHARD_PAIR##*-of-}"
          scripts/feature-check.sh --fake --shard "$I/$N" --image-tag "$TAG"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # matrix.pair is now slash-free ("i-of-N"), which artifact names
          # require (NTFS-reserved characters are rejected outright). The
          # fan-in matches this name's shape, not the record's `shard` field,
          # so the rename stays local to the workflow.
          name: measure-shard-${{ matrix.pair }}-rep${{ matrix.rep }}
          path: ${{ runner.temp }}/feature-check/*/artifacts
          retention-days: 7
          if-no-files-found: warn

  # The fan-in prints the MEASURE table. `!cancelled()` so a failed or
  # timed-out shard still yields its row (the measurement is the point); the
  # owner note names this form. No inventory witness here — the witness step
  # flips inventory rows, and this measurement must not.
  fan-in:
    name: Measure table (fan-in)
    needs: [reference, shard]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download reference artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: measure-reference
          path: runs/reference

      - name: Download shard artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: measure-shard-*
          path: runs/
          merge-multiple: false

      - name: Build the MEASURE table
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(os.environ.get("MEASURE_ROOT", "runs"))
          reference_dir = root / "reference"
          if not reference_dir.is_dir():
              print(f"FATAL: no reference artifacts at {reference_dir}")
              sys.exit(1)

          def summaries_of(dirpath):
              return sorted(dirpath.glob("**/summary.json"))

          def legs_of(summary):
              return set((summary.get("results", {}).get("golden", {}).get("playwright_specs") or {}).keys())

          refs = summaries_of(reference_dir)
          if len(refs) != 1:
              print(f"FATAL: reference holds {len(refs)} summary.json files, expected exactly 1")
              sys.exit(1)
          ref = json.loads(refs[0].read_text())
          ref_legs = legs_of(ref)

          print("## [r264] MEASURE - shard wall times and leg unions", flush=True)
          print(flush=True)
          print(f"reference (unsharded, same head): {len(ref_legs)} golden playwright legs", flush=True)
          print(flush=True)

          rows = []
          unions = {}
          problems = []
          for shard_dir in sorted(p for p in root.iterdir() if p.is_dir() and p.name != "reference"):
              found = summaries_of(shard_dir)
              label = shard_dir.name
              if len(found) != 1:
                  problems.append(f"{label}: {len(found)} summary.json files (expected exactly 1; job red or no upload)")
                  rows.append((label, None, None, "no run record"))
                  continue
              summary = json.loads(found[0].read_text())
              shard_label = summary.get("shard", "?")
              legs = legs_of(summary)
              unions.setdefault(shard_label, set()).update(legs)
              golden = summary.get("results", {}).get("golden", {})
              state = golden.get("playwright", "?")
              started = summary.get("date")
              rows.append((label, shard_label, len(legs), state))

          print("| artifact | shard | legs | playwright |", flush=True)
          print("|---|---|---|---|", flush=True)
          for label, shard_label, n_legs, state in rows:
              legs_cell = "-" if n_legs is None else str(n_legs)
              shard_cell = "-" if shard_label is None else shard_label
              print(f"| {label} | {shard_cell} | {legs_cell} | {state} |", flush=True)

          print(flush=True)
          for shard_label in sorted(unions):
              union = unions[shard_label]
              missing = sorted(ref_legs - union)
              extra = sorted(union - ref_legs)
              verdict = "EQUAL" if not missing and not extra else "MISMATCH"
              n_for = shard_label.split("/")[-1] if "/" in shard_label else "?"
              print(f"### N={n_for}: union of its shards' legs {verdict} ({len(union)} vs {len(ref_legs)})", flush=True)
              if missing:
                  print(f"- missing from the union ({len(missing)}): {', '.join(missing)}", flush=True)
              if extra:
                  print(f"- not in the reference ({len(extra)}): {', '.join(extra)}", flush=True)

          print(flush=True)
          print("Wall times: each shard job's own clock in this run's view; the record's `date` stamps the harness start.", flush=True)

          if problems:
              print(flush=True)
              print("PROBLEMS:", flush=True)
              for problem in problems:
                  print(f"- {problem}", flush=True)
              sys.exit(1)
          PYEOF

      - name: Job summary
        if: always()
        run: echo "The table above is the measurement; it gates nothing (ruling 264 MEASURE box)."
