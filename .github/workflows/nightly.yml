name: Nightly Analysis

on:
  schedule:
    - cron: '0 7 * * *' # 2am EST / 7am UTC
  workflow_dispatch:

env:
  UV_VERSION: '0.9.18'

jobs:
  # NOTE 2026-09-15: extended-benchmarks (self-hosted gpu, rtx-a5500) removed
  # while that runner is offline (queued to 60m timeout nightly). Restore from git
  # history when the GPU box comes back online.

  # NOTE 2026-10-13: complexity-trends (wily) removed by owner ruling 149(b) —
  # it had failed on every run since at least 10-03 and nothing read its report.
  # It survived that long because this workflow is report-only: a red here is
  # triaged, never merge-blocking. Complexity gating lives in ci.yml's
  # `uv run radon cc` / `uv run radon mi` step (a hard gate, not a report), and
  # wily itself left the project env under R-1 (2026-09-23) — these `uv tool run`
  # steps were its last consumer, so nothing else here needs to change.
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # OB.2: the pip-audit and npm audit steps deleted here. They wrote no
      # file (the upload below carries bandit-full.json only), their verdicts
      # were swallowed by `|| true`, and no artifact or step consumed their
      # stdout — phantom legs by measurement, not taste. Dependency auditing
      # now runs in exactly one place: .github/workflows/dependency-audit.yml
      # (weekly schedule + ci.yml's WP1.2 call job, registry checkers fail
      # CLOSED there — a strictly stronger audit than two `|| true` prints).
      - name: Full Bandit scan
        run: uv tool run bandit -r backend/ -f json -o bandit-full.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-audit
          path: |
            bandit-full.json
