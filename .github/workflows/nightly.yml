name: Nightly Analysis

on:
  schedule:
    - cron: '0 7 * * *' # 2am EST / 7am UTC
  workflow_dispatch:

env:
  UV_VERSION: '0.9.18'

jobs:
  # NOTE 2026-09-15: extended-benchmarks (self-hosted gpu, rtx-a5500) removed
  # while that runner is offline (queued to 60m timeout nightly). Restore from git
  # history when the GPU box comes back online.
  complexity-trends:
    name: Complexity Trends
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for wily

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Build wily cache
        run: uv tool run wily build backend/

      - name: Generate complexity report
        run: |
          uv tool run wily report backend/ --format html -o wily-report.html
          uv tool run wily diff backend/ -r HEAD~10..HEAD

      - name: Upload wily report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wily-report
          path: wily-report.html

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Audit Python dependencies
        run: uv tool run pip-audit || true

      - name: Audit Node dependencies
        run: |
          cd frontend
          npm audit || true

      - name: Full Bandit scan
        run: uv tool run bandit -r backend/ -f json -o bandit-full.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-audit
          path: |
            bandit-full.json
