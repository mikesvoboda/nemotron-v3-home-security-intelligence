name: SAST (Static Analysis)

# WP1.2 (2026-09-20): SAST becomes BLOCKING — same surgery as gitleaks.yml:
# advisory standalone push/PR workflow -> `uses:`-called from ci.yml, whose
# call job is a direct ci-gate need + check_job line. Bandit/Semgrep findings
# used to be compatible with a green `CI Gate`. Baseline at flip: ZERO
# high/critical findings (measured 2026-09-20, green on last 5 main pushes).
# Triggers deleted so the standalone run cannot race the parent inside the
# shared concurrency group. See gitleaks.yml's header for the full rationale.
on:
  workflow_call:

# WP1.2 fix (probe3, run 35492418369): root `concurrency:` is BANNED in a
# called workflow. The child run renders `${{ github.workflow }}` as the
# CALLER's name, so with ci.yml's group `CI-<ref>` every child registered
# the PARENT's own group; cancel-in-progress then killed the call job at
# initialization (no check-run, no logs, needs.*.result=failure — proven
# one-variable: w5 dies, w6 same-parent green). Standalone triggers are
# deleted, so a group here guarded nothing; ci.yml's own concurrency
# already cancels duplicate pushes whole-run. Precedent: integration-shard.yml.

env:
  UV_VERSION: '0.9.18'

jobs:
  bandit:
    name: Bandit Python Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Run Bandit
        run: |
          uv tool run bandit -r backend/ \
            -c .bandit.yml \
            -b .bandit.baseline \
            -x "backend/tests/*" \
            -f json \
            -o bandit-report.json \
            --severity-level medium \
            || true

      - name: Check for high/critical issues
        run: |
          if [ -f bandit-report.json ]; then
            HIGH=$(cat bandit-report.json | python -c "import sys,json; r=json.load(sys.stdin); print(sum(1 for i in r.get('results',[]) if i['issue_severity'] in ['HIGH','CRITICAL']))")
            if [ "$HIGH" -gt 0 ]; then
              echo "Found $HIGH high/critical security issues"
              cat bandit-report.json | python -c "import sys,json; r=json.load(sys.stdin); [print(f\"{i['filename']}:{i['line_number']} - {i['issue_text']}\") for i in r.get('results',[]) if i['issue_severity'] in ['HIGH','CRITICAL']]"
              exit 1
            fi
          fi

  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/python
            p/typescript
            p/react
            p/owasp-top-ten
            semgrep.yml
