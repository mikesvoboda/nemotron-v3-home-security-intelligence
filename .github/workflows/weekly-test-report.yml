name: Weekly Test Report

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '24'
  UV_VERSION: '0.9.18'

jobs:
  # ============================================================================
  # Collect test metrics and coverage
  # ============================================================================

  weekly-report:
    name: Generate Weekly Test Report
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: security_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: uv sync --extra dev --frozen

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run backend unit tests
        id: backend-unit
        # OB.2 reason: this workflow REPORTS suite health, it does not gate
        # it (ci.yml owns the gate) — the json-report files are the deliverable
        # and the report generator below must run on every outcome, red
        # included; that is the whole point of a weekly trend.
        run: |
          uv run pytest backend/tests/unit/ \
            --cov=backend \
            --cov-json \
            --json-report \
            --json-report-file=backend-unit-report.json \
            -v
        continue-on-error: true

      - name: Run backend integration tests
        id: backend-integration
        # OB.2 reason: same report-not-gate doctrine as the unit step above.
        run: |
          uv run pytest backend/tests/integration/ \
            -n0 \
            --json-report \
            --json-report-file=backend-integration-report.json \
            -v
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/security_test # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379/0

      - name: Run frontend tests
        id: frontend-test
        # OB.2 reason: same report-not-gate doctrine as the backend steps.
        working-directory: frontend
        run: |
          npm test -- --run --reporter=verbose
        continue-on-error: true

      - name: Generate weekly report
        id: report
        # OB.2 reason: the generator tolerates missing/partial upstream
        # reports by design (a week where one suite exploded still gets a
        # trend row); a hard red here would blank the artifact and break the
        # history the weekly-test-report artifact series exists to build.
        run: |
          python3 scripts/weekly-test-report.py \
            --output weekly-test-report.json \
            --no-frontend
        continue-on-error: true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            weekly-test-report.json
            backend-unit-report.json
            backend-integration-report.json
            .coverage
            coverage/
          retention-days: 30

      - name: Generate job summary
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 📊 Weekly Test Report

          ## Test Execution

          - **Backend Unit Tests**: ${{ steps.backend-unit.outcome }}
          - **Backend Integration Tests**: ${{ steps.backend-integration.outcome }}
          - **Frontend Tests**: ${{ steps.frontend-test.outcome }}
          - **Report Generation**: ${{ steps.report.outcome }}

          ## Artifacts

          Generated report saved to: `weekly-test-report.json`

          View detailed test metrics:
          - Backend unit test report: `backend-unit-report.json`
          - Backend integration test report: `backend-integration-report.json`
          - Coverage data: `.coverage`

          ## Actions

          - Download artifacts to analyze trends
          - Compare with previous weeks to identify regressions
          - Review flaky tests and coverage gaps
          EOF

  # ============================================================================
  # Post report to team channels (if integration configured)
  # ============================================================================

  post-report:
    name: Post Report Summary
    runs-on: ubuntu-latest
    needs: [weekly-report]
    if: always()
    steps:
      - name: Download report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-reports
          path: reports

      - name: Prepare summary
        id: summary
        run: |
          echo "Preparing weekly test report summary..."
          if [ -f reports/weekly-test-report.json ]; then
            echo "REPORT_AVAILABLE=true" >> $GITHUB_OUTPUT
          else
            echo "REPORT_AVAILABLE=false" >> $GITHUB_OUTPUT
          fi

      - name: Post to team channel (if configured)
        if: steps.summary.outputs.REPORT_AVAILABLE == 'true' && env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          # v4 requires the webhook kind as an input; v1 inferred it from the
          # presence of SLACK_WEBHOOK_URL. The URL itself still resolves from
          # that env var (dist/index.js: getInput("webhook") || env.SLACK_WEBHOOK_URL),
          # so only the discriminator is new. Without it v4 throws
          # "Missing input! The webhook type must be 'incoming-webhook' or
          # 'webhook-trigger'." — and this is a channel webhook, not a
          # Workflow Builder trigger.
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "📊 Weekly Test Report Generated",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Weekly Test Report*\n\nGenerated on: $(date '+%Y-%m-%d')\nStatus: Complete\n\nView full report in CI artifacts."
                  }
                }
              ]
            }
        # OB.2 reason: external notification — a Slack outage (or an expired
        # webhook) must not redden the weekly REPORT run; the report artifact
        # is the deliverable, the channel post is courtesy.
        continue-on-error: true

  # ============================================================================
  # Detect and report flaky tests
  # ============================================================================

  analyze-flaky-tests:
    name: Analyze Flaky Tests
    runs-on: ubuntu-latest
    needs: [weekly-report]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download test reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-reports
          path: reports

      - name: Check for flaky tests
        run: |
          echo "Analyzing test results for flaky patterns..."

          # This would be implemented as a script that:
          # 1. Parses test reports
          # 2. Compares with historical data
          # 3. Identifies intermittent failures
          # 4. Generates summary

          if [ -f reports/backend-unit-report.json ]; then
            echo "Backend unit tests: Available"
          fi

          if [ -f reports/backend-integration-report.json ]; then
            echo "Backend integration tests: Available"
          fi
        # (OB.2: the continue-on-error that used to sit here is gone — this
        # step only echoes; with bash's if-compound returning 0 on a false
        # condition the key could never fire, and a decorative COE dilutes
        # the ones that carry load.)

      - name: Comment on flaky tests (if found)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // This would create an issue or discussion about flaky tests
            // when patterns are detected in the test reports
            console.log("Flaky test analysis complete");
        # (OB.2: continue-on-error removed — a console.log cannot fail.)

  # ============================================================================
  # Enforce coverage thresholds
  # ============================================================================

  coverage-threshold-check:
    name: Coverage Threshold Enforcement
    runs-on: ubuntu-latest
    needs: [weekly-report]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-reports
          path: reports

      - name: Check coverage thresholds
        run: |
          echo "Checking coverage against thresholds..."
          echo ""
          echo "Required thresholds:"
          echo "  Backend unit tests: 85%"
          echo "  Backend combined: 95%"
          echo "  Frontend: 83%/77%/81%/84% (statements/branches/functions/lines)"
          echo ""
          echo "Note: Thresholds are enforced in CI workflow"
          echo "Weekly report tracks trends over time"
        # (OB.2: continue-on-error removed — every line above is an echo, so
        # the step cannot fail and the key was decoration. The note itself is
        # honest: the enforcement lives in ci.yml/test-coverage-gate.yml.)

  # ============================================================================
  # Cleanup old reports
  # ============================================================================

  cleanup-old-reports:
    name: Cleanup Old Reports
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup artifacts older than 90 days
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const now = new Date();
            const ninetyDaysAgo = new Date(now.getTime() - (90 * 24 * 60 * 60 * 1000));

            for (const artifact of artifacts.data.artifacts) {
              const createdAt = new Date(artifact.created_at);
              if (createdAt < ninetyDaysAgo) {
                console.log(`Deleting old artifact: ${artifact.name}`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
        # OB.2 reason: housekeeping — deleting an artifact the API already
        # reaped (or a pagination edge) must not redden the weekly report
        # run; nothing downstream reads this job's status.
        continue-on-error: true
