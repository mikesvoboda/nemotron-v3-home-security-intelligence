name: AGENTS.md Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# WP3.4: repeated pushes to a PR branch piled up redundant runs of this
# workflow that all competed for the measured ~20-job scheduler ceiling
# (spec WP3.1: concurrency 20 pinned). Same pattern as ci.yml:10-12.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-agents-md:
    runs-on: ubuntu-latest
    # No job-level continue-on-error. It was added in the same commit (#4015)
    # that introduced the Sync-to-Linear step below - and that step's
    # `pip install pyyaml` never installed the httpx that
    # scripts/agents_md_linear_sync.py imports, so the Linear doc-drift task
    # has failed on EVERY push to main since, invisible behind the mask.
    # An advisory job that cannot fail is how a whole feature died quietly;
    # this workflow gates nothing in ci-gate, so a real red here is signal,
    # not noise.

    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # pyyaml for agents_md_validator.py, httpx for
          # agents_md_linear_sync.py - the script has imported httpx since
          # the day it was added; the install line never caught up.
          pip install pyyaml httpx

      - name: Run AGENTS.md validator
        id: validator
        run: |
          # W1.1: the validator now has teeth (exit 1 on a ratchet violation,
          # 2 when the baseline could not load). Its exit code is captured,
          # not raised here, because the Sync-to-Linear step below is what
          # historically DIED quietly when it sat behind a masked failure —
          # and the ticket stream must keep running while violations drain.
          # The rc decides the job in the final step. `|| true` because the
          # shell runs with -e.
          set +e
          python scripts/agents_md_validator.py \
            --output report.json \
            --format json
          echo "outcome=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Exit 2 writes NO report (by design — a DEFAULTS-config report would
        # feed the sync a bogus table), so uploading it would only add a
        # second, confusing red.
        if: always() && steps.validator.outputs.outcome != '2'
        with:
          name: agents-md-report
          path: report.json

      - name: Sync to Linear (main branch only)
        if: vars.LINEAR_ENABLED == 'true' && (github.ref == 'refs/heads/main') && steps.validator.outputs.outcome != '2'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          # Runs on outcome 1 as well as 0: the doc-drift ticket stream and
          # the gate are allowed to disagree — violations are listed below
          # in the job log and in report.json's ratchet.violations.
          python scripts/agents_md_linear_sync.py \
            --report report.json \
            --commit ${{ github.sha }}

      - name: Ratchet verdict
        run: |
          # || 2: an empty outcome means the validator died before writing
          # its output — fail closed, never silently green.
          exit ${{ steps.validator.outputs.outcome || 2 }}
