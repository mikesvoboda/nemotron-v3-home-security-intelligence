# AGENTS.md validation configuration
# Controls which directories are scanned and what counts as code files

# Directories to skip entirely (no AGENTS.md required)
# Glob patterns relative to project root
exclude_directories:
  - __pycache__
  - node_modules
  - .git
  - .venv
  - .pytest_cache
  - coverage
  - dist
  - build
  - .mypy_cache
  - .ruff_cache
  - mutants
  - '*.egg-info'
  - .tox
  - .nox
  # W1.1: mkdocs output. Gitignored, but rglob does not read .gitignore — one
  # local `mkdocs build` otherwise adds a scanned AGENTS.md and reddens the
  # gate for reasons no PR caused. Measured effect on both baselines: zero.
  - site

# Directories that intentionally have no AGENTS.md
# Even if they contain code files (used for generated code, test fixtures, etc.)
no_agents_md_required:
  - certs/
  - data/
  # Setup library is simple utilities
  - setup_lib/
  # Tests directory at root is minimal
  - tests/
  # Quarantine for pending-deletion artifacts — content, not code to navigate
  - archive/
  - docs/archive/

# File extensions that count as "code files"
# Directories with >= min_code_files of these need AGENTS.md
code_extensions:
  - .py
  - .ts
  - .tsx
  - .js
  - .jsx

# Minimum code files before requiring AGENTS.md
min_code_files: 2

# File patterns to exclude from reference validation
# Regex patterns - references matching these are not validated as file paths
exclude_reference_patterns:
  # Example patterns in documentation
  - "example\\.py"
  - "your_file\\.py"
  # Template variables like {file}.py or <name>.py
  - "\\{.*\\}"
  - '<.*>'
  # Environment variables
  - "\\$\\{.*\\}"
  - "\\$[A-Z_]+"
  # Output artifacts mentioned in documentation
  - "report\\.json$"
  - "-report\\.json$"
  - "yolo26-vs-yolo26\\.md$" # scripts/benchmark_yolo26_accuracy.py DEFAULT_OUTPUT_PATH — written on a run, not in the tree
  # Generic pattern placeholders (prose like "every .tsx has a co-located .test.tsx")
  - "_test\\.(py|tsx?)$"
  - "test_.*\\.py$"
  - "\\.test\\.tsx$"
  - "\\.msw\\.test\\.tsx$"

# ---------------------------------------------------------------------------
# W1.1 ratchet baselines — measured by scripts/agents_md_validator.py itself
# on the tree this PR produces: that is the tree this config ships on, and a
# baseline measured on a tree that never runs is unverifiable (the design
# panel's blocker). Honest scope of that claim, measured at this PR's
# merge-base for the review: the retired-name counts (then six, now five
# names per the owner's pose ruling) are IDENTICAL at base and head — the
# PR's AGENTS.md edits add zero net mentions — so
# "minting at the base would have minted stale numbers" was false for THIS
# PR; it is a hazard that generalises (any AGENTS.md edit can move a count,
# which is why re-measure-before-merge is the rule), not a harm this PR
# demonstrably dodged. Ratchet doctrine (scripts/ratchet-check.py):
# these sets may only FALL. A rise is a hand edit a human reviews in the diff;
# there is deliberately no --update, because a flag that rewrites the baseline
# is an opt-out with no diff. See docs/uplevel/40-docs.md (W1.1).
# ---------------------------------------------------------------------------

# dead_reference_allowlist was REMOVED by W1.3 (drained to zero 2026-10-08): dead references
# now fail the gate directly, zero tolerance. The loader rejects the key's presence
# (exit 2) — re-adding an excuse is a gate-disable attempt; repair the citation instead.

# The remaining baseline — retired-name mentions (docs/uplevel/00-audit.md's retired
# names), measured at the same commit on this tree and a clean clone
# (identical: 93/143/153/10/2, total 401, over 245 scanned AGENTS.md;
# re-measured on the rebased head 2026-10-08, and again at W1.3's head after
# the drain — W1.3 removed six enrichment mentions, so the ceiling fell
# 159 -> 153 with it; counts hand-fall in the PR that removes the mentions;
# re-measured at W3.1 deletion batch 1 — identical 93/143/153/10/2, now over
# 235 scanned (245 -> 235: the ten deleted synthbench satellite guides named
# none of the five, so the denominator moved and the counts did not);
# at batch 2 the deleted ai/ satellites carried retired-name mentions, and
# the boundary files they left behind lost their stale five-adapter rows, so
# the counts fell and the ceilings hand-fell to the final measurement:
# florence 93 -> 84 and enrichment 153 -> 145 over 225 scanned;
# at batch 3 the deleted scripts/ satellites named Florence twice and the
# retired family once (the synthetic pipeline prose) — florence 84 -> 82,
# nemotron 143 -> 142; at batch 4 the deleted monitoring/ satellites (the
# dashboards guide above all) plus one stale fence line rewritten in
# monitoring/AGENTS.md carried florence -32 (31 deleted + 1 rewritten),
# enrichment -11, nemotron -1 — final measurement 50/141/134/10/2 over 211 scanned;
# at batch 5 the six tail singletons (tests, tests/benchmark, tests/load, data,
# docker, archive/vsftpd) carried two mentions, both in the data guide's
# schema prose — nemotron 141 -> 139, final measurement over 205 scanned;
# at batch 6 the 45 backend/tests/** guides carried the largest fall of the
# drain — florence 50 -> 42, nemotron 139 -> 115, enrichment 134 -> 101 —
# re-measured by the validator at this commit (33 enrichment mentions counting
# case variants; the appendix in backend/AGENTS.md states everything DB- and
# module-neutral, verified zero net new mentions by the pre-deletion run);
# xclip/demographics unmoved throughout). `pose` is OUT of the ratchet
# per the owner's ruling on #6870 (2026-10-08): the count is dominated by the
# LIVE Triton model actually named `pose`, so it mixes live and retired usage
# (it measured 37 whole-word while watched). It comes back if R2 retires the
# pose features.
# Counting rule: case-insensitive WHOLE WORD (\b<name>\b) over the FULL
# content of every scanned AGENTS.md — fenced blocks INCLUDED (fences are not
# a dodge surface) and READMEs EXCLUDED (the scanned set is find_agents_md_files,
# never every *.md). Whole-word is load-bearing: \w includes the underscore,
# so shipped identifiers like ENRICHMENT_LIGHT_URL are NOT `enrichment`
# mentions under \b, but a SUBSTRING implementation would count them and
# redden any PR that names one — pinned by
# test_enrichment_light_url_is_not_enrichment.
# Per-name ceilings, not one total: a total launders by substitution
# (+1 florence bought with -1 demographics — the fixture drops demographics
# and doubles florence, so nemotron sits still on both sides of the swap) —
# pinned by test_substitution_does_not_green_a_total. ALL FIVE KEYS ARE REQUIRED: the
# run exits 2 without any one of them (absent is neither 0 nor unchecked).
retired_name_baseline:
  florence: 42 # retired ai/florence path (W1.3 drained its dead-reference citations
  # without adding florence mentions; W3.1 batches 2-4 removed 43 mentions —
  # deleted satellites plus stale prose, the batch-4 fall (-32) living in the
  # monitoring dashboards guide — 93 -> 84 -> 82 -> 50, hand-fell each PR;
  # batch 5's six guides named no florence at all; batch 6's backend/tests guides
  # carried eight (the unit/services and unit/models prose) — 50 -> 42, hand-fell)
  nemotron: 115 # the retired model family (the repo's own name string; W3.1
  # batch 3 removed one mention and batch 4 one more; batch 5's data guide
  # carried two (141 -> 139, the schema prose the appendix now states DB-neutral);
  # batch 6's test-tree guides carried 24 (the gpu/e2e/fixtures prose — including
  # one guide printing a URL port the code contradicts) — 139 -> 115, hand-fall
  # every PR)
  enrichment: 101 # retired ai/enrichment component (W1.3 drained six dead-citing
  # mentions; W3.1 batch 2 removed eight (153 -> 145) and batch 4 eleven
  # more with the monitoring dashboards guide — 145 -> 134; batch 6's unit-tier
  # guides carried 33 (adapter/transformer prose the appendix now states
  # module-neutral) — 134 -> 101, hand-fall)
  xclip: 10 # retired clip pipeline
  demographics: 2

# W2.1 boundary list (UR-21): the directories that keep an AGENTS.md when W3.1 prunes the
# rest. Membership rule (DECIDE; census in PR #6920): root + the seven lane roots +
# every non-test, non-docs, non-archive directory with >= 20 code files (the
# validator's own unit, measured at this config's tree) + the directories the standard
# names or that guard a cross-lane/CI contract (frontend/src, backend/ai_contract,
# backend/api, ai/gateway, ai/gateway/export, synthbench/contract,
# .github/codeql/custom-queries). Test dirs, docs/ subfolders and archive/ are NOT
# boundaries; they index themselves. A directory the rule would keep is listed
# ONLY if it has an AGENTS.md today: W3.1 deletes files outside the list and
# adds none, so a boundary without a file would sit in the report forever as a
# measured-null hole in the map. synthbench/commands (23 code files, no
# AGENTS.md, flagged by the missing_agents_md arm) is therefore not_boundary —
# it stays unlisted rather than moving to no_agents_md_required, which would
# silence a gap the gate already reports. Pinned by
# test_committed_boundary_list_covers_the_rule.
boundary_list:
  - path: .
    reason: "the project's single root instruction file (owner ruling 2026-09): navigation plus the operational rules every agent reads first"
  - path: .github
    reason: 'lane root: CI/CD workflows, security scanning, dependency and review configuration'
  - path: ai
    reason: 'lane root: AI inference services; the prod compose builds exactly two AI images (this file says which)'
  - path: backend
    reason: "lane root: the FastAPI backend \u2014 request flow, services, models, API wiring"
  - path: frontend
    reason: "lane root: the React dashboard app \u2014 build tooling, config, and the src/ workspace"
  - path: monitoring
    reason: "lane root: observability config (Prometheus, Grafana provisioning, DCGM) \u2014 config IS the product here"
  - path: scripts
    reason: "lane root: dev/test/deploy/maintenance scripts \u2014 the AGENTS.md validator and this gate itself live here"
  - path: setup_lib
    reason: "setup.py's extracted utilities; exempt from the AGENTS.md requirement (simple utilities) but keeps its file"
  - path: synthbench
    reason: 'lane root: synthetic benchmark generation (the docs/superpowers specs drive the arms)'
  - path: ai/gateway
    reason: "the single FastAPI front for Triton (port 8090); the legacy containers' wire APIs are its contract"
  - path: backend/ai_contract
    reason: 'the generated single source of truth for AI-tier operations the backend may call (standard-named)'
  - path: backend/api
    reason: 'the FastAPI REST layer root: app wiring, media serving, dead-letter queue, metrics'
  - path: backend/core
    reason: "foundational infra: settings (config.py), logging, redis/db wiring \u2014 security-adjacent and hot"
  - path: backend/models
    reason: 'the SQLAlchemy 2.0 models that ARE the database schema of record'
  - path: backend/services
    reason: "detection-pipeline orchestration, enrichment, re-ID, model zoo \u2014 the backend's invariant heart (standard-named)"
  - path: frontend/src
    reason: 'the React source workspace every frontend package nests under (standard-named)'
  - path: synthbench/contract
    reason: "the event contract (spec section 2): what an event means to show \u2014 a cross-lane interface"
  - path: .github/codeql/custom-queries
    reason: "the custom CodeQL queries the security-scan gate runs \u2014 CI-blocking by construction"
  - path: ai/gateway/export
    reason: "model export scripts; the Triton model cache they write is GENERATED \u2014 the source-vs-cache trap"
  - path: backend/api/middleware
    reason: "cross-cutting HTTP middleware (auth, preflight, content-type) \u2014 registration order is load-bearing"
  - path: backend/api/routes
    reason: "HTTP endpoint handlers \u2014 one of the two largest backend packages"
  - path: backend/api/schemas
    reason: 'Pydantic request/response models; feeds docs/openapi.json regeneration (hot file)'
  - path: frontend/src/contexts
    reason: 'React context providers (global state outside the stores)'
  - path: frontend/src/hooks
    reason: "WebSocket/event/polling hooks \u2014 the realtime data plane (the tree's largest package)"
  - path: frontend/src/pages
    reason: 'top-level route-destination page components'
  - path: frontend/src/services
    reason: "the typed REST client + logging \u2014 the frontend's only path to the backend"
  - path: frontend/src/stores
    reason: "Zustand stores \u2014 app state that lives outside the React tree"
  - path: frontend/src/types
    reason: 'frontend type definitions; types/generated nests under it (regenerate, never hand-merge)'
  - path: frontend/src/utils
    reason: 'shared risk/confidence/time formatting utilities'
  - path: frontend/src/components/ai
    reason: 'AI Performance and AI Audit pages: model health, pipeline health, prompt quality'
  - path: frontend/src/components/alerts
    reason: 'high/critical alert views and alert-rule configuration'
  - path: frontend/src/components/analytics
    reason: 'analytics page: baselines, anomalies, pipeline latency, scene change'
  - path: frontend/src/components/common
    reason: 'reusable low-level UI building blocks shared across features'
  - path: frontend/src/components/dashboard
    reason: 'main dashboard: risk visualization, camera status, GPU and pipeline status'
  - path: frontend/src/components/developer-tools
    reason: 'dev tools page: config inspector, profiler, request recorder, log levels'
  - path: frontend/src/components/entities
    reason: 'cross-camera entity tracking UI (ReID embeddings at a pinned cosine threshold)'
  - path: frontend/src/components/events
    reason: 'event list/detail UI: AI summaries, detection overlays, export'
  - path: frontend/src/components/face-recognition
    reason: 'face-recognition and person re-identification UI'
  - path: frontend/src/components/jobs
    reason: 'background-jobs page with WebSocket log streaming'
  - path: frontend/src/components/settings
    reason: 'Settings page: cameras, alert rules, processing params, calibration, access control'
  - path: frontend/src/components/system
    reason: 'system observability panels: metrics, containers, DB, pipeline flow'
  - path: frontend/src/components/zones
    reason: 'detection-zone overlay management on camera feeds'

# W2.1 line caps per tier (DECIDE): REPORTING ONLY until W3.2 flips them to failing.
# A boundary file over its cap appears in the report's ratchet.line_caps block; the
# run stays green on caps alone. Caps apply to the boundary files only — files
# outside the list are W3.1 deletions, and capping a file scheduled to disappear is
# noise, not a ratchet. The standard that sets these numbers has its single home at
# docs/developer/agents-md-standard.md (40-docs.md points there). Measured at
# adoption (PR #6920, this head): root 505 — inside its cap; lane roots 41..1334,
# 4 of the 7 over; boundary packages up to 3164; 29 of the 42 boundary files over
# cap. The live set is the report's ratchet.line_caps.over (or the run's console
# summary), not this comment — the comment is the reason the caps exist, the
# report is the work list. W3.2 rewrites them, one PR per lane.
line_caps:
  root: 600 # the root file; the standard says it is the longest
  lane_root: 500 # the seven lane roots
  package: 300 # every other boundary file
