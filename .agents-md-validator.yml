# AGENTS.md validation configuration
# Controls which directories are scanned and what counts as code files

# Directories to skip entirely (no AGENTS.md required)
# Glob patterns relative to project root
exclude_directories:
  - __pycache__
  - node_modules
  - .git
  - .venv
  - .pytest_cache
  - coverage
  - dist
  - build
  - .mypy_cache
  - .ruff_cache
  - mutants
  - '*.egg-info'
  - .tox
  - .nox
  # W1.1: mkdocs output. Gitignored, but rglob does not read .gitignore — one
  # local `mkdocs build` otherwise adds a scanned AGENTS.md and reddens the
  # gate for reasons no PR caused. Measured effect on both baselines: zero.
  - site

# Directories that intentionally have no AGENTS.md
# Even if they contain code files (used for generated code, test fixtures, etc.)
no_agents_md_required:
  - certs/
  - data/
  # Setup library is simple utilities
  - setup_lib/
  # Tests directory at root is minimal
  - tests/
  # Quarantine for pending-deletion artifacts — content, not code to navigate
  - archive/
  - docs/archive/

# File extensions that count as "code files"
# Directories with >= min_code_files of these need AGENTS.md
code_extensions:
  - .py
  - .ts
  - .tsx
  - .js
  - .jsx

# Minimum code files before requiring AGENTS.md
min_code_files: 2

# File patterns to exclude from reference validation
# Regex patterns - references matching these are not validated as file paths
exclude_reference_patterns:
  # Example patterns in documentation
  - "example\\.py"
  - "your_file\\.py"
  # Template variables like {file}.py or <name>.py
  - "\\{.*\\}"
  - '<.*>'
  # Environment variables
  - "\\$\\{.*\\}"
  - "\\$[A-Z_]+"
  # Output artifacts mentioned in documentation
  - "report\\.json$"
  - "-report\\.json$"
  - "yolo26-vs-yolo26\\.md$" # scripts/benchmark_yolo26_accuracy.py DEFAULT_OUTPUT_PATH — written on a run, not in the tree
  # Generic pattern placeholders (prose like "every .tsx has a co-located .test.tsx")
  - "_test\\.(py|tsx?)$"
  - "test_.*\\.py$"
  - "\\.test\\.tsx$"
  - "\\.msw\\.test\\.tsx$"

# ---------------------------------------------------------------------------
# W1.1 ratchet baselines — measured by scripts/agents_md_validator.py itself
# on the tree this PR produces: that is the tree this config ships on, and a
# baseline measured on a tree that never runs is unverifiable (the design
# panel's blocker). Honest scope of that claim, measured at this PR's
# merge-base for the review: the retired-name counts (then six, now five
# names per the owner's pose ruling) are IDENTICAL at base and head — the
# PR's AGENTS.md edits add zero net mentions — so
# "minting at the base would have minted stale numbers" was false for THIS
# PR; it is a hazard that generalises (any AGENTS.md edit can move a count,
# which is why re-measure-before-merge is the rule), not a harm this PR
# demonstrably dodged. Ratchet doctrine (scripts/ratchet-check.py):
# these sets may only FALL. A rise is a hand edit a human reviews in the diff;
# there is deliberately no --update, because a flag that rewrites the baseline
# is an opt-out with no diff. See docs/uplevel/40-docs.md (W1.1).
# ---------------------------------------------------------------------------

# Baseline 1/2 — every dead file reference the validator reports TODAY (13
# pairs; the audit's 213 is the full census — the committed extractor sees
# backticked paths only, and widening the grammar is W1.3's job, together
# with emptying this list). Keys are the report.json fields verbatim
# (agents_md + reference, trailing slash included), so the gate matches the
# emitted pair with no translation layer. Loader rules: entries are literal
# paths (no globs, no leading /) and every entry carries a tracking ref —
# an admission without a reason to revisit is a permanent excuse. All 13
# drain under W1.3 ("Remove dead references now"); the PR that fixes a
# reference deletes its entry in the same diff (test_real_tree_allowlist_is_
# exact goes red on a zombie entry until then).
dead_reference_allowlist:
  - agents_md: .github/AGENTS.md
    reference: ai/florence/requirements.txt
    tracking: W1.3
  # `.venv/` is gitignored AND in exclude_directories above; under ANCHORED
  # resolution (exists + inside the root + no excluded component) it stays
  # dead on every tree — absent in CI, excluded-but-present on a dev box.
  # Keep the entry: whoever measures a local 12 must not "fix" it by
  # deleting this pair. The other two `.venv/`-shaped traps (references
  # that exist only under build/ etc.) are excluded from extraction by the
  # patterns above, so they never reach this list.
  - agents_md: .github/codeql/custom-queries/AGENTS.md
    reference: .venv/
    tracking: W1.3
  - agents_md: ai/common/AGENTS.md
    reference: ai/enrichment/models/
    tracking: W1.3
  - agents_md: ai/common/tests/AGENTS.md
    reference: ai/enrichment-light/models/
    tracking: W1.3
  - agents_md: ai/common/tests/AGENTS.md
    reference: ai/enrichment/scripts/
    tracking: W1.3
  - agents_md: ai/triton/AGENTS.md
    reference: ai/gateway/adapters/enrichment.py
    tracking: W1.3
  - agents_md: docs/AGENTS.md
    reference: images/ai-pipeline/
    tracking: W1.3
  - agents_md: docs/architecture/AGENTS.md
    reference: ai/enrichment/
    tracking: W1.3
  - agents_md: docs/images/AGENTS.md
    reference: ai-pipeline/
    tracking: W1.3
  - agents_md: synthbench/AGENTS.md
    reference: status/flagship.json
    tracking: W1.3
  - agents_md: synthbench/AGENTS.md
    reference: status/snapshots.json
    tracking: W1.3
  - agents_md: synthbench/clips/AGENTS.md
    reference: commands/clip_render.py
    tracking: W1.3
  - agents_md: tests/AGENTS.md
    reference: tests/unit/
    tracking: W1.3

# Baseline 2/2 — retired-name mentions (docs/uplevel/00-audit.md's retired
# names), measured at the same commit on this tree and a clean clone
# (identical: 93/143/159/10/2, total 407, over 245 scanned AGENTS.md;
# re-measured on the rebased head 2026-10-08). `pose` is OUT of the ratchet
# per the owner's ruling on #6870 (2026-10-08): the count is dominated by the
# LIVE Triton model actually named `pose`, so it mixes live and retired usage
# (it measured 37 whole-word while watched). It comes back if R2 retires the
# pose features.
# Counting rule: case-insensitive WHOLE WORD (\b<name>\b) over the FULL
# content of every scanned AGENTS.md — fenced blocks INCLUDED (fences are not
# a dodge surface) and READMEs EXCLUDED (the scanned set is find_agents_md_files,
# never every *.md). Whole-word is load-bearing: \w includes the underscore,
# so shipped identifiers like ENRICHMENT_LIGHT_URL are NOT `enrichment`
# mentions under \b, but a SUBSTRING implementation would count them and
# redden any PR that names one — pinned by
# test_enrichment_light_url_is_not_enrichment.
# Per-name ceilings, not one total: a total launders by substitution
# (+1 florence bought with -1 nemotron) — pinned by
# test_substitution_does_not_green_a_total. ALL FIVE KEYS ARE REQUIRED: the
# run exits 2 without any one of them (absent is neither 0 nor unchecked).
retired_name_baseline:
  florence: 93 # retired ai/florence path; citations drain under W1.3
  nemotron: 143 # the retired model family (the repo's own name string)
  enrichment: 159 # retired ai/enrichment component
  xclip: 10 # retired clip pipeline
  demographics: 2

