# Prometheus configuration for Home Security Intelligence
#
# TEMPLATE FILE - This file is processed by envsubst during container startup.
# Environment variables with defaults are substituted before Prometheus loads this config.
#
# Variable substitution:
#   - 8083: Port for cAdvisor metrics (default: 8083)
#   - 9400: Port for DCGM GPU metrics (default: 9400)
#
# PORT CONFIGURATION NOTE:
# Internal Docker service names (e.g., backend:8000, alertmanager:9093) use FIXED
# container ports that are independent of .env port variables. The .env port variables
# only affect host-side port bindings for external access.
#
# The host.containers.internal targets (cAdvisor, DCGM) require templating because they
# run in separate podman instances (rootful vs rootless) and use host-mapped ports.
#
# See docs/development/PORT_STANDARDIZATION.md for details.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules for AI pipeline monitoring
# See prometheus_rules.yml for rule definitions and severity documentation
rule_files:
  - 'prometheus_rules.yml'
  - 'prometheus-rules.yml'
  - 'alerting-rules.yml'
  - 'profiling-recording-rules.yml'
  - 'profiling-regression-alerts.yml'
  - 'gpu-alerts.yml'
  - 'ai-pipeline-alerts.yml'

# Alertmanager configuration for alert delivery
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s
      api_version: v2

scrape_configs:
  # ==========================================================================
  # Direct Native Prometheus Metrics Scraping (Preferred)
  # ==========================================================================
  # Scrapes the native Prometheus metrics endpoint directly.
  # This is the recommended approach as it:
  # - Preserves native histogram buckets for accurate percentile calculations
  # - Eliminates the JSON exporter as an intermediate failure point
  # - Reduces latency in metrics collection
  # - Properly types all metrics (counters, gauges, histograms)
  - job_name: 'hsi-backend-metrics'
    metrics_path: /api/metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'backend:8000'
    # Honor labels from the target to preserve native 'service' labels on metrics
    # like hsi_ai_request_duration_seconds{service="yolo26"} and circuit breaker metrics.
    # Without honor_labels, Prometheus would rename the metric's 'service' label to
    # 'exported_service' if we added a 'service' label via relabel_configs.
    honor_labels: true

  # ==========================================================================
  # AI Service Native Prometheus Metrics
  # ==========================================================================
  # Nemotron (llama.cpp) exposes native Prometheus metrics when started with
  # --metrics flag. Includes token counts, timing, and inference statistics.
  #
  # Key metrics:
  # - llama_tokens_predicted_total: Total tokens generated
  # - llama_tokens_prompt_total: Total tokens in prompts
  # - llama_generation_time_seconds: Generation time histogram
  # - llama_prompt_eval_time_seconds: Prompt evaluation time histogram
  # - llama_kv_cache_usage_ratio: KV cache utilization
  # - llama_requests_processing: Currently processing requests
  #
  # Calculate tokens per second: rate(llama_tokens_predicted_total[1m])
  - job_name: 'ai-llm-metrics'
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'ai-llm:8091'
        labels:
          service: nemotron
          model_type: llm
    # Handle case where container is not running
    honor_labels: true

  # Triton Inference Server native metrics (NEM-5553)
  # Exposes per-model inference statistics, queue latency, batch sizes, and GPU utilization.
  # Key metrics:
  # - nv_inference_request_success: Successful inference count per model
  # - nv_inference_request_failure: Failed inference count per model
  # - nv_inference_queue_duration_us: Time spent in scheduling queue
  # - nv_inference_compute_infer_duration_us: Actual inference compute time
  # - nv_gpu_utilization: GPU utilization percentage
  # - nv_gpu_memory_used_bytes: GPU memory in use
  - job_name: 'triton-metrics'
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'ai-gateway:8002'
        labels:
          service: triton
          component: inference-server
    honor_labels: true

  # ==========================================================================
  # Legacy AI Service Metrics (REMOVED)
  # ==========================================================================
  # The following standalone AI services have been consolidated into ai-gateway
  # (Triton Inference Server). Their per-model metrics are now available via
  # the 'triton-metrics' job above (ai-gateway:8002/metrics).
  #
  # Removed targets:
  # - ai-yolo26:8095 (ai-yolo26-metrics)
  # - ai-florence:8092 (ai-florence-metrics)
  # - ai-clip:8093 (ai-clip-metrics)
  # - ai-enrichment:8094 (ai-enrichment-metrics)
  # - ai-enrichment-light:8096 (ai-enrichment-light-metrics)
  #
  # Triton provides equivalent metrics:
  # - nv_inference_request_success/failure per model
  # - nv_inference_queue_duration_us per model
  # - nv_inference_compute_infer_duration_us per model
  # - nv_gpu_utilization, nv_gpu_memory_used_bytes

  # ==========================================================================
  # JSON Exporter Scraped Endpoints (For non-Prometheus format data)
  # ==========================================================================
  # These endpoints return JSON data that needs conversion to Prometheus format.
  # Used for health checks, telemetry summaries, and stats that don't have
  # native Prometheus equivalents.

  # Backend health metrics via JSON exporter
  - job_name: 'hsi-health'
    metrics_path: /probe
    scrape_interval: 10s
    params:
      module: [health]
    static_configs:
      - targets:
          - 'http://backend:8000/api/system/health'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: json-exporter:7979

  # Backend telemetry metrics via JSON exporter
  - job_name: 'hsi-telemetry'
    metrics_path: /probe
    scrape_interval: 10s
    params:
      module: [telemetry]
    static_configs:
      - targets:
          - 'http://backend:8000/api/system/telemetry'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: json-exporter:7979

  # Backend stats metrics via JSON exporter
  - job_name: 'hsi-stats'
    metrics_path: /probe
    scrape_interval: 30s
    params:
      module: [stats]
    static_configs:
      - targets:
          - 'http://backend:8000/api/system/stats'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: json-exporter:7979

  # GPU stats via JSON exporter
  - job_name: 'hsi-gpu'
    metrics_path: /probe
    scrape_interval: 10s
    params:
      module: [gpu]
    static_configs:
      - targets:
          - 'http://backend:8000/api/system/gpu'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: json-exporter:7979

  # ==========================================================================
  # Node Exporter - Host System Metrics (NEM-3931)
  # ==========================================================================
  # Collects hardware and OS metrics from the host system including:
  # - CPU usage, load averages, context switches
  # - Memory usage, buffers, cache
  # - Disk I/O, filesystem usage
  # - Network interface statistics
  # - System uptime, boot time
  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'node-exporter:9100'
        labels:
          service: node
          instance_type: host

  # Redis metrics via redis_exporter
  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'redis-exporter:9121'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

  # JSON exporter health
  - job_name: 'json-exporter'
    static_configs:
      - targets:
          - 'json-exporter:7979'

  # Alertmanager metrics
  # Exposes alertmanager_alerts, alertmanager_notifications_*, alertmanager_config_*
  - job_name: 'alertmanager'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'alertmanager:9093'

  # =============================================================================
  # Blackbox Exporter - Synthetic Monitoring (NEM-1637)
  # =============================================================================
  # External endpoint probing for availability, latency, and health validation
  # Access probe UI at http://blackbox-exporter:9115

  # Blackbox exporter self-monitoring
  - job_name: 'blackbox-exporter'
    static_configs:
      - targets:
          - 'blackbox-exporter:9115'

  # ==========================================================================
  # Pyroscope Continuous Profiling Metrics (NEM-3925)
  # ==========================================================================
  # Scrapes internal metrics from Pyroscope server for monitoring profiling health.
  # Key metrics:
  #   - pyroscope_distributor_received_samples_total: Total samples received
  #   - pyroscope_ingester_profiles_received_total: Total profiles ingested
  #   - pyroscope_distributor_bytes_received_total: Bytes received from agents
  #   - up{job="pyroscope"}: Server availability (1 = healthy, 0 = down)
  - job_name: 'pyroscope'
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'pyroscope:4040'
        labels:
          service: pyroscope
          component: profiling
    honor_labels: true

  # HTTP Health probes - validates JSON health response body
  - job_name: 'blackbox-http-health'
    metrics_path: /probe
    params:
      module: [http_health]
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - http://backend:8000/api/system/health
        labels:
          probe_type: health
          service: backend
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # HTTP Readiness probes - stricter check for load balancing decisions
  - job_name: 'blackbox-http-ready'
    metrics_path: /probe
    params:
      module: [http_ready]
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - http://backend:8000/api/system/health/ready
        labels:
          probe_type: readiness
          service: backend
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # HTTP Liveness probes - simple availability checks
  # This is the canonical backend liveness check (replaces removed backend-liveness job)
  # The /health endpoint returns JSON, so we use blackbox-exporter for proper probing
  - job_name: 'blackbox-http-live'
    metrics_path: /probe
    params:
      module: [http_live]
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - http://backend:8000/health
          - http://frontend:8080
        labels:
          probe_type: liveness
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      # Extract service name from URL for labeling
      - source_labels: [__param_target]
        regex: 'http://([^:]+):.*'
        target_label: service
        replacement: '${1}'

  # HTTP 2xx probes - basic availability for AI services
  - job_name: 'blackbox-http-2xx'
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_interval: 30s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - http://ai-llm:8091/health
          - http://ai-florence:8092/health
          - http://ai-clip:8093/health
          - http://ai-enrichment:8094/health
          - http://ai-yolo26:8095/health
        labels:
          probe_type: availability
          service_type: ai
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      # Extract AI service name from URL
      - source_labels: [__param_target]
        regex: 'http://([^:]+):.*'
        target_label: ai_service
        replacement: '${1}'

  # =============================================================================
  # cAdvisor - Container Resource Metrics (NEM-3930)
  # =============================================================================
  # Container-level CPU, memory, network, and filesystem metrics
  # Key metrics:
  # - container_cpu_usage_seconds_total: CPU usage by container
  # - container_memory_usage_bytes: Memory usage by container
  # - container_network_receive_bytes_total: Network receive bytes
  # - container_network_transmit_bytes_total: Network transmit bytes
  # - container_fs_usage_bytes: Filesystem usage
  - job_name: 'cadvisor'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      # cAdvisor runs as a rootful systemd service (not in the compose network).
      # Use host.containers.internal to reach the host from inside Podman containers.
      # Port 8088 matches the -port flag in monitoring/cadvisor/cadvisor.service.
      - targets:
          - 'host.containers.internal:8088'
    # Filter to only include containers from this compose project
    # and add helpful labels
    relabel_configs:
      - target_label: source
        replacement: 'cadvisor'

  # TCP connectivity probes - database and cache connections
  - job_name: 'blackbox-tcp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - postgres:5432
          - redis:6379
        labels:
          probe_type: tcp
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      # Extract service name from target
      - source_labels: [__param_target]
        regex: '([^:]+):.*'
        target_label: service
        replacement: '${1}'

  # ==========================================================================
  # NVIDIA DCGM Exporter - GPU Hardware Metrics (NEM-4132, NEM-4150)
  # ==========================================================================
  # dcgm-exporter runs as a rootful systemd service (DCGM nv-hostengine needs
  # host-level root). It uses --net=host so it's reachable from rootless Prometheus
  # via host.containers.internal. Install with: setup.py or setup-systemd.sh.
  - job_name: 'dcgm-exporter'
    static_configs:
      - targets: ['host.containers.internal:9400']
    scrape_interval: 15s
    scrape_timeout: 10s
