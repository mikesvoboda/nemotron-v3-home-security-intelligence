# AI Pipeline Alerting Rules
#
# Alerting for Triton inference health, GPU VRAM pressure, prompt context fit,
# and the ai-vlm analysis path.
#
# Every expression here keys on a metric with a live writer on this tree:
#   - Triton inference failures (nv_inference_request_failure / _success, per
#     model, scraped from ai-gateway:8002/metrics by the 'triton-metrics' job)
#   - GPU VRAM pressure (hsi_gpu_memory_used_mb / hsi_gpu_memory_total_mb from
#     the json-exporter conversion in monitoring/json-exporter-config.yml)
#   - Prompt context fit (hsi_prompts_truncated_total, incremented at the wire
#     by backend/services/vlm_client.py when a prompt exceeds the slot)
#   - ai-vlm analysis outcomes (hsi_pipeline_errors_total,
#     hsi_ai_service_degraded, hsi_specialist_unavailable_total — written by
#     vlm_client.py, vlm_analyzer.py and vlm_specialists.py, all scraped from
#     backend:8000/api/metrics by the 'hsi-backend-metrics' job)
#
# hsi_pipeline_errors_total error_type values pass through the allowlist in
# backend/core/sanitization.py (KNOWN_ERROR_TYPES): a value outside it collapses
# to "other". The VLM-path values that survive are vlm_transport_error,
# vlm_http_error, vlm_schema_invalid, vlm_circuit_open and
# vlm_verification_failed. The reason codes vlm_client.py also passes
# (vlm_probe_props_unreachable, vlm_probe_build_mismatch, vlm_probe_transport,
# vlm_probe_not_enforced, vlm_probe_truncated, vlm_context_overflow,
# vlm_assess_truncated) land in "other", so these alerts match on the five.
#
# Alert Severity Levels:
# - critical: Immediate action required. System is down or data loss is imminent.
# - warning:  Action required soon. Performance degradation or approaching limits.
# - info:     Informational. No immediate action required but worth monitoring.
#
# Validation:
#   promtool check rules monitoring/ai-pipeline-alerts.yml

groups:
  # =============================================================================
  # GPU & Triton Inference Alerts
  # =============================================================================
  # Inference failures and memory pressure across AI serving. Triton surfaces
  # VRAM pressure as failed inferences, which is what GPUInferenceFailures
  # alerts on; the json-exporter gauges read nvidia-smi directly.
  - name: gpu_oom_alerts
    interval: 15s
    rules:
      # Critical: Triton inference failures above 10% of served requests
      # nv_inference_request_failure / nv_inference_request_success are Triton's
      # per-model counters, scraped from ai-gateway:8002/metrics by the
      # 'triton-metrics' job. VRAM exhaustion surfaces here as failed inferences.
      - alert: GPUInferenceFailures
        expr: |
          (
            sum(rate(nv_inference_request_failure[5m]))
            /
            (sum(rate(nv_inference_request_success[5m])) + 0.001)
          ) > 0.1
        for: 5m
        labels:
          severity: critical
          component: gpu
          service: ai_inference
        annotations:
          summary: 'Triton inference failure rate above 10%'
          description: 'Triton is failing {{ $value | humanizePercentage }} of inference requests through ai-gateway. Common causes are VRAM exhaustion, an unloaded model, or a backend crash. Check per-model failure rates via nv_inference_request_failure{model=...} and consider reducing batch sizes or unloading unused models.'
          runbook_url: 'https://github.com/mikesvoboda/nemotron-v3-home-security-intelligence/wiki/runbooks/gpu-oom'

      # Warning: GPU memory utilization above 90% (from JSON exporter hsi_gpu_* metrics)
      - alert: GPUMemoryHigh
        expr: |
          (hsi_gpu_memory_used_mb / hsi_gpu_memory_total_mb) > 0.9
        for: 5m
        labels:
          severity: warning
          component: gpu
          service: nvidia
        annotations:
          summary: 'GPU memory utilization > 90%'
          description: 'GPU VRAM usage is {{ $value | humanizePercentage }} for more than 5 minutes. OOM errors are likely if load increases. Consider reducing model concurrency or batch sizes.'

      # Critical: GPU memory utilization above 95%
      - alert: GPUMemoryCritical
        expr: |
          (hsi_gpu_memory_used_mb / hsi_gpu_memory_total_mb) > 0.95
        for: 2m
        labels:
          severity: critical
          component: gpu
          service: nvidia
        annotations:
          summary: 'GPU memory utilization > 95%'
          description: 'GPU VRAM usage is {{ $value | humanizePercentage }} for more than 2 minutes. OOM errors are imminent. Immediate action required: reduce batch sizes, evict models, or restart services.'
          runbook_url: 'https://github.com/mikesvoboda/nemotron-v3-home-security-intelligence/wiki/runbooks/gpu-memory-high'

  # =============================================================================
  # Prompt Context Alerts
  # =============================================================================
  # Context-window fit on the ai-vlm prompt. VlmClient renders the prompt,
  # counts it against vlm_context_window, and truncates to fit before the call.
  # A sustained truncation rate means the slot is too small for what the
  # selector chose and the verdict is built from a shortened context.
  - name: prompt_llm_alerts
    interval: 15s
    rules:
      # Warning: High rate of prompt truncation
      # hsi_prompts_truncated_total counts events whose rendered prompt
      # exceeded the slot. record_prompt_truncated() fires once per event, at
      # the wire in vlm_client.assess — deliberately not inside the renderer,
      # which runs a second time in the analyzer to store llm_prompt.
      - alert: PromptTruncationHigh
        expr: rate(hsi_prompts_truncated_total[5m]) > 0.5 / 60
        for: 5m
        labels:
          severity: warning
          component: llm
          service: ai-vlm
        annotations:
          summary: 'Prompt truncation rate is high (> 0.5/min)'
          description: 'Prompts are being truncated at a rate of {{ $value | printf "%.4f" }}/sec due to context window overflow. A truncated prompt drops detections from the context, so the verdict is built on less than the selector chose. Consider lowering the key-frame budget or raising VLM_CONTEXT_WINDOW.'
          runbook_url: 'https://github.com/mikesvoboda/nemotron-v3-home-security-intelligence/wiki/runbooks/prompt-truncation'

  # =============================================================================
  # ai-vlm Analysis Alerts
  # =============================================================================
  # The shipped analysis path: pipeline_workers hands a batch to VlmAnalyzer,
  # which fills the face/plate/re-ID slots through vlm_specialists and then
  # calls VlmClient.assess against llama.cpp (ai-vlm:8098). These alerts cover
  # the three ways that path reports a loss of signal — a declined verdict, a
  # burning retry ladder, and a silent specialist leg. Queue starvation is
  # covered by HSIAnalysisQueue* in alerting-rules.yml and is not duplicated
  # here.
  - name: ai_vlm_alerts
    interval: 15s
    rules:
      # Warning: a sustained share of detections ends in a declined verdict.
      # vlm_verification_failed is recorded by vlm_analyzer when assess() raises
      # a degradable error after its retry ladder is spent; the affected events
      # are written with verification_failed and a NULL risk score.
      #
      # The denominator is hsi_detections_processed_total, incremented by
      # detector_client at detect time — the shipped code has no per-analysis
      # request counter, so this reads "declined verdicts per detection handed
      # forward", not a per-call failure rate. It is biased LOW: one declined
      # verdict covers a whole batch, while the denominator counts each of that
      # batch's detections. Both series come from the same backend process, so
      # the ratio needs no cross-instance join.
      - alert: VlmVerificationFailures
        expr: |
          (
            sum(rate(hsi_pipeline_errors_total{error_type="vlm_verification_failed"}[30m]))
            /
            (sum(rate(hsi_detections_processed_total[30m])) + 0.001)
          ) > 0.1
        for: 15m
        labels:
          severity: warning
          component: ai
          service: ai-vlm
        annotations:
          summary: 'ai-vlm is declining more than 10% of the detections it is handed'
          description: '{{ $value | humanizePercentage }} of detections over the last 30 minutes ended in a declined ai-vlm verdict. Those events carry verification_failed and no risk score. Break the cause down across the other vlm_* error_types and hsi_ai_service_degraded{service="ai-vlm"}.'
          runbook_url: 'https://github.com/mikesvoboda/nemotron-v3-home-security-intelligence/wiki/runbooks/vlm-verification-failures'

      # Warning: the ai-vlm retry ladder is burning attempts.
      # These three error_types are recorded once per ATTEMPT, so one failing
      # request contributes up to three increments; 30 in 10 minutes is a
      # sustained failure stream rather than a blip. A healthy ai-vlm emits
      # none of them. vlm_schema_invalid means the grammar did not constrain
      # the reply — check the GGUF build and its grammar file; transport and
      # HTTP errors point at the llama.cpp server itself.
      - alert: VlmRequestErrors
        expr: |
          sum(increase(hsi_pipeline_errors_total{error_type=~"vlm_transport_error|vlm_http_error|vlm_schema_invalid"}[10m])) > 30
        for: 5m
        labels:
          severity: warning
          component: ai
          service: ai-vlm
        annotations:
          summary: 'ai-vlm request errors above 30 per 10 minutes'
          description: 'The ai-vlm client recorded {{ $value | printf "%.0f" }} transport, HTTP, or schema errors in the last 10 minutes (counted per attempt). Check the ai-vlm container, its model and grammar load, and AI_VLM_URL.'
          runbook_url: 'https://github.com/mikesvoboda/nemotron-v3-home-security-intelligence/wiki/runbooks/vlm-request-errors'

      # Info: ai-vlm has been marked unhealthy for a whole recovery window.
      # hsi_ai_service_degraded is the alertable projection of a
      # DegradationManager UNHEALTHY push, set once on the breaker's OPEN
      # transition and cleared on recovery. HSICircuitBreakerOpen in
      # alerting-rules.yml already alerts on the breaker state at 30s; this one
      # is the service verdict the ANALYSIS pipeline is acting on — while it
      # holds, every item is refused without I/O (counted as
      # error_type="vlm_circuit_open") and analysis answers without a model.
      # The 30m window is what makes it distinct: it says the outage outlived
      # the recovery_timeout rather than being a single trip.
      - alert: VlmServiceUnhealthy
        expr: hsi_ai_service_degraded{service="ai-vlm"} == 1
        for: 30m
        labels:
          severity: info
          component: ai
          service: ai-vlm
        annotations:
          summary: 'ai-vlm has been marked unhealthy for 30 minutes'
          description: 'The ai-vlm breaker opened and the service has stayed UNHEALTHY for 30 minutes, so analysis is refusing items without calling the model. Check the ai-vlm container and its recovery probes; hsi_circuit_breaker_state{service="ai-vlm"} carries the raw breaker state.'
          runbook_url: 'https://github.com/mikesvoboda/nemotron-v3-home-security-intelligence/wiki/runbooks/vlm-service-unhealthy'

      # Info: every specialist leg reported unavailable for the same reason.
      # hsi_specialist_unavailable_total counts degraded prompt lines by
      # specialist (faces, plates, person_reid) and a bounded reason code. One
      # leg down is normal — a household with no enrolled faces, a night frame
      # with no plates. Three legs sharing ONE reason code inside 30 minutes is
      # a shared cause (weights, a gallery, a DB session), and it means the
      # verdict was rendered with no specialist text at all. The inner
      # count-by makes one series per (reason, specialist) leg, so the outer
      # count is a leg tally that does not multiply across scrape replicas.
      - alert: VlmSpecialistLegsUnavailable
        expr: |
          count by (reason) (
            count by (reason, specialist) (
              increase(hsi_specialist_unavailable_total[30m]) > 0
            )
          ) >= 3
        for: 15m
        labels:
          severity: info
          component: ai
          service: ai-vlm
        annotations:
          summary: 'All ai-vlm specialist legs unavailable (reason {{ $labels.reason }})'
          description: 'All three specialist legs reported unavailable for the reason "{{ $labels.reason }}" over the last 30 minutes, so the prompt the model received carries no face, plate, or re-ID text. The reason is a bounded code — the detail behind it is in the backend log, not the metric.'
          runbook_url: 'https://github.com/mikesvoboda/nemotron-v3-home-security-intelligence/wiki/runbooks/vlm-specialist-legs-unavailable'
